<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>교사 바이브 코딩 목차 아이디어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 칠판 톤의 헤더 + 요약 매트릭스(교과×단계) + 그룹별 카드 목록. 셀을 누르면 목록이 걸러짐 */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a63; --line:#dde2dc;
  --board:#2c4a3f; --board-fg:#eef3ee; --chalk:#f3d36b; --chalk-soft:#fbf1c8; --accent:#2f6b57; --accent-soft:#e3efe8;
  --link:#2a6290;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --fg:#e6ebe7; --muted:#9aa8a0; --line:#2e3833;
  --board:#1f3a30; --board-fg:#e6efe8; --chalk:#e9c95c; --chalk-soft:#3a3420; --accent:#7cc0a3; --accent-soft:#223a30; --link:#86b8e3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --fg:#e6ebe7; --muted:#9aa8a0; --line:#2e3833;
  --board:#1f3a30; --board-fg:#e6efe8; --chalk:#e9c95c; --chalk-soft:#3a3420; --accent:#7cc0a3; --accent-soft:#223a30; --link:#86b8e3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.board{background:var(--board);color:var(--board-fg);padding-inline:16px;padding-block:28px 0}
header .in{max-width:1120px;margin:0 auto}
h1{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;opacity:.85;font-size:14px}
header .status{margin-top:10px;font-size:12.5px;opacity:.75}
header .status[data-ok="0"]{opacity:1;color:var(--chalk)}
.tabs{display:flex;gap:4px;margin-top:22px;flex-wrap:wrap}
.tab{appearance:none;border:0;background:transparent;color:var(--board-fg);opacity:.7;font:inherit;font-weight:600;padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
.tab .cnt{font-variant-numeric:tabular-nums;margin-left:6px;font-weight:500;color:inherit;opacity:.7}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

.intro{margin:22px 0 4px;color:var(--muted);font-size:14px;max-width:72ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 6px;font-size:14px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:18px;margin-right:3px}

h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:28px 0 10px}
.matrix-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.mx{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx thead th{font-weight:600;color:var(--muted);font-size:12.5px}
.mx tbody th{text-align:left;font-weight:600}
.mx tr:last-child td,.mx tr:last-child th{border-bottom:0}
.mx .tot{color:var(--muted);font-weight:600}
.cell{appearance:none;border:0;font:inherit;min-width:34px;padding:3px 8px;border-radius:6px;cursor:pointer;color:var(--fg);background:transparent}
.cell[data-v="0"]{color:var(--line);cursor:default}
.cell.h1{background:var(--accent-soft)}
.cell.h2{background:color-mix(in srgb,var(--accent) 35%,var(--accent-soft))}
.cell.h3{background:var(--accent);color:var(--surface)}
.cell.on{outline:2px solid var(--chalk);outline-offset:1px}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.controls label{font-size:13px;color:var(--muted)}
input[type=search],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 200px;min-width:0}
.filt{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filt .pill{background:var(--chalk-soft);color:var(--fg);padding:2px 10px;border-radius:999px}
.filt button{appearance:none;border:0;background:none;color:var(--link);font:inherit;cursor:pointer;text-decoration:underline}

.group{margin-top:26px}
.group h3{font-family:var(--f-display);font-size:20px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.group h3 .n{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.group .desc{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.no{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.tag{padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.alt{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.card h4{margin:0;font-size:16.5px;line-height:1.4;font-weight:600}
.scene{margin:0;font-size:14px}
.scene::before{content:"어려운 장면 ";font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-right:2px}
.note{margin:0;font-size:13.5px;color:var(--muted);border-left:2px solid var(--chalk);padding-left:10px}
.meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);padding-top:6px;border-top:1px dashed var(--line)}
.meta .who{color:var(--fg);font-weight:600}
.meta a{color:var(--link);word-break:break-all}
.live{font-size:11.5px;font-weight:600;color:var(--board);background:var(--chalk);padding:1px 7px;border-radius:4px}
.empty{padding:40px 0;color:var(--muted);text-align:center}

details.ref{margin-top:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px}
details.ref summary{cursor:pointer;padding:14px 0;font-weight:600}
.refbook{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.refbook .bk{font-weight:600;font-size:14px}
.refbook .ord{font-size:12.5px;color:var(--accent);font-weight:600}
.refbook .toc{font-size:13.5px;white-space:pre-line}
.refbook .why{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>
</head>
<body>


<header class="board"><div class="in">
  <h1>교사 바이브 코딩 목차 아이디어</h1>
  <p>선생님들이 시트 ③에 적어 주신 웹앱 아이디어 정리 · 수업자동화 / 업무자동화</p>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
</div></header>

<main class="wrap">
  <p class="intro" id="intro"></p>
  <div class="stats" id="stats"></div>

  <h2 id="mxTitle"></h2>
  <div class="matrix-box"><table class="mx" id="mx"></table></div>

  <div class="controls">
    <span class="seg" id="grp" role="group" aria-label="묶는 기준"></span>
    <input type="search" id="q" placeholder="앱 이름·장면·비고 검색" aria-label="검색">
    <label for="who">제안</label>
    <select id="who"></select>
  </div>
  <div class="filt" id="filt"></div>
  <div id="out"></div>

  <details class="ref" id="ref"><summary>참고: 기존 도서 샘플 목차와 다룬 앱</summary><div id="refBody"></div></details>
</main>

<script>
/* 데이터: GitHub Actions가 1시간마다 드라이브 엑셀을 읽어 data.json으로 만듭니다.
   data.json을 읽지 못하면 아래 DATA(정리 시점 데이터)를 보여 줍니다. */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ordered = (vals, order) => [...order.filter(v => vals.includes(v)), ...vals.filter(v => !order.includes(v)).sort()];
const isLive = u => /^https?:\/\/[^…]+$/.test(u) && !u.endsWith("…");

function renderTabs(){
  $("#tabs").innerHTML = Object.keys(DATA).map(k =>
    `<button class="tab" role="tab" aria-selected="${k===state.tab}" data-k="${k}">${k}<span class="cnt">${DATA[k].ideas.length}</span></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
    state = { tab: b.dataset.k, group: "stage", q: "", who: "", cell: null };
    $("#q").value = "";
    try { localStorage.setItem("tocTab", state.tab); } catch(e){}
    renderAll();
  });
}

function renderTop(){
  const d = DATA[state.tab], c = CONF[state.tab], ideas = d.ideas;
  $("#intro").textContent = c.intro;
  const people = new Set(ideas.map(i => i.who)), links = ideas.filter(i => isLive(i.link)).length;
  const cats = new Set(ideas.map(i => i.cat));
  $("#stats").innerHTML = `<span><b>${ideas.length}</b>개 아이디어</span><span><b>${people.size}</b>명 제안</span><span><b>${cats.size}</b>개 ${c.catLabel}</span><span><b>${links}</b>개 이미 만든 사이트 있음</span>`;
  $("#mxTitle").textContent = c.mxTitle;

  const stages = ordered([...new Set(ideas.map(i => i.stage))], c.stageOrder);
  const catsO = ordered([...cats], c.catOrder);
  const cnt = (cat, st) => ideas.filter(i => (cat==null||i.cat===cat) && (st==null||i.stage===st)).length;
  const lvl = v => v===0?"":v>=5?"h3":v>=3?"h2":"h1";
  const on = (a,b) => state.cell && state.cell[0]===a && state.cell[1]===b ? " on" : "";
  let h = `<thead><tr><th style="text-align:left">${c.catLabel}</th>${stages.map(s=>`<th>${esc(s)}</th>`).join("")}<th>합계</th></tr></thead><tbody>`;
  for (const ct of catsO){
    h += `<tr><th>${esc(ct)}</th>`;
    for (const st of stages){ const v = cnt(ct, st);
      h += `<td><button class="cell ${lvl(v)}${on(ct,st)}" data-v="${v}" data-c="${esc(ct)}" data-s="${esc(st)}" ${v?"":"disabled tabindex=-1"} aria-label="${esc(ct)} ${esc(st)} ${v}개">${v||"·"}</button></td>`; }
    h += `<td class="tot"><button class="cell${on(ct,null)}" data-v="${cnt(ct,null)}" data-c="${esc(ct)}">${cnt(ct,null)}</button></td></tr>`;
  }
  h += `<tr><th class="tot">합계</th>${stages.map(st=>`<td class="tot"><button class="cell${on(null,st)}" data-v="${cnt(null,st)}" data-s="${esc(st)}">${cnt(null,st)}</button></td>`).join("")}<td class="tot">${ideas.length}</td></tr></tbody>`;
  $("#mx").innerHTML = h;
  $("#mx").querySelectorAll(".cell").forEach(b => b.onclick = () => {
    if (b.dataset.v === "0") return;
    const k = [b.dataset.c ?? null, b.dataset.s ?? null];
    state.cell = state.cell && state.cell[0]===k[0] && state.cell[1]===k[1] ? null : k;
    renderTop(); renderList();
  });

  const g = [["stage", c.stageLabel+"별"],["cat", c.catLabel+"별"],["who","제안자별"],["num","번호순"]];
  $("#grp").innerHTML = g.map(([k,l]) => `<button aria-pressed="${state.group===k}" data-k="${k}">${l}</button>`).join("");
  $("#grp").querySelectorAll("button").forEach(b => b.onclick = () => { state.group = b.dataset.k; renderTop(); renderList(); });

  const ppl = [...people].sort((a,b)=> ideas.filter(i=>i.who===b).length - ideas.filter(i=>i.who===a).length || a.localeCompare(b));
  $("#who").innerHTML = `<option value="">전체</option>` + ppl.map(p => `<option value="${esc(p)}" ${state.who===p?"selected":""}>${esc(p)} (${ideas.filter(i=>i.who===p).length})</option>`).join("");
}

function card(i, c){
  const link = i.link ? (isLive(i.link) ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.link.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>` : esc(i.link)) : "";
  return `<article class="card">
    <div class="top"><span class="no">${String(i.n).padStart(2,"0")}</span><span class="tag">${esc(i.cat||"미기재")}</span><span class="tag alt">${esc(i.stage||"미기재")}</span>${isLive(i.link)?'<span class="live">사이트 있음</span>':""}</div>
    <h4>${esc(i.name)}</h4>
    ${i.scene?`<p class="scene">${esc(i.scene)}</p>`:""}
    ${i.note?`<p class="note">${esc(i.note)}</p>`:""}
    <div class="meta"><span class="who">${esc(i.who)}</span><span>${esc(i.tool)}</span>${link?`<span>${link}</span>`:""}</div>
  </article>`;
}

function renderList(){
  const d = DATA[state.tab], c = CONF[state.tab];
  const q = state.q.trim().toLowerCase();
  let items = d.ideas.filter(i =>
    (!state.who || i.who===state.who) &&
    (!state.cell || ((state.cell[0]==null||i.cat===state.cell[0]) && (state.cell[1]==null||i.stage===state.cell[1]))) &&
    (!q || [i.name,i.scene,i.note,i.tool,i.cat,i.stage,i.who].join(" ").toLowerCase().includes(q)));

  const f = [];
  if (state.cell) f.push([state.cell.filter(Boolean).join(" · "), "cell"]);
  if (state.who) f.push([state.who, "who"]);
  if (q) f.push([`“${state.q.trim()}”`, "q"]);
  $("#filt").innerHTML = f.length ? `<span>${items.length}개 표시 중</span>` + f.map(([t])=>`<span class="pill">${esc(t)}</span>`).join("") + `<button id="clr">필터 해제</button>` : "";
  if (f.length) $("#clr").onclick = () => { state.cell=null; state.who=""; state.q=""; $("#q").value=""; renderTop(); renderList(); };

  if (!items.length){ $("#out").innerHTML = `<p class="empty">조건에 맞는 아이디어가 없습니다. 필터를 해제해 보세요.</p>`; return; }
  let groups;
  if (state.group==="num") groups = [["", items]];
  else {
    const key = state.group, vals = [...new Set(items.map(i=>i[key]))];
    const order = key==="stage" ? c.stageOrder : key==="cat" ? c.catOrder : [];
    const keys = key==="who" ? vals.sort((a,b)=>items.filter(i=>i.who===b).length-items.filter(i=>i.who===a).length||a.localeCompare(b)) : ordered(vals, order);
    groups = keys.map(k => [k, items.filter(i=>i[key]===k)]);
  }
  $("#out").innerHTML = groups.map(([k, arr]) => `<section class="group">
    ${k?`<h3>${esc(k)}<span class="n">${arr.length}개</span></h3>`:""}
    <div class="list">${arr.map(i=>card(i,c)).join("")}</div></section>`).join("");
}

function renderRef(){
  const d = DATA[state.tab];
  $("#refBody").innerHTML =
    `<h2 style="margin-top:4px">① 샘플 목차</h2>` +
    d.ref1.map(r => `<div class="refbook"><div class="bk">${esc(r.book).replace(/\n/g,"<br>")}</div><div class="ord">배열 기준: ${esc(r.order)}</div><div class="toc">${esc(r.toc)}</div><div class="why">${esc(r.why)}</div></div>`).join("") +
    `<h2>② 기존 도서에서 다룬 앱</h2>` +
    d.ref2.map(r => `<div class="refbook"><div class="bk">${esc(r.book)}</div><div class="toc">${esc(r.apps)}</div></div>`).join("") + `<div style="height:12px"></div>`;
}

function renderAll(){ renderTabs(); renderTop(); renderList(); renderRef(); }
$("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
$("#who").addEventListener("change", e => { state.who = e.target.value; renderList(); });
renderAll();

/* ---------- data.json에서 최신 데이터 불러오기 ---------- */
async function loadData(){
  const st = $("#status");
  try {
    const res = await fetch(`data.json?_=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`data.json 응답 ${res.status}`);
    const j = await res.json();
    for (const k of Object.keys(DATA)) if (j.sheets && j.sheets[k]) DATA[k] = j.sheets[k];
    state.cell = null;
    renderAll();
    st.textContent = `드라이브 엑셀 기준 · ${j.updated} 갱신 (1시간마다 자동 갱신)`;
    st.dataset.ok = "1";
  } catch (e){
    st.textContent = "최신 데이터를 불러오지 못해 저장된 데이터(정리 시점 기준)를 보여 주고 있어요.";
    st.dataset.ok = "0";
    console.warn(e);
  }
}
loadData();
</script>
