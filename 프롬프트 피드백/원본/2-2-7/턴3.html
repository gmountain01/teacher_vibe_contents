<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 과제 점검판</title>
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#172b46;background:#f1f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #ffb627;outline-offset:4px}.wrap{max-width:1600px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{font-size:18px;font-weight:800;color:#506681;margin:0 0 8px}h1{font-size:clamp(30px,4vw,52px);margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #c6d2e0;border-radius:12px;padding:13px 18px;background:white;color:#233d5d;font-weight:700;min-height:48px}.primary{background:#244edb;color:white;border-color:#244edb}.setup{max-width:800px;margin:40px auto;background:white;padding:clamp(24px,5vw,48px);border-radius:24px;box-shadow:0 12px 40px #203b6010}.setup h2{font-size:30px;margin:0 0 12px}.hint{color:#53677f;line-height:1.7}.field{display:block;margin:24px 0 10px;font-weight:800;font-size:20px}input,textarea{width:100%;border:2px solid #cbd6e4;border-radius:12px;padding:15px;font-size:22px;background:#fbfcfe;color:#172b46}textarea{min-height:240px;resize:vertical;line-height:1.6}.setup .primary{width:100%;font-size:23px;margin-top:24px}.summary{background:#172f50;color:white;border-radius:22px;padding:26px 32px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.count{font-size:clamp(30px,4vw,48px);font-weight:900}.summary p{margin:8px 0 0;color:#d2dff0;font-size:18px}.track{height:10px;background:#3b506e;border-radius:20px;width:220px;overflow:hidden}.fill{height:100%;background:#69e0b3;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.card{min-height:180px;border:3px solid #d4deea;border-radius:20px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;color:#233d5d;box-shadow:0 5px 0 #dce4ee;transition:background .15s,transform .15s}.card:hover{transform:translateY(-2px)}.card.done{background:#d9f8eb;border-color:#14845b;box-shadow:0 5px 0 #b5dfce;color:#086343}.name{font-size:clamp(30px,3vw,42px);font-weight:900;overflow-wrap:anywhere;max-width:100%}.status{font-size:23px;font-weight:800;border-radius:30px;padding:6px 18px;background:#edf1f7}.done .status{background:#14845b;color:white}.foot{font-size:16px;color:#53677f;text-align:center;margin-top:30px;line-height:1.7}.error{color:#b22c30;font-weight:700;min-height:24px;margin:12px 0 0}[hidden]{display:none!important}@media(max-width:650px){.wrap{padding:20px}header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:155px;padding:18px 8px}.name{font-size:30px}.summary{padding:24px}.track{width:160px}}
.card.retry{background:#fff0db;border-color:#d57816;color:#8b4305;box-shadow:0 5px 0 #eed0a7}.retry .status{background:#bc5b08;color:white}.attempts{font-size:16px;color:#53677f}.student{display:flex;flex-direction:column;gap:12px}.student .card{width:100%;flex:1}.ratings{display:flex;gap:8px}.ratings button{flex:1;font-size:24px;padding:12px 6px}.ratings button[aria-pressed="true"],.btn.teacher-on{background:#244edb;color:white;border-color:#244edb}.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 0 20px}.tabs button{flex-shrink:0;max-width:360px;overflow-wrap:anywhere}.tabs [aria-selected="true"]{background:#244edb;color:white}.badge{font-size:15px;background:#fff0cf;color:#734500;border-radius:8px;padding:5px 9px}.table-wrap{overflow:auto;border:1px solid #cbd6e4;border-radius:16px;background:white}table{border-collapse:collapse;width:100%;font-size:22px}caption{text-align:left;padding:20px;font-weight:bold}th,td{border-bottom:1px solid #dce4ee;border-right:1px solid #dce4ee;padding:20px;text-align:center;min-width:180px;overflow-wrap:anywhere}th{background:#e8eef8}tbody th{position:sticky;left:0;z-index:1}td small{display:block;font-size:16px;margin-top:8px;color:#53677f}.report-note{line-height:1.8;color:#53677f}</style>
</head>
<body>
<main class="wrap">
<header><div><p class="eyebrow">우리 반 · 함께 확인해요</p><h1 id="heading">과제 점검판</h1></div><div class="actions" id="boardActions" hidden><button class="btn" id="teacher" aria-pressed="false">선생님</button><button class="btn" id="edit">명단·과제 수정</button><button class="btn" id="reset">제출 상태 초기화</button><button class="btn" id="fullscreen">전체 화면</button></div></header>
<nav class="tabs" id="tabs" role="tablist" aria-label="과제 선택" hidden></nav><section id="report" hidden aria-label="학생별 누적 보기"></section>
<section class="setup" id="setup">
<h2 id="formTitle">오늘의 과제를 준비해요</h2><p class="hint">과제 이름과 학생 명단을 입력하세요.<br>점검판에서 학생 카드를 누르면 제출 상태가 바뀝니다.</p>
<form id="form"><label class="field" for="task">과제 이름</label><input id="task" placeholder="예: 수학 익힘책 24~25쪽" required maxlength="150">
<label class="field" for="roster">학생 명단</label><p class="hint" id="rosterHint">한 줄에 한 명씩 입력하세요. 쉼표로 구분해도 됩니다.<br>이름이 같은 학생은 ‘김민수 A’, ‘김민수 B’처럼 구분해 주세요.</p><textarea id="roster" placeholder="김민수&#10;이서연&#10;박지우" required aria-describedby="rosterHint"></textarea><p class="error" id="error" role="alert"></p><button class="btn primary" type="submit">점검판 열기</button><button class="btn" type="button" id="cancel" hidden style="width:100%;margin-top:12px">수정 취소</button></form>
</section>
<section id="board" hidden aria-label="학생별 제출 현황"><div class="summary"><div><div class="count" id="count" role="status" aria-live="polite"></div><p id="boardHint"></p></div><div class="track" role="progressbar" aria-label="제출률" id="progress"><div class="fill" id="fill"></div></div></div><div class="grid" id="cards"></div></section>
<p class="foot" id="saveNote">인터넷 연결 없이 사용할 수 있습니다. 이 브라우저에 입력 내용과 제출 상태가 자동 저장됩니다.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),key='classroom-assignment-board-v1';
let state={version:2,tasks:[],activeId:null},teacherMode=false,view='task',editingId=null;
const current=()=>state.tasks.find(t=>t.id===state.activeId);
const fresh=name=>({name,done:false,grade:null,lastGrade:null,attempts:0});
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('saveNote').textContent='자동 저장됨 · 같은 컴퓨터와 브라우저에서 이 파일을 다시 열면 이어서 사용할 수 있습니다.'}catch(e){$('saveNote').textContent='자동 저장을 사용할 수 없습니다. 창을 닫으면 입력 내용이 사라질 수 있습니다.'}}
function stats(){const map=new Map();state.tasks.forEach(t=>t.students.forEach(s=>{if(!map.has(s.name))map.set(s.name,{name:s.name,high:0,total:0,order:map.size});const r=map.get(s.name);if(s.lastGrade){r.total++;if(s.lastGrade==='상')r.high++}}));return [...map.values()]}
function lowStudents(){return new Set(stats().filter(r=>r.total>0).sort((a,b)=>a.high/a.total-b.high/b.total||a.order-b.order).slice(0,3).map(r=>r.name))}
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function badge(){return el('span','살펴보기','badge')}
function tabs(){const host=$('tabs');host.replaceChildren();host.hidden=!state.tasks.length;state.tasks.forEach(t=>{const b=el('button',t.task,'btn');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(view==='task'&&t.id===state.activeId));b.addEventListener('click',()=>{state.activeId=t.id;view='task';save();render()});host.append(b)});const report=el('button','누적 보기','btn');report.type='button';report.setAttribute('role','tab');report.setAttribute('aria-selected',String(view==='report'));report.addEventListener('click',()=>{view='report';render()});const add=el('button','+ 과제 등록','btn');add.type='button';add.addEventListener('click',()=>openForm(false));host.append(report,add)}
function submitStudent(s){if(teacherMode||s.grade==='상'||s.grade==='중')return;if(s.done)s.done=false;else{s.done=true;s.grade=null;s.attempts++}save();render()}
function rateStudent(s,grade){if(!teacherMode||!s.done||!['상','중','하'].includes(grade))return;s.grade=grade;s.lastGrade=grade;if(grade==='하')s.done=false;save();render()}
function renderReport(){const host=$('report');host.replaceChildren();const wrap=el('div',undefined,'table-wrap'),table=el('table');table.append(el('caption','학생별 과제 기록'));const head=el('thead'),hr=el('tr');hr.append(el('th','학생'));state.tasks.forEach(t=>hr.append(el('th',t.task)));if(teacherMode)hr.append(el('th','상 비율'));head.append(hr);table.append(head);const body=el('tbody'),low=teacherMode?lowStudents():new Set();stats().forEach(r=>{const row=el('tr'),name=el('th',r.name);name.scope='row';if(low.has(r.name))name.append(el('br'),badge());row.append(name);state.tasks.forEach(t=>{const s=t.students.find(x=>x.name===r.name),cell=el('td');if(!s)cell.textContent='—';else{cell.append(el('span',s.lastGrade==='하'?'다시 도전':s.lastGrade|| (s.done?'평가 대기':'미제출')),el('small','도전 '+s.attempts+'회'));if(s.lastGrade==='하'&&s.done)cell.append(el('small','재제출 · 재평가 대기'))}row.append(cell)});if(teacherMode)row.append(el('td',r.total?Math.round(r.high/r.total*100)+'% ('+r.high+'/'+r.total+')':'평가 없음'));body.append(row)});table.append(body);wrap.append(table);host.append(wrap);if(teacherMode)host.append(el('p','상 비율 = 마지막 평가가 상인 과제 수 ÷ 평가가 있는 과제 수. 하(다시 도전)도 포함하며 미평가는 제외합니다. 평가가 있는 학생 중 비율이 낮은 3명에 ‘살펴보기’를 표시합니다. 동률이면 명단 순서로 정합니다.','report-note'))}
function render(){if(!state.tasks.length){openForm(false);return}const t=current();tabs();$('setup').hidden=true;$('boardActions').hidden=false;$('heading').textContent=view==='report'?'누적 보기':t.task;$('report').hidden=view!=='report';$('board').hidden=view!=='task';$('edit').hidden=view==='report';$('reset').hidden=view==='report';$('teacher').setAttribute('aria-pressed',String(teacherMode));$('teacher').classList.toggle('teacher-on',teacherMode);$('teacher').textContent=teacherMode?'선생님 · 켜짐':'선생님';
// 이전 화면의 교사용 표시도 즉시 제거합니다.
$('cards').replaceChildren();$('report').replaceChildren();if(view==='report'){renderReport();return}
$('boardHint').textContent=teacherMode?'제출된 카드 아래에서 상·중·하를 선택하세요. 하 → 다시 도전':'카드를 누르면 제출 · 다시 도전 카드를 누르면 재제출 · 평가 완료 카드는 유지됩니다.';
const low=teacherMode?lowStudents():new Set();t.students.forEach((s,i)=>{const wrapper=el('div',undefined,'student'),b=el('button',undefined,'card'+(s.grade==='하'?' retry':s.done?' done':''));b.type='button';b.setAttribute('aria-pressed',String(s.done));b.append(el('span',s.name,'name'),el('span',s.grade==='하'?'↻ 다시 도전':s.grade?'✓ 제출 · '+s.grade:s.done?'✓ 제출':'제출 전','status'),el('span','도전 '+s.attempts+'회','attempts'));if(low.has(s.name))b.append(badge());b.addEventListener('click',()=>{submitStudent(s);$('cards').children[i].querySelector('.card').focus()});wrapper.append(b);if(teacherMode&&s.done){const ratings=el('div',undefined,'ratings');ratings.setAttribute('role','group');ratings.setAttribute('aria-label',s.name+' 평가');['상','중','하'].forEach(g=>{const button=el('button',g,'btn');button.type='button';button.setAttribute('aria-pressed',String(s.grade===g));button.setAttribute('aria-label',s.name+' '+g+' 평가');button.addEventListener('click',()=>{rateStudent(s,g);const next=$('cards').children[i];(next.querySelector('.ratings button[aria-pressed="true"]')||next.querySelector('.card')).focus()});ratings.append(button)});wrapper.append(ratings)}$('cards').append(wrapper)});
const n=t.students.filter(s=>s.done).length,m=t.students.length;$('count').textContent='제출 '+n+'/'+m+'명';$('fill').style.width=(m?n/m*100:0)+'%';$('progress').setAttribute('aria-valuemin','0');$('progress').setAttribute('aria-valuemax',String(m));$('progress').setAttribute('aria-valuenow',String(n))}
function openForm(editing){editingId=editing?state.activeId:null;const t=current();$('task').value=editing?t.task:'';$('roster').value=t?t.students.map(s=>s.name).join('\n'):'';$('formTitle').textContent=editing?'명단·과제 수정':'새 과제 등록';$('setup').hidden=false;$('board').hidden=true;$('report').hidden=true;$('tabs').hidden=true;$('boardActions').hidden=true;$('cancel').hidden=!state.tasks.length;$('heading').textContent='과제 점검판';$('error').textContent='';$('task').focus()}
$('form').addEventListener('submit',e=>{e.preventDefault();const task=$('task').value.trim(),names=$('roster').value.split(/[\n,，]+/).map(n=>n.trim()).filter(Boolean);if(!task||!names.length){$('error').textContent='과제 이름과 학생 명단을 입력해 주세요.';return}if(new Set(names).size!==names.length){$('error').textContent='같은 이름이 있습니다. 번호나 문자를 붙여 구분해 주세요.';return}if(state.tasks.some(t=>t.id!==editingId&&t.task===task)){$('error').textContent='이미 등록된 과제 이름입니다. 다른 이름을 입력해 주세요.';return}const old=state.tasks.find(t=>t.id===editingId);if(old&&old.students.some(s=>!names.includes(s.name)&&s.attempts>0)&&!confirm('명단에서 제외한 학생의 이 과제 기록은 삭제됩니다. 수정할까요?'))return;const previous=new Map((old?.students||[]).map(s=>[s.name,s]));const t={id:old?.id||uid(),task,students:names.map(name=>previous.get(name)||fresh(name))};if(old)state.tasks[state.tasks.indexOf(old)]=t;else state.tasks.push(t);state.activeId=t.id;view='task';save();render()});
$('teacher').addEventListener('click',()=>{teacherMode=!teacherMode;render()});$('edit').addEventListener('click',()=>openForm(true));$('cancel').addEventListener('click',render);$('reset').addEventListener('click',()=>{if(confirm('현재 과제의 제출 상태·평가·도전 횟수를 초기화할까요? 다른 과제는 유지됩니다.')){current().students=current().students.map(s=>fresh(s.name));save();render()}});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('saveNote').textContent='전체 화면은 크롬에서 F11 키로도 사용할 수 있습니다.'}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면'});
function normalizeStudent(s){if(!s||typeof s.name!=='string'||!s.name.trim()||typeof s.done!=='boolean')throw Error('학생 기록 오류');const grade=['상','중','하'].includes(s.grade)?s.grade:null;return {name:s.name,done:grade==='하'?false:s.done,grade,lastGrade:['상','중','하'].includes(s.lastGrade)?s.lastGrade:grade,attempts:Math.max(Number.isSafeInteger(s.attempts)&&s.attempts>=0?s.attempts:0,s.done||grade?1:0)}}
try{const saved=JSON.parse(localStorage.getItem(key));if(saved){const tasks=Array.isArray(saved.tasks)?saved.tasks:[{id:uid(),task:saved.task,students:saved.students}];if(!tasks.length||!tasks.every(t=>typeof t.task==='string'&&t.task.trim()&&Array.isArray(t.students)&&t.students.length))throw Error('과제 기록 오류');state={version:2,tasks:tasks.map(t=>({id:t.id||uid(),task:t.task,students:t.students.map(normalizeStudent)})),activeId:saved.activeId};if(!current())state.activeId=state.tasks[0].id;render()}}catch(e){$('saveNote').textContent='저장 내용을 불러오지 못했습니다. 기존 저장 내용은 덮어쓰지 않았습니다.'}

</script>
</body>
</html>
