<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 과제 점검판</title>
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#172b46;background:#f1f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #ffb627;outline-offset:4px}.wrap{max-width:1600px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{font-size:18px;font-weight:800;color:#506681;margin:0 0 8px}h1{font-size:clamp(30px,4vw,52px);margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #c6d2e0;border-radius:12px;padding:13px 18px;background:white;color:#233d5d;font-weight:700;min-height:48px}.primary{background:#244edb;color:white;border-color:#244edb}.setup{max-width:800px;margin:40px auto;background:white;padding:clamp(24px,5vw,48px);border-radius:24px;box-shadow:0 12px 40px #203b6010}.setup h2{font-size:30px;margin:0 0 12px}.hint{color:#53677f;line-height:1.7}.field{display:block;margin:24px 0 10px;font-weight:800;font-size:20px}input,textarea{width:100%;border:2px solid #cbd6e4;border-radius:12px;padding:15px;font-size:22px;background:#fbfcfe;color:#172b46}textarea{min-height:240px;resize:vertical;line-height:1.6}.setup .primary{width:100%;font-size:23px;margin-top:24px}.summary{background:#172f50;color:white;border-radius:22px;padding:26px 32px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.count{font-size:clamp(30px,4vw,48px);font-weight:900}.summary p{margin:8px 0 0;color:#d2dff0;font-size:18px}.track{height:10px;background:#3b506e;border-radius:20px;width:220px;overflow:hidden}.fill{height:100%;background:#69e0b3;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.card{min-height:180px;border:3px solid #d4deea;border-radius:20px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;color:#233d5d;box-shadow:0 5px 0 #dce4ee;transition:background .15s,transform .15s}.card:hover{transform:translateY(-2px)}.card.done{background:#d9f8eb;border-color:#14845b;box-shadow:0 5px 0 #b5dfce;color:#086343}.name{font-size:clamp(30px,3vw,42px);font-weight:900;overflow-wrap:anywhere;max-width:100%}.status{font-size:23px;font-weight:800;border-radius:30px;padding:6px 18px;background:#edf1f7}.done .status{background:#14845b;color:white}.foot{font-size:16px;color:#53677f;text-align:center;margin-top:30px;line-height:1.7}.error{color:#b22c30;font-weight:700;min-height:24px;margin:12px 0 0}[hidden]{display:none!important}@media(max-width:650px){.wrap{padding:20px}header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:155px;padding:18px 8px}.name{font-size:30px}.summary{padding:24px}.track{width:160px}}
</style>
</head>
<body>
<main class="wrap">
<header><div><p class="eyebrow">우리 반 · 함께 확인해요</p><h1 id="heading">과제 점검판</h1></div><div class="actions" id="boardActions" hidden><button class="btn" id="edit">명단·과제 수정</button><button class="btn" id="reset">제출 상태 초기화</button><button class="btn" id="fullscreen">전체 화면</button></div></header>
<section class="setup" id="setup">
<h2>오늘의 과제를 준비해요</h2><p class="hint">과제 이름과 학생 명단을 입력하세요.<br>점검판에서 학생 카드를 누르면 제출 상태가 바뀝니다.</p>
<form id="form"><label class="field" for="task">과제 이름</label><input id="task" placeholder="예: 수학 익힘책 24~25쪽" required maxlength="150">
<label class="field" for="roster">학생 명단</label><p class="hint" id="rosterHint">한 줄에 한 명씩 입력하세요. 쉼표로 구분해도 됩니다.<br>이름이 같은 학생은 ‘김민수 A’, ‘김민수 B’처럼 구분해 주세요.</p><textarea id="roster" placeholder="김민수&#10;이서연&#10;박지우" required aria-describedby="rosterHint"></textarea><p class="error" id="error" role="alert"></p><button class="btn primary" type="submit">점검판 열기</button><button class="btn" type="button" id="cancel" hidden style="width:100%;margin-top:12px">수정 취소</button></form>
</section>
<section id="board" hidden aria-label="학생별 제출 현황"><div class="summary"><div><div class="count" id="count" role="status" aria-live="polite"></div><p>카드를 누르면 제출 · 다시 누르면 제출 전</p></div><div class="track" role="progressbar" aria-label="제출률" id="progress"><div class="fill" id="fill"></div></div></div><div class="grid" id="cards"></div></section>
<p class="foot" id="saveNote">인터넷 연결 없이 사용할 수 있습니다. 이 브라우저에 입력 내용과 제출 상태가 자동 저장됩니다.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),key='classroom-assignment-board-v1';
let state={task:'',students:[]};
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('saveNote').textContent='자동 저장됨 · 같은 컴퓨터와 브라우저에서 이 파일을 다시 열면 이어서 사용할 수 있습니다.'}catch(e){$('saveNote').textContent='이 브라우저에서는 자동 저장을 사용할 수 없습니다. 창을 닫으면 입력 내용이 사라질 수 있습니다.'}}
function summary(){const n=state.students.filter(s=>s.done).length,m=state.students.length;$('count').textContent=`제출 ${n}/${m}명`;$('fill').style.width=(m?n/m*100:0)+'%';$('progress').setAttribute('aria-valuemin','0');$('progress').setAttribute('aria-valuemax',String(m));$('progress').setAttribute('aria-valuenow',String(n))}
function render(){ $('heading').textContent=state.task;$('setup').hidden=true;$('board').hidden=false;$('boardActions').hidden=false;$('cards').replaceChildren();state.students.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='card'+(s.done?' done':'');b.setAttribute('aria-pressed',String(s.done));const name=document.createElement('span');name.className='name';name.textContent=s.name;const status=document.createElement('span');status.className='status';status.textContent=s.done?'✓ 제출':'제출 전';b.append(name,status);b.addEventListener('click',()=>{s.done=!s.done;b.classList.toggle('done',s.done);b.setAttribute('aria-pressed',String(s.done));status.textContent=s.done?'✓ 제출':'제출 전';summary();save()});$('cards').append(b)});summary()}
function edit(){ $('task').value=state.task;$('roster').value=state.students.map(s=>s.name).join('\n');$('setup').hidden=false;$('board').hidden=true;$('boardActions').hidden=true;$('cancel').hidden=!state.students.length;$('heading').textContent='과제 점검판';$('task').focus()}
$('form').addEventListener('submit',e=>{e.preventDefault();const task=$('task').value.trim(),names=$('roster').value.split(/[\n,，]+/).map(n=>n.trim()).filter(Boolean);if(!task||!names.length){$('error').textContent='과제 이름과 학생 명단을 입력해 주세요.';return}if(new Set(names).size!==names.length){$('error').textContent='같은 이름이 있습니다. 번호나 문자를 붙여 학생을 구분해 주세요.';return}const sameTask=state.task===task;const previous=new Map(state.students.map(s=>[s.name,s.done]));if(state.students.some(s=>s.done)&&!sameTask&&!confirm('과제 이름을 바꾸면 모든 학생이 제출 전으로 바뀝니다. 새 과제로 시작할까요?'))return;state={task,students:names.map(name=>({name,done:sameTask?(previous.get(name)||false):false}))};$('error').textContent='';save();render()});
$('edit').addEventListener('click',edit);$('cancel').addEventListener('click',()=>{$('error').textContent='';render()});$('reset').addEventListener('click',()=>{if(confirm('모든 학생의 제출 상태를 ‘제출 전’으로 바꿀까요?')){state.students.forEach(s=>s.done=false);save();render()}});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('saveNote').textContent='전체 화면은 크롬에서 F11 키로도 사용할 수 있습니다.'}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면'});
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.task==='string'&&saved.task.trim()&&Array.isArray(saved.students)&&saved.students.length&&saved.students.every(s=>s&&typeof s.name==='string'&&s.name.trim()&&typeof s.done==='boolean')){state=saved;render()}}catch(e){$('saveNote').textContent='저장 내용을 불러오지 못했습니다. 새 명단으로 시작해 주세요.'}
</script>
</body>
</html>
