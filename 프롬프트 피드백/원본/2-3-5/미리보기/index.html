<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src blob: data:; frame-src blob:; connect-src 'none'"><title>학교 파일 제출 · 로컬 미리보기</title>
<style>
:root{--green:#245c4d;--ink:#253a32;--muted:#708078;--line:#dce4df;--bg:#f3f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 '맑은 고딕',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;padding:10px 17px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:5px}button:hover{border-color:var(--green);background:#edf3ef}button.primary,.active{background:var(--green)!important;color:white!important}button:disabled{opacity:.5;cursor:default}input,select{width:100%;padding:12px;border:1px solid #c3cfc7;border-radius:4px;background:white;color:var(--ink)}input[type=checkbox]{width:19px}label{display:block;font-weight:600;margin:15px 0 6px}h1{font-size:30px;line-height:1.4;margin:8px 0 12px}h2{font-size:21px;margin:24px 0 12px}h3{font-size:18px}p{margin:8px 0 16px}small,.muted{color:var(--muted);font-size:14px}.banner{background:#e8eee6;text-align:center;padding:8px 15px;font-size:14px;color:#45604e}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1180px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:21px;font-weight:800}.logo{display:inline-grid;place-items:center;background:var(--green);color:white;width:36px;height:36px;margin-right:10px;border-radius:5px}main{max-width:1180px;margin:32px auto;padding:0 24px 60px}.narrow{max-width:730px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:30px;margin-bottom:20px}.eyebrow{font-size:13px;color:var(--green);letter-spacing:2px;font-weight:700}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.steps{display:flex;gap:10px;margin:20px 0 30px;font-size:14px}.steps span{flex:1;border-top:3px solid var(--line);padding-top:10px}.steps .current{border-color:var(--green);color:var(--green);font-weight:700}.choice{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:10px 0;padding:17px 20px}.choice.selected{border:2px solid var(--green);background:#eef5ef}.badge{font-size:13px;background:#e9f2ed;color:var(--green);padding:4px 9px;border-radius:3px}.summary{background:#f3f6f2;padding:16px;border-left:3px solid var(--green)}.file{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.file img{width:80px;height:65px;object-fit:contain}.drop{display:block;text-align:center;border:1px dashed #9eafa3;padding:25px;background:#f8faf7}.drop input{margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.metric{background:white;border:1px solid var(--line);padding:22px}.metric strong{display:block;font-size:32px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:14px;background:#f5f7f3;color:var(--muted)}td,th{padding:14px 12px;border-bottom:1px solid var(--line)}td button{font-size:13px;padding:6px 9px}hr{border:0;border-top:1px solid var(--line);margin:25px 0}.bar{display:flex;gap:14px;align-items:center;margin:16px 0}.bar span{width:180px}.bar i{display:block;height:13px;background:#7fa18e}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.error{color:#a33a32}.empty{text-align:center;padding:35px;color:var(--muted)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#243f33;color:white;padding:13px 25px;border-radius:5px;display:none;z-index:5}dialog{border:1px solid var(--line);border-radius:6px;max-width:720px;width:90%;padding:25px}dialog::backdrop{background:#182e2466}dialog img{max-width:100%;max-height:65vh}details{margin:20px 0}summary{cursor:pointer}footer{text-align:center;font-size:13px;color:var(--muted)}:focus-visible{outline:3px solid #8bb8a2;outline-offset:3px}@media(max-width:720px){main{padding:0 14px;margin-top:20px}.panel{padding:22px}.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.head{padding:14px}.head button{padding:8px;font-size:14px}h1{font-size:26px}}
</style></head><body><div class="banner">외부 연결 없는 로컬 미리보기 · 예시 데이터 · 파일은 이 브라우저에서만 확인합니다 · 새로고침 시 초기화</div><header><div class="head"><div class="brand"><span class="logo">▤</span>학교 파일 제출</div><div id="top"></div></div></header><main id="app"></main><footer>학교와 가정을 잇는 간편한 파일 제출 · 로컬 데모</footer><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let role='parent',tab='대시보드',year=2026,p={},selected='',picked=[],timer;
const boxes=[{id:1,name:'공개수업 참관 신청서',count:48,active:true,year:2026},{id:2,name:'현장체험학습 신청서',count:32,active:true,year:2026},{id:3,name:'방과후학교 신청서',count:21,active:true,year:2026},{id:4,name:'교육활동 동의서',count:12,active:true,year:2026},{id:5,name:'2026학년도 3학년 2반',count:9,active:true,year:2026,grade:3,cls:2},{id:6,name:'2025학년도 공개수업 자료',count:8,active:false,year:2025}];
let students=[{grade:3,cls:2,num:1,name:'김하늘',year:2026},{grade:3,cls:2,num:2,name:'이서준',year:2026},{grade:2,cls:1,num:1,name:'박지우',year:2026}],teachers=[{name:'이지상',email:'teacher@school.example',status:'승인',box:[1,5]},{name:'김선생',email:'kim@school.example',status:'승인 대기',box:[]}];
let records=[{id:1,box:1,grade:3,cls:2,student:'김하늘',parent:'김보호',password:'preview1234',phone:'010-0000-0000',date:'2026. 11. 08. 09:20',files:[{name:'공개수업_참관신청서[26-11-08-09-20-00].pdf',size:153600}]},{id:2,box:2,grade:2,cls:1,student:'박지우',parent:'박보호',password:'preview1234',date:'2026. 11. 07. 14:35',files:[{name:'체험학습_신청서.hwpx',size:89088}]}];
const btn=(s,js,cl='')=>`<button class="${cl}" onclick="${js}">${s}</button>`;
function field(id,label,value='',type='text',extra=''){return `<div><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function sel(id,label,list,val){return `<div><label for="${id}">${label}</label><select id="${id}" name="${id}">${list.map(x=>`<option value="${esc(x[0])}" ${String(val)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`}
function table(head,rows){return `<div class="table"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">표시할 내용이 없습니다.</td></tr>`}</tbody></table></div>`}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3500)}
function header(){ $('top').innerHTML=btn('학부모','parentHome()')+' '+btn('교사','login("teacher")')+' '+btn('관리자','login("admin")')+(role==='parent'?' '+btn('업로드 확인','lookup()'): ''); }
function steps(n){return `<div class="steps">${['학생 정보','제출함·파일','완료'].map((x,i)=>`<span class="${i===n?'current':''}">0${i+1} ${x}</span>`).join('')}</div>`}
function parentHome(){role='parent';header();$('app').innerHTML=`<div class="narrow">${steps(0)}<section class="panel"><div class="eyebrow">FOR PARENTS</div><h1>파일 제출, 간편하게.</h1><p class="muted">학생 정보를 입력하고 학교에 제출할 파일을 선택하세요.</p><form id="info"><div class="row">${sel('grade','학년',[1,2,3,4,5,6].map(x=>[x,x+'학년']),p.grade||3)}${sel('cls','반',[1,2,3,4,5].map(x=>[x,x+'반']),p.cls||2)}</div>${field('student','학생 이름',p.student||'','text','required placeholder="예: 김하늘"')}<div class="row">${field('parent','학부모 이름',p.parent||'','text','required')}${field('phone','학부모 전화번호',p.phone||'','tel','required placeholder="010-0000-0000" pattern="[0-9+() -]{9,20}"')}</div>${field('password','제출 확인용 임시암호',p.password||'','password','required minlength="10" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{10,}"')}<small>영문과 숫자를 포함한 10자 이상 · 제출 기록 확인에 사용합니다.</small><div class="actions"><button class="primary" type="submit">다음 · 제출함 선택 →</button>${btn('예시 정보 채우기','fillExample()')}</div></form></section><p class="muted">입력 정보와 선택한 파일은 외부로 전송되지 않습니다.</p></div>`;$('info').onsubmit=e=>{e.preventDefault();p=Object.fromEntries(new FormData(e.target));const all=students.filter(s=>s.year===2026),cls=all.filter(s=>s.grade==p.grade&&s.cls==p.cls);if((all.length>=70||cls.length>=15)&&!cls.some(s=>s.name===p.student.trim()))return toast('학생 정보가 일치하지 않습니다. 학년, 반, 이름을 확인하세요.');p.student=p.student.trim();choose()}}
function fillExample(){Object.assign(p,{grade:3,cls:2,student:'김하늘',parent:'김보호',phone:'010-0000-0000',password:'preview1234'});parentHome()}
function choose(){header();const general=boxes.filter(b=>b.year===2026&&b.active&&!b.grade&&!b.deleted).sort((a,b)=>b.count-a.count);const cls=boxes.filter(b=>b.year===2026&&b.active&&b.grade==p.grade&&b.cls==p.cls&&!b.deleted);const choices=a=>a.map(b=>`<button class="choice ${selected==b.id?'selected':''}" onclick="selected=${b.id};choose()"><span>${esc(b.name)}<br><small>${b.grade?'우리 반 전용':'최근 한 달 '+b.count+'건'}</small></span><span class="badge">${selected==b.id?'선택됨':'선택'}</span></button>`).join('');$('app').innerHTML=`<div class="narrow">${steps(1)}<section class="panel"><h1>어디에 제출할까요?</h1><p class="summary">${esc(p.grade)}학년 ${esc(p.cls)}반 <b>${esc(p.student)}</b> · ${esc(p.parent)}</p><h2>많이 찾는 제출함 <small>최근 한 달 TOP 3</small></h2>${choices(general.slice(0,3))}<details><summary>일반 제출함 전체보기 · ${general.length}개</summary>${choices(general)}</details><h2>우리 반 제출함</h2>${choices(cls)||'<p class="muted">등록된 학급 제출함이 없습니다.</p>'}<hr><label class="drop">＋ 첨부파일 추가<input id="picker" type="file" multiple accept=".hwp,.hwpx,.xls,.xlsx,.pdf,.jpg,.jpeg,.png,.gif,.webp,.bmp,.txt,.csv"><small>파일당 8 MB · 총 24 MB · 최대 10개<br>로컬 파일 선택 및 미리보기만 지원합니다.</small></label><div id="picked"></div><div class="actions">${btn('이전','parentHome()')} ${btn('로컬 제출 완료','finish()','primary')}</div></section></div>`;$('picker').onchange=e=>{for(const f of e.target.files){if(picked.some(x=>x.name===f.name&&x.size===f.size))continue;if(f.size>8*1024*1024||picked.length>=10||picked.reduce((s,x)=>s+x.size,0)+f.size>24*1024*1024){toast('첨부 가능 개수 또는 용량을 초과했습니다.');continue}picked.push(f)}drawPicked();e.target.value=''};drawPicked()}
function drawPicked(){$('picked').innerHTML=picked.map((f,i)=>`<div class="file"><div><b>${esc(f.name)}</b><br><small>${(f.size/1024).toFixed(1)} KB</small></div><div>${btn('미리보기',`previewPicked(${i})`)} ${btn('제거',`picked.splice(${i},1);drawPicked()`)}</div></div>`).join('')}
function previewPicked(i){showFile(picked[i])}
function showFile(f){let content=`<p>${esc(f.name)}</p><p class="muted">${(f.size/1024).toFixed(1)} KB · 로컬 파일</p>`;if(f instanceof Blob&&f.type.startsWith('image/')){let url=URL.createObjectURL(f);content+=`<img src="${url}" alt="선택한 이미지">`;$('modal').onclose=()=>URL.revokeObjectURL(url)}else content+='<div class="summary">이 형식은 파일명과 크기만 미리 봅니다. 파일은 외부로 전송되지 않습니다.</div>';$('modal').innerHTML=content+`<div class="actions">${btn('닫기',"$('modal').close()")}</div>`;$('modal').showModal()}
function finish(){if(!selected||!boxes.some(b=>b.id==selected&&b.active&&!b.deleted))return toast('제출함을 선택해 주세요.');if(!picked.length)return toast('파일을 추가해 주세요.');const stamp=new Date().toISOString().slice(2,19).replace(/[T:]/g,'-');const r={...p,id:Date.now(),box:Number(selected),date:new Date().toLocaleString('ko-KR'),files:picked.map(f=>({name:f.name.replace(/(\.[^.]+)?$/,(_,ext)=>'['+stamp+']'+(ext||'')),size:f.size,blob:f}))};records.unshift(r);boxes.find(b=>b.id==selected).count++;picked=[];selected='';$('app').innerHTML=`<div class="narrow">${steps(2)}<section class="panel" style="text-align:center"><div style="font-size:50px;color:var(--green)">✓</div><h1>미리보기 접수가 완료되었습니다</h1><p>실제 전송 없이 브라우저 메모리에 기록했습니다.</p><p class="summary">${esc(boxes.find(b=>b.id===r.box).name)}<br>${esc(r.grade)}학년 ${esc(r.cls)}반 ${esc(r.student)} · ${r.files.length}개 파일</p><small>예시 보관 경로: ${r.grade}_${r.cls}_${esc(r.student)} / 파일명[날짜-시각].확장자</small><div class="actions" style="justify-content:center">${btn('제출 기록 확인','lookup()','primary')}${btn('새로 제출하기','parentHome()')}</div></section></div>`}
function lookup(){role='parent';header();$('app').innerHTML=`<section class="panel narrow"><div class="eyebrow">SUBMISSION HISTORY</div><h1>업로드 확인</h1><p class="muted">제출할 때 입력한 학생 정보와 임시암호를 입력하세요.</p><form id="look"><div class="row">${field('grade','학년',p.grade||3,'number','required min="1" max="6"')}${field('cls','반',p.cls||2,'number','required min="1" max="99"')}</div>${field('student','학생 이름',p.student||'김하늘','text','required')}${field('password','임시암호',p.password||'','password','required')}<small>예시 기록: 3학년 2반 김하늘 / preview1234</small><div class="actions"><button class="primary">조회</button>${btn('제출 화면','parentHome()')}</div></form><div id="history"></div></section>`;$('look').onsubmit=e=>{e.preventDefault();const q=Object.fromEntries(new FormData(e.target)),r=records.filter(r=>r.grade==q.grade&&r.cls==q.cls&&r.student===q.student.trim()&&r.password===q.password);$('history').innerHTML=r.length?r.map(r=>`<h2>${esc(boxes.find(b=>b.id===r.box)?.name||'제출함')}</h2><p class="muted">${esc(r.date)} · 로컬 접수 완료</p>${table(['파일명','크기'],r.files.map(f=>[esc(f.name),(f.size/1024).toFixed(1)+' KB']))}`).join(''):'<p class="error">일치하는 제출 기록이 없습니다. 입력 정보를 확인하세요.</p>'}}
function login(target){role=target;header();$('app').innerHTML=`<section class="panel narrow"><div class="eyebrow">STAFF ACCESS</div><h1>${target==='admin'?'관리자':'교사'} 화면 미리보기</h1><p>실제 계정 인증 대신 화면 전환으로 체험합니다.</p><div class="actions">${btn(target==='admin'?'관리자로 화면 전환':'승인된 교사로 화면 전환',`role='${target}';tab='${target==='admin'?'대시보드':'제출함 열람'}';staff()`,'primary')}</div>${target==='teacher'?`<hr>${btn('인증 신청 · 대기 화면','application()')}`:''}</section>`}
function application(){ $('app').innerHTML=`<section class="panel narrow"><h1>교사 인증 신청</h1><form id="apply">${field('name','교사 이름','','text','required')}${field('email','학교 이메일','','email','required')}<div class="row">${field('grade','담임 학년 (선택)','','number','min="1" max="6"')}${field('cls','담임 반 (선택)','','number','min="1" max="99"')}</div><div class="actions"><button class="primary">미리보기 인증 신청</button></div></form></section>`;$('apply').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));teachers.push({...d,status:'승인 대기',box:[]});$('app').innerHTML=`<section class="panel narrow"><h1>승인 대기 중입니다</h1><p>${esc(d.name)} · ${esc(d.email)}</p><p class="muted">관리자 화면의 교사·권한에서 예시 승인을 할 수 있습니다. 이메일은 발송하지 않습니다.</p>${btn('교사 화면으로','login("teacher")')}</section>`}}
function staff(){header();const tabs=role==='admin'?['대시보드','제출함 열람','제출함 관리','학생 명렬표','교사·권한','운영 설정']:['제출함 열람'];$('app').innerHTML=`<div class="row"><div><div class="eyebrow">SCHOOL WORKSPACE</div><h1>${role==='admin'?'관리자 업무 공간':'이지상 선생님 · 제출함'}</h1><small>${year}학년도 · ${year}년 3월 ~ ${year+1}년 2월</small></div><div style="max-width:180px">${sel('year','학년도',[[2026,'2026학년도'],[2025,'2025학년도']],year)}</div></div><nav>${tabs.map(t=>btn(t,`tab='${t}';staff()`,t===tab?'active':'')).join('')}</nav><div id="content"></div>`;$('year').onchange=e=>{year=Number(e.target.value);staff()};({'대시보드':dashboard,'제출함 열람':filesView,'제출함 관리':boxAdmin,'학생 명렬표':studentAdmin,'교사·권한':teacherAdmin,'운영 설정':settings}[tab])()}
function currentBoxes(){return boxes.filter(b=>b.year===year&&(role==='admin'||teachers[0].box.includes(b.id)&&!b.deleted))}
function dashboard(){const r=records.filter(r=>boxes.find(b=>b.id===r.box)?.year===year);$('content').innerHTML=`<div class="metrics">${[[r.length,'접수 건수'],[r.reduce((n,r)=>n+r.files.length,0),'파일 수'],[new Set(r.map(r=>r.student)).size,'제출 학생'],[currentBoxes().length,'제출함'],[teachers.filter(t=>t.status==='승인').length,'승인 교사']].map(x=>`<div class="metric"><small>${x[1]}</small><strong>${x[0]}</strong></div>`).join('')}</div><div class="split"><section class="panel"><h2>최근 한 달 · 제출함별 현황</h2><small>인기 순위용 예시 집계 · 접수 목록과 별도</small>${currentBoxes().map(b=>`<div class="bar"><span>${esc(b.name)}</span><i style="width:${b.count*3}px;max-width:42%"></i><small>${b.count}건</small></div>`).join('')}</section><section class="panel"><h2>최근 접수</h2>${r.map(r=>`<div class="file"><div><b>${esc(r.student)}</b><br><small>${esc(boxes.find(b=>b.id===r.box)?.name)}</small></div><span class="badge">${r.files.length}개</span></div>`).join('')||'<p class="empty">접수 기록이 없습니다.</p>'}<h2>처리할 업무</h2><p>교사 인증 대기 <b>${teachers.filter(t=>t.status==='승인 대기').length}명</b></p>${btn('대기 목록 보기',"tab='교사·권한';staff()")}</section></div>`}
let fileBox=1;
function filesView(){const bs=currentBoxes();if(!bs.some(b=>b.id==fileBox))fileBox=bs[0]?.id;$('content').innerHTML=`<section class="panel"><div class="row">${sel('filebox','제출함',bs.map(b=>[b.id,b.name]),fileBox)}${field('search','검색','','search','placeholder="학생 또는 파일명"')}</div><p class="muted">${role==='teacher'?'승인된 교사에게 배정된 제출함만 표시합니다.':'전체 제출함의 로컬 접수 기록입니다.'}</p><div id="fileRows"></div></section>`;$('filebox').onchange=e=>{fileBox=Number(e.target.value);drawFileRows()};$('search').oninput=drawFileRows;drawFileRows()}
function drawFileRows(){const q=$('search').value;const rows=[];records.filter(r=>r.box==fileBox).forEach(r=>r.files.forEach((f,i)=>{if(![r.student,f.name].join(' ').includes(q))return;rows.push([esc(f.name)+'<br><small>'+(f.size/1024).toFixed(1)+' KB</small>',esc(r.grade+'학년 '+r.cls+'반 '+r.student),esc(r.parent),esc(r.date),btn('보기',`fileAction(${r.id},${i},'preview')`)+btn('이름',`fileAction(${r.id},${i},'rename')`)+btn('이동',`fileAction(${r.id},${i},'move')`)+btn('삭제',`fileAction(${r.id},${i},'delete')`)])}));$('fileRows').innerHTML=table(['파일','학생','제출자','제출 시각','관리'],rows)+'<p class="muted">파일 확인은 로컬 미리보기만 지원합니다. Drive 다운로드 및 ZIP 생성은 연결하지 않습니다.</p>'}
function fileAction(id,i,a){const r=records.find(r=>r.id===id),f=r.files[i];if(a==='preview')return showFile(f.blob||f);if(a==='rename'){const n=prompt('새 파일명',f.name);if(n?.trim())f.name=n.trim()}if(a==='delete'){if(!confirm('이 미리보기 기록에서 파일을 삭제할까요?'))return;r.files.splice(i,1)}if(a==='move'){const bs=currentBoxes().filter(b=>b.id!==r.box&&!b.deleted);$('modal').innerHTML=`<h2>파일 이동</h2><p>${esc(f.name)}</p>${sel('dest','도착 제출함',bs.map(b=>[b.id,b.name]))}<div class="actions">${btn('이동',`moveFile(${id},${i})`,'primary')}${btn('취소',"$('modal').close()")}</div>`;$('modal').showModal();return}drawFileRows()}
function moveFile(id,i){if(!$('dest').value)return;const r=records.find(r=>r.id===id);records.push({...r,id:Date.now(),box:Number($('dest').value),files:[r.files.splice(i,1)[0]]});$('modal').close();drawFileRows();toast('로컬 기록의 제출함을 변경했습니다.')}
function boxAdmin(){$('content').innerHTML=`<section class="panel"><h2>제출함 관리</h2><form id="addbox"><div class="row">${field('name','일반 제출함 이름','','text','required')}<button class="primary">제출함 생성</button></div></form><h2>학급 제출함 일괄 생성</h2><form id="classbox"><div class="row">${field('grade','학년',3,'number','min="1" max="6" required')}${field('start','시작 반',1,'number','min="1" max="99" required')}${field('end','마지막 반',3,'number','min="1" max="99" required')}<button>생성</button></div></form><hr>${table(['제출함 이름','종류','상태','작업'],currentBoxes().map(b=>[esc(b.name),b.grade?'학급':'일반',b.deleted?'삭제 예약 · 30일 유예':b.active?'접수 중':'비활성',btn('이름',`editBox(${b.id})`)+(b.deleted?btn('복원',`changeBox(${b.id},'restore')`):btn(b.active?'비활성화':'활성화',`changeBox(${b.id},'toggle')`)+btn('삭제 예약',`changeBox(${b.id},'delete')`))]))}<small>삭제 예약은 화면상 상태만 변경합니다. 실제 자동 삭제는 실행하지 않습니다.</small></section>`;$('addbox').onsubmit=e=>{e.preventDefault();boxes.push({id:Date.now(),year,name:e.target.name.value.trim(),active:true,count:0});staff();toast('제출함을 추가했습니다.')};$('classbox').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(+d.end<+d.start)return toast('반 범위를 확인하세요.');for(let c=+d.start;c<=+d.end;c++){if(!boxes.some(b=>b.year===year&&b.grade==d.grade&&b.cls===c))boxes.push({id:Date.now()+c,year,grade:+d.grade,cls:c,name:`${year}학년도 ${d.grade}학년 ${c}반`,count:0,active:true})}staff();toast('학급 제출함을 생성했습니다.')}}
function editBox(id){const b=boxes.find(b=>b.id===id),n=prompt('제출함 이름',b.name);if(n?.trim())b.name=n.trim();staff()}
function changeBox(id,a){const b=boxes.find(b=>b.id===id);if(a==='delete'){if(!confirm('자료는 보존하고 제출함을 비활성화하여 삭제 예약할까요?'))return;b.deleted=true;b.active=false}else if(a==='restore'){b.deleted=false;b.active=true}else b.active=!b.active;staff()}
function studentAdmin(){const ss=students.filter(s=>s.year===year);$('content').innerHTML=`<section class="panel"><h2>학생 명렬표 <span class="badge">${ss.length}명</span></h2><p class="muted">전체 70명 이상 또는 해당 반 15명 이상이면 제출 시 학생 정보 일치를 확인합니다. 현재 예시는 자유 입력이 가능합니다.</p><form id="studentForm"><div class="row">${field('grade','학년',3,'number','required min="1" max="6"')}${field('cls','반',2,'number','required min="1" max="99"')}${field('num','번호',3,'number','required min="1"')}${field('name','학생 이름','','text','required')}<button class="primary">학생 추가</button></div></form><h2>CSV 일괄 등록</h2>${btn('CSV 양식 다운로드','csvTemplate()')}<label for="csv">로컬 CSV 선택 · 학년도,학년,반,번호,학생이름</label><input id="csv" type="file" accept=".csv"><div id="csvPreview"></div><hr>${table(['학년','반','번호','이름','관리'],ss.map(s=>[s.grade,s.cls,s.num,esc(s.name),btn('수정',`editStudent(${students.indexOf(s)})`)+btn('삭제',`students.splice(${students.indexOf(s)},1);staff()`)]))}</section>`;$('studentForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(students.some(s=>s.year===year&&s.grade==d.grade&&s.cls==d.cls&&s.num==d.num))return toast('이미 등록된 학급 번호입니다.');students.push({...d,year});staff()};$('csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;const lines=(await f.text()).replace(/^\uFEFF/,'').trim().split(/\r?\n/).slice(1).filter(Boolean);const items=lines.map(l=>l.split(',').map(x=>x.trim()));if(!items.length||items.some(x=>x.length!==5||![x[0],x[1],x[2],x[3]].every(v=>/^\d+$/.test(v))||+x[1]<1||+x[1]>6||+x[2]<1||+x[3]<1||!x[4]))return $('csvPreview').textContent='CSV 형식을 확인하세요. 단순 쉼표 구분 양식만 지원합니다.';window.csvItems=items.map(x=>({year:+x[0],grade:+x[1],cls:+x[2],num:+x[3],name:x[4]}));$('csvPreview').innerHTML=table(['학년도','학년','반','번호','이름'],items.map(x=>x.map(esc)))+btn('확인한 내용을 메모리에 반영','applyCsv()','primary')}}
function editStudent(i){const s=students[i];$('modal').innerHTML=`<h2>학생 수정</h2><form id="editStudent"><div class="row">${field('grade','학년',s.grade,'number','required min="1" max="6"')}${field('cls','반',s.cls,'number','required min="1"')}${field('num','번호',s.num,'number','required min="1"')}</div>${field('name','학생 이름',s.name,'text','required')}<div class="actions"><button class="primary">저장</button>${btn('취소',"$('modal').close()")}</div></form>`;$('modal').showModal();$('editStudent').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(students.some((x,j)=>j!==i&&x.year===s.year&&x.grade==d.grade&&x.cls==d.cls&&x.num==d.num))return toast('이미 등록된 번호입니다.');Object.assign(s,d);$('modal').close();staff()}}
function csvTemplate(){const u=URL.createObjectURL(new Blob(['\uFEFF학년도,학년,반,번호,학생이름\r\n'+year+',3,2,1,김하늘\r\n'],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='학생명렬표_양식.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function applyCsv(){for(const s of window.csvItems){const i=students.findIndex(x=>x.year===s.year&&x.grade==s.grade&&x.cls==s.cls&&x.num==s.num);if(i>=0)students[i]=s;else students.push(s)}window.csvItems=[];staff();toast('명렬표를 메모리에 반영했습니다.')}
function teacherAdmin(){$('content').innerHTML=`<section class="panel"><h2>교사·권한</h2>${table(['이름','학교 이메일','상태','처리'],teachers.map((t,i)=>[esc(t.name),esc(t.email),t.status,t.status==='승인 대기'?btn('승인',`teachers[${i}].status='승인';staff()`)+btn('반려',`teachers[${i}].status='반려';staff()`):btn('수정',`editTeacher(${i})`)+btn('삭제',`removeTeacher(${i})`)]))}<h2>교사 등록</h2><form id="teacherForm"><div class="row">${field('name','이름','','text','required')}${field('email','학교 이메일','','email','required')}<button class="primary">등록</button></div></form><hr><h2>제출함 열람 권한 · 담임 배정</h2><p class="muted">교사와 제출함을 선택해 권한을 부여합니다. 학급 제출함을 배정하면 담임 권한으로 표시합니다.</p><form id="perm"><div class="row">${sel('teacher','교사',teachers.map((t,i)=>[i,t.name]))}${sel('box','제출함',currentBoxes().filter(b=>!b.deleted).map(b=>[b.id,b.name]))}<button>권한 추가</button></div></form>${table(['교사','제출함 / 담임 학급','권한'],teachers.flatMap((t,i)=>t.box.filter(id=>boxes.some(b=>b.id===id&&b.year===year)).map(id=>[esc(t.name),esc(boxes.find(b=>b.id===id)?.name),btn('열람·파일 관리 · 해제',`teachers[${i}].box=teachers[${i}].box.filter(x=>x!==${id});staff()`)])))}</section>`;$('teacherForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(teachers.some(t=>t.email===d.email))return toast('이미 등록된 이메일입니다.');teachers.push({...d,status:'승인',box:[]});staff()};$('perm').onsubmit=e=>{e.preventDefault();const t=teachers[$('teacher').value],id=Number($('box').value);if(!t||!id)return;if(t.status!=='승인')return toast('승인된 교사에게 권한을 부여하세요.');if(!t.box.includes(id))t.box.push(id);staff()}}
function editTeacher(i){const t=teachers[i];$('modal').innerHTML=`<h2>교사 정보 수정</h2><form id="editTeacher">${field('name','이름',t.name,'text','required')}${field('email','학교 이메일',t.email,'email','required')}${sel('status','상태',[['승인','승인'],['이용 중지','이용 중지']],t.status)}<div class="actions"><button class="primary">저장</button>${btn('취소',"$('modal').close()")}</div></form>`;$('modal').showModal();$('editTeacher').onsubmit=e=>{e.preventDefault();Object.assign(t,Object.fromEntries(new FormData(e.target)));$('modal').close();staff()}}
function removeTeacher(i){if(!confirm('교사의 권한을 해제할까요? 기존 접수 파일은 보존됩니다.'))return;teachers[i].status='이용 중지';teachers[i].box=[];staff()}
let config={file:8,total:24,count:10};function settings(){$('content').innerHTML=`<section class="panel"><h2>운영 설정</h2><p class="summary">로컬 미리보기 모드 · 계정 연결, 배포, 이메일 발송 없음</p><p>파일 제한: 파일당 ${config.file} MB · 접수당 ${config.total} MB · 최대 ${config.count}개</p><p>학년도: 3월 1일 ~ 다음 해 2월 말</p><p>제출함 삭제: 30일 유예 상태만 표시</p><p class="muted">운영 서버와 연결되지 않으며 입력한 정보와 기록은 새로고침 시 사라집니다.</p></section>`}
parentHome();
</script></body></html>
