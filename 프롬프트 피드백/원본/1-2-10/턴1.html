<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{--ink:#253e3a;--green:#347a68;--paper:#fffefa;--muted:#687d77}
    *{box-sizing:border-box}body{margin:0;background:#f1f5ef;color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.6}
    main{max-width:850px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:12px}.brand{font-weight:800;letter-spacing:-.6px;font-size:20px}.leaf{color:var(--green)}
    h1{font-size:clamp(28px,5vw,42px);line-height:1.3;letter-spacing:-1.5px;margin:12px 0}h2{line-height:1.4}p{color:var(--muted)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 20px;background:var(--green);color:white;min-height:48px;font-weight:700;transition:transform .15s,background .15s}button:hover{transform:translateY(-2px)}button:disabled{opacity:.5;cursor:default;transform:none}button.secondary{background:#e8eee7;color:var(--ink)}button.danger{background:#f6e5df;color:#934837}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dca44b;outline-offset:3px}
    .intro{margin:38px 0 28px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tile{background:var(--paper);border:1px solid #e1e7dc;border-radius:24px;padding:26px;text-align:left;color:var(--ink);box-shadow:0 8px 24px #29473606}.tile span{display:block}.tile .icon{font-size:32px;margin-bottom:30px}.tile strong{font-size:23px}.tile .desc{font-weight:400;color:var(--muted);margin-top:8px;font-size:14px}.panel{background:var(--paper);border:1px solid #e1e7dc;border-radius:24px;padding:28px;margin:18px 0;box-shadow:0 10px 35px #29473606}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted);font-size:14px}.pill{background:#e7f0e8;color:var(--green);padding:5px 12px;border-radius:99px;font-size:13px}.card{width:100%;min-height:290px;background:var(--paper);color:var(--ink);border:1px solid #dce5d9;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;margin:20px 0;box-shadow:0 12px 35px #29473609}.card .text{font-size:clamp(23px,4vw,32px);margin:24px 0;overflow-wrap:anywhere;white-space:pre-wrap}.card.answer{background:#e5f0e7}.controls{display:flex;justify-content:center;gap:12px}.bar{height:7px;background:#e1e8de;border-radius:9px;overflow:hidden;margin:18px 0}.bar div{height:100%;background:var(--green);transition:width .2s}.question{font-size:25px;margin:24px 0;white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;font-weight:700;margin:15px 0 7px}input,select{width:100%;padding:13px;border:1px solid #ccd8cd;border-radius:12px;background:white;color:var(--ink)}.feedback{min-height:34px;margin-top:15px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}.edit-card{padding:18px;background:#f3f6f0;border-radius:16px;margin:16px 0}.edit-card input{margin:5px 0}.score{font-size:64px;font-weight:800;color:var(--green);line-height:1.3}.review{border-top:1px solid #e2e8de;padding:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status{padding:10px 0;color:#8c4532;white-space:pre-wrap}footer{text-align:center;margin-top:36px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:560px){main{padding:20px 16px 40px}.grid{grid-template-columns:1fr}.tile .icon{margin-bottom:12px}.panel{padding:20px}.controls button{padding:12px 14px}.brand{font-size:18px}.card{padding:22px}.intro{margin-top:24px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main>
  <header><div class="brand"><span class="leaf">✦</span> 플래시 학습 게임</div><button id="home" class="secondary" onclick="showMenu()">처음으로</button></header>
  <div id="status" class="status" role="status" aria-live="polite">학습 카드를 불러오고 있어요…</div>
  <section id="menu" hidden>
    <div class="intro"><div class="eyebrow">A LITTLE EVERY DAY</div><h1>한 장씩 익히고,<br>차곡차곡 기억해요.</h1><p>가볍게 시작하는 나만의 단원 용어 학습</p></div>
    <label for="category">학습할 카테고리</label><select id="category"></select>
    <p id="summary" class="muted"></p>
    <div class="grid">
      <button class="tile" onclick="startStudy()"><span class="icon">📖</span><strong>학습 모드 →</strong><span class="desc">카드를 눌러 정답을 확인하며 익혀요.</span></button>
      <button class="tile" onclick="startQuiz()"><span class="icon">⏱</span><strong>퀴즈 모드 →</strong><span class="desc">제한 시간 안에 기억한 용어를 적어 봐요.</span></button>
    </div><p style="text-align:center"><button class="secondary" onclick="openLogin()">⚙ 관리자</button></p>
  </section>
  <section id="study" hidden>
    <div class="row between"><h2>천천히 익혀요</h2><span id="studyCount" class="pill"></span></div>
    <button id="flashcard" class="card" onclick="flipCard()" aria-label="카드 정답 보기"><span id="studyCategory" class="pill"></span><span id="studyText" class="text"></span><span id="flipHint" class="muted"></span></button>
    <div class="controls"><button id="prev" class="secondary" onclick="moveCard(-1)">← 이전</button><button onclick="shuffleStudy()">섞기</button><button id="next" class="secondary" onclick="moveCard(1)">다음 →</button></div>
  </section>
  <section id="quiz" hidden>
    <div class="row between"><h2>기억을 꺼내 봐요</h2><span id="quizCount" class="pill"></span></div>
    <div class="panel"><div class="row between"><span id="quizCategory" class="pill"></span><span id="timer" role="timer"></span></div><div class="bar"><div id="timeBar"></div></div><div id="question" class="question"></div>
      <form id="answerForm"><label for="answer">정답 입력</label><input id="answer" autocomplete="off" placeholder="떠오르는 용어를 적어 주세요" required><div style="margin-top:16px" class="row"><button id="submit" type="submit">정답 확인</button><button id="skip" type="button" class="secondary" onclick="grade(true)">모르겠어요</button></div></form>
      <div id="feedback" class="feedback" aria-live="polite"></div><button id="nextQuestion" onclick="advanceQuiz()" hidden>다음 문제 →</button>
    </div>
  </section>
  <section id="result" hidden><div class="panel"><div class="eyebrow">QUIZ COMPLETE</div><h2>오늘의 학습을 마쳤어요!</h2><div id="score" class="score"></div><p id="resultMessage"></p><div class="row"><button onclick="startQuiz()">다시 도전</button><button class="secondary" onclick="showMenu()">메뉴로</button></div></div><h2>문제 돌아보기</h2><div id="reviews"></div></section>
  <section id="login" hidden><div class="panel"><h2>관리자 로그인</h2><p>설정과 학습 카드를 관리해요.</p><form id="loginForm"><label for="password">관리자 비밀번호</label><input id="password" type="password" required autocomplete="current-password"><button id="loginButton" style="margin-top:20px">로그인</button></form></div></section>
  <section id="admin" hidden><h2>학습 공간 관리</h2><form id="adminForm"><div class="panel"><div class="grid"><div><label for="count">퀴즈 문항 수 (1~100)</label><input id="count" type="number" min="1" max="100" required></div><div><label for="seconds">문제당 시간 (3~300초)</label><input id="seconds" type="number" min="3" max="300" required></div></div><label for="newPassword">새 비밀번호 (4자 이상)</label><input id="newPassword" type="password" minlength="4" maxlength="100" autocomplete="new-password" placeholder="변경할 때만 입력하세요"><p class="muted">카드가 설정한 문항 수보다 적으면 있는 카드 수만큼 출제해요.</p></div><div class="row between"><h2>카드 편집</h2><button type="button" class="secondary" onclick="addEditor()">+ 카드 추가</button></div><div id="editors"></div><button id="saveButton">모두 저장하기</button></form></section>
  <footer>작은 배움이 쌓이는 시간 · FLASH LEARNING</footer>
</main>
<script>
  // 화면에 보여 줄 글은 textContent로 넣어 안전하게 표시합니다.
  const $ = id => document.getElementById(id);
  const screens = ['menu','study','quiz','result','login','admin'];
  let data, deck = [], position = 0, flipped = false, quizCards = [], records = [];
  let timerId, deadline, answered = false, adminPassword = '', view = '', busy = false;
  function message(text = '') { $('status').textContent = text; }
  function stopTimer() { clearInterval(timerId); }
  function screen(name) {
    stopTimer(); view = name;
    screens.forEach(id => $(id).hidden = id !== name);
    message(); window.scrollTo(0, 0);
  }
  function error(err) { message(err.message || String(err)); }
  // 서버 함수는 비동기로 실행되므로 성공/실패 처리를 함께 지정합니다.
  function load() {
    google.script.run.withSuccessHandler(value => { data = value; fillCategories(); showMenu(); })
      .withFailureHandler(err => { error(err); $('status').appendChild(Object.assign(document.createElement('button'), {textContent:'다시 불러오기', onclick:load})); }).getGameData();
  }
  function fillCategories() {
    const selected = $('category').value;
    $('category').replaceChildren(new Option('전체 카테고리', ''));
    [...new Set(data.cards.map(c => c.category))].forEach(c => $('category').add(new Option(c, c)));
    if ([...$('category').options].some(o => o.value === selected)) $('category').value = selected;
    updateSummary();
  }
  function selectedCards() { return data.cards.filter(c => !$('category').value || c.category === $('category').value); }
  function updateSummary() { $('summary').textContent = `카드 ${selectedCards().length}장 · 퀴즈 최대 ${data.count}문항 · 문제당 ${data.seconds}초`; }
  $('category').onchange = updateSummary;
  function showMenu() {
    if (busy) return;
    adminPassword = ''; $('password').value = ''; $('newPassword').value = '';
    $('editors').replaceChildren();
    if (data) screen('menu');
  }
  // 피셔–예이츠 방식으로 카드 순서를 골고루 섞습니다.
  function shuffled(cards) {
    const copy = cards.slice();
    for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
    return copy;
  }
  function startStudy() {
    deck = selectedCards(); if (!deck.length) return message('카드가 없어요. 관리자에서 카드를 추가해 주세요.');
    position = 0; screen('study'); renderCard();
  }
  function renderCard() {
    flipped = false;
    $('studyCount').textContent = `${position + 1} / ${deck.length}`;
    $('studyCategory').textContent = deck[position].category;
    $('prev').disabled = position === 0; $('next').disabled = position === deck.length - 1;
    drawCard();
  }
  function drawCard() {
    $('studyText').textContent = flipped ? deck[position].answer : deck[position].question;
    $('flipHint').textContent = flipped ? '다시 누르면 문제를 볼 수 있어요' : '카드를 눌러 정답을 확인하세요';
    $('flashcard').classList.toggle('answer', flipped);
    $('flashcard').setAttribute('aria-label', flipped ? '카드 문제 보기' : '카드 정답 보기');
  }
  function flipCard() { flipped = !flipped; drawCard(); }
  function moveCard(step) { position = Math.max(0, Math.min(deck.length - 1, position + step)); renderCard(); }
  function shuffleStudy() { deck = shuffled(deck); position = 0; renderCard(); }
  function startQuiz() {
    quizCards = shuffled(selectedCards()).slice(0, data.count);
    if (!quizCards.length) return message('카드가 없어요. 관리자에서 카드를 추가해 주세요.');
    position = 0; records = []; screen('quiz'); renderQuestion();
  }
  function renderQuestion() {
    answered = false;
    $('quizCount').textContent = `${position + 1} / ${quizCards.length}`;
    $('quizCategory').textContent = quizCards[position].category;
    $('question').textContent = quizCards[position].question;
    $('answer').value = ''; $('answer').disabled = false;
    $('submit').disabled = false; $('skip').disabled = false;
    $('feedback').textContent = ''; $('nextQuestion').hidden = true;
    $('nextQuestion').textContent = position === quizCards.length - 1 ? '결과 보기 →' : '다음 문제 →';
    deadline = Date.now() + data.seconds * 1000;
    tick(); timerId = setInterval(tick, 150); $('answer').focus();
  }
  // 남은 시간은 실제 시각으로 계산해 탭을 바꿨을 때도 지연되지 않게 합니다.
  function tick() {
    const remaining = Math.max(0, deadline - Date.now());
    $('timer').textContent = `남은 시간 ${Math.ceil(remaining / 1000)}초`;
    $('timeBar').style.width = `${remaining / (data.seconds * 1000) * 100}%`;
    if (remaining === 0) grade(false, true);
  }
  // 띄어쓰기, 영문 대소문자는 무시하고 비교합니다. 다른 표현은 오답이 될 수 있어요.
  function normalize(s) { return s.normalize('NFKC').replace(/\s+/g, '').toLowerCase(); }
  function grade(skip = false, timeout = false) {
    if (answered) return;
    timeout = timeout || Date.now() >= deadline;
    answered = true; stopTimer();
    const entered = $('answer').value.trim();
    const correct = !skip && !timeout && normalize(entered) === normalize(quizCards[position].answer);
    records.push({ card: quizCards[position], entered, correct, timeout, skip });
    $('answer').disabled = true; $('submit').disabled = true; $('skip').disabled = true;
    $('feedback').textContent = correct ? '✓ 정답이에요!' : `${timeout ? '시간이 끝났어요.' : '한 번 더 기억해 봐요.'} 정답: ${quizCards[position].answer}`;
    $('nextQuestion').hidden = false;
    if (timeout) { $('timer').textContent = '남은 시간 0초'; $('timeBar').style.width = '0%'; }
  }
  $('answerForm').onsubmit = event => { event.preventDefault(); grade(); };
  function advanceQuiz() {
    if (!answered) return;
    position++;
    if (position < quizCards.length) renderQuestion(); else showResult();
  }
  function showResult() {
    screen('result');
    const correct = records.filter(r => r.correct).length;
    $('score').textContent = `${correct} / ${records.length}`;
    $('resultMessage').textContent = `${Math.round(correct / records.length * 100)}점 · ${correct === records.length ? '모두 맞혔어요. 멋진 기억력이에요!' : '틀린 카드를 다시 살펴보면 더 오래 기억할 수 있어요.'}`;
    $('reviews').replaceChildren();
    records.forEach((r, i) => {
      const block = document.createElement('div'); block.className = 'review';
      block.textContent = `${r.correct ? '✓' : '○'} ${i + 1}. ${r.card.question}\n정답: ${r.card.answer}\n내 답: ${r.entered || '(미입력)'}${r.timeout ? ' · 시간 초과' : r.skip ? ' · 건너뜀' : ''}`;
      $('reviews').appendChild(block);
    });
  }
  function openLogin() { screen('login'); $('password').focus(); }
  $('loginForm').onsubmit = event => {
    event.preventDefault(); if (busy) return;
    const password = $('password').value; busy = true; $('loginButton').disabled = true;
    google.script.run.withSuccessHandler(value => {
      busy = false; $('loginButton').disabled = false; adminPassword = password; data = value;
      screen('admin'); $('password').value = ''; $('count').value = data.count; $('seconds').value = data.seconds;
      $('editors').replaceChildren(); data.cards.forEach(addEditor);
    }).withFailureHandler(err => { busy = false; $('loginButton').disabled = false; error(err); }).getAdminData(password);
  };
  function addEditor(card = {}) {
    if ($('editors').children.length >= 500) return message('카드는 최대 500개까지 추가할 수 있어요.');
    const block = document.createElement('div'); block.className = 'edit-card';
    [['category','카테고리'], ['question','문제'], ['answer','정답']].forEach(([key, title]) => {
      const label = document.createElement('label'); label.textContent = title;
      const input = document.createElement('input'); input.dataset.key = key; input.value = card[key] || '';
      input.required = key !== 'category'; input.maxLength = 2000;
      label.appendChild(input); block.appendChild(label);
    });
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'danger'; remove.textContent = '카드 삭제';
    remove.onclick = () => block.remove(); block.appendChild(remove); $('editors').appendChild(block);
  }
  $('adminForm').onsubmit = event => {
    event.preventDefault(); if (busy) return;
    const cards = [...$('editors').children].map(block => {
      const card = {}; block.querySelectorAll('input').forEach(input => card[input.dataset.key] = input.value); return card;
    });
    if (!cards.length) return message('카드를 한 개 이상 추가해 주세요.');
    const payload = { count: Number($('count').value), seconds: Number($('seconds').value), newPassword: $('newPassword').value, cards };
    busy = true;
    // 저장 중 입력값이 바뀌지 않게 잠시 편집을 막습니다.
    const controls = [...$('admin').querySelectorAll('input,button')]; controls.forEach(el => el.disabled = true);
    message('저장하고 있어요…');
    google.script.run.withSuccessHandler(() => {
      busy = false; controls.forEach(el => el.disabled = false);
      if (payload.newPassword) adminPassword = payload.newPassword;
      $('newPassword').value = '';
      data = {count:payload.count, seconds:payload.seconds, cards:payload.cards.map(c => ({category:c.category.trim() || '기타',question:c.question.trim(),answer:c.answer.trim()}))};
      fillCategories(); message('설정과 카드를 저장했어요.');
    }).withFailureHandler(err => { busy = false; controls.forEach(el => el.disabled = false); error(err); }).saveAdminData(adminPassword, payload);
  };
  // 이 앱은 연습용입니다. 정답이 브라우저에 전달되므로 공식 시험용으로 사용하지 마세요.
  load();
</script>
</body>
</html>
