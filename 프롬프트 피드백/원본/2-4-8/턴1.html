<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트 특별실 · 기자재 예약판</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--blue:#315fe9;--line:#e4e9f2;--ink:#202e48}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--ink);font:14px '맑은 고딕',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;color:var(--ink)}button:hover{background:#edf2ff}button.primary{background:var(--blue);color:white;border:0}.danger{color:#c34848}header{background:white;border-bottom:1px solid var(--line);padding:23px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:23px;margin:0 0 6px}p{color:#7b879b;margin:5px 0}main{display:grid;grid-template-columns:235px minmax(420px,1fr) 320px;gap:22px;padding:25px;max-width:1700px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;align-self:start}h2{font-size:18px;margin:0 0 18px}h3{font-size:15px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{flex:1}.active{background:#eaf0ff!important;color:var(--blue)!important;border-color:#aebffa!important}.resource{padding:13px 10px;border:1px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer}.resource small{display:block;color:#7b879b;margin-top:5px}.tools{display:flex;gap:5px;margin-top:15px;flex-wrap:wrap}.tools button{flex:1;padding:8px}.calhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.calhead strong{font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.weekday{text-align:center;background:#f7f9fd;padding:10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);color:#7b879b}.day{min-height:117px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere}.day:hover{background:#f5f8ff}.day.selected{background:#edf3ff;box-shadow:inset 0 0 0 2px var(--blue)}.day.empty{background:#fafbfd;cursor:default}.daynum{font-weight:bold}.event{font-size:11px;background:#e8efff;color:#3154a2;border-radius:4px;padding:4px;margin-top:5px;line-height:1.5}.remaining{font-size:10px;color:#71829e;margin-top:6px}.stats{display:flex;gap:10px;margin:16px 0}.stat{flex:1;background:#f5f8fd;padding:14px 8px;border-radius:9px;text-align:center;color:#72809b}.stat b{display:block;font-size:24px;color:var(--ink);margin-top:5px}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:bold}input,select,textarea{width:100%;padding:10px;border:1px solid #dbe2ee;border-radius:7px;background:white;color:var(--ink)}textarea{min-height:75px;resize:vertical}.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}.wide{width:100%;margin-top:18px}.hint{font-size:12px;line-height:1.6;color:#8793a5}.booking{border-top:1px solid var(--line);padding:13px 0;line-height:1.7}.booking button{font-size:11px;padding:4px 7px;margin:5px 4px 0 0}.badge{font-size:11px;color:#3b6cc7;background:#edf3ff;padding:4px 7px;border-radius:5px}.emptymsg{padding:25px 0;color:#8a96a8;text-align:center}dialog{border:0;border-radius:15px;width:430px;max-width:95vw;padding:25px;box-shadow:0 20px 80px #172d4d44}dialog::backdrop{background:#1d2b4666}#notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#243552;color:white;padding:13px 25px;border-radius:10px;display:none;z-index:10}@media(max-width:1150px){main{grid-template-columns:200px 1fr}aside.right{grid-column:1/-1}}@media(max-width:700px){header{align-items:start;flex-direction:column}main{display:block;padding:12px}.panel{margin-bottom:14px;padding:14px}.day{min-height:90px;padding:4px}.event{font-size:10px}.calendar{font-size:12px}}
</style></head><body><header><div><h1>스마트 특별실 · 기자재 예약판</h1><p>공간과 물품을 한눈에, 예약은 간편하게</p></div><div class="tools"><button onclick="exportExcel()">↓ 대여대장 Excel</button><button onclick="document.getElementById('upload').click()">↑ 대여대장 업로드</button><input id="upload" type="file" accept=".xlsx,.xls" hidden onchange="importExcel(event)"></div></header><main><aside class="panel"><div class="tabs"><button id="roomTab" onclick="switchTab('room')">특별실</button><button id="gearTab" onclick="switchTab('gear')">기자재</button></div><h3 id="listTitle"></h3><div id="resources"></div><div class="tools"><button onclick="editResource(false)">＋ 추가</button><button onclick="editResource(true)">수정</button><button class="danger" onclick="deleteResource()">삭제</button></div><p class="hint" style="margin-top:25px">예약 정보는 현재 브라우저에 자동 저장됩니다. 다른 기기와 공유되지 않으므로 대여대장을 다운로드해 보관하세요.</p></aside><section class="panel"><span class="badge" id="category"></span><h2 id="resourceTitle" style="margin-top:12px"></h2><div id="stats" class="stats"></div><div id="gearActions" class="tabs"><button class="primary" onclick="setLoanMode('new')">대여 신청하기</button><button onclick="setLoanMode('extend')">연장하기</button></div><div class="calhead"><button onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="changeMonth(1)">›</button></div><div class="calendar" id="calendar"></div><p class="hint">날짜를 선택하면 오른쪽에서 예약하거나 상세 내역을 확인할 수 있습니다. 특별실 잔여수는 각 시간대의 예약 가능 팀 수입니다.</p><h3 id="detailTitle"></h3><div id="bookings"></div></section><aside class="panel right"><h2 id="formTitle"></h2><div id="formArea"></div></aside></main><dialog id="resourceDialog"><h2 id="dialogTitle"></h2><form id="resourceForm"><label>이름</label><input id="resourceName" required maxlength="60"><label id="capacityLabel"></label><input id="resourceCapacity" type="number" min="1" max="10000" required><p class="hint">특별실은 같은 시간대에 예약할 수 있는 팀 수를 입력하세요.</p><div class="tools"><button type="button" onclick="document.getElementById('resourceDialog').close()">취소</button><button class="primary">저장</button></div></form></dialog><div id="notice" role="status"></div><script>
const KEY='smart-school-board-v1', slots=['09:00–10:00','10:00–11:00','11:00–12:00','12:00–13:00','13:00–14:00','14:00–15:00','15:00–16:00','16:00–17:00'];
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.resources)||!Array.isArray(data.bookings))data={resources:[{id:uid(),type:'room',name:'과학실',capacity:1},{id:uid(),type:'room',name:'컴퓨터실',capacity:1},{id:uid(),type:'room',name:'음악실',capacity:1},{id:uid(),type:'gear',name:'태블릿 PC',capacity:30},{id:uid(),type:'gear',name:'노트북',capacity:20},{id:uid(),type:'gear',name:'무선 마이크',capacity:5}],bookings:[]};
let type='room',selected=data.resources.find(r=>r.type===type)?.id,date=today(),month=new Date(date+'T00:00:00'),loanMode='new';
const $=id=>document.getElementById(id), current=()=>data.resources.find(r=>r.id===selected), save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('브라우저 저장 공간이 부족합니다. 대여대장을 다운로드해 주세요.')}}, toast=s=>{$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3000)};
function switchTab(t){type=t;selected=data.resources.find(r=>r.type===t)?.id;loanMode='new';render()}
function active(b,d){return b.status!=='반납'&&b.status!=='취소'&&b.start<=d&&b.end>=d}
function used(id,d,except){return data.bookings.filter(b=>b.resourceId===id&&b.id!==except&&active(b,d)).reduce((s,b)=>s+b.quantity,0)}
function available(r,start,end,quantity,except,slot){if(r.type==='room')return data.bookings.filter(b=>b.resourceId===r.id&&b.id!==except&&active(b,start)&&b.slot===slot).length+quantity<=r.capacity;let cursor=new Date(start+'T00:00:00'),last=new Date(end+'T00:00:00');while(cursor<=last){let d=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;if(used(r.id,d,except)+quantity>r.capacity)return false;cursor.setDate(cursor.getDate()+1)}return true}
function render(){let r=current();$('roomTab').classList.toggle('active',type==='room');$('gearTab').classList.toggle('active',type==='gear');$('listTitle').textContent=type==='room'?'특별실 목록':'기자재 목록';$('resources').innerHTML=data.resources.filter(x=>x.type===type).map(x=>`<div class="resource ${selected===x.id?'active':''}" data-id="${esc(x.id)}" role="button" tabindex="0">${esc(x.name)}<small>${type==='room'?'동시 예약 '+x.capacity+'팀':'보유 '+x.capacity+'개'}</small></div>`).join('')||'<p class="hint">항목을 추가해 주세요.</p>';document.querySelectorAll('.resource').forEach(el=>{el.onclick=()=>{selected=el.dataset.id;loanMode='new';render()};el.onkeydown=e=>{if(e.key==='Enter')el.click()}});$('category').textContent=type==='room'?'SPACE RESERVATION':'EQUIPMENT RENTAL';$('resourceTitle').textContent=r?.name||'등록된 항목이 없습니다';$('gearActions').style.display=type==='gear'&&r?'flex':'none';$('stats').innerHTML=r?(type==='gear'?[['보유수량',r.capacity],['대여중 · 오늘',used(r.id,today())],['잔여 · 오늘',r.capacity-used(r.id,today())]]:[['동시 예약 가능',r.capacity+'팀'],['선택일 예약',data.bookings.filter(b=>b.resourceId===r.id&&active(b,date)).length+'건']]).map(([a,b])=>`<div class="stat">${a}<b>${b}</b></div>`).join(''):'';renderCalendar();renderDetails();renderForm()}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderCalendar()}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),r=current();$('monthTitle').textContent=`${y}년 ${m+1}월`;$('calendar').innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')+'<div class="day empty"></div>'.repeat(new Date(y,m,1).getDay());for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,bs=data.bookings.filter(b=>b.resourceId===selected&&active(b,d)),el=document.createElement('div');el.className='day'+(date===d?' selected':'');el.innerHTML=`<span class="daynum">${n}</span>`+bs.map(b=>`<div class="event">${esc(b.name)}<br>${type==='room'?esc(b.slot):esc(b.quantity)+'개 · '+esc(b.end)+'까지'}${type==='room'?'<br>해당 시간 잔여 '+(r.capacity-bs.filter(x=>x.slot===b.slot).length)+'팀':''}</div>`).join('')+(r?`<div class="remaining">${type==='gear'?'잔여 '+(r.capacity-used(r.id,d))+'개':bs.length?'':'예약 가능'}</div>`:'');el.onclick=()=>{date=d;render()};$('calendar').appendChild(el)}}
function renderDetails(){$('detailTitle').textContent=date+' 예약 내역';let bs=data.bookings.filter(b=>b.resourceId===selected&&active(b,date));$('bookings').innerHTML=bs.map(b=>`<div class="booking"><b>${esc(b.name)}</b> · ${type==='room'?esc(b.slot):b.quantity+'개'}<br><span class="hint">${esc(b.start)} ~ ${esc(b.end)} · ${esc(b.purpose)}${b.requests?' · '+esc(b.requests):''}</span><br>${type==='gear'?`<button onclick="extendLoan('${b.id}')">연장</button><button onclick="finishLoan('${b.id}')">반납 처리</button>`:''}<button class="danger" onclick="cancelBooking('${b.id}')">예약 취소</button></div>`).join('')||'<div class="emptymsg">선택한 날짜에 예약이 없습니다.</div>'}
function setLoanMode(m){loanMode=m;renderForm();$('formArea').scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderForm(){let r=current();$('formTitle').textContent=type==='room'?'특별실 예약 신청':loanMode==='extend'?'기자재 대여 연장':'기자재 대여 신청';if(!r){$('formArea').innerHTML='<p class="hint">왼쪽에서 항목을 추가해 주세요.</p>';return}if(type==='gear'&&loanMode==='extend'){let bs=data.bookings.filter(b=>b.resourceId===selected&&b.status==='대여');$('formArea').innerHTML=`<form onsubmit="submitExtension(event)"><label>연장할 대여 선택</label><select name="booking" required><option value="">대여 내역 선택</option>${bs.map(b=>`<option value="${b.id}">${esc(b.name)} · ${b.quantity}개 · ${b.end} 반납</option>`).join('')}</select><label>변경할 반납 예정일</label><input name="end" type="date" required><button class="primary wide">연장 신청 제출</button><p class="hint">연장 기간의 잔여 수량을 확인한 후 반납 예정일이 변경됩니다.</p></form>`;return}$('formArea').innerHTML=`<form onsubmit="submitBooking(event)"><label>예약자명</label><input name="name" required maxlength="40" placeholder="이름을 입력하세요">${type==='gear'?`<label>희망 기기종류</label><input value="${esc(r.name)}" readonly><label>대여구분</label><select name="division"><option>수업용</option><option>행사용</option><option>업무용</option><option>기타</option></select><label>대여 수량</label><input name="quantity" type="number" min="1" max="${r.capacity}" value="1" required>`:''}<label>${type==='room'?'예약일':'대여 시작일'}</label><input name="start" type="date" value="${date}" required>${type==='room'?`<label>예약 시간대</label><select name="slot">${slots.map(s=>{let left=r.capacity-data.bookings.filter(b=>b.resourceId===r.id&&active(b,date)&&b.slot===s).length;return `<option value="${s}" ${left===0?'disabled':''}>${s} (잔여 ${left}팀)</option>`}).join('')}</select>`:`<label>반납 예정일</label><input name="end" type="date" value="${date}" required>`}<label>${type==='room'?'사용 목적':'대여목적'}</label><textarea name="purpose" required maxlength="500" placeholder="사용 목적을 입력하세요"></textarea><label>필요 구성품 및 요청사항 (선택)</label><textarea name="requests" maxlength="1000" placeholder="충전기, 케이블 등"></textarea><button class="primary wide">${type==='room'?'예약 신청 제출':'대여 신청 제출'}</button></form>`;if(type==='room')$('formArea').querySelector('[name=start]').onchange=e=>{date=e.target.value;month=new Date(date+'T00:00:00');let name=$('formArea').querySelector('[name=name]').value;render();$('formArea').querySelector('[name=name]').value=name}}
function submitBooking(e){e.preventDefault();let f=new FormData(e.target),r=current(),start=f.get('start'),end=type==='room'?start:f.get('end'),quantity=type==='room'?1:Number(f.get('quantity')),slot=f.get('slot')||'';if(!f.get('name').trim()||!f.get('purpose').trim())return alert('이름과 목적을 입력해 주세요.');if(end<start)return alert('반납 예정일은 시작일 이후여야 합니다.');if(!available(r,start,end,quantity,null,slot)||type==='room'&&!slots.includes(slot))return alert('선택한 기간 또는 시간대의 잔여 수량이 부족합니다.');data.bookings.push({id:uid(),resourceId:r.id,name:f.get('name').trim(),start,end,quantity,slot,division:f.get('division')||'특별실',purpose:f.get('purpose').trim(),requests:f.get('requests')||'',status:type==='room'?'예약':'대여'});date=start;month=new Date(start+'T00:00:00');save();render();toast('신청이 완료되었습니다.')}
function extendLoan(id){loanMode='extend';renderForm();$('formArea').querySelector('[name=booking]').value=id;$('formArea').querySelector('[name=end]').value=data.bookings.find(b=>b.id===id).end}
function submitExtension(e){e.preventDefault();let f=new FormData(e.target),b=data.bookings.find(b=>b.id===f.get('booking')),end=f.get('end'),r=current();if(!b)return;if(end<=b.end)return alert('기존 반납 예정일보다 늦은 날짜를 선택하세요.');if(!available(r,b.start,end,b.quantity,b.id))return alert('연장 기간에 다른 예약이 있어 잔여 수량이 부족합니다.');b.end=end;save();render();toast('대여 기간이 연장되었습니다.')}
function finishLoan(id){if(!confirm('반납 완료로 처리할까요?'))return;data.bookings.find(b=>b.id===id).status='반납';save();render()}
function cancelBooking(id){if(!confirm('이 예약을 취소할까요?'))return;data.bookings.find(b=>b.id===id).status='취소';save();render()}
function editResource(edit){let r=current();if(edit&&!r)return;let d=$('resourceDialog');$('dialogTitle').textContent=(type==='room'?'특별실':'기자재')+(edit?' 수정':' 추가');$('capacityLabel').textContent=type==='room'?'동시 예약 가능 팀 수':'보유수량';$('resourceName').value=edit?r.name:'';$('resourceCapacity').value=edit?r.capacity:1;$('resourceForm').onsubmit=e=>{e.preventDefault();let name=$('resourceName').value.trim(),capacity=Number($('resourceCapacity').value);if(!name||!Number.isInteger(capacity)||capacity<1)return;if(edit){let proposed={...r,capacity};for(let b of data.bookings.filter(b=>b.resourceId===r.id&&!['반납','취소'].includes(b.status))){if(!available(proposed,b.start,b.end,b.quantity,b.id,b.slot))return alert('기존 예약 수량보다 작게 변경할 수 없습니다.')}r.name=name;r.capacity=capacity}else{let item={id:uid(),type,name,capacity};data.resources.push(item);selected=item.id}save();d.close();render()};d.showModal()}
function deleteResource(){let r=current();if(!r)return;if(data.bookings.some(b=>b.resourceId===r.id&&!['반납','취소'].includes(b.status)))return alert('진행 중인 예약을 취소하거나 반납한 후 삭제하세요.');if(!confirm(r.name+' 항목을 삭제할까요? 과거 대장은 보존됩니다.'))return;for(let b of data.bookings.filter(b=>b.resourceId===r.id))b.resourceName=r.name;data.resources=data.resources.filter(x=>x.id!==r.id);selected=data.resources.find(x=>x.type===type)?.id;save();render()}
function exportExcel(){if(!window.XLSX)return alert('Excel 기능을 불러오려면 인터넷 연결이 필요합니다. 페이지를 다시 열어 주세요.');let rows=data.bookings.map(b=>{let r=data.resources.find(x=>x.id===b.resourceId);return {'예약ID':b.id,'유형':r?.type==='room'||b.division==='특별실'?'특별실':'기자재','항목명':r?.name||b.resourceName||'삭제된 항목','보유수량':r?.capacity||b.quantity,'예약자명':b.name,'대여구분':b.division,'시작일':b.start,'반납예정일':b.end,'시간대':b.slot,'수량':b.quantity,'목적':b.purpose,'요청사항':b.requests,'상태':b.status}}),headers=['예약ID','유형','항목명','보유수량','예약자명','대여구분','시작일','반납예정일','시간대','수량','목적','요청사항','상태'];let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows,{header:headers});ws['!cols']=headers.map(x=>({wch:['목적','요청사항','항목명'].includes(x)?28:18}));XLSX.utils.book_append_sheet(wb,ws,'대여대장');XLSX.writeFile(wb,'특별실_기자재_대여대장_'+today()+'.xlsx')}
async function importExcel(e){let file=e.target.files[0];if(!file)return;try{if(!window.XLSX)throw Error('인터넷 연결 후 페이지를 다시 열어 주세요.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),copy=JSON.parse(JSON.stringify(data)),count=0;const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00'))&&new Date(s+'T00:00:00').getDate()===Number(s.slice(-2));for(let [i,x] of rows.entries()){let id=String(x['예약ID']||uid());if(copy.bookings.some(b=>b.id===id))continue;let t=x['유형']==='특별실'?'room':x['유형']==='기자재'?'gear':'',name=String(x['항목명']).trim(),start=String(x['시작일']),end=String(x['반납예정일']),quantity=Number(x['수량']),capacity=Number(x['보유수량']),status=String(x['상태']);if(!t||!name||!String(x['예약자명']).trim()||!validDate(start)||!validDate(end)||end<start||!Number.isInteger(quantity)||quantity<1||!Number.isInteger(capacity)||capacity<1||!['예약','대여','반납','취소'].includes(status)||t==='room'&&(!slots.includes(x['시간대'])||quantity!==1||start!==end))throw Error((i+2)+'행의 값이 올바르지 않습니다. 다운로드한 대장 형식을 사용하세요.');let r=copy.resources.find(r=>r.type===t&&r.name===name);if(!r){r={id:uid(),type:t,name,capacity};copy.resources.push(r)}copy.bookings.push({id,resourceId:r.id,name:String(x['예약자명']),division:String(x['대여구분']),start,end,quantity,slot:String(x['시간대']),purpose:String(x['목적']),requests:String(x['요청사항']),status});count++}let previous=data;data=copy;try{for(let b of data.bookings.filter(b=>!['취소','반납'].includes(b.status))){let r=data.resources.find(r=>r.id===b.resourceId);if(r&&!available(r,b.start,b.end,b.quantity,b.id,b.slot))throw Error('업로드 내역이 기존 예약과 겹치거나 보유수량을 초과합니다.')}}catch(err){data=previous;throw err}save();selected=data.resources.find(r=>r.type===type)?.id;render();toast(count+'건을 추가했습니다. 동일 예약ID는 건너뜁니다.')}catch(err){alert('업로드 실패: '+err.message)}finally{e.target.value=''}}
render();
</script></body></html>
