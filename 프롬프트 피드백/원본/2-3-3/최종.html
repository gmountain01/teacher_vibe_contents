:root{--ink:#193a3d;--teal:#14776b;--muted:#71817f;--line:#dfe7e2;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 '맑은 고딕',system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button,.btn{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 17px;background:white;color:var(--ink);text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:var(--teal);background:#edf5ef}.primary{background:var(--teal);border-color:var(--teal);color:white}.primary:hover{background:#0b5e54;color:white}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #e4aa4b;outline-offset:3px}.preview{background:#233f3b;color:#eef6ee;text-align:center;padding:9px 16px;font-size:12px}.preview b{color:#e7d49a}header{background:#fff;border-bottom:1px solid var(--line)}.header{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:23px 28px;gap:20px}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--teal);color:white;font-size:24px;width:43px;height:43px;text-align:center;border-radius:13px}.brand strong{display:block;font-size:21px;letter-spacing:-1px}.brand small{font-size:11px;color:var(--muted)}nav,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.switch{background:#f1f4ef;padding:4px;border-radius:10px;display:flex;gap:3px}.switch button{border:0;background:transparent;font-size:13px;padding:7px 13px}.switch .selected{background:white;box-shadow:0 2px 5px #183b3510;color:var(--teal);font-weight:bold}main{max-width:1180px;margin:auto;padding:38px 28px 60px;min-height:75vh}h1,h2,h3,p{margin-top:0}h1{font-size:34px;letter-spacing:-1.5px;line-height:1.35;margin-bottom:12px}h2{font-size:24px;letter-spacing:-.8px}h3{font-size:19px;line-height:1.5}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:bold;margin-bottom:12px}.hero{display:flex;justify-content:space-between;align-items:center;gap:25px;margin-bottom:28px}.hero p{color:var(--muted);margin-bottom:0}.hero-art{width:150px;height:125px;position:relative;flex-shrink:0}.leaf{position:absolute;background:#c8d7b9;width:80px;height:48px;border-radius:60px 0 60px 0;transform:rotate(-25deg);top:25px;left:5px}.leaf.two{background:#79a88f;transform:rotate(65deg);left:65px;top:38px}.stem{position:absolute;width:3px;height:80px;background:#316e5c;left:75px;top:42px;transform:rotate(-10deg)}.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:white;padding:19px 0;margin-bottom:30px}.stat{padding:0 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{color:var(--muted);display:block}.stat strong{font-size:25px}.stat span{font-size:13px;font-weight:normal;margin-left:5px}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:25px 0 19px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:0;background:transparent;padding:7px 13px;font-size:13px}.filters .active{background:var(--ink);color:white;border-radius:22px}.search{width:235px!important;margin:0!important;background:white!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:25px;text-align:left;display:block;width:100%;box-shadow:0 3px 10px #223d2d03;transition:transform .15s}.card:hover{transform:translateY(-3px);background:white}.card-top{display:flex;justify-content:space-between;align-items:center}.category{font-size:11px;color:var(--muted);letter-spacing:.5px}.badge{font-size:12px;font-weight:bold;padding:4px 10px;border-radius:6px;display:inline-block}.open{background:#e2f2e9;color:#26734e}.soon{background:#eaf0fb;color:#5273a2}.full{background:#f7ede1;color:#a76a24}.closed{background:#edf0ee;color:#7a8380}.card h3{margin:17px 0 8px;font-size:22px;letter-spacing:-.7px}.card-desc{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-info{font-size:13px;display:grid;gap:6px;margin:20px 0}.card-info b{display:inline-block;font-weight:normal;color:var(--muted);width:48px}.countline{display:flex;justify-content:space-between;font-size:12px;margin-top:20px}.countline strong{font-size:16px}.bar{height:5px;background:#edf1eb;border-radius:5px;margin:9px 0 15px;overflow:hidden}.bar i{display:block;height:100%;background:#338b75}.card-bottom{border-top:1px solid var(--line);padding-top:13px;font-size:12px;color:var(--teal);display:flex;justify-content:space-between}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:30px;margin-bottom:22px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.back{border:0;background:transparent;padding-left:0;margin-bottom:20px;color:var(--muted)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#f3f6f0;padding:22px;border-radius:10px;margin:24px 0}.meta dt{color:var(--muted);font-size:12px}.meta dd{margin:3px 0 0;font-size:14px}.description{white-space:pre-wrap;line-height:1.9;margin:30px 0}.notice{background:#f4f5eb;border:1px solid #e6e7d5;border-radius:8px;padding:14px 18px;font-size:13px;color:#6e745a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:bold}input,select,textarea{display:block;width:100%;padding:10px 12px;border:1px solid #cad7ce;border-radius:7px;margin-top:7px;background:#fff;color:var(--ink)}input:focus,textarea:focus,select:focus{outline:2px solid #9bc1ae;outline-offset:1px}textarea{min-height:130px;resize:vertical}input[type=checkbox]{width:auto;margin:4px 0}.check{display:flex;gap:9px;align-items:flex-start;font-weight:normal}.help{font-size:12px;color:var(--muted);margin-top:7px}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.file{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}iframe{width:100%;height:470px;border:1px solid var(--line);margin-top:15px;border-radius:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:left;padding:14px 11px;border-bottom:1px solid var(--line)}th{background:#f3f6f1;font-size:12px;color:var(--muted)}.empty{text-align:center;padding:50px;color:var(--muted)}.success{max-width:760px;margin:auto}.success-head{text-align:center;margin:12px 0 30px}.tick{background:#e3f1e6;color:var(--teal);width:65px;height:65px;line-height:65px;border-radius:50%;font-size:30px;margin:0 auto 18px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 23px;border-radius:9px;z-index:5;max-width:90vw}footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:11px}.error{color:#ac4037;font-size:13px;margin:12px 0}#error:empty{display:none}[hidden]{display:none!important}@media(max-width:760px){.header{padding:18px;align-items:flex-start;flex-direction:column}main{padding:28px 18px}.hero-art{display:none}h1{font-size:28px}.stats{grid-template-columns:repeat(2,1fr);gap:18px}.stat:nth-child(2){border:0}.grid,.form-grid,.meta{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar,.topline{align-items:flex-start;flex-direction:column}.search{width:100%!important}.panel{padding:21px}.card{padding:22px}.hero{align-items:flex-start}.actions button{font-size:12px}iframe{height:350px}}@media print{body{background:white}.preview,header,footer,.back,.actions,.form-actions,.program-detail,.toast{display:none!important}main{padding:0;max-width:none}.panel{border:0;padding:0}.table-wrap{overflow:visible}table{white-space:normal;font-size:11px}tr{break-inside:avoid}@page{size:A4 landscape;margin:15mm}}
</style></head><body><div class="preview"><b>로컬 미리보기</b> · 외부 연결 없음 · 모든 정보는 예시이며 새로고침하면 초기화됩니다.</div><header><div class="header"><div class="brand"><div class="logo">잎</div><div><strong>배움이음</strong><small>우리 학교 학부모 프로그램</small></div></div><nav><div class="switch"><button id="parentMode" class="selected" onclick="setRole(false)">학부모 화면</button><button id="adminMode" onclick="setRole(true)">관리자 화면</button></div><button onclick="home()">프로그램 목록</button><button id="create" class="primary" hidden onclick="edit()">＋ 프로그램 등록</button></nav></div></header><main id="root"></main><footer>배움으로 연결되는 우리 학교 · 모든 일시는 한국 표준시(KST) 기준 · 계정 연결·배포·이메일 발송 없는 미리보기</footer><div id="toast" class="toast" role="status" hidden></div><script>
'use strict';
const $=s=>document.querySelector(s),root=$('#root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let admin=false,filter='all',query='',current=null,toastTimer;
const now=new Date(),dateOffset=(days,h=10)=>{let d=new Date(now);d.setDate(d.getDate()+days);d.setHours(h,0,0,0);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const programs=[
{id:1,title:'자녀와 마음을 잇는 대화의 기술',category:'소통 · 부모교육',description:'아이의 마음을 듣는 일, 작은 대화에서 시작됩니다.\n\n청소년기 자녀를 이해하고 서로의 감정을 존중하는 대화 방법을 함께 배웁니다. 일상 속 사례와 짝 활동을 통해 우리 가족에게 맞는 소통 방법을 찾아보세요.\n\n1부 · 자녀의 감정 이해하기\n2부 · 공감하고 경청하는 대화 연습\n3부 · 우리 집 대화 약속 만들기\n\n준비물: 필기도구, 열린 마음',type:'single',start:dateOffset(10,14),end:dateOffset(10,16),rs:dateOffset(-5,9),re:dateOffset(7,18),capacity:20,base:12,place:'본관 2층 시청각실',files:[]},
{id:2,title:'AI 시대, 우리 아이의 배움을 돕는 법',category:'디지털 · 미래교육',description:'변화하는 디지털 환경 속에서 자녀의 배움을 함께 살펴봅니다.\n\n생성형 AI의 기초와 올바른 활용 사례를 알아보고, 가정에서 실천할 수 있는 디지털 학습 습관을 이야기합니다.\n\n마지막 1자리 예시입니다. 직접 신청하면 정원 마감으로 바뀝니다.',type:'single',start:dateOffset(12,15),end:dateOffset(12,17),rs:dateOffset(-4,9),re:dateOffset(9,18),capacity:15,base:14,place:'미래교육실 · 본관 3층',files:[]},
{id:3,title:'함께 읽고 함께 자라는 부모 독서모임',category:'독서 · 문화',description:'책을 매개로 자녀와 더 깊이 소통하는 3주 과정입니다.\n매주 수요일, 함께 읽은 내용을 나누고 가정에서 실천할 독서 활동을 만들어 갑니다.',type:'period',start:dateOffset(20,10),end:dateOffset(34,12),rs:dateOffset(5,9),re:dateOffset(17,18),capacity:12,base:0,place:'학교 도서관 이야기방',files:[]},
{id:4,title:'초록으로 쉬어 가는 학부모 원예교실',category:'체험 · 마음돌봄',description:'작은 식물을 가꾸며 일상에 쉼표를 더합니다.\n전문 강사와 함께 나만의 화분을 만들고 관리 방법을 익힙니다.',type:'single',start:dateOffset(8,10),end:dateOffset(8,12),rs:dateOffset(-10,9),re:dateOffset(5,18),capacity:10,base:10,place:'과학실 · 별관 1층',files:[]},
{id:5,title:'우리 아이 진로, 함께 찾아가는 첫걸음',category:'진로 · 진학',description:'자녀의 관심과 강점을 발견하는 진로 대화 시간입니다.\n다양한 진로 탐색 도구를 살펴보고 가정에서의 지원 방법을 알아봅니다.',type:'single',start:dateOffset(-2,14),end:dateOffset(-2,16),rs:dateOffset(-20,9),re:dateOffset(-5,18),capacity:25,base:18,place:'본관 2층 시청각실',files:[]}
];
const applications=[];const names=['김하늘','이서연','박지우','최민서','정다은','윤서준'];
programs.forEach(p=>{for(let i=0;i<p.base;i++)applications.push({id:'DEMO-'+p.id+'-'+String(i+1).padStart(3,'0'),pid:p.id,parent:names[i%6],grade:String(i%3+1),cls:String(i%5+1),student:['김예원','이도윤','박서아','최하준','정지호','윤하린'][i%6],phone:'010-0000-'+String(i+1).padStart(4,'0'),created:dateOffset(-3,9+i%8)});delete p.base});
const count=p=>applications.filter(a=>a.pid===p.id).length;
function status(p){const n=Date.now();if(n<new Date(p.rs))return ['soon','모집 예정'];if(n>=new Date(p.re))return ['closed','기간 마감'];if(count(p)>=p.capacity)return ['full','정원 마감'];return ['open','모집 중']}
const fmt=v=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v));
function period(p){return fmt(p.start)+(p.end?' ~ '+(p.type==='single'?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(p.end)):fmt(p.end)):'')}
const recruitment=p=>fmt(p.rs)+' ~ '+fmt(p.re),badge=p=>`<span class="badge ${status(p)[0]}">${status(p)[1]}</span>`;
function notify(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function setRole(v){admin=v;$('#parentMode').classList.toggle('selected',!v);$('#adminMode').classList.toggle('selected',v);$('#create').hidden=!v;home();notify(v?'관리자 화면으로 전환했습니다. 인증을 대신하는 미리보기 버튼입니다.':'학부모 화면으로 전환했습니다.')}
function home(){current=null;root.innerHTML=`<section class="hero"><div><div class="eyebrow">PARENT LEARNING TOGETHER</div><h1>${admin?'배움을 준비하는 공간, 프로그램 관리':'함께 배우고, 함께 자라는 시간'}</h1><p>${admin?'프로그램을 등록하고 신청 현황을 한눈에 확인하세요.':'우리 아이와 더 가까워지는 배움. 관심 있는 프로그램에 참여해 보세요.'}</p></div><div class="hero-art" aria-hidden="true"><div class="stem"></div><div class="leaf"></div><div class="leaf two"></div></div></section><div class="stats"><div class="stat"><small>전체 프로그램</small><strong>${programs.length}<span>개</span></strong></div><div class="stat"><small>지금 모집 중</small><strong>${programs.filter(p=>status(p)[0]==='open').length}<span>개</span></strong></div><div class="stat"><small>모집 예정</small><strong>${programs.filter(p=>status(p)[0]==='soon').length}<span>개</span></strong></div><div class="stat"><small>${admin?'전체 신청 인원':'함께하는 학부모'}</small><strong>${applications.length}<span>명</span></strong></div></div><div class="toolbar"><div class="filters">${[['all','전체'],['open','모집 중'],['soon','모집 예정'],['ended','마감']].map(([k,v])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';home()">${v}</button>`).join('')}</div><input class="search" aria-label="프로그램 검색" type="search" placeholder="프로그램명 또는 장소 검색" value="${esc(query)}" oninput="query=this.value;renderCards()"></div><div class="grid" id="cards"></div><p class="help" style="margin-top:20px">ⓘ 선착순으로 접수되며, 정원이 차면 자동 마감됩니다. ‘AI 시대’ 프로그램에서 마지막 한 자리 신청을 체험해 보세요.</p>`;renderCards()}
function renderCards(){const rows=programs.filter(p=>(filter==='all'||(filter==='ended'?['full','closed'].includes(status(p)[0]):status(p)[0]===filter))&&[p.title,p.place].join(' ').includes(query.trim()));$('#cards').innerHTML=rows.map(p=>`<button class="card" onclick="detail(${p.id})"><div class="card-top">${badge(p)}<span class="category">${esc(p.category)}</span></div><h3>${esc(p.title)}</h3><p class="card-desc">${esc(p.description.split('\n')[0])}</p><div class="card-info"><div><b>운영</b>${esc(period(p))}</div><div><b>모집</b>${esc(recruitment(p))}</div><div><b>장소</b>${esc(p.place)}</div></div><div class="countline"><span>신청 <strong>${count(p)}</strong> / ${p.capacity}명</span><span class="muted">${status(p)[0]==='open'?'잔여 '+(p.capacity-count(p))+'석':status(p)[1]}</span></div><div class="bar"><i style="width:${count(p)/p.capacity*100}%"></i></div><div class="card-bottom"><span>${admin?'프로그램 및 신청 현황 관리':'프로그램 자세히 보기'}</span><span>↗</span></div></button>`).join('')||'<div class="panel empty wide">조건에 맞는 프로그램이 없습니다.</div>'}
function meta(p){return `<dl class="meta"><div><dt>운영 ${p.type==='period'?'기간':'일시'}</dt><dd>${esc(period(p))}</dd></div><div><dt>모집 기간</dt><dd>${esc(recruitment(p))}</dd></div><div><dt>프로그램 장소</dt><dd>${esc(p.place)}</dd></div><div><dt>신청 현황</dt><dd><b>${count(p)} / ${p.capacity}명</b> · 잔여 ${Math.max(0,p.capacity-count(p))}석</dd></div></dl>`}
function filesHTML(p){const pdf=p.files.find(f=>f.kind==='pdf');return `<h3>관련 문서 및 첨부파일</h3>${pdf?`<div class="file"><span>PDF · ${esc(pdf.name)}</span><a class="btn" href="${pdf.url}" target="_blank" rel="noopener">새 창으로 열기</a></div><iframe title="관련 PDF 로컬 미리보기" src="${pdf.url}"></iframe>`:'<p class="help">등록된 관련 PDF가 없습니다. 관리자 화면에서 로컬 PDF를 선택해 미리 볼 수 있습니다.</p>'}${p.files.filter(f=>f.kind==='extra').map(f=>`<div class="file"><span>▤ ${esc(f.name)} <span class="muted">· ${Math.ceil(f.size/1024)}KB</span></span><a class="btn" download="${esc(f.name)}" href="${f.url}">내려받기</a></div>`).join('')}`}
function detail(id){const p=programs.find(p=>p.id===id);current=p;root.innerHTML=`<button class="back" onclick="home()">← 프로그램 목록으로</button><section class="panel program-detail"><div class="topline"><div>${badge(p)}<h1 style="margin-top:14px;font-size:29px">${esc(p.title)}</h1><p class="muted">${esc(p.category)}</p></div><div class="actions">${admin?`<button class="primary" onclick="edit(${p.id})">프로그램 수정</button>`:`<button class="primary" onclick="applyForm(${p.id})" ${status(p)[0]!=='open'?'disabled':''}>${status(p)[0]==='open'?'프로그램 참가 신청 →':status(p)[1]}</button>`}</div></div>${meta(p)}<div class="description">${esc(p.description)}</div>${filesHTML(p)}</section>${admin?roster(p):'<div class="notice">신청은 선착순으로 진행됩니다. 운영 일시와 장소를 확인한 후 신청해 주세요.</div>'}`;window.scrollTo(0,0)}
function roster(p){const rows=applications.filter(a=>a.pid===p.id).sort((a,b)=>a.created.localeCompare(b.created));return `<section class="panel"><div class="topline"><div><div class="eyebrow">APPLICANTS</div><h2>신청 학부모 현황 <span class="muted">${rows.length} / ${p.capacity}명</span></h2><p class="help">${esc(p.title)} · ${esc(period(p))}<br>모든 이름과 연락처는 미리보기용 예시 데이터입니다.</p></div><div class="actions"><button onclick="window.print()">인쇄</button><button class="primary" onclick="exportXlsx(${p.id})">엑셀 다운로드</button></div></div><div class="table-wrap"><table><thead><tr>${['순번','신청 일시','학부모','학년','반','학생 이름','전화번호'].map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${rows.map((a,i)=>`<tr>${[i+1,fmt(a.created),a.parent,a.grade,a.cls,a.student,a.phone].map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>${!rows.length?'<div class="empty">아직 신청자가 없습니다.</div>':''}</div></section>`}
function field(n,t,type='text',v='',extra=''){return `<label>${t}<input name="${n}" type="${type}" value="${esc(v)}" required ${extra}></label>`}
function applyForm(id){const p=programs.find(p=>p.id===id);if(status(p)[0]!=='open'){detail(id);notify('현재 신청 가능한 프로그램이 아닙니다.');return}root.innerHTML=`<button class="back" onclick="detail(${id})">← 프로그램 상세로</button><section class="panel success"><div class="eyebrow">PROGRAM APPLICATION</div><h2>프로그램 참가 신청</h2><h3>${esc(p.title)}</h3>${meta(p)}<form id="application"><div class="form-grid">${field('parent','학부모 이름','text','','maxlength="40" placeholder="예시 이름을 입력하세요"')}${field('student','자녀 이름','text','','maxlength="40"') }<label>자녀 학년<select name="grade" required><option value="">선택해 주세요</option>${[1,2,3,4,5,6].map(v=>`<option>${v}</option>`).join('')}</select></label>${field('cls','자녀 반','number','','min="1" max="30"')}${field('phone','학부모 전화번호','tel','','placeholder="010-0000-0000" pattern="0[0-9 -]{8,19}"')}${field('password','신청서 비밀번호','password','','minlength="8" maxlength="64" autocomplete="new-password"')}<div class="wide help">비밀번호는 8~64자입니다. 이 미리보기에서는 비밀번호를 보관하지 않으며, 신청 조회·수정·취소 기능은 제공하지 않습니다.</div><div class="wide notice"><b>미리보기 개인정보 안내</b><br>실제 개인정보 대신 가상의 이름과 연락처를 입력해 주세요. 입력한 신청 정보는 이 탭의 메모리에만 유지되며, 새로고침 시 사라집니다. 실제 서비스의 수집 목적·보유기간은 학교의 확정 안내가 필요합니다.</div><label class="wide check"><input type="checkbox" required>미리보기 안내를 확인했으며, 예시 정보로 신청합니다.</label></div><div id="error" class="error" role="alert"></div><div class="form-actions"><button type="button" onclick="detail(${id})">취소</button><button class="primary" type="submit">참가 신청 등록</button></div></form></section>`;$('#application').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;if(status(p)[0]!=='open'){$('#error').textContent='정원 또는 모집 기간이 마감되어 신청할 수 없습니다.';return}const data=Object.fromEntries(new FormData(form));if(!data.parent.trim()||!data.student.trim()||!/^0\d{8,10}$/.test(data.phone.replace(/[ -]/g,''))){$('#error').textContent='이름과 전화번호 형식을 확인해 주세요.';return}form.querySelector('[type=submit]').disabled=true;const a={id:'PREVIEW-'+String(Date.now()).slice(-8),pid:id,parent:data.parent.trim(),student:data.student.trim(),grade:data.grade,cls:data.cls,phone:data.phone,created:new Date().toISOString()};applications.push(a);form.reset();receipt(p,a)};window.scrollTo(0,0)}
function receipt(p,a){root.innerHTML=`<section class="panel success"><div class="success-head"><div class="tick">✓</div><div class="eyebrow">APPLICATION COMPLETE</div><h1 style="font-size:28px">참가 신청이 완료되었습니다</h1><p class="muted">함께 배우는 시간에 만나 뵙겠습니다.</p><span class="badge open">신청 번호 ${esc(a.id)}</span></div><h3>${esc(p.title)}</h3><dl class="meta"><div><dt>운영 일시 / 기간</dt><dd>${esc(period(p))}</dd></div><div><dt>장소</dt><dd>${esc(p.place)}</dd></div><div><dt>학부모 이름</dt><dd>${esc(a.parent)}</dd></div><div><dt>자녀 정보</dt><dd>${esc(a.grade)}학년 ${esc(a.cls)}반 ${esc(a.student)}</dd></div><div><dt>신청 일시</dt><dd>${esc(fmt(a.created))}</dd></div><div><dt>현재 모집 상태</dt><dd>${badge(p)} · ${count(p)} / ${p.capacity}명</dd></div></dl><p class="notice">브라우저 메모리에만 접수되었습니다. 외부 서비스 저장이나 이메일 발송은 없습니다.</p><div class="form-actions"><button class="primary" onclick="filter='all';query='';home()">첫 화면으로 →</button></div></section>`;window.scrollTo(0,0)}
function edit(id){if(!admin)return;const old=programs.find(p=>p.id===id),p=old||{title:'',description:'',type:'single',start:dateOffset(10,14),end:dateOffset(10,16),rs:dateOffset(-1,9),re:dateOffset(7,18),capacity:20,place:'',files:[]};let draft=p.files.slice();root.innerHTML=`<button class="back" onclick="${id?'detail('+id+')':'home()'}">← 돌아가기</button><section class="panel"><div class="eyebrow">PROGRAM EDITOR</div><h2>${id?'프로그램 수정':'새 프로그램 등록'}</h2><p class="muted">배움의 내용과 모집 일정을 입력해 주세요.</p><form id="editor"><div class="form-grid"><div class="wide">${field('title','프로그램명','text',p.title,'maxlength="150"')}</div><label class="wide">내용 설명<textarea name="description" required maxlength="20000">${esc(p.description)}</textarea></label><label>운영 방식<select name="type"><option value="single">특정 날짜와 시간</option><option value="period">기간</option></select></label>${field('place','프로그램 장소','text',p.place,'maxlength="200"')}${field('start','운영 시작 일시','datetime-local',p.start)}${field('end','운영 종료 일시','datetime-local',p.end)}${field('rs','모집 시작 일시','datetime-local',p.rs)}${field('re','모집 종료 일시','datetime-local',p.re)}${field('capacity','모집 정원','number',p.capacity,'min="'+(old?Math.max(1,count(old)):1)+'" max="10000"')}<div class="help">현재 신청 인원보다 적은 정원으로 변경할 수 없습니다.</div><div class="wide"><h3>관련 문서 및 첨부파일 <span class="help">선택사항</span></h3><div class="notice">파일은 서버에 업로드하지 않습니다. 선택한 로컬 파일만 이 탭에서 미리보기·다운로드할 수 있습니다. 각 5MB 이하, 추가 첨부 최대 10개.</div><label style="margin-top:18px">관련 PDF 1개 · 선택하면 기존 PDF 교체<input id="pdf" type="file" accept=".pdf,application/pdf"></label><label style="margin-top:18px">추가 첨부파일 · 문서 및 압축파일<input id="extras" type="file" multiple accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.7z"></label><div id="draftFiles"></div></div></div><div id="error" class="error" role="alert"></div><div class="form-actions"><button type="button" onclick="${id?'detail('+id+')':'home()'}">취소</button><button class="primary" type="submit">${id?'변경사항 저장':'프로그램 등록'}</button></div></form></section>`;const form=$('#editor');form.elements.type.value=p.type;function draw(){const pdf=draft.find(f=>f.kind==='pdf');$('#draftFiles').innerHTML=draft.map((f,i)=>`<div class="file"><span>${f.kind==='pdf'?'관련 PDF':'추가파일'} · ${esc(f.name)}</span><button type="button" data-remove="${i}">제거</button></div>`).join('')+(pdf?`<iframe title="선택한 PDF 미리보기" src="${pdf.url}"></iframe>`:'');$('#draftFiles').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.remove),1);draw()})}function choose(input,kind){const files=Array.from(input.files);if(files.some(f=>f.size===0||f.size>5*1024*1024)){notify('빈 파일은 제외하고 5MB 이하 파일을 선택해 주세요.');input.value='';return}if(kind==='pdf'&&files.some(f=>!f.name.toLowerCase().endsWith('.pdf'))){notify('PDF 파일만 선택해 주세요.');input.value='';return}if(kind==='extra'&&files.some(f=>! /\.(pdf|hwp|hwpx|doc|docx|xls|xlsx|ppt|pptx|txt|csv|zip|7z)$/i.test(f.name))){notify('지원하는 문서·압축파일을 선택해 주세요.');input.value='';return}if(kind==='extra'&&draft.filter(f=>f.kind==='extra').length+files.length>10){notify('추가파일은 최대 10개입니다.');input.value='';return}if(kind==='pdf'&&files.length)draft=draft.filter(f=>f.kind!=='pdf');files.forEach(f=>draft.push({name:f.name,size:f.size,kind,url:URL.createObjectURL(f)}));input.value='';draw()}$('#pdf').onchange=e=>choose(e.target,'pdf');$('#extras').onchange=e=>choose(e.target,'extra');draw();form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));if(!d.title.trim()||!d.description.trim()||!d.place.trim()){$('#error').textContent='프로그램명, 설명, 장소를 입력해 주세요.';return}if(d.end<=d.start||d.re<=d.rs||d.re>d.start){$('#error').textContent='운영 종료는 시작 이후, 모집 종료는 모집 시작 이후이면서 운영 시작 이전이어야 합니다.';return}if(d.type==='single'&&d.start.slice(0,10)!==d.end.slice(0,10)){$('#error').textContent='특정 일시의 시작과 종료는 같은 날짜로 입력하세요. 여러 날이면 기간을 선택하세요.';return}const capacity=Number(d.capacity);if(!Number.isInteger(capacity)||capacity<1||capacity<(old?count(old):0)){$('#error').textContent='모집 정원을 확인해 주세요.';return}const saved={...d,id:old?old.id:Date.now(),capacity,category:old?old.category:'학교 · 학부모 프로그램',files:draft};if(old)Object.assign(old,saved);else programs.unshift(saved);detail(saved.id);notify('프로그램을 브라우저 메모리에 저장했습니다.')};window.scrollTo(0,0)}
// 외부 라이브러리 없이 텍스트 셀로 구성한 XLSX를 생성합니다 (ZIP store).
function exportXlsx(id){if(!admin)return;const p=programs.find(p=>p.id===id);const rows=[['프로그램',p.title],['운영 일시',period(p)],['순번','신청 일시','학부모','학년','반','학생 이름','전화번호'],...applications.filter(a=>a.pid===id).sort((a,b)=>a.created.localeCompare(b.created)).map((a,i)=>[i+1,fmt(a.created),a.parent,a.grade,a.cls,a.student,a.phone])];const xml=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const sheet='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="7" width="24" customWidth="1"/></cols><sheetData>'+rows.map((row,i)=>`<row r="${i+1}">${row.map((v,j)=>`<c r="${String.fromCharCode(65+j)}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('')+'</sheetData></worksheet>';const files={'[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>','_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="신청자 명단" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>','xl/worksheets/sheet1.xml':sheet};const enc=new TextEncoder(),parts=[],central=[];let offset=0;const put=(v,o,n,len)=>{for(let i=0;i<len;i++)v[o+i]=(n>>>(8*i))&255};for(const [name,content] of Object.entries(files)){const n=enc.encode(name),d=enc.encode(content);let crc=0xffffffff;for(const b of d){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=(crc^0xffffffff)>>>0;const h=new Uint8Array(30+n.length);put(h,0,0x04034b50,4);put(h,4,20,2);put(h,14,crc,4);put(h,18,d.length,4);put(h,22,d.length,4);put(h,26,n.length,2);h.set(n,30);parts.push(h,d);const c=new Uint8Array(46+n.length);put(c,0,0x02014b50,4);put(c,4,20,2);put(c,6,20,2);put(c,16,crc,4);put(c,20,d.length,4);put(c,24,d.length,4);put(c,28,n.length,2);put(c,42,offset,4);c.set(n,46);central.push(c);offset+=h.length+d.length}const size=central.reduce((a,c)=>a+c.length,0),end=new Uint8Array(22);put(end,0,0x06054b50,4);put(end,8,central.length,2);put(end,10,central.length,2);put(end,12,size,4);put(end,16,offset,4);const url=URL.createObjectURL(new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=url;a.download=p.title.replace(/[\\/:*?"<>|]/g,'_')+'_신청자.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('예시 신청자 명단을 엑셀 파일로 내려받았습니다.')}
home();
</script></body></html>
