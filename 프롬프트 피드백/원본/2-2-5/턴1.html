<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 아침 안내판</title>
<style>
:root{font-family:"맑은 고딕","Malgun Gothic",sans-serif;color:#173d36;background:#f3f5ec}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #bdcdc1;border-radius:12px;padding:12px 19px;background:#fff;color:#24483e;font-weight:700}button:hover{background:#e7eee2}button:focus-visible,input:focus-visible{outline:4px solid #e7aa35;outline-offset:3px}.primary{background:#205c4d;color:white}.primary:hover{background:#164738}main{max-width:1500px;margin:auto;padding:35px 5vw}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:20px;font-weight:700;letter-spacing:3px;color:#557465}h1{font-size:clamp(32px,4vw,60px);margin:12px 0 24px;letter-spacing:-2px}#date{font-size:clamp(23px,3vw,42px);font-weight:700}nav{display:flex;gap:10px;flex-wrap:wrap}.board{margin-top:28px;border-top:3px solid #205c4d;padding-top:22px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px}h2{font-size:30px;margin:0 0 18px}.badge{background:#e1e9d6;border-radius:30px;padding:8px 18px;font-size:18px}#schedule{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}.lesson{background:white;border:1px solid #d9e1d3;border-radius:18px;min-height:108px;display:flex;align-items:center;padding:16px 26px;gap:28px}.period{color:#55776b;font-size:clamp(23px,2.5vw,35px);white-space:nowrap}.subject{font-size:clamp(32px,4vw,58px);font-weight:800;overflow-wrap:anywhere;line-height:1.3}.empty{color:#87958b;font-weight:400;font-size:30px}footer{margin-top:24px;color:#587065;font-size:17px;line-height:1.7}.weekend{grid-column:1/-1;padding:50px;background:white;border-radius:20px;text-align:center;font-size:36px}dialog{border:0;border-radius:22px;padding:28px;width:min(1000px,95vw);max-height:92vh;color:#173d36;box-shadow:0 20px 100px #0004}dialog::backdrop{background:#102d27aa}.dialog-head{display:flex;justify-content:space-between;gap:18px;align-items:center}.help{line-height:1.7;color:#52685f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:7px;text-align:center}th{background:#edf2e7}td input{width:100%;min-width:90px;padding:11px 7px;border:1px solid #bccdc2;border-radius:8px;color:#173d36}label.title{display:block;margin:16px 0}#classTitle{width:min(500px,100%);padding:11px;border:1px solid #bccdc2;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}#status{min-height:25px;color:#205c4d}#preview{font-size:16px;color:#785b20}body:fullscreen{overflow:auto}@media(min-width:1700px){main{padding-top:50px}.lesson{min-height:130px}}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}main{padding:24px 20px}#schedule{grid-template-columns:1fr}.lesson{min-height:90px}h1{letter-spacing:-1px}nav button{padding:10px}h2{font-size:25px}}@media print{nav,footer,dialog{display:none}body{background:white}main{padding:10px}.lesson{break-inside:avoid}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">GOOD MORNING</div><h1 id="title">우리 반 아침 안내판</h1><div id="date"></div></div><nav aria-label="안내판 도구"><button id="edit">✎ 시간표 설정</button><button id="fullscreen">전체 화면</button></nav></header>
<section class="board" aria-labelledby="scheduleTitle"><div class="heading"><h2 id="scheduleTitle">오늘의 시간표</h2><span class="badge" id="dayBadge"></span></div><div id="schedule"></div></section>
<footer>오늘도 함께 배우고 자라는 하루!<div id="preview"></div><div id="status" role="status" aria-live="polite"></div></footer>
</main>
<dialog id="settings" aria-labelledby="settingsTitle"><form id="form"><div class="dialog-head"><h2 id="settingsTitle">우리 반 시간표 설정</h2><button type="button" id="close" aria-label="설정 닫기">닫기</button></div><p class="help">월~금 과목을 한 번 입력한 뒤 저장하세요. 빈 교시는 안내판에 표시하지 않습니다.<br>같은 컴퓨터·같은 Chrome에서 이 파일을 열면 저장한 시간표를 불러옵니다.</p><label class="title">안내판 제목 <input id="classTitle" maxlength="40" placeholder="예: 3학년 2반 아침 안내판"></label><div class="table-wrap"><table><thead><tr><th scope="col">교시</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th></tr></thead><tbody id="editor"></tbody></table></div><p class="help">다른 컴퓨터로 옮기거나 안전하게 보관하려면 입력 후 <b>시간표가 담긴 HTML 저장</b>을 누르세요. 내려받은 HTML 파일 하나만 열면 됩니다.</p><div class="actions"><button type="button" id="download">시간표가 담긴 HTML 저장</button><button type="submit" class="primary">저장하고 안내판 보기</button></div></form></dialog>
<script id="embedded-data" type="application/json">null</script>
<script>
'use strict';
const KEY='class-morning-board-v1';
const days=['일','월','화','수','목','금','토'];
const blank=()=>({title:'우리 반 아침 안내판',week:Array.from({length:5},()=>Array(8).fill(''))});
function valid(v){return v&&typeof v.title==='string'&&v.title.length<=40&&Array.isArray(v.week)&&v.week.length===5&&v.week.every(d=>Array.isArray(d)&&d.length===8&&d.every(s=>typeof s==='string'&&s.length<=40));}
let embedded=null;try{embedded=JSON.parse(document.getElementById('embedded-data').textContent);}catch{}
// A downloaded copy has its own storage key, so its embedded timetable takes precedence over older copies.
const storageKey=embedded&&embedded.id?KEY+'-'+embedded.id:KEY;
let data=valid(embedded)?embedded:blank();let storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(valid(saved))data=saved;}catch{storageAvailable=false;}
const $=id=>document.getElementById(id);
function render(){const now=new Date();const day=now.getDay();$('title').textContent=data.title||'우리 반 아침 안내판';$('date').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[day]}요일`;$('dayBadge').textContent=days[day]+'요일';$('schedule').replaceChildren();$('preview').textContent='';if(day===0||day===6){const p=document.createElement('div');p.className='weekend';p.textContent='오늘은 주말이에요. 편안한 하루 보내세요!';$('schedule').append(p);return;}data.week[day-1].forEach((subject,i)=>{if(!subject.trim())return;const card=document.createElement('div');card.className='lesson';const period=document.createElement('span');period.className='period';period.textContent=(i+1)+'교시';const name=document.createElement('span');name.className='subject';name.textContent=subject;card.append(period,name);$('schedule').append(card);});if(!$('schedule').children.length){const p=document.createElement('div');p.className='weekend';p.textContent='오늘 시간표를 입력해 주세요.';$('schedule').append(p);$('preview').textContent='오른쪽 위 ‘시간표 설정’에서 월~금 과목을 입력할 수 있어요.';}}
function openEditor(){$('classTitle').value=data.title;$('editor').replaceChildren();for(let p=0;p<8;p++){const tr=document.createElement('tr');const th=document.createElement('th');th.scope='row';th.textContent=(p+1)+'교시';tr.append(th);for(let d=0;d<5;d++){const td=document.createElement('td');const input=document.createElement('input');input.value=data.week[d][p];input.maxLength=40;input.dataset.day=d;input.dataset.period=p;input.setAttribute('aria-label',days[d+1]+'요일 '+(p+1)+'교시 과목');td.append(input);tr.append(td);}$('editor').append(tr);}$('settings').showModal();}
function collect(){const next=blank();next.title=$('classTitle').value.trim()||next.title;document.querySelectorAll('#editor input').forEach(input=>{next.week[Number(input.dataset.day)][Number(input.dataset.period)]=input.value.trim();});return next;}
function save(next){data=next;try{localStorage.setItem(storageKey,JSON.stringify(data));storageAvailable=true;}catch{storageAvailable=false;}render();$('status').textContent=storageAvailable?'시간표를 저장했습니다.':'이 브라우저에서 저장할 수 없습니다. 설정에서 ‘시간표가 담긴 HTML 저장’으로 보관하세요.';}
$('edit').addEventListener('click',openEditor);$('close').addEventListener('click',()=>$('settings').close());$('form').addEventListener('submit',e=>{e.preventDefault();save(collect());$('settings').close();});
$('download').addEventListener('click',()=>{const next=collect();save(next);const copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-data').textContent=JSON.stringify({...next,id:Date.now().toString(36)}).replace(/</g,'\\u003c');copy.querySelector('#settings').removeAttribute('open');copy.querySelector('#editor').replaceChildren();copy.querySelector('#status').textContent='';const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='우리반_아침안내판_시간표포함.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);$('settings').close();$('status').textContent='시간표가 담긴 HTML을 내려받았습니다. Chrome의 다운로드 목록에서 확인하세요.';});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('status').textContent='Chrome에서 F11 키를 누르면 전체 화면으로 볼 수 있습니다.';}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면';});
render();setInterval(render,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
if(!storageAvailable)$('status').textContent='저장 기능이 제한되어 있습니다. 시간표 입력 후 HTML 저장 기능을 사용하세요.';
</script>
</body>
</html>
