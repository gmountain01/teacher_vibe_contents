<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교내 분실물 알리미</title>
<style>
:root{--ink:#20312f;--green:#167765;--muted:#74817c;--line:#e0e8e2}*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:var(--ink);font-family:system-ui,-apple-system,'맑은 고딕',sans-serif}button,input{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto;padding:32px 24px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:5px 0 8px;letter-spacing:-1px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--green)}p{color:var(--muted);font-size:14px;margin:0}.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:13px 19px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;text-align:left;color:var(--ink)}.stat.active{border-color:var(--green);box-shadow:0 0 0 2px #16776515}.stat span{display:block;font-size:14px;color:var(--muted)}.stat strong{display:block;font-size:32px;margin-top:8px}.stat small{font-size:14px;margin-left:5px;font-weight:400}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:22px}.toolbar h2{font-size:20px;margin:0 auto 0 0}.search{padding:11px 14px;border:1px solid var(--line);border-radius:9px;width:245px;background:white}.settings{font-size:13px;color:var(--muted)}.settings input{width:66px;padding:8px;border:1px solid var(--line);border-radius:7px}.reset{border:1px solid var(--line);background:white;padding:10px;border-radius:8px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{height:220px;background:#e9eee8;position:relative;display:flex;align-items:center;justify-content:center;font-size:45px}.photo img{width:100%;height:100%;object-fit:cover}.done .photo img{filter:grayscale(1);opacity:.65}.stamp{position:absolute;border:4px double #486758;color:#486758;font-size:25px;font-weight:900;padding:6px 12px;transform:rotate(-13deg);background:#ffffffc9}.body{padding:20px}.badges{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.badge{font-size:12px;background:#e8f4ee;color:#24735a;border-radius:5px;padding:4px 8px}.warn{background:#fff2d7;color:#a26b14}.late{background:#ffebe6;color:#b54c37}.neutral{background:#edf0ee;color:#65746c}.card h3{font-size:20px;margin:0 0 15px}.details{display:grid;grid-template-columns:75px 1fr;gap:8px;font-size:13px}.details dt{color:var(--muted)}.details dd{margin:0;overflow-wrap:anywhere}.action{width:100%;border:1px solid var(--line);background:#fff;color:var(--green);padding:11px;border-radius:8px;margin-top:19px;font-weight:700}.resolved{margin-top:19px;padding:11px;background:#f1f4f1;text-align:center;font-size:13px;border-radius:8px;color:#52685d}.empty{grid-column:1/-1;text-align:center;padding:90px 20px;background:white;border:1px dashed #cad8cd;border-radius:16px}.empty b{display:block;font-size:20px;margin-bottom:9px}footer{text-align:center;color:var(--muted);font-size:12px;margin:35px 0}dialog{border:0;border-radius:18px;padding:28px;width:min(520px,calc(100% - 28px));box-shadow:0 20px 80px #102d2933}dialog::backdrop{background:#172d2b70}dialog h2{margin:0 0 23px;font-size:22px}.field{display:block;margin-bottom:16px;font-size:14px;font-weight:600}.field input{display:block;width:100%;border:1px solid #d6dfd7;padding:11px;border-radius:8px;margin-top:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.secondary{padding:12px 18px;border:1px solid var(--line);border-radius:9px;background:white}#preview{max-width:100%;max-height:160px;border-radius:8px;display:none}.hint{font-weight:400;font-size:12px;color:var(--muted);display:block;margin-top:7px}.notice{font-size:12px;margin-top:16px;line-height:1.7}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203e35;color:white;padding:13px 23px;border-radius:10px;display:none;z-index:10}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{gap:9px}.stat{padding:16px}.wrap{padding:24px 16px}}@media(max-width:520px){header .wrap{align-items:flex-start}h1{font-size:22px}header p{max-width:210px;line-height:1.6}.primary{padding:11px 13px;white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{width:100%}.toolbar h2{width:100%}.row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<header><div class="wrap"><div><div class="eyebrow">SCHOOL LOST & FOUND</div><h1>분실물 알리미</h1><p>잃어버린 물건과 주인을 다시 연결해요.</p></div><button class="primary" id="add">＋ 분실물 등록</button></div></header>
<main class="wrap">
<section class="stats" aria-label="분실물 현황">
<button class="stat" data-filter="stored"><span>📦 보관중</span><strong id="storedCount">0</strong></button>
<button class="stat" data-filter="recent"><span>🗓 최근 7일 등록</span><strong id="recentCount">0</strong></button>
<button class="stat" data-filter="done"><span>✓ 찾아감</span><strong id="doneCount">0</strong></button>
<button class="stat" data-filter="expired"><span>⌛ 보관기한 경과</span><strong id="expiredCount">0</strong></button>
</section>
<div class="toolbar"><h2 id="listTitle">전체 분실물 <small id="listCount"></small></h2><button class="reset" id="all">전체 보기</button><input class="search" id="search" placeholder="물건 이름·장소 검색" aria-label="분실물 검색"><label class="settings">보관 기한 <input id="retention" type="number" min="1" max="3650" value="30"> 일</label></div>
<div class="grid" id="cards"></div>
<p class="notice">• 보관 기한은 취득 일자를 기준으로 계산하며, 설정을 바꾸면 보관중인 모든 물품에 적용됩니다.<br>• 물건 수령은 표시된 보관장소에 문의해 주세요. 등록 정보와 사진은 현재 기기의 브라우저에 저장됩니다.</p>
<footer>소중한 물건이 주인을 찾는 곳 · 교내 분실물 알리미</footer>
</main>
<dialog id="register"><form id="registerForm"><h2>분실물 등록</h2><label class="field">분실물명<input name="name" required maxlength="80" placeholder="예: 파란색 텀블러"></label><div class="row"><label class="field">취득 일자<input name="acquired" type="date" required></label><label class="field">취득장소<input name="found" required maxlength="100" placeholder="예: 2층 복도"></label></div><label class="field">보관장소<input name="storage" required maxlength="100" placeholder="예: 1층 교무실"></label><label class="field">분실물 사진<input id="photoInput" type="file" accept="image/*" required><span class="hint">사진의 긴 변을 최대 1,200px로 자동 조정해 저장합니다.</span></label><img id="preview" alt="업로드할 분실물 사진"><div class="buttons"><button class="secondary" type="button" id="cancelRegister">취소</button><button class="primary" id="saveButton" type="submit">등록하기</button></div></form></dialog>
<dialog id="handover"><form id="handoverForm"><h2>찾아감 처리</h2><p id="handoverName" style="margin-bottom:20px"></p><label class="field">해결 날짜<input id="resolvedDate" type="date" required></label><p>인계 완료 도장과 해결 날짜가 표시됩니다.</p><div class="buttons"><button type="button" class="secondary" id="cancelHandover">취소</button><button type="submit" class="primary">인계 완료</button></div></form></dialog>
<div id="toast" role="status"></div>
<script>
const KEY='school-lost-found-v1';let items=[],retention=30,filter='all',photo='',pendingId=null,loading=false;
const $=s=>document.querySelector(s);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const day=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000};const dateText=s=>s?s.replaceAll('-','. '):'—';
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){items=Array.isArray(saved.items)?saved.items:[];retention=Number.isInteger(saved.retention)&&saved.retention>0?saved.retention:30}}catch(e){toast('저장된 정보를 불러오지 못했습니다.')}
$('#retention').value=retention;
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function persist(next,nextRetention=retention){try{localStorage.setItem(KEY,JSON.stringify({items:next,retention:nextRetention}));items=next;retention=nextRetention;return true}catch(e){toast('저장 공간이 부족하거나 브라우저 저장이 제한되어 있습니다.');return false}}
function remaining(i){return day(i.acquired)+retention-day(today())}function matches(i,f){if(f==='stored')return !i.resolved;if(f==='done')return !!i.resolved;if(f==='recent'){const age=day(today())-day(i.registered);return age>=0&&age<7}if(f==='expired')return !i.resolved&&remaining(i)<0;return true}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){for(const f of ['stored','recent','done','expired']){$('#'+f+'Count').textContent=items.filter(i=>matches(i,f)).length;document.querySelector(`[data-filter="${f}"]`).classList.toggle('active',filter===f)}const query=$('#search').value.trim().toLowerCase();const shown=items.filter(i=>matches(i,filter)&&[i.name,i.found,i.storage].some(s=>s.toLowerCase().includes(query)));$('#listTitle').textContent=({all:'전체 분실물',stored:'보관중인 분실물',recent:'최근 7일 등록',done:'찾아간 분실물',expired:'보관기한 경과'})[filter]+' · '+shown.length+'건';$('#cards').innerHTML=shown.length?shown.map(i=>{const rem=remaining(i);const deadline=new Date((day(i.acquired)+retention)*86400000).toISOString().slice(0,10);return `<article class="card ${i.resolved?'done':''}"><div class="photo">${i.photo?`<img src="${i.photo}" alt="${esc(i.name)}">`:'📦'}${i.resolved?'<div class="stamp">인계 완료</div>':''}</div><div class="body"><div class="badges"><span class="badge ${i.resolved?'neutral':''}">${i.resolved?'찾아감':'보관중'}</span>${!i.resolved&&rem<=7?`<span class="badge ${rem<0?'late':'warn'}">${rem<0?'기한 경과 '+Math.abs(rem)+'일':'기한 임박 · '+(rem===0?'오늘까지':rem+'일 남음')}</span>`:''}</div><h3>${esc(i.name)}</h3><dl class="details"><dt>취득 일자</dt><dd>${dateText(i.acquired)}</dd><dt>취득장소</dt><dd>${esc(i.found)}</dd><dt>보관장소</dt><dd>${esc(i.storage)}</dd><dt>보관 기한</dt><dd>${dateText(deadline)}</dd></dl>${i.resolved?`<div class="resolved">✓ 해결 날짜 ${dateText(i.resolved)}</div>`:`<button class="action" data-id="${i.id}">찾아감 처리 →</button>`}</div></article>`}).join(''):'<div class="empty"><b>표시할 분실물이 없어요</b><p>새로운 분실물을 등록하거나 검색 조건을 변경해 주세요.</p></div>'}
document.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('#all').onclick=()=>{filter='all';$('#search').value='';render()};$('#search').oninput=render;
$('#retention').onchange=e=>{const n=Number(e.target.value);if(!Number.isInteger(n)||n<1||n>3650){e.target.value=retention;toast('보관 기한은 1~3650일로 입력해 주세요.');return}if(persist(items,n)){render();toast('보관 기한을 변경했습니다.')}else e.target.value=retention};
$('#add').onclick=()=>{$('#registerForm').reset();$('#registerForm').elements.acquired.value=today();$('#registerForm').elements.acquired.max=today();photo='';$('#preview').style.display='none';$('#register').showModal()};$('#cancelRegister').onclick=()=>$('#register').close();
$('#photoInput').onchange=async e=>{const file=e.target.files[0];photo='';$('#preview').style.display='none';if(!file)return;loading=true;$('#saveButton').disabled=true;try{if(!file.type.startsWith('image/'))throw Error();photo=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))}catch(err){reject(err)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error())};img.src=url});$('#preview').src=photo;$('#preview').style.display='block'}catch(err){e.target.value='';toast('사진을 읽을 수 없습니다. JPG 또는 PNG 사진을 선택해 주세요.')}finally{loading=false;$('#saveButton').disabled=false}};
$('#registerForm').onsubmit=e=>{e.preventDefault();if(loading||!photo){toast('사진을 선택하고 변환이 완료될 때까지 기다려 주세요.');return}const f=e.target.elements;const entry={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:f.name.value.trim(),acquired:f.acquired.value,found:f.found.value.trim(),storage:f.storage.value.trim(),photo,registered:today(),resolved:null};if(!entry.name||!entry.found||!entry.storage){toast('빈칸에 내용을 입력해 주세요.');return}if(persist([entry,...items])){$('#register').close();filter='all';$('#search').value='';render();toast('분실물이 등록되었습니다.')}};
$('#cards').onclick=e=>{const button=e.target.closest('[data-id]');if(!button)return;const item=items.find(i=>i.id===button.dataset.id);pendingId=item.id;$('#handoverName').textContent=item.name;$('#resolvedDate').value=today();$('#resolvedDate').min=item.acquired;$('#resolvedDate').max=today();$('#handover').showModal()};$('#cancelHandover').onclick=()=>$('#handover').close();$('#handoverForm').onsubmit=e=>{e.preventDefault();if(persist(items.map(i=>i.id===pendingId?{...i,resolved:$('#resolvedDate').value}:i))){$('#handover').close();render();toast('인계 완료 처리되었습니다.')}};
render();setInterval(render,60000);
</script>
</body>
</html>
