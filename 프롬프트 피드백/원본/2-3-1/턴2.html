<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #18263c;
      --muted: #64748b;
      --line: #e3e9f1;
      --blue: #2563eb;
      --soft: #eff5ff;
      --red: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.65;
    }

    button, input, textarea {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #93b4ff;
      outline-offset: 3px;
    }

    .shell {
      width: min(960px, calc(100% - 36px));
      margin: 48px auto;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(24, 38, 60, .035);
      overflow: hidden;
    }

    .list-heading {
      display: grid;
      grid-template-columns: 1fr 150px;
      padding: 16px 24px;
      background: #fafbfd;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .notice-row {
      display: grid;
      grid-template-columns: 1fr 150px;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding: 23px 24px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: white;
      color: var(--text);
      text-align: left;
    }

    .notice-row:last-child {
      border-bottom: 0;
    }

    .notice-row:hover {
      background: var(--soft);
    }

    .notice-title {
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .notice-date {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 56px 24px;
      text-align: center;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .btn.danger {
      color: var(--red);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--muted);
    }

    .detail-body {
      padding: 30px;
    }

    .detail-title {
      margin: 0 0 12px;
      font-size: clamp(23px, 5vw, 30px);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 8px;
      background: var(--soft);
      color: #315a98;
      font-size: 13px;
    }

    .memo {
      margin: 28px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .attachment {
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .attachment h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .pdf {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 420px;
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f1f4f8;
    }

    .status {
      min-height: 26px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--red);
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .form {
      padding: 26px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      color: var(--text);
    }

    .field textarea {
      min-height: 140px;
      resize: vertical;
    }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .admin-list {
      margin-top: 25px;
    }

    .admin-item {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .admin-item:last-child {
      border-bottom: 0;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .shell {
        width: calc(100% - 24px);
        margin: 28px auto;
      }

      .list-heading {
        display: none;
      }

      .notice-row {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 20px;
      }

      .detail-body,
      .form {
        padding: 22px 18px;
      }

      .pdf {
        min-height: 380px;
        height: 65vh;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">SCHOOL NOTICE</p>
        <h1>우리 학교 가정통신문</h1>
        <p class="subtitle">
          학교의 소식을 편리하게 확인하세요.
        </p>
      </div>

      <? if (isAdmin) { ?>
        <button
          class="icon-btn"
          type="button"
          onclick="openAdmin()"
          title="관리자 화면"
          aria-label="관리자 화면"
        >
          <svg
            width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="1.8" aria-hidden="true"
          >
            <path d="M9.5 3h5l.7 2.6 2.3 1.3 2.6-.7 2.5 4.3-1.9 1.9v2.6l1.9 1.9-2.5 4.3-2.6-.7-2.3 1.3-.7 2.6h-5l-.7-2.6-2.3-1.3-2.6.7L1.4 17l1.9-1.9v-2.6l-1.9-1.9 2.5-4.3 2.6.7 2.3-1.3z"
              transform="translate(1 0) scale(.9)"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
        </button>
      <? } ?>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main>
      <section id="listView" aria-label="가정통신문 목록">
        <div class="card">
          <div class="list-heading">
            <span>제목</span>
            <span>게시 종료일</span>
          </div>
          <div id="noticeList"></div>
        </div>
      </section>

      <section id="detailView" hidden aria-label="가정통신문 상세">
        <div class="toolbar">
          <button class="btn" type="button" onclick="goList()">
            ← 목록으로
          </button>
        </div>

        <article id="detailContent" class="card detail-body"></article>
      </section>

      <? if (isAdmin) { ?>
        <?!= HtmlService.createHtmlOutputFromFile('Admin').getContent(); ?>
      <? } ?>
    </main>

    <footer class="footer">
      안내문은 게시 종료일까지 확인할 수 있습니다.
    </footer>
  </div>

  <script>
    function el(id) {
      return document.getElementById(id);
    }

    function setStatus(message, error = false) {
      el('status').textContent = message || '';
      el('status').classList.toggle('error', error);
    }

    function showView(name) {
      ['listView', 'detailView', 'adminView'].forEach(id => {
        const element = el(id);
        if (element) element.hidden = id !== name;
      });
    }

    function reportError(error) {
      setStatus(
        error && error.message
          ? error.message
          : '처리하지 못했습니다. 잠시 후 다시 시도해 주세요.',
        true
      );
    }

    function loadList() {
      showView('listView');
      setStatus('안내문을 불러오는 중입니다.');
      el('noticeList').replaceChildren();

      google.script.run
        .withSuccessHandler(items => {
          setStatus('');

          if (!items.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '현재 게시된 가정통신문이 없습니다.';
            el('noticeList').append(empty);
            return;
          }

          items.forEach(item => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'notice-row';

            const title = document.createElement('span');
            title.className = 'notice-title';
            title.textContent = item.title;

            const date = document.createElement('span');
            date.className = 'notice-date';
            date.textContent = '게시 종료 ' + item.endDate;

            button.append(title, date);
            button.addEventListener('click', () => {
              google.script.history.push(
                { id: item.id }, { id: item.id }, ''
              );
              loadDetail(item.id);
            });

            el('noticeList').append(button);
          });
        })
        .withFailureHandler(reportError)
        .listNotices();
    }

    function loadDetail(id) {
      showView('detailView');
      el('detailContent').replaceChildren();
      setStatus('안내문을 불러오는 중입니다.');

      google.script.run
        .withSuccessHandler(item => {
          setStatus('');

          if (!item) {
            el('detailContent').textContent =
              '게시가 종료되었거나 찾을 수 없는 안내문입니다.';
            return;
          }

          const title = document.createElement('h2');
          title.className = 'detail-title';
          title.textContent = item.title;

          const date = document.createElement('span');
          date.className = 'badge';
          date.textContent = '게시 종료일 ' + item.endDate;

          const memo = document.createElement('div');
          memo.className = 'memo';
          memo.textContent = item.memo;

          const attachment = document.createElement('section');
          attachment.className = 'attachment';

          const heading = document.createElement('h3');
          heading.textContent = '첨부 안내문';

          const link = document.createElement('a');
          link.className = 'btn';
          link.href = item.openUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'PDF 새 창으로 열기';

          const hint = document.createElement('p');
          hint.className = 'hint';
          hint.textContent =
            '미리보기가 보이지 않으면 새 창으로 열어 주세요.';

          const frame = document.createElement('iframe');
          frame.className = 'pdf';
          frame.src = item.previewUrl;
          frame.title = item.title + ' PDF 미리보기';
          frame.setAttribute('allow', 'fullscreen');

          attachment.append(heading, link, hint, frame);
          el('detailContent').append(title, date, memo, attachment);
        })
        .withFailureHandler(reportError)
        .getNotice(id);
    }

    function goList() {
      google.script.history.push({}, {}, '');
      loadList();
    }

    function route(parameters) {
      const id = parameters && parameters.id;
      if (id) loadDetail(id);
      else loadList();
    }

    window.addEventListener('DOMContentLoaded', () => {
      google.script.history.setChangeHandler(event => {
        route(event.location.parameter);
      });

      google.script.url.getLocation(location => {
        route(location.parameter);
      });
    });
  </script>
</body>
</html>
