<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202b3c;font-family:"Malgun Gothic",system-ui,sans-serif}button{font:inherit}main{height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:24px 32px;gap:20px;max-width:1800px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;letter-spacing:-1px;margin:0 0 6px}header p{margin:0;color:#697588;font-size:14px}.presets{display:flex;padding:5px;border:1px solid #dce1e9;border-radius:14px;background:white;gap:4px}.presets button{border:0;background:transparent;padding:12px 18px;border-radius:10px;cursor:pointer;color:#596577;font-weight:700;white-space:nowrap}.presets button[aria-pressed="true"]{background:#273d59;color:white;box-shadow:0 3px 6px #273d5920}button:focus-visible{outline:3px solid #2968da;outline-offset:4px}.classroom{flex:1;min-height:0;display:grid;grid-template-columns:52px 1fr 52px;grid-template-rows:48px 1fr 26px;gap:10px 16px}.board{grid-column:2;display:flex;justify-content:center;align-items:center}.board span{display:block;width:46%;max-width:500px;text-align:center;background:#284f48;color:#fff;border:5px solid #d4c0a2;border-radius:5px;padding:7px;font-size:14px;letter-spacing:8px;box-shadow:0 2px 2px #172a3110}.side{grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#697588;font-size:14px;font-weight:bold}.windows{grid-column:1}.hall{grid-column:3}.side .label{writing-mode:vertical-rl;letter-spacing:7px}.window{width:25px;height:65px;border:2px solid #a8cbd9;border-radius:4px;background:linear-gradient(90deg,transparent 46%,#a8cbd9 46%,#a8cbd9 54%,transparent 54%),#e3f2fa}.hall-mark{height:65px;width:6px;border-radius:6px;background:#d4dbe5}.floor{grid-column:2;grid-row:2;border:2px solid #cbd3de;background:white;border-radius:18px;padding:10px;display:grid;gap:10px;box-shadow:0 8px 30px #23395508}.floor.rows{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr))}.floor.columns{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr}.floor.six{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.zone{border:2px solid var(--edge);border-radius:11px;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px;gap:8px;min-width:0}.zone-number{font-size:12px;font-weight:700;letter-spacing:2px;opacity:.7}.zone h2{font-size:clamp(22px,2.7vw,40px);margin:0;letter-spacing:-1px}.zone p{margin:0;font-size:14px;opacity:.8}.back{grid-column:2;text-align:center;color:#8a94a3;font-size:12px;letter-spacing:4px;align-self:center}footer{display:flex;justify-content:space-between;color:#798393;font-size:12px;gap:12px}#summary{color:#4b5d73} @media(max-width:850px){main{padding:16px;gap:12px}header{flex-direction:column;align-items:stretch;gap:14px}h1{font-size:23px}.presets{justify-content:center}.presets button{flex:1;padding:11px 8px;font-size:13px}.classroom{grid-template-columns:26px 1fr 26px;gap:8px}.window{width:18px;height:48px}.floor{padding:7px;gap:7px}.zone{padding:8px}.zone h2{font-size:clamp(17px,3.5vw,28px)}.zone p{font-size:11px}.zone-number{font-size:10px;letter-spacing:0}.board span{width:65%}footer{font-size:11px}}@media print{main{height:95vh;min-height:0;padding:0}.presets{display:none}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}.floor{box-shadow:none}}
main{height:auto;min-height:100vh;min-height:100dvh}.classroom{flex:none;min-height:500px;height:calc(100dvh - 300px)}.zone{cursor:pointer;text-align:center;font:inherit;transition:filter .15s}.zone:hover{filter:brightness(.97)}.zone h2{font-size:clamp(18px,2vw,28px)}.zone .students{font-size:clamp(25px,3vw,44px);font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;opacity:1}.zone .empty{font-size:14px;font-weight:400;opacity:.65}.special-section{margin:0 68px}.special-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}.special-header h2{font-size:19px;margin:0}.special-header p{font-size:13px;color:#697588;margin:5px 0 0}.add-form{display:flex;gap:8px;flex-wrap:wrap}input,textarea{font:inherit;border:1px solid #bdc8d6;border-radius:8px;padding:10px;background:white;color:#202b3c}input{min-width:0;max-width:100%;width:220px}.action{border:0;border-radius:8px;padding:10px 16px;background:#273d59;color:white;cursor:pointer}.special-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.special-card{position:relative;min-width:0}.special-card .zone{width:100%;height:100%;min-height:155px;padding:20px 40px}.remove{position:absolute;top:6px;right:6px;background:#ffffffa0;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;color:#596577;font-size:12px}.special-empty{margin:0;padding:20px;border:1px dashed #cbd3de;border-radius:10px;text-align:center;color:#798393;font-size:14px}dialog{border:0;border-radius:16px;padding:26px;width:min(460px,calc(100% - 32px));box-shadow:0 15px 70px #0003}dialog::backdrop{background:#202b3c70}dialog h2{margin:0 0 18px;font-size:22px}dialog label{display:block;margin-bottom:8px;font-weight:bold}dialog textarea{width:100%;resize:vertical;min-height:130px}dialog p{font-size:13px;color:#697588;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.secondary{background:#e9edf3;color:#34465c}@media(max-width:850px){.special-section{margin:0 34px}.classroom{height:560px}.special-header{align-items:stretch}.add-form{width:100%}.add-form input{flex:1}.zone .students{font-size:clamp(22px,4vw,34px)}}@media print{.classroom{height:650px}.special-header .add-form,.remove,.empty,dialog{display:none}.special-section{margin:0 68px}.zone{break-inside:avoid}.special-grid{grid-template-columns:repeat(3,1fr)}}
.progress-panel{margin:0 68px;padding:16px 22px;border-radius:14px;background:#273d59;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress-panel strong{font-size:clamp(26px,3vw,38px)}.progress-panel p{margin:4px 0 0;font-size:13px;color:#d5e1ef}.zone-card{position:relative;min-width:0;min-height:0}.zone-card>.zone{width:100%;height:100%;padding:18px 16px 42px}.edit-names{position:absolute;bottom:8px;right:8px;border:1px solid #aab8c8;background:#ffffffed;color:#34465c;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}.zone.done{background:#c8ecd2;border-color:#469663;color:#194f2e}.zone .completion{font-size:14px;font-weight:bold;opacity:1}.zone .completion small{display:block;font-size:11px;font-weight:400;margin-top:3px}.zone .students{font-size:clamp(23px,2.7vw,38px)}.floor.rows{grid-template-rows:repeat(3,minmax(170px,1fr))}.floor.six{grid-template-rows:repeat(2,minmax(190px,1fr))}.classroom{min-height:660px;height:calc(100dvh - 360px)}.special-card .zone{padding-bottom:45px}.zone .empty{font-size:14px}@media(max-width:850px){.progress-panel{margin:0 34px}.classroom{height:720px;min-height:720px}.zone-card>.zone{padding:12px 8px 42px}.zone .students{font-size:clamp(19px,3.6vw,32px)}}@media print{.edit-names{display:none}.zone-card>.zone{padding-bottom:16px}.progress-panel{color:#202b3c;background:#edf3f8}}
.corner-tools{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;gap:8px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 2px 12px #0002}.corner-tools button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;background:#273d59;color:white}.corner-tools button[aria-pressed="true"]{background:#9b5d13}.teacher-actions{position:absolute;bottom:8px;left:8px;display:flex;gap:6px}.teacher-actions button{border:0;border-radius:6px;padding:5px 10px;color:white;cursor:pointer;font-weight:bold}.pass-action{background:#24653a}.retry-action{background:#a52f36}.zone.done{background:#fff1c9;border-color:#d7b650;color:#715516}.zone.passed{background:#c8ecd2;border-color:#469663;color:#194f2e}.zone.retry{background:#fbdcdc;border-color:#cf6464;color:#922f35}footer{padding-bottom:58px}.print-sheet{display:none}@page{size:A4 portrait;margin:0}@media print{body{background:white}body>main,body>dialog,.corner-tools{display:none!important}.print-sheet{display:block;width:210mm;height:297mm;padding:12mm;overflow:hidden;color:#111}.print-report{width:186mm;transform-origin:top left}.print-report table{width:100%;border-collapse:collapse;font-size:11pt;table-layout:fixed}.print-report caption{font-size:17pt;font-weight:bold;text-align:left;padding-bottom:12px}.print-report caption small{display:block;font-size:10pt;font-weight:normal;margin-top:6px}.print-report th,.print-report td{border:1px solid #555;padding:8px;overflow-wrap:anywhere}.print-report th{background:#eee}.print-report td:not(:first-child){text-align:center}.print-report th:first-child{width:62%}.print-report tfoot td{font-size:9pt;text-align:left!important}}
.teacher-mode .teacher-actions{bottom:40px;right:8px;justify-content:center}.teacher-mode .zone-card>.zone,.teacher-mode .special-card .zone{padding-bottom:80px}.teacher-mode .floor.rows{grid-template-rows:repeat(3,minmax(215px,1fr))}.teacher-mode .classroom{min-height:800px}.teacher-mode .special-card .zone{min-height:210px}
</style>
</head>
<body>
<main>
<header><div><h1>우리 반 청소 구역 점검판</h1><p>분할 방식을 선택하고, 우리 반 청소 구역을 한눈에 확인하세요.</p></div><nav class="presets" aria-label="청소 구역 분할 방식"><button type="button" data-preset="rows" aria-pressed="true">앞·중간·뒤 3분할</button><button type="button" data-preset="columns" aria-pressed="false">창가·가운데·복도 3분할</button><button type="button" data-preset="six" aria-pressed="false">6분할</button></nav></header>
<section class="progress-panel" aria-label="오늘 청소 진행 상황"><div><strong id="progress" role="status" aria-live="polite">오늘 0/3 구역 완료</strong><p>청소를 마치면 구역을 누르세요. 선생님이 확인한 뒤 통과 또는 다시로 표시합니다.</p></div><span id="today-label"></span></section>
<section class="classroom" aria-label="교실 평면도: 칠판은 위쪽, 창가는 왼쪽, 복도는 오른쪽">
<div class="board"><span>칠판 · 앞</span></div>
<div class="side windows" aria-hidden="true"><span class="window"></span><span class="label">창가</span><span class="window"></span></div>
<div id="floor" class="floor rows" aria-label="청소 구역"></div>
<div class="side hall" aria-hidden="true"><span class="hall-mark"></span><span class="label">복도</span><span class="hall-mark"></span></div>
<div class="back">교실 뒤쪽</div>
</section>
<section class="special-section" aria-labelledby="special-title"><div class="special-header"><div><h2 id="special-title">교실 밖 특별 구역</h2><p>구역을 누르면 청소 완료 · ‘이름 수정’으로 담당 학생 입력</p></div><form id="add-special" class="add-form"><input id="special-name" aria-label="추가할 특별 구역 이름" placeholder="예: 복도, 신발장, 특별실" maxlength="40" required><button class="action" type="submit">+ 구역 추가</button></form></div><div id="special-grid" class="special-grid"></div></section>
<footer><span id="summary" role="status" aria-live="polite"></span><span id="save-status">인터넷 없이 사용 가능 · 입력 내용 자동 저장</span></footer>
</main>
<div class="corner-tools"><button type="button" id="teacher-toggle" aria-pressed="false">선생님</button><button type="button" id="print-button">인쇄</button></div>
<section class="print-sheet" aria-label="최근 5일 청소 점검 집계"><div id="print-report" class="print-report"></div></section>
<dialog id="student-dialog" aria-labelledby="dialog-title"><form id="student-form"><h2 id="dialog-title"></h2><label for="student-names">담당 학생 이름</label><textarea id="student-names" placeholder="예: 김민수, 이서연&#10;또는 한 줄에 한 명씩 입력하세요."></textarea><p>여러 명을 함께 적을 수 있습니다. 이름을 모두 지우고 저장하면 담당 학생이 비워집니다.</p><div class="dialog-actions"><button type="button" id="cancel-dialog" class="action secondary">취소</button><button type="submit" class="action">저장</button></div></form></dialog>
<script>
(()=>{
 'use strict';
 const colors=[['#e1f2ed','#a7d5c6','#245d4d'],['#fff1d6','#e8cd92','#7b571c'],['#e4edfd','#b1c7ed','#365781'],['#f9e7e1','#e4b9aa','#854e3e'],['#ede7f7','#c9b9e2','#644c87'],['#e0f1f6','#a3cddc','#326479']];
 const presets={rows:{title:'앞·중간·뒤 3분할',zones:[['앞 구역','칠판 쪽'],['중간 구역','교실 중앙'],['뒤 구역','교실 뒤쪽']]},columns:{title:'창가·가운데·복도 3분할',zones:[['창가 구역','왼쪽'],['가운데 구역','교실 중앙'],['복도 구역','오른쪽']]},six:{title:'6분할',zones:[['앞 · 창가','앞쪽 왼편'],['앞 · 가운데','앞쪽 중앙'],['앞 · 복도','앞쪽 오른편'],['뒤 · 창가','뒤쪽 왼편'],['뒤 · 가운데','뒤쪽 중앙'],['뒤 · 복도','뒤쪽 오른편']]}};
 const floor=document.getElementById('floor');
 const storageKey='classroom-cleaning-assignments-v1';
 let data={assignments:{rows:[],columns:[],six:[]},special:[]};
 try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved && saved.assignments && Array.isArray(saved.special)){for(const key of ['rows','columns','six'])if(Array.isArray(saved.assignments[key]))data.assignments[key]=saved.assignments[key].map(x=>typeof x==='string'?x:'');data.special=saved.special.filter(x=>x && typeof x.name==='string').map(x=>({id:typeof x.id==='string'?x.id:makeId(),name:x.name,students:typeof x.students==='string'?x.students:''}));}}catch(e){}
 let current='rows',editing=null,teacherMode=false;
 function makeId(){return 'special-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
 data.special.forEach(item=>{if(!item.id)item.id=makeId();});
 const historyKey='classroom-cleaning-reviews-v1';
 let reviews=[];
 try{const saved=JSON.parse(localStorage.getItem(historyKey));if(Array.isArray(saved))reviews=saved.filter(x=>x && typeof x.id==='string' && typeof x.name==='string' && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && ['pass','retry'].includes(x.result));}catch(e){}
 function zoneId(key,index){return key==='special'?data.special[index].id:key+':'+index;}
 function zoneName(key,index){return key==='special'?data.special[index].name:presets[key].title+' / '+presets[key].zones[index][0];}
 function todayReview(key,index){const id=zoneId(key,index);return reviews.findLast(x=>x.id===id && x.date===dateKey());}
 function saveReviews(){try{localStorage.setItem(historyKey,JSON.stringify(reviews));}catch(e){document.getElementById('save-status').textContent='판정 기록 저장 불가 · 이 창을 닫으면 기록이 사라질 수 있습니다.';}}
 function reviewZone(key,index,result){if(!teacherMode)return;checkDate();const previous=todayReview(key,index);if(previous && previous.result===result)return;reviews.push({id:zoneId(key,index),name:zoneName(key,index),date:dateKey(),time:new Date().toISOString(),result});saveReviews();render(current);}
 function reviewControls(key,index){const actions=document.createElement('div');actions.className='teacher-actions';if(teacherMode){for(const [result,label] of [['pass','통과'],['retry','다시']]){const button=document.createElement('button');button.type='button';button.className=result+'-action';button.textContent=label;button.setAttribute('aria-label',zoneName(key,index)+' '+label);button.addEventListener('click',()=>reviewZone(key,index,result));actions.append(button);}}return actions;}
 document.getElementById('teacher-toggle').addEventListener('click',()=>{teacherMode=!teacherMode;document.body.classList.toggle('teacher-mode',teacherMode);document.getElementById('teacher-toggle').setAttribute('aria-pressed',String(teacherMode));document.getElementById('teacher-toggle').textContent=teacherMode?'선생님 · 종료':'선생님';render(current);});
 function reportDates(){const end=new Date();end.setHours(12,0,0,0);return Array.from({length:5},(_,i)=>{const d=new Date(end);d.setDate(d.getDate()-4+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');});}
 function buildReport(){checkDate();const dates=reportDates(),rows=new Map();presets[current].zones.forEach((_,i)=>rows.set(zoneId(current,i),{name:zoneName(current,i),pass:0,retry:0}));data.special.forEach((_,i)=>rows.set(zoneId('special',i),{name:zoneName('special',i),pass:0,retry:0}));for(const record of reviews){if(!dates.includes(record.date))continue;if(!rows.has(record.id))rows.set(record.id,{name:record.name,pass:0,retry:0});rows.get(record.id)[record.result]++;}const report=document.getElementById('print-report');report.replaceChildren();const table=document.createElement('table'),caption=document.createElement('caption');caption.textContent='최근 5일 청소 구역 점검 집계';const period=document.createElement('small');period.textContent=dates[0]+' ~ '+dates[4]+' (오늘 포함, 달력 기준 5일)';caption.append(period);table.append(caption);const head=document.createElement('thead'),heading=document.createElement('tr');for(const label of ['구역','통과 횟수','다시 횟수']){const cell=document.createElement('th');cell.scope='col';cell.textContent=label;heading.append(cell);}head.append(heading);table.append(head);const body=document.createElement('tbody');let passed=0,retried=0;for(const row of rows.values()){const tr=document.createElement('tr');for(const value of [row.name,row.pass,row.retry]){const td=document.createElement('td');td.textContent=String(value);tr.append(td);}passed+=row.pass;retried+=row.retry;body.append(tr);}const total=document.createElement('tr');for(const value of ['합계',passed,retried]){const cell=document.createElement('th');cell.textContent=String(value);total.append(cell);}body.append(total);table.append(body);const foot=document.createElement('tfoot'),noteRow=document.createElement('tr'),note=document.createElement('td');note.colSpan=3;note.textContent='교사 판정 횟수 집계: 같은 판정의 연속 클릭은 1회로 계산합니다. 다시 후 통과는 각각 1회입니다. 현재 구역과 기간 내 기록이 있는 구역을 표시합니다.';noteRow.append(note);foot.append(noteRow);table.append(foot);report.append(table);report.style.transform='';report.style.width='186mm';}
 function fitReport(){const report=document.getElementById('print-report');report.style.transform='';const scale=Math.min(1,(272*96/25.4)/Math.max(1,report.scrollHeight));report.style.transform='scale('+scale+')';}
 window.addEventListener('beforeprint',()=>{buildReport();fitReport();});
 document.getElementById('print-button').addEventListener('click',()=>{buildReport();window.print();});
 const dailyKey='classroom-cleaning-daily-v1';
 function dateKey(){const now=new Date();return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');}
 function freshDaily(){return {date:dateKey(),rows:[],columns:[],six:[],special:[]};}
 let daily=freshDaily();
 try{const saved=JSON.parse(localStorage.getItem(dailyKey));if(saved && saved.date===dateKey()){for(const key of ['rows','columns','six','special'])if(Array.isArray(saved[key]))daily[key]=saved[key].map(value=>typeof value==='string' && Number.isFinite(Date.parse(value))?value:null);}}catch(e){}
 function saveDaily(){try{localStorage.setItem(dailyKey,JSON.stringify(daily));}catch(e){document.getElementById('save-status').textContent='자동 저장 불가 · 이 창을 닫으면 입력 내용이 사라질 수 있습니다.';}}
 function checkDate(){if(daily.date===dateKey())return false;daily=freshDaily();saveDaily();render(current);return true;}
 function updateProgress(){const total=presets[current].zones.length+data.special.length;function isDone(key,i){const review=todayReview(key,i);return review?review.result==='pass':Boolean(daily[key][i]);}const done=presets[current].zones.reduce((n,_,i)=>n+Number(isDone(current,i)),0)+data.special.reduce((n,_,i)=>n+Number(isDone('special',i)),0);document.getElementById('progress').textContent='오늘 '+done+'/'+total+' 구역 완료';document.getElementById('today-label').textContent=daily.date.replaceAll('-','.');}
 function complete(key,index){checkDate();if(teacherMode || todayReview(key,index))return;if(daily[key][index]){if(!confirm('청소 완료 표시를 취소할까요?'))return;daily[key][index]=null;}else{daily[key][index]=new Date().toISOString();}saveDaily();render(current);}
 function completionLabel(button,key,index){const time=daily[key][index],review=todayReview(key,index);button.setAttribute('aria-pressed',String(Boolean(time)));if(review)button.className+=review.result==='pass'?' passed':' retry';else if(time)button.className+=' done';const label=document.createElement('p');label.className='completion';label.textContent=review?(review.result==='pass'?'✓ 통과':'↻ 다시'):time?'✓ 청소 끝 · 확인 대기':'눌러서 청소 완료';if(time){const small=document.createElement('small');small.textContent=new Date(time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})+' 완료';label.append(small);}button.append(label);button.addEventListener('click',()=>complete(key,index));}
 function editButton(title,onClick){const button=document.createElement('button');button.type='button';button.className='edit-names';button.textContent='이름 수정';button.setAttribute('aria-label',title+' 담당 학생 이름 수정');button.addEventListener('click',onClick);return button;}
 const dialog=document.getElementById('student-dialog'),names=document.getElementById('student-names');
 function save(){try{localStorage.setItem(storageKey,JSON.stringify(data));document.getElementById('save-status').textContent='인터넷 없이 사용 가능 · 입력 내용 자동 저장';}catch(e){document.getElementById('save-status').textContent='자동 저장 불가 · 이 창을 닫으면 입력 내용이 사라질 수 있습니다.';}}
 function openEditor(title,value,onSave){document.getElementById('dialog-title').textContent=title;names.value=value;editing=onSave;dialog.showModal();names.focus();}
 document.getElementById('cancel-dialog').addEventListener('click',()=>dialog.close());
 document.getElementById('student-form').addEventListener('submit',event=>{event.preventDefault();if(editing)editing(names.value.trim());save();dialog.close();render(current);});
 function studentLabel(value){const label=document.createElement('p');label.className='students'+(value?'':' empty');label.textContent=value||'담당 학생 미지정';return label;}
 function paint(zone,index){['--bg','--edge','--ink'].forEach((property,j)=>zone.style.setProperty(property,colors[index%colors.length][j]));}
 function renderSpecial(){const grid=document.getElementById('special-grid');grid.replaceChildren();if(!data.special.length){const empty=document.createElement('p');empty.className='special-empty';empty.textContent='복도, 신발장, 특별실 등 필요한 구역을 추가하세요.';grid.append(empty);}data.special.forEach((item,i)=>{const card=document.createElement('div');card.className='special-card';const button=document.createElement('button');button.type='button';button.className='zone';paint(button,i+3);const title=document.createElement('h2');title.textContent=item.name;button.append(title,studentLabel(item.students));completionLabel(button,'special',i);const edit=editButton(item.name,()=>openEditor(item.name,item.students,value=>{item.students=value}));const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='삭제';remove.setAttribute('aria-label',item.name+' 구역 삭제');remove.addEventListener('click',()=>{if(confirm('“'+item.name+'” 구역과 담당 학생 정보를 삭제할까요?')){checkDate();data.special.splice(i,1);daily.special.splice(i,1);save();saveDaily();render(current);}});card.append(button,edit,remove,reviewControls('special',i));grid.append(card);});updateProgress();}
 document.getElementById('add-special').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('special-name');const name=input.value.trim();if(!name){input.value='';input.reportValidity();return;}checkDate();data.special.push({id:makeId(),name,students:''});input.value='';save();renderSpecial();input.focus();});
 function render(key){
  current=key;
  if(daily.date!==dateKey()){daily=freshDaily();saveDaily();}
  const preset=presets[key];floor.className='floor '+key;floor.replaceChildren();
  preset.zones.forEach(([name,description],i)=>{
   const zone=document.createElement('button');zone.type='button';zone.className='zone';
   ['--bg','--edge','--ink'].forEach((property,j)=>zone.style.setProperty(property,colors[i][j]));
   const number=document.createElement('span');number.className='zone-number';number.textContent='구역 '+(i+1);
   const heading=document.createElement('h2');heading.textContent=name;
   const subtitle=document.createElement('p');subtitle.textContent=description;
   const value=data.assignments[key][i]||'';
   zone.append(number,heading,studentLabel(value));zone.setAttribute('aria-label',name+' 담당 학생: '+(value||'미지정')+'. 청소 완료 표시 전환');completionLabel(zone,key,i);const card=document.createElement('div');card.className='zone-card';card.append(zone,editButton(name,()=>openEditor(name,data.assignments[key][i]||'',newValue=>{data.assignments[key][i]=newValue})),reviewControls(key,i));floor.append(card);
  });
  document.querySelectorAll('[data-preset]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.preset===key)));
  document.getElementById('summary').textContent=preset.title+' · 총 '+preset.zones.length+'개 구역'+(teacherMode?' · 선생님 모드: 통과·다시 버튼으로 판정':'');
  try{localStorage.setItem('classroom-cleaning-preset',key)}catch(e){}
  renderSpecial();
 }
 document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.preset)));
 let initial='rows';try{const saved=localStorage.getItem('classroom-cleaning-preset');if(Object.hasOwn(presets,saved))initial=saved}catch(e){}
 save();
 render(initial);
 setInterval(checkDate,1000);
 document.addEventListener('visibilitychange',checkDate);
 window.addEventListener('focus',checkDate);
})();
</script>
</body>
</html>
