<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리학교 교무수첩</title><style>
:root{--green:#287766;--ink:#243a36;--muted:#71817b;--line:#e1e9e4;--bg:#f3f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 15px;color:var(--ink)}button:hover{background:#e9f3ee}.primary{background:var(--green);color:white;border-color:var(--green)}header{background:white;border-bottom:1px solid var(--line);padding:23px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 5px}small,.muted{color:var(--muted)}nav{display:flex;gap:8px;padding:20px 5% 0;flex-wrap:wrap}nav button.active{background:var(--green);color:white}main{max-width:1400px;margin:25px auto;padding:0 4%}h2{font-size:24px;margin:0 0 8px}h3{font-size:17px;margin:0 0 20px}.intro{margin-bottom:25px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.badge{background:#e9f3ee;color:var(--green);font-size:12px;border-radius:6px;padding:5px 8px;white-space:nowrap}.item{padding:15px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}.item:last-child{border-bottom:0}.grow{flex:1}.dday{min-width:56px;color:var(--green);font-weight:bold}.empty{padding:24px 0;color:var(--muted);text-align:center}.progress{height:9px;background:#edf1ee;border-radius:8px;margin:12px 0;overflow:hidden}.progress span{display:block;height:100%;background:#55a48c}.stat{font-size:27px;font-weight:bold}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:#50645d;margin-bottom:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5dfd9;border-radius:8px;background:white;color:var(--ink);margin-top:6px}textarea{resize:vertical;min-height:85px}input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--green)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);margin-top:20px}.dayhead{padding:12px;text-align:center;font-size:13px;color:var(--muted)}.day{min-height:110px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-width:0}.day.dim{background:#f8faf8;color:#adb8b1}.day.today{background:#eff8f1}.event{display:block;background:#e8f2ed;color:#246853;padding:5px;border:0;border-radius:5px;margin-top:5px;font-size:11px;text-align:left;width:100%;overflow-wrap:anywhere}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.week .card{padding:14px;min-width:0}.week textarea{min-height:160px}.delete{color:#a05a50;padding:5px 8px;font-size:12px}.tabs{display:flex;gap:7px;margin:20px 0}.tabs .active{background:#e4f0e9;color:var(--green);border-color:var(--green)}dialog{width:480px;max-width:95%;border:0;border-radius:16px;padding:25px}dialog::backdrop{background:#183b3255}footer{text-align:center;color:var(--muted);font-size:12px;padding:15px 15px 30px}.full{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr}.week{grid-template-columns:1fr}.calendar .day{min-height:85px;padding:4px}.card{padding:18px}header{align-items:flex-start;gap:15px;flex-direction:column}.formgrid{grid-template-columns:1fr}.event{font-size:10px}nav{gap:5px}nav button{padding:9px}}
@media print{header button,nav,button,.no-print{display:none!important}body{background:white}main{padding:0}.card{break-inside:avoid}}
</style></head><body><header><div><h1>🌿 우리학교 교무수첩</h1><small id="schoolTitle">선생님의 하루를 가볍게, 학교의 일정을 한눈에.</small></div><div class="row"><button onclick="backup()">↓ 백업 저장</button><button onclick="document.getElementById('restore').click()">백업 불러오기</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(this)"><button onclick="print()">인쇄</button></div></header><nav id="nav"></nav><main id="main"></main><footer>입력 내용은 현재 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제에 대비해 백업을 저장해 주세요.</footer><dialog id="eventDialog"><form id="eventForm"><div class="row between"><h3 id="dialogTitle">일정 추가</h3><button type="button" onclick="eventDialog.close()">닫기</button></div><input type="hidden" name="id"><label>일정 이름<input name="title" required maxlength="100" placeholder="예: 교육과정 협의회"></label><div class="formgrid"><label>시작일<input type="date" name="start" required></label><label>종료일<input type="date" name="end" required></label></div><label>분류<select name="category"><option>학교 행사</option><option>회의</option><option>연수</option><option>시험</option><option>평가</option><option>대회</option><option>공휴일</option><option>방학</option><option>기타</option></select></label><label>메모<textarea name="memo" placeholder="장소, 시간, 담당 등을 입력하세요"></textarea></label><button class="primary" type="submit">일정 저장</button><button type="button" id="eventDelete" class="delete" onclick="deleteEvent()">삭제</button></form></dialog>
<script>
const KEY='school-notebook-v1',now=new Date(),today=iso(now),year=now.getFullYear();
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function date(s){return new Date(s+'T12:00:00')}function add(s,n){let d=date(s);d.setDate(d.getDate()+n);return iso(d)}function diff(a,b){return Math.round((date(a)-date(b))/86400000)}function monday(s){let d=date(s);return add(s,-((d.getDay()+6)%7))}function fmt(s){return s?`${Number(s.slice(5,7))}.${Number(s.slice(8,10))}`:'-'}
const initial={settings:{school:'우리학교',year,sem1start:year+'-03-01',sem1end:year+'-07-31',sem2start:year+'-08-01',sem2end:(year+1)+'-02-28',holidays:''},events:[],tasks:[],weeks:{}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch{data=initial}let tab='today',month=today.slice(0,7),week=monday(today),filter='진행중';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('저장 공간이 부족하거나 브라우저 저장이 제한되어 있습니다. 백업을 저장해 주세요.')}}
function render(){ $('#schoolTitle').textContent=data.settings.school+' · '+data.settings.year+'학년도';$('#nav').innerHTML=[['today','오늘'],['calendar','학사일정'],['weekly','주간계획'],['tasks','업무 할 일'],['settings','학기 설정']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('');$('#main').innerHTML=({today:todayView,calendar:calendarView,weekly:weeklyView,tasks:tasksView,settings:settingsView}[tab])()}
function empty(t){return `<div class="empty">${t}</div>`}function heading(t,sub){return `<div class="intro"><h2>${t}</h2><span class="muted">${sub}</span></div>`}
function sem(){let s=data.settings;for(let n of [1,2])if(today>=s['sem'+n+'start']&&today<=s['sem'+n+'end'])return n;return [1,2].find(n=>s['sem'+n+'start']>=today)||2}
function schoolDays(start,end){if(!start||!end||start>end)return 0;let excluded=new Set(data.settings.holidays.split(/[\s,]+/));let n=0;for(let d=start;d<=end;d=add(d,1)){let w=date(d).getDay();if(w!==0&&w!==6&&!excluded.has(d))n++}return n}
function dday(s){let n=diff(s,today);return n===0?'D-Day':n>0?'D-'+n:'D+'+Math.abs(n)}
function eventList(events){return events.length?events.map(e=>`<div class="item"><div class="dday">${e.start<today&&e.end>=today?'진행 중':dday(e.start)}</div><div class="grow"><b>${esc(e.title)}</b><div class="muted"><small>${e.start} ~ ${e.end}${e.source==='weekly'?' · 주간계획':''}</small></div>${e.memo?`<small>${esc(e.memo)}</small>`:''}</div><span class="badge">${esc(e.category==='학교 행사'?'행사':e.category)}</span></div>`).join(''):empty('등록된 일정이 없습니다.')}
function taskList(tasks){return tasks.length?tasks.map(t=>`<div class="item"><input type="checkbox" aria-label="${esc(t.title)} 완료" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow"><b style="${t.done?'text-decoration:line-through;color:#8b9891':''}">${esc(t.title)}</b><div><small>${esc(t.category)} · ${esc(t.priority)} · 마감 ${t.due}</small></div></div><span class="badge">${t.done?'완료':diff(t.due,today)<0?'기한 지남 '+Math.abs(diff(t.due,today))+'일':dday(t.due)}</span><button class="delete" onclick="removeTask('${t.id}')" aria-label="업무 삭제">삭제</button></div>`).join(''):empty('해당하는 업무가 없습니다.')}
function dueWeek(w){return data.tasks.filter(t=>!t.done&&t.due<=add(w,6)).sort((a,b)=>a.due.localeCompare(b.due))}
function todayView(){let s=data.settings,n=sem(),end=s['sem'+n+'end'];return heading('오늘도, 차근차근 ☀',new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(now))+`<div class="grid"><div><section class="card"><h3>오늘의 일정</h3>${eventList(data.events.filter(e=>e.start<=today&&e.end>=today))}</section><section class="card"><div class="row between"><h3>다가오는 주요 일정</h3><span class="badge">${n}학기 · ${end}까지</span></div>${eventList(data.events.filter(e=>e.end>=today&&e.start<=end&&e.end>=s['sem'+n+'start']).sort((a,b)=>a.start.localeCompare(b.start)))}</section></div><div><section class="card"><h3>수업일수 현황</h3>${[1,2].map(i=>{let a=s['sem'+i+'start'],b=s['sem'+i+'end'],total=schoolDays(a,b),passed=today<a?0:schoolDays(a,today>b?b:today),rate=total?Math.round(passed/total*100):0;return `<div style="margin-bottom:24px"><div class="row between"><b>${i}학기</b><small>${a} ~ ${b}</small></div><div class="progress"><span style="width:${rate}%"></span></div><div class="row between"><span><strong class="stat">${passed}</strong> / ${total}일</span><span>${rate}% 진행</span></div></div>`}).join('')}<small>오늘 포함 · 토·일요일 및 설정한 휴업일 제외</small></section><section class="card"><h3>이번 주까지 할 일</h3>${taskList(dueWeek(monday(today)))}</section></div></div>`}
function moveMonth(n){let d=date(month+'-01');d.setMonth(d.getMonth()+n);month=iso(d).slice(0,7);render()}
function calendarView(){let first=month+'-01',start=add(first,-date(first).getDay());return heading('학사일정','학교의 중요한 일정을 달력에 모아보세요.')+`<div class="grid"><section class="card"><div class="row between"><button onclick="moveMonth(-1)">‹ 이전 달</button><h3 style="margin:0">${month.replace('-','년 ')}월</h3><button onclick="moveMonth(1)">다음 달 ›</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{let d=add(start,i);return `<div class="day ${d.slice(0,7)!==month?'dim':''} ${d===today?'today':''}"><button style="border:0;padding:2px;background:transparent" onclick="openEvent('${d}')" aria-label="${d} 일정 추가">${Number(d.slice(8))}</button>${data.events.filter(e=>e.start<=d&&e.end>=d).map(e=>`<button class="event" onclick="editEvent('${e.id}')">${esc(e.title)}</button>`).join('')}</div>`}).join('')}</div></section><aside class="card"><h3>일정 관리</h3><p class="muted">일정 추가 버튼이나 달력의 날짜를 눌러 등록하세요. 행사를 누르면 수정할 수 있습니다.</p><button class="primary" onclick="openEvent('${today}')">+ 일정 추가</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>이번 달 일정</h3>${eventList(data.events.filter(e=>e.start<=add(month+'-01',new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()-1)&&e.end>=first).sort((a,b)=>a.start.localeCompare(b.start)))}</aside></div>`}
function openEvent(d){$('#eventForm').reset();$('#eventForm').elements.id.value='';$('#eventForm').elements.start.value=d;$('#eventForm').elements.end.value=d;$('#dialogTitle').textContent='일정 추가';$('#eventDelete').hidden=true;eventDialog.showModal()}
function editEvent(id){let e=data.events.find(e=>e.id===id);openEvent(e.start);for(let k of ['id','title','start','end','category','memo'])$('#eventForm').elements[k].value=e[k]||'';$('#dialogTitle').textContent='일정 수정';$('#eventDelete').hidden=false}
$('#eventForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.end<v.start)return alert('종료일은 시작일 이후로 선택해 주세요.');let old=data.events.find(x=>x.id===v.id);v.id=v.id||crypto.randomUUID();if(old){v.source=old.source;v.week=old.week;Object.assign(old,v)}else data.events.push(v);save();eventDialog.close();render()};
function deleteEvent(){let id=$('#eventForm').elements.id.value;if(confirm('이 일정을 삭제할까요?')){data.events=data.events.filter(e=>e.id!==id);save();eventDialog.close();render()}}
function weeklyView(){let w=data.weeks[week]||{};return heading('주간계획','개인 일정을 정리하고, 이번 주의 흐름을 만들어 보세요.')+`<div class="row between card"><button onclick="week=add(week,-7);render()">‹ 이전 주</button><b>${week} ~ ${add(week,4)}</b><div class="row"><button onclick="week=monday(today);render()">이번 주</button><button onclick="week=add(week,7);render()">다음 주 ›</button></div></div><div class="week">${['월','화','수','목','금'].map((name,i)=>{let d=add(week,i);return `<section class="card"><h3>${name} <small>${fmt(d)}</small></h3>${data.events.filter(e=>e.start<=d&&e.end>=d).map(e=>`<button class="event" onclick="editEvent('${e.id}')">${esc(e.title)} · ${esc(e.category)}</button>`).join('')}<textarea aria-label="${d} 개인 계획" placeholder="개인별 계획을 자유롭게 입력하세요" onchange="setWeek('day${i}',this.value)">${esc(w['day'+i]||'')}</textarea><button style="width:100%;margin-top:10px" onclick="openWeeklyEvent('${d}')">+ 일정 등록</button></section>`}).join('')}</div><div class="grid"><section class="card"><h3>이번 주 목표</h3><textarea placeholder="이번 주 꼭 이루고 싶은 목표" onchange="setWeek('goal',this.value)">${esc(w.goal||'')}</textarea><h3 style="margin-top:25px">메모 · 전달</h3><textarea placeholder="기억할 내용과 전달 사항" onchange="setWeek('memo',this.value)">${esc(w.memo||'')}</textarea><small>개인 계획·목표·메모는 입력 후 다른 곳을 누르면 자동 저장됩니다.<br>‘일정 등록’으로 추가하면 학사일정과 오늘 탭에도 표시됩니다.</small></section><section class="card"><h3>이 주까지 마감 업무</h3>${taskList(dueWeek(week))}<small>이전 미완료 업무와 이번 주 일요일까지의 업무가 표시됩니다.</small></section></div>`}
function setWeek(k,v){data.weeks[week]??={};data.weeks[week][k]=v;save()}
function openWeeklyEvent(d){openEvent(d);let f=$('#eventForm');let original=f.onsubmit;f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));if(v.end<v.start)return alert('종료일을 확인해 주세요.');v.id=crypto.randomUUID();v.source='weekly';v.week=week;data.events.push(v);save();eventDialog.close();f.onsubmit=original;render()};eventDialog.addEventListener('close',()=>{f.onsubmit=original},{once:true})}
function tasksView(){return heading('업무 할 일','할 일을 내려놓고, 중요한 업무부터 하나씩 완료하세요.')+`<section class="card"><h3>새 업무 추가</h3><form onsubmit="addTask(event)"><div class="formgrid"><label>업무 내용<input name="title" required placeholder="예: 학급 교육과정 운영 계획 제출"></label><label>마감일<input type="date" name="due" required value="${today}"></label><label>중요도<select name="priority"><option>보통</option><option>높음</option><option>낮음</option></select></label><label>분류<select name="category">${['공문','수업','평가','학급업무','행사','기타'].map(x=>`<option>${x}</option>`).join('')}</select></label></div><button class="primary">+ 업무 추가</button></form></section><section class="card"><div class="tabs">${['진행중','완료','전체'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x} ${data.tasks.filter(t=>x==='전체'||(x==='완료'?t.done:!t.done)).length}</button>`).join('')}</div>${taskList(data.tasks.filter(t=>filter==='전체'||(filter==='완료'?t.done:!t.done)).sort((a,b)=>a.due.localeCompare(b.due)))}</section>`}
function addTask(e){e.preventDefault();data.tasks.push({...Object.fromEntries(new FormData(e.target)),id:crypto.randomUUID(),done:false});save();render()}function toggleTask(id){let t=data.tasks.find(t=>t.id===id);t.done=!t.done;save();render()}function removeTask(id){if(confirm('이 업무를 삭제할까요?')){data.tasks=data.tasks.filter(t=>t.id!==id);save();render()}}
function settingsView(){let s=data.settings;return heading('학기 설정','학교 정보와 실제 학기 기간을 설정해 주세요.')+`<section class="card"><form onsubmit="saveSettings(event)"><div class="formgrid"><label>학교 이름<input name="school" value="${esc(s.school)}" required></label><label>학년도<input type="number" name="year" value="${s.year}" min="2000" max="2100" required></label>${[1,2].map(n=>`<label>${n}학기 시작일<input name="sem${n}start" type="date" value="${s['sem'+n+'start']}" required></label><label>${n}학기 종료일<input name="sem${n}end" type="date" value="${s['sem'+n+'end']}" required></label>`).join('')}</div><label>수업에서 제외할 날짜 (공휴일 · 재량휴업일 · 방학 등)<textarea name="holidays" placeholder="2026-05-05&#10;2026-05-25">${esc(s.holidays)}</textarea></label><p class="muted">YYYY-MM-DD 형식으로 한 줄에 하나씩 입력하세요. 토요일·일요일은 자동 제외됩니다. 공휴일은 직접 입력해야 하며, 학기 중 방학이 포함되면 해당 날짜도 입력해 주세요.</p><button class="primary">설정 저장</button></form></section>`}
function saveSettings(e){e.preventDefault();let s=Object.fromEntries(new FormData(e.target));if(s.sem1start>s.sem1end||s.sem2start>s.sem2end||s.sem1end>=s.sem2start)return alert('학기 시작·종료일을 확인해 주세요. 2학기는 1학기 종료 후 시작해야 합니다.');let days=s.holidays.trim().split(/[\s,]+/).filter(Boolean);if(days.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x)||isNaN(date(x))||iso(date(x))!==x))return alert('휴업일 날짜 형식을 확인해 주세요. 예: 2026-05-05');data.settings=s;save();render();alert('학기 설정을 저장했습니다.')}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='교무수첩_백업_'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreFile(input){try{let v=JSON.parse(await input.files[0].text());if(!v.settings||!Array.isArray(v.events)||!Array.isArray(v.tasks)||!v.weeks||typeof v.weeks!=='object')throw Error();for(let k of Object.keys(initial.settings))if(!(k in v.settings))throw Error();if(v.events.some(e=>!e.id||!e.title||!/^\d{4}-\d{2}-\d{2}$/.test(e.start)||!/^\d{4}-\d{2}-\d{2}$/.test(e.end)))throw Error();if(v.tasks.some(t=>!t.id||!t.title||!/^\d{4}-\d{2}-\d{2}$/.test(t.due)))throw Error();if(confirm('현재 내용을 백업 파일의 내용으로 바꿀까요?')){data=v;save();render()}}catch{alert('올바른 교무수첩 백업 파일을 선택해 주세요.')}input.value=''}
render();
</script><script src="enhancements.js"></script></body></html>
