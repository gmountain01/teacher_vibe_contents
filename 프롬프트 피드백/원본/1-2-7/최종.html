<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한 권 읽기 독서일지</title>
  <style>
    :root { color-scheme: light; font-family: "맑은 고딕", "Apple SD Gothic Neo", sans-serif; color: #293a32; background: #f5f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 52px 20px 70px; }
    main { max-width: 800px; margin: auto; }
    header { margin-bottom: 28px; }
    .eyebrow { margin: 0 0 10px; color: #66786b; font-size: 14px; letter-spacing: .1em; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.06em; }
    header > p:last-child { margin: 0; color: #6c746e; line-height: 1.7; }
    .paper { padding: 30px; border: 1px solid #e0e4da; border-radius: 18px; background: #fffefb; box-shadow: 0 8px 30px #26392b06; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; border: 1px solid #d7ddd4; border-radius: 9px; background: #fff; padding: 12px 14px; color: #293a32; line-height: 1.6; }
    input:focus, textarea:focus { outline: 3px solid #dbe8dc; border-color: #648369; }
    textarea { min-height: 106px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #969c95; }
    .book { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #e7e9e1; }
    #book-title { font-size: 19px; font-weight: 600; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field { margin-bottom: 22px; }
    button { display: block; margin-left: auto; border: 0; border-radius: 9px; padding: 13px 27px; background: #3e644f; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #31533f; }
    button:focus-visible { outline: 3px solid #8eac91; outline-offset: 3px; }
    .records { margin-top: 38px; }
    .file-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .file-actions button { width: auto; margin: 0; padding: 10px 16px; border: 1px solid #d7ddd4; background: #fffefb; color: #3e644f; font-size: 14px; }
    .file-actions button:hover { background: #eaf0e7; }
    #file-status { margin: 0 0 16px; color: #657568; font-size: 14px; line-height: 1.7; }
    h2 { margin: 0 0 17px; font-size: 21px; letter-spacing: -.04em; }
    #empty { margin: 0; padding: 30px 18px; text-align: center; color: #7d867d; border: 1px dashed #cfd7ca; border-radius: 12px; line-height: 1.8; }
    #record-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
    .record { background: #fffefb; border: 1px solid #e0e4da; border-radius: 14px; padding: 25px; overflow-wrap: anywhere; }
    .record-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: #657568; font-size: 14px; padding-bottom: 15px; border-bottom: 1px solid #e9ece4; }
    .record h3 { margin: 19px 0 8px; font-size: 14px; }
    .record p { margin: 0; white-space: pre-wrap; line-height: 1.85; }
    .record .quote { padding-left: 14px; border-left: 3px solid #b9ccb5; }
    .record .delete-button { width: auto; margin-top: 20px; padding: 8px 15px; border: 1px solid #d7ddd4; background: transparent; color: #657568; font-size: 14px; }
    .record .delete-button:hover { background: #f5f3ed; color: #293a32; }
    footer { margin-top: 30px; text-align: center; color: #7d867d; font-size: 13px; }
    @media (max-width: 520px) { body { padding: 30px 16px 45px; } .paper { padding: 22px 18px; } .row { grid-template-columns: 1fr; gap: 0; } button { width: 100%; } .record { padding: 21px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">읽고, 남기고, 생각하기</p>
      <h1>한 권 읽기 독서일지</h1>
      <p>오늘 읽은 책 속 문장과 나의 생각을 차곡차곡 남겨 보세요.</p>
    </header>
    <form id="reading-form" class="paper">
      <div class="book">
        <label for="book-title">책 제목</label>
        <input id="book-title" type="text" placeholder="읽고 있는 책 제목을 적어 주세요" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="reading-date">날짜</label>
          <input id="reading-date" type="date" lang="ko" required>
        </div>
        <div class="field">
          <label for="pages">읽은 쪽</label>
          <input id="pages" type="text" placeholder="예: 1~25쪽" required>
        </div>
      </div>
      <div class="field">
        <label for="sentence">기억에 남는 문장</label>
        <textarea id="sentence" placeholder="마음에 남은 문장을 옮겨 적어 보세요" required></textarea>
      </div>
      <div class="field">
        <label for="thoughts">내 생각</label>
        <textarea id="thoughts" placeholder="책을 읽으며 어떤 생각이 들었나요?" required></textarea>
      </div>
      <button type="submit">기록 추가</button>
    </form>
    <section class="records" aria-labelledby="records-heading">
      <h2 id="records-heading">쌓이는 독서 기록</h2>
      <div class="file-actions">
        <button id="download-records" type="button">기록 파일 내려받기</button>
        <button id="import-records" type="button">기록 파일 불러오기</button>
        <input id="record-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="file-status" role="status">불러온 기록은 기존 기록 뒤에 추가됩니다.</p>
      <p id="empty">아직 기록이 없어요.<br>첫 번째 독서 기록을 남겨 보세요.</p>
      <ol id="record-list" aria-live="polite" aria-relevant="additions removals"></ol>
    </section>
    <footer>이 컴퓨터에만 저장됩니다</footer>
  </main>
  <script>
    const form = document.getElementById('reading-form');
    const book = document.getElementById('book-title');
    const date = document.getElementById('reading-date');
    const pages = document.getElementById('pages');
    const sentence = document.getElementById('sentence');
    const thoughts = document.getElementById('thoughts');
    const today = new Date();
    date.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    const storageKey = 'one-book-reading-journal-v1';
    let records = [];
    function save(nextRecords = records) {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ bookTitle: book.value, records: nextRecords }));
        return true;
      } catch {
        alert('이 컴퓨터에 저장하지 못했어요. 브라우저의 저장 공간 설정을 확인해 주세요.');
        return false;
      }
    }
    function renderRecord(record) {
      const item = document.createElement('li');
      item.className = 'record';
      const meta = document.createElement('div');
      meta.className = 'record-meta';
      const [year, month, day] = record.date.split('-');
      for (const text of [record.bookTitle, `${year}년 ${Number(month)}월 ${Number(day)}일`, record.pages]) {
        const span = document.createElement('span');
        span.textContent = text;
        meta.append(span);
      }
      item.append(meta);
      for (const [title, content, className] of [
        ['기억에 남는 문장', record.sentence, 'quote'],
        ['내 생각', record.thoughts, 'thought']
      ]) {
        const heading = document.createElement('h3');
        heading.textContent = title;
        const paragraph = document.createElement('p');
        paragraph.className = className;
        paragraph.textContent = content;
        item.append(heading, paragraph);
      }
      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '지우기';
      deleteButton.addEventListener('click', () => {
        const nextRecords = records.filter(entry => entry !== record);
        if (!save(nextRecords)) return;
        records = nextRecords;
        const nextFocus = item.nextElementSibling?.querySelector('button') ||
          item.previousElementSibling?.querySelector('button');
        item.remove();
        document.getElementById('empty').hidden = records.length > 0;
        (nextFocus || pages).focus();
      });
      item.append(deleteButton);
      document.getElementById('record-list').append(item);
      document.getElementById('empty').hidden = true;
    }
    try {
      const stored = JSON.parse(localStorage.getItem(storageKey) || 'null');
      if (stored && typeof stored.bookTitle === 'string' && Array.isArray(stored.records)) {
        book.value = stored.bookTitle;
        records = stored.records.filter(record => record &&
          ['bookTitle', 'date', 'pages', 'sentence', 'thoughts'].every(key => typeof record[key] === 'string'));
        records.forEach(renderRecord);
      }
    } catch {
      alert('저장된 기록을 불러오지 못했어요. 브라우저의 저장 공간 설정을 확인해 주세요.');
    }
    book.addEventListener('change', () => save());
    const fileInput = document.getElementById('record-file');
    const fileStatus = document.getElementById('file-status');
    document.getElementById('download-records').addEventListener('click', () => {
      const data = { format: 'one-book-reading-journal', version: 1, bookTitle: book.value, records };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '한 권 읽기 독서일지.json';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      fileStatus.textContent = '기록 파일 내려받기를 요청했어요.';
    });
    document.getElementById('import-records').addEventListener('click', () => fileInput.click());
    function isValidFileRecord(record) {
      if (!record || !['bookTitle', 'date', 'pages', 'sentence', 'thoughts'].every(key =>
        typeof record[key] === 'string' && record[key].trim().length > 0)) return false;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(record.date)) return false;
      const parsed = new Date(record.date + 'T00:00:00Z');
      return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === record.date;
    }
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        const data = JSON.parse((await file.text()).replace(/^\uFEFF/, ''));
        if (!data || data.format !== 'one-book-reading-journal' || data.version !== 1 ||
            typeof data.bookTitle !== 'string' || !Array.isArray(data.records) ||
            !data.records.every(isValidFileRecord)) {
          throw new Error('invalid-file');
        }
        const imported = data.records.map(record => ({
          bookTitle: record.bookTitle, date: record.date, pages: record.pages,
          sentence: record.sentence, thoughts: record.thoughts
        }));
        const nextRecords = [...records, ...imported];
        const previousTitle = book.value;
        if (!book.value.trim()) book.value = data.bookTitle;
        if (!save(nextRecords)) {
          book.value = previousTitle;
          fileStatus.textContent = '저장하지 못해 기록을 불러오지 않았어요.';
          return;
        }
        records = nextRecords;
        imported.forEach(renderRecord);
        fileStatus.textContent = `${imported.length}개의 기록을 불러왔어요.`;
      } catch {
        fileStatus.textContent = '파일을 불러오지 못했어요. 이 페이지에서 내려받은 기록 파일인지 확인해 주세요.';
      } finally {
        fileInput.value = '';
      }
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      for (const field of [book, pages, sentence, thoughts]) {
        if (!field.value.trim()) {
          field.setCustomValidity('내용을 적어 주세요.');
          field.reportValidity();
          return;
        }
      }
      const record = {
        bookTitle: book.value.trim(), date: date.value, pages: pages.value.trim(),
        sentence: sentence.value.trim(), thoughts: thoughts.value.trim()
      };
      const nextRecords = [...records, record];
      if (!save(nextRecords)) return;
      records = nextRecords;
      renderRecord(record);
      pages.value = '';
      sentence.value = '';
      thoughts.value = '';
      pages.focus();
    });
    form.addEventListener('input', (event) => event.target.setCustomValidity(''));
  </script>
</body>
</html>
