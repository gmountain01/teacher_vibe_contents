            "text": "하나의 유물만 있으면 모든 사람의 생활을 확정할 수 있기 때문이다.",
            "correct": false,
            "explanation": "하나의 사례를 모든 사람에게 일반화할 수 없습니다."
          },
          {
            "text": "후대의 생활 모습이 구석기 시대에도 그대로 있었기 때문이다.",
            "correct": false,
            "explanation": "각 시대의 기술과 생활을 구분해야 합니다."
          }
        ],
        "point": "역사 해석에서는 확인한 증거와 추론을 구분해야 한다."
      }
    ]
  }
],
  neolithic:[
    {title:'농사의 시작', investigations:[{title:'씨앗을 심다'},{title:'간석기의 발견'},{title:'가축과 함께'}]},
    {title:'마을의 탄생', investigations:[{title:'움집을 찾아서'},{title:'빗살무늬 토기'},{title:'옷을 만드는 도구'}]},
    {title:'자연과 함께', investigations:[{title:'자연에 깃든 영혼'},{title:'동물과 조상'},{title:'신석기 마을의 하루'}]}
  ],
  bronze:[
    {title:'발달하는 농경', investigations:[{title:'벼농사의 흔적'},{title:'반달 돌칼'},{title:'늘어난 생산물'}]},
    {title:'달라지는 사회', investigations:[{title:'청동검의 주인'},{title:'계급의 등장'},{title:'마을을 이끄는 사람'}]},
    {title:'고인돌의 비밀', investigations:[{title:'거대한 돌무덤'},{title:'함께 나온 유물'},{title:'선사 시대 탐사 기록'}]}
  ]
};
</script>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#22372f;background:#f3f5ed}*{box-sizing:border-box}body{margin:0}header{background:#173e35;color:white;padding:22px max(6vw,20px);display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:clamp(18px,3vw,25px)}main{max-width:1120px;margin:auto;padding:36px 22px 70px}button{font:inherit;font-weight:750;min-height:52px;padding:13px 23px;border:0;border-radius:13px;cursor:pointer;background:#24644e;color:white}button:hover:not(:disabled){background:#174a39}button:focus-visible{outline:4px solid #df9b25;outline-offset:4px}button:disabled{background:#e2e6df;color:#68756e;cursor:not-allowed}.secondary{background:#e6ede7;color:#244b3d}.eyebrow{color:#687a58;font-weight:800;letter-spacing:2px;font-size:13px}h1{font-size:clamp(32px,6vw,54px);line-height:1.15;margin:15px 0}h2{font-size:28px}p{line-height:1.8}.hero{padding:18px 0 38px;max-width:750px}.hero p{color:#58675f;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card,.panel{background:white;border:1px solid #dce3d6;border-radius:22px;padding:26px;box-shadow:0 8px 24px #24372b06}.card{display:flex;flex-direction:column;gap:12px}.card h2,.card h3,.card p{margin:0}.icon{font-size:38px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.tag{background:#edf2e7;border-radius:8px;padding:6px 9px;font-size:14px}.card button{margin-top:auto;width:100%}.progress{font-weight:750;color:#40614c}.muted{color:#69766d}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.badge{font-size:13px;font-weight:800;color:#64775c}.panel{max-width:760px;margin:auto}.panel h2{margin-top:12px}.choices{display:grid;gap:12px;margin:24px 0}.choices button{text-align:left;background:#edf2e8;color:#253f32}.choices button:disabled{opacity:.7}.feedback{padding:16px;background:#f0f4e9;border-radius:12px;line-height:1.7;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.notice{padding:16px 20px;background:#e8eddf;border-radius:12px;margin:24px 0;line-height:1.7}progress{width:100%;height:10px;accent-color:#397b53}footer{text-align:center;color:#6c786a;font-size:13px;padding:24px}header button{min-height:46px;background:#ffffff18} @media(max-width:800px){.grid{grid-template-columns:1fr}.card{padding:24px}.hero{padding-top:0}.topline{align-items:flex-start}header{padding:16px}main{padding:26px 16px 48px}button{min-height:56px}.panel{padding:23px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;background:#e5eddf;padding:20px;border-radius:18px;margin-bottom:24px;line-height:1.8}.stats strong{font-size:23px}.learning{font-size:clamp(23px,4vw,31px);font-weight:800;line-height:1.6}.report li{padding:8px 0 16px}.report p{font-size:20px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}} </style>
</head>
<body>
<header><strong>🧭 시간탐사대: 선사시대</strong><button onclick="home()" aria-label="홈 화면으로">홈</button></header>
<main id="app"></main>
<footer>시간의 흔적을 조사하고, 선사 시대의 생활을 발견해 보세요.</footer>
<script>
let record={};
try{record=JSON.parse(localStorage.getItem('prehistoric-expedition-v2'))||{};}catch(e){}
const app=document.getElementById('app');
let currentAge=0,currentStage=0,currentInvestigation=0;
function done(a,s,i){return record[`${a}-${s}-${i}`]===true;}
function stageDone(a,s){return stages[age[a].id][s].investigations.every((_,i)=>done(a,s,i));}
function ageDone(a){return stages[age[a].id].every((_,s)=>stageDone(a,s));}
function ageOpen(a){return a===0||ageDone(a-1);}
function stageOpen(a,s){return ageOpen(a)&&(s===0||stageDone(a,s-1));}
function save(){try{localStorage.setItem('prehistoric-expedition-v2',JSON.stringify(record));}catch(e){}}
function home(){
 app.innerHTML=`<section class="hero"><span class="eyebrow">PREHISTORY EXPEDITION</span><h1>시간탐사대: 선사시대</h1><p>돌 도구 하나에도 옛사람들의 이야기가 숨어 있어요.<br>구석기부터 청동기까지, 시간의 흔적을 따라 탐사를 떠나요.</p><button onclick="start()">탐사 시작하기 →</button></section><div class="grid">${age.map((a,n)=>`<section class="card"><span class="icon" aria-hidden="true">${a.icon}</span><span class="badge">${ageOpen(n)?'탐사 가능':'🔒 잠긴 시대'}</span><h2>${a.name}</h2><p>${a.intro}</p><div class="tags">${a.keywords.map(k=>`<span class="tag">${k}</span>`).join('')}</div><p class="progress">${stages[a.id].filter((_,s)=>stageDone(n,s)).length} / 3 스테이지 완료</p><button ${ageOpen(n)?'':'disabled'} onclick="showAge(${n})">${ageOpen(n)?'시대 탐사하기':age[n-1].name+' 완료 후 열림'}</button></section>`).join('')}</div><p class="muted">각 시대는 3개 스테이지, 각 스테이지는 3개 조사로 구성됩니다. 앞선 탐사를 마치면 다음 탐사가 열립니다.</p>`;
}
function start(){let a=age.findIndex((_,n)=>!ageDone(n));showAge(a<0?0:a);}
function showAge(a){if(!ageOpen(a))return;currentAge=a;app.innerHTML=`<div class="topline"><div><span class="eyebrow">${age[a].icon} 시대 탐사</span><h1>${age[a].name}</h1><p class="muted">${age[a].intro}</p></div><button class="secondary" onclick="home()">← 홈</button></div><div class="grid">${stages[age[a].id].map((s,n)=>`<section class="card"><span class="badge">STAGE ${n+1} ${stageDone(a,n)?'✓ 완료':''}</span><h2>${s.title}</h2><p class="progress">${s.investigations.filter((_,i)=>done(a,n,i)).length} / 3 조사 완료</p><ol>${s.investigations.map(i=>`<li><p>${i.title}</p></li>`).join('')}</ol><button ${stageOpen(a,n)?'':'disabled'} onclick="openStage(${a},${n})">${stageDone(a,n)?'다시 탐사':stageOpen(a,n)?'시작':'🔒 이전 스테이지 완료 후 시작'}</button></section>`).join('')}</div>`;}
function openStage(a,s){if(!stageOpen(a,s))return;currentAge=a;currentStage=s;let next=stages[age[a].id][s].investigations.findIndex((_,i)=>!done(a,s,i));showInvestigation(next<0?0:next);}

let phase='action';
function itemNow(){return stages[age[currentAge].id][currentStage].investigations[currentInvestigation];}
function countDone(){return age.reduce((sum,a,n)=>sum+stages[a.id].reduce((v,s,k)=>v+s.investigations.filter((_,i)=>done(n,k,i)).length,0),0);}
function dashboard(){let n=countDone(),v=Math.min(100,70+n);return '<div class="stats"><div>식량 <strong>'+v+'</strong><progress value="'+v+'" max="100" aria-label="식량"></progress></div><div>공동체 <strong>'+v+'</strong><progress value="'+v+'" max="100" aria-label="공동체"></progress></div><div>역사 증거 점수<br><strong>'+n*30+'</strong></div><div>조사 진행<br><strong>'+(currentInvestigation+1)+' / 3</strong></div></div>';}
function showInvestigation(i){currentInvestigation=i;phase='action';renderInvestigation();window.scrollTo(0,0);}
function renderInvestigation(){let a=currentAge,s=currentStage,stage=stages[age[a].id][s],item=itemNow();app.innerHTML='<div class="topline"><div><span class="eyebrow">'+age[a].name+' · STAGE '+(s+1)+'</span><h2>'+stage.title+'</h2><p>목표: '+(stage.goal||'조사 자료 준비 중')+'</p></div><button class="secondary" onclick="showAge('+a+')">← 스테이지 목록</button></div>'+dashboard()+'<section class="panel"><span class="eyebrow">조사 '+(currentInvestigation+1)+'</span><h2>'+item.title+'</h2>'+(item.situation?'<p>'+item.situation+'</p><div id="interaction" aria-live="polite"></div>':'<div class="notice">이 조사는 제목만 준비되어 있습니다.</div>')+'</section>';if(item.situation)renderChoices();}
function renderChoices(){let item=itemNow(),r=phase==='reason';document.getElementById('interaction').innerHTML='<h3>'+(r?'왜 그 선택이 맞을까요?':'어떻게 행동할까요?')+'</h3>'+(r?'<p class="progress">✓ 가능한 선택을 찾았습니다. 근거를 골라 보세요.</p>':'')+'<div class="choices">'+(r?item.reasons:item.actions).map((c,n)=>'<button onclick="choose('+n+')"><strong>'+(r?n+1:['A','B','C'][n])+'</strong> · '+c.text+'</button>').join('')+'</div>';}
function choose(n){if(phase==='complete')return;let item=itemNow(),r=phase==='reason',c=(r?item.reasons:item.actions)[n];if(r?c.correct:c.type==='가능한 선택'){if(r)completeInvestigation();else{phase='reason';renderChoices();}return;}document.getElementById('interaction').innerHTML='<div class="feedback" role="status"><h3>'+(r?'근거를 다시 살펴보세요':c.type==='시대착오'?'시대착오 발견':'근거가 부족합니다')+'</h3><p>'+c.explanation+'</p><button onclick="renderChoices()">다시 선택</button></div>';}
function completeInvestigation(){let already=done(currentAge,currentStage,currentInvestigation);record[currentAge+'-'+currentStage+'-'+currentInvestigation]=true;save();phase='complete';renderInvestigation();document.getElementById('interaction').innerHTML='<div class="feedback"><span class="badge">조사 완료</span><p class="learning">'+itemNow().point+'</p><p>'+(already?'이미 완료한 조사입니다. 점수는 중복 지급되지 않습니다.':'역사 증거 +30 · 식량 +1 · 공동체 +1')+'</p></div><button onclick="'+(currentInvestigation<2?'showInvestigation('+(currentInvestigation+1)+')':'showReport()')+'">'+(currentInvestigation<2?'다음 조사 →':'조사 보고서 보기 →')+'</button>';}
function showReport(){let a=currentAge,s=currentStage,stage=stages[age[a].id][s];if(!stageDone(a,s))return;app.innerHTML='<section class="panel"><span class="eyebrow">'+age[a].name+' · STAGE '+(s+1)+' · '+stage.title+'</span><h1>조사 보고서 완성</h1><ol class="report">'+stage.investigations.map(i=>'<li><h3>'+i.title+'</h3><p>'+i.point+'</p></li>').join('')+'</ol><p class="progress">3 / 3 조사 완료 · 역사 증거 총 '+countDone()*30+'점</p><button onclick="showAge('+a+')">스테이지 목록으로 →</button></section>';window.scrollTo(0,0);}
home();
</script>
</body>
</html>
