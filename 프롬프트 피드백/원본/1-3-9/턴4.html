<script>
let record={};
try{record=JSON.parse(localStorage.getItem('prehistoric-expedition-v2'))||{};}catch(e){}
const app=document.getElementById('app');
let currentAge=0,currentStage=0,currentInvestigation=0;
function done(a,s,i){return record[`${a}-${s}-${i}`]===true;}
function stageDone(a,s){return stages[age[a].id][s].investigations.every((_,i)=>done(a,s,i));}
function ageDone(a){return stages[age[a].id].every((_,s)=>stageDone(a,s));}

function stageOpen(a,s){return ageOpen(a)&&(s===0||stageDone(a,s-1));}
function save(){try{localStorage.setItem('prehistoric-expedition-v2',JSON.stringify(record));}catch(e){}}
function home(){
 app.innerHTML=`<section class="hero"><span class="eyebrow">PREHISTORY EXPEDITION</span><h1>시간탐사대: 선사시대</h1><p>돌 도구 하나에도 옛사람들의 이야기가 숨어 있어요.<br>구석기부터 청동기까지, 시간의 흔적을 따라 탐사를 떠나요.</p><button onclick="start()">탐사 시작하기 →</button></section><div class="grid">${age.map((a,n)=>`<section class="card"><span class="icon" aria-hidden="true">${a.icon}</span><span class="badge">${ageOpen(n)?'탐사 가능':'🔒 잠긴 시대'}</span><h2>${a.name}</h2><p>${a.intro}</p><div class="tags">${a.keywords.map(k=>`<span class="tag">${k}</span>`).join('')}</div><p class="progress">${stages[a.id].filter((_,s)=>stageDone(n,s)).length} / 3 스테이지 완료</p><button ${ageOpen(n)?'':'disabled'} onclick="showAge(${n})">${ageOpen(n)?'시대 탐사하기':age[n-1].name+' 완료 후 열림'}</button></section>`).join('')}</div><p class="muted">각 시대는 3개 스테이지, 각 스테이지는 3개 조사로 구성됩니다. 앞선 탐사를 마치면 다음 탐사가 열립니다.</p>`;

function openStage(a,s){if(!stageOpen(a,s))return;currentAge=a;currentStage=s;let next=stages[age[a].id][s].investigations.findIndex((_,i)=>!done(a,s,i));showInvestigation(next<0?0:next);}

let phase='action';
function itemNow(){return stages[age[currentAge].id][currentStage].investigations[currentInvestigation];}
function countDone(){return age.reduce((sum,a,n)=>sum+stages[a.id].reduce((v,s,k)=>v+s.investigations.filter((_,i)=>done(n,k,i)).length,0),0);}
function dashboard(){let n=countDone(),v=Math.min(100,70+n);return '<div class="stats"><div>식량 <strong>'+v+'</strong><progress value="'+v+'" max="100" aria-label="식량"></progress></div><div>공동체 <strong>'+v+'</strong><progress value="'+v+'" max="100" aria-label="공동체"></progress></div><div>역사 증거 점수<br><strong>'+n*30+'</strong></div><div>조사 진행<br><strong>'+(currentInvestigation+1)+' / 3</strong></div></div>';}
function showInvestigation(i){currentInvestigation=i;phase='action';renderInvestigation();window.scrollTo(0,0);}
function renderInvestigation(){let a=currentAge,s=currentStage,stage=stages[age[a].id][s],item=itemNow();app.innerHTML='<div class="topline"><div><span class="eyebrow">'+age[a].name+' · STAGE '+(s+1)+'</span><h2>'+stage.title+'</h2><p>목표: '+(stage.goal||'조사 자료 준비 중')+'</p></div><button class="secondary" onclick="showAge('+a+')">← 스테이지 목록</button></div>'+dashboard()+'<section class="panel"><span class="eyebrow">조사 '+(currentInvestigation+1)+'</span><h2>'+item.title+'</h2>'+(item.situation?'<p>'+item.situation+'</p><div id="interaction" aria-live="polite"></div>':'<div class="notice">이 조사는 제목만 준비되어 있습니다.</div>')+'</section>';if(item.situation)renderChoices();}
function renderChoices(){let item=itemNow(),r=phase==='reason';document.getElementById('interaction').innerHTML='<h3>'+(r?'왜 그 선택이 맞을까요?':'어떻게 행동할까요?')+'</h3>'+(r?'<p class="progress">✓ 가능한 선택을 찾았습니다. 근거를 골라 보세요.</p>':'')+'<div class="choices">'+(r?item.reasons:item.actions).map((c,n)=>'<button onclick="choose('+n+')"><strong>'+(r?n+1:['A','B','C'][n])+'</strong> · '+c.text+'</button>').join('')+'</div>';}
function choose(n){if(phase==='complete')return;let item=itemNow(),r=phase==='reason',c=(r?item.reasons:item.actions)[n];if(r?c.correct:c.type==='가능한 선택'){if(r)completeInvestigation();else{phase='reason';renderChoices();}return;}logInvestigationError();document.getElementById('interaction').innerHTML='<div class="feedback" role="status"><h3>'+(r?'근거를 다시 살펴보세요':c.type==='시대착오'?'시대착오 발견':'근거가 부족합니다')+'</h3><p>'+c.explanation+'</p><button onclick="renderChoices()">다시 선택</button></div>';}
function completeInvestigation(){let already=done(currentAge,currentStage,currentInvestigation);record[currentAge+'-'+currentStage+'-'+currentInvestigation]=true;save();phase='complete';renderInvestigation();document.getElementById('interaction').innerHTML='<div class="feedback"><span class="badge">조사 완료</span><p class="learning">'+itemNow().point+'</p><p>'+(already?'이미 완료한 조사입니다. 점수는 중복 지급되지 않습니다.':'역사 증거 +30 · 식량 +1 · 공동체 +1')+'</p></div><button onclick="'+(currentInvestigation<2?'showInvestigation('+(currentInvestigation+1)+')':'showReport()')+'">'+(currentInvestigation<2?'다음 조사 →':'조사 보고서 보기 →')+'</button>';discoverArtifacts();}
function showReport(){let a=currentAge,s=currentStage,stage=stages[age[a].id][s];if(!stageDone(a,s))return;app.innerHTML='<section class="panel"><span class="eyebrow">'+age[a].name+' · STAGE '+(s+1)+' · '+stage.title+'</span><h1>조사 보고서 완성</h1><ol class="report">'+stage.investigations.map(i=>'<li><h3>'+i.title+'</h3><p>'+i.point+'</p></li>').join('')+'</ol><p class="progress">3 / 3 조사 완료 · 역사 증거 총 '+countDone()*30+'점</p><button onclick="showAge('+a+')">스테이지 목록으로 →</button></section>';window.scrollTo(0,0);}

let museum={found:[],viewed:[],pending:[]};
try{let m=JSON.parse(localStorage.getItem('prehistoric-museum-v1'));if(m&&['found','viewed','pending'].every(k=>Array.isArray(m[k])))museum=m;}catch(e){}
let codexFilter='all',lastFocus=null;
function saveMuseum(){try{localStorage.setItem('prehistoric-museum-v1',JSON.stringify(museum));}catch(e){}}
function syncArtifacts(){age.forEach((a,n)=>stages[a.id].forEach((st,j)=>st.investigations.forEach((it,k)=>{if(done(n,j,k))(it.artifactIds||[]).forEach(id=>{if(!museum.found.includes(id)){museum.found.push(id);museum.pending.push(id);}});})));saveMuseum();}
function artImage(a){return '<figure><img class="artifact-image" src="'+a.image+'" alt="'+a.name+' 학습용 도식"><figcaption>'+a.imageLabel+'</figcaption></figure>';}
function showCodex(filter='all'){codexFilter=filter;syncArtifacts();app.innerHTML='<div class="topline"><div><span class="eyebrow">EXPEDITION COLLECTION</span><h1>탐사도감</h1><p class="progress">전체 15개 중 '+artifacts.filter(a=>museum.found.includes(a.id)).length+'개 발견</p></div><button class="secondary" onclick="home()">← 홈</button></div><div class="stats">'+age.map(a=>{let list=artifacts.filter(x=>x.age===a.id),n=list.filter(x=>museum.found.includes(x.id)).length;return '<div>'+a.name+' '+n+' / 5<progress value="'+n+'" max="5" aria-label="'+a.name+' 발견 진행"></progress></div>';}).join('')+'</div><div class="actions filters" aria-label="시대별 거르기">'+[{id:'all',name:'전체'},...age].map(a=>'<button class="'+(filter===a.id?'':'secondary')+'" aria-pressed="'+(filter===a.id)+'" onclick="showCodexByIndex('+(['all',...age.map(x=>x.id)].indexOf(a.id))+')">'+a.name+'</button>').join('')+'</div><div class="grid">'+artifacts.filter(a=>filter==='all'||a.age===filter).map(a=>{let open=museum.found.includes(a.id);return '<section class="card">'+(open?artImage(a):'<div class="locked-art" aria-label="미발견 유물">?</div>')+'<span class="badge">'+age.find(x=>x.id===a.age).name+'</span><h2>'+(open?a.name:'잠김')+'</h2>'+(open&&!museum.viewed.includes(a.id)?'<span class="new-badge">NEW</span>':'')+'<p>'+(open?a.description:'조사를 완료해 유물을 발견하세요.')+'</p><button '+(open?'onclick="openArtifact('+a.id+')"':'disabled')+'>'+(open?'카드 열기':'🔒 잠김')+'</button></section>';}).join('')+'</div><p class="muted">유물 카드는 학습 보상이며 해당 조사 장소의 출토품을 뜻하지 않습니다. 검증 자료 링크는 인터넷 연결이 필요합니다.</p>';window.scrollTo(0,0);}
function discoverArtifacts(){syncArtifacts();showNextArtifact();}
function showNextArtifact(){let id=museum.pending.find(id=>artifacts.some(a=>a.id===id));if(id!==undefined)openArtifact(id,true);}
function openArtifact(id,isNew=false){let a=artifacts.find(x=>x.id===id);if(!a||!museum.found.includes(id))return;let d=document.getElementById('artifactDialog');lastFocus=document.activeElement;if(!museum.viewed.includes(id))museum.viewed.push(id);saveMuseum();d.dataset.artifact=id;d.dataset.discovery=isNew?'yes':'no';d.innerHTML='<span class="eyebrow">'+(isNew?'새 유물 카드가 열렸습니다':'탐사도감')+'</span><h2 id="artifactHeading">'+a.name+'</h2>'+artImage(a)+'<p><strong>'+age.find(x=>x.id===a.age).name+' · '+a.kind+' · '+a.material+'</strong></p><p>'+a.description+'</p><div class="feedback"><strong>학생이 캐치해야 할 점</strong><p>'+a.catchPoint+'</p></div><div class="tags">'+a.keywords.map(k=>'<span class="tag">'+k+'</span>').join('')+'</div><p><a class="source-link" href="'+a.sourceUrl+'" target="_blank" rel="noopener noreferrer">검증 자료 열기 ↗</a></p><p class="muted">자료 확인: '+a.sourceChecked+' · 인터넷 연결 필요</p><button autofocus onclick="closeArtifact()">'+(isNew?'확인 · 다음 카드':'닫기')+'</button>';if(!d.open)d.showModal();}
function closeArtifact(){let d=document.getElementById('artifactDialog'),isNew=d.dataset.discovery==='yes';museum.pending=museum.pending.filter(id=>id!==Number(d.dataset.artifact));saveMuseum();d.close();if(app.querySelector('.filters'))showCodex(codexFilter);if(lastFocus&&lastFocus.isConnected)lastFocus.focus();if(isNew)showNextArtifact();}
document.getElementById('artifactDialog').addEventListener('cancel',e=>{e.preventDefault();closeArtifact();});
syncArtifacts();

function showCodexByIndex(n){showCodex(["all",...age.map(a=>a.id)][n]);}

let activity={stars:{},errors:{},finalAnswers:{},endingSeen:false};
try{let x=JSON.parse(localStorage.getItem('prehistoric-activities-v1'));if(x&&x.stars&&x.errors)activity={...activity,...x};}catch(e){}
let challengeTab='anachronism',challengeAge=0,chosenCards=[],puzzleId=null,puzzleSelections=[null,null,null];
function saveActivity(){try{localStorage.setItem('prehistoric-activities-v1',JSON.stringify(activity));}catch(e){}}
function awardStar(key){let fresh=!activity.stars[key];activity.stars[key]=true;saveActivity();return fresh;}
function starCount(){return Object.keys(activity.stars).length;}
function allFinished(){return age.every((_,a)=>ageDone(a));}
function refreshFinalMenu(){let b=document.getElementById('finalMenu');b.disabled=!allFinished();b.textContent=allFinished()?'최종 미션':'🔒 최종 미션';}
function logInvestigationError(){let key=currentAge+'-'+currentStage+'-'+currentInvestigation;activity.errors[key]=(activity.errors[key]||0)+1;saveActivity();}
function checkSetBonuses(){artifactSets.forEach((ids,n)=>{if(ids.every(id=>museum.found.includes(id)))awardStar('set-'+n);});}
function setBonusMarkup(){checkSetBonuses();return '<section class="notice"><h2>세트 보너스 · 도전 별 '+starCount()+'개 ⭐</h2><p>시대별 대표 유물 4개를 모두 발견하면 별 1개를 받습니다.</p><div class="grid">'+age.map((a,n)=>'<div><strong>'+a.name+' · '+artifactSets[n].filter(id=>museum.found.includes(id)).length+' / 4 '+(activity.stars['set-'+n]?'⭐ 획득':'')+'</strong><p>'+artifactSets[n].map(id=>artifacts[id].name).join(' · ')+'</p></div>').join('')+'</div></section>';}
const codexBeforeActivities=showCodex;
showCodex=function(filter='all'){codexBeforeActivities(filter);app.insertAdjacentHTML('beforeend',setBonusMarkup());};
const discoveryBeforeActivities=discoverArtifacts;
discoverArtifacts=function(){checkSetBonuses();refreshFinalMenu();discoveryBeforeActivities();checkSetBonuses();};
const nextArtifactBeforeActivities=showNextArtifact;
showNextArtifact=function(){if(museum.pending.length){nextArtifactBeforeActivities();return;}if(allFinished()&&!activity.endingSeen)showEnding();};
function showChallenges(tab=challengeTab){challengeTab=tab;syncArtifacts();checkSetBonuses();app.innerHTML='<div class="topline"><div><h1>도전 활동</h1><p class="progress">도전 별 ⭐ '+starCount()+'개</p></div><button class="secondary" onclick="home()">← 홈</button></div><div class="actions" role="tablist" aria-label="도전 종류"><button role="tab" aria-selected="'+(tab==='anachronism')+'" onclick="showChallenges(\'anachronism\')">시대착오 찾기</button><button role="tab" aria-selected="'+(tab==='puzzle')+'" onclick="showChallenges(\'puzzle\')">유물 연결 퍼즐</button></div><div id="challengeBody" role="tabpanel"></div>';if(tab==='anachronism')renderAnachronism();else renderPuzzleList();}
function selectChallengeAge(n){challengeAge=n;chosenCards=[];renderAnachronism();}
function renderAnachronism(){let a=challengeAge;document.getElementById('challengeBody').innerHTML='<h2>시대착오 찾기</h2><div class="actions">'+age.map((x,n)=>'<button '+(ageOpen(n)?'':'disabled')+' class="'+(a===n?'':'secondary')+'" aria-pressed="'+(a===n)+'" onclick="selectChallengeAge('+n+')">'+(ageOpen(n)?'':'🔒 ')+x.name+'</button>').join('')+'</div>'+(ageOpen(a)?'<p>'+age[a].name+'보다 뒤에 나타난 물건·행동을 2개 고르세요. '+(activity.stars['time-'+a]?'⭐ 완료':'')+'</p><div class="challenge-cards">'+challengeCards[a].map((c,n)=>'<button class="pick '+(chosenCards.includes(n)?'selected':'')+'" aria-pressed="'+chosenCards.includes(n)+'" onclick="toggleTimeCard('+n+')">'+c.text+'</button>').join('')+'</div><p>선택 '+chosenCards.length+' / 2</p><button '+(chosenCards.length===2?'':'disabled')+' onclick="gradeTimeCards()">선택한 2개 확인</button><div id="timeFeedback" aria-live="polite"></div>':'<p class="notice">해당 시대의 탐사를 먼저 열어 주세요.</p>');}
function toggleTimeCard(n){if(!ageOpen(challengeAge))return;let i=chosenCards.indexOf(n);if(i>=0)chosenCards.splice(i,1);else if(chosenCards.length<2)chosenCards.push(n);renderAnachronism();}
function gradeTimeCards(){if(!ageOpen(challengeAge)||chosenCards.length!==2)return;let correct=chosenCards.every(n=>challengeCards[challengeAge][n].later),fresh=correct?awardStar('time-'+challengeAge):false;document.getElementById('timeFeedback').innerHTML='<div class="feedback">'+(correct?'<strong>시대착오 2개를 찾았습니다!</strong><p>'+chosenCards.map(n=>challengeCards[challengeAge][n].hint).join('<br>')+'</p>'+(fresh?'⭐ 도전 별 +1':'이미 받은 별은 중복 지급되지 않습니다.'):'<strong>다시 살펴보세요.</strong><p>선택한 카드 중 이 시대에 가능한 활동이 있습니다. 뒤에 나타난 카드만 골라 주세요.</p>')+'</div>';if(correct)showStarTotal();}
function showStarTotal(){let p=app.querySelector('.topline .progress');if(p)p.textContent='도전 별 ⭐ '+starCount()+'개';}
function renderPuzzleList(){let list=artifacts.filter(a=>museum.found.includes(a.id));document.getElementById('challengeBody').innerHTML='<h2>유물 연결 퍼즐</h2><p>발견한 유물의 기능·의미, 생활 모습, 시대를 연결하세요. 유물마다 처음 완성할 때 별 1개를 받습니다.</p>'+(list.length?'<div class="grid">'+list.map(a=>'<section class="card"><h3>'+a.name+' '+(activity.stars['puzzle-'+a.id]?'⭐ 완료':'')+'</h3><button onclick="openPuzzle('+a.id+')">퍼즐 풀기</button></section>').join('')+'</div>':'<p class="notice">아직 발견한 유물이 없습니다. 조사에서 유물을 먼저 발견하세요.</p>');}
function openPuzzle(id){if(!museum.found.includes(id))return;puzzleId=id;puzzleSelections=[null,null,null];renderPuzzle();}
function puzzleOptions(){let id=puzzleId,meaning=[id,(id+5)%15,(id+10)%15].sort((a,b)=>((a*7+id)%17)-((b*7+id)%17)),life=puzzleLifeAnswers[id],lives=[life,(life+2)%7,(life+4)%7].sort((a,b)=>((a*5+id)%11)-((b*5+id)%11));return [meaning.map(n=>({value:n,text:puzzleMeanings[n]})),lives.map(n=>({value:n,text:puzzleLives[n]})),age.map((a,n)=>({value:n,text:a.name}))];}
function renderPuzzle(){let a=artifacts[puzzleId];document.getElementById('challengeBody').innerHTML='<h2>'+a.name+' 연결 퍼즐</h2>'+artImage(a)+puzzleOptions().map((options,row)=>'<fieldset><legend>'+['기능·의미','생활 모습','시대'][row]+'</legend><div class="puzzle-row">'+options.map(o=>'<button class="pick '+(puzzleSelections[row]===o.value?'selected':'')+'" aria-pressed="'+(puzzleSelections[row]===o.value)+'" onclick="selectPuzzle('+row+','+o.value+')">'+o.text+'</button>').join('')+'</div></fieldset>').join('')+'<div class="actions"><button '+(puzzleSelections.every(x=>x!==null)?'':'disabled')+' onclick="gradePuzzle()">연결 확인</button><button class="secondary" onclick="renderPuzzleList()">유물 목록</button></div><div id="puzzleFeedback" aria-live="polite"></div>';}
function selectPuzzle(row,value){puzzleSelections[row]=value;renderPuzzle();}
function gradePuzzle(){if(!museum.found.includes(puzzleId)||puzzleSelections.some(x=>x===null))return;let expected=[puzzleId,puzzleLifeAnswers[puzzleId],Math.floor(puzzleId/5)],wrong=expected.map((x,n)=>puzzleSelections[n]!==x?n:-1).filter(n=>n>=0),fresh=wrong.length?false:awardStar('puzzle-'+puzzleId);document.getElementById('puzzleFeedback').innerHTML='<div class="feedback">'+(wrong.length?'다시 연결해 보세요: '+wrong.map(n=>['기능·의미','생활 모습','시대'][n]).join(', ')+'<p>'+artifacts[puzzleId].catchPoint+'</p>':'<strong>세 줄을 모두 연결했습니다!</strong><p>'+(fresh?'⭐ 도전 별 +1':'이미 완성한 퍼즐입니다. 별은 중복 지급되지 않습니다.')+'</p>')+'</div>';showStarTotal();}
function showFinal(){refreshFinalMenu();if(!allFinished()){app.innerHTML='<section class="panel"><h1>🔒 최종 미션</h1><p>9스테이지를 모두 마치면 열립니다.</p><button onclick="home()">홈으로</button></section>';return;}app.innerHTML='<h1>최종 미션</h1><p>특징 카드 12장을 대표 시대에 연결하세요. 각 특징이 대표적으로 강조되는 시대를 선택합니다.</p><div class="grid">'+finalCards.map((c,i)=>'<section class="card" id="finalCard'+i+'"><h3>'+c.text+'</h3><label>시대 선택<select onchange="setFinalAnswer('+i+',this.value)"><option value="">선택하세요</option>'+age.map((a,n)=>'<option value="'+n+'" '+(activity.finalAnswers[i]===n?'selected':'')+'>'+a.name+'</option>').join('')+'</select></label><div class="final-hint" aria-live="polite"></div></section>').join('')+'</div><div class="actions final-actions"><button onclick="gradeFinal()">채점하기</button><button class="secondary" onclick="showEnding()">학습 엔딩 보기</button></div><div id="finalFeedback" aria-live="polite"></div>';window.scrollTo(0,0);}
function setFinalAnswer(i,value){if(value==='')delete activity.finalAnswers[i];else activity.finalAnswers[i]=Number(value);saveActivity();let c=document.getElementById('finalCard'+i);c.classList.remove('incorrect','correct');c.querySelector('.final-hint').textContent='';}
function gradeFinal(){if(!allFinished())return;let score=0;finalCards.forEach((c,i)=>{let node=document.getElementById('finalCard'+i),ok=activity.finalAnswers[i]===c.age;if(ok)score++;node.classList.toggle('correct',ok);node.classList.toggle('incorrect',!ok);node.querySelector('.final-hint').textContent=ok?'✓ 알맞게 연결했습니다.':'힌트: '+age[c.age].name+' 시대의 대표 특징입니다.';});document.getElementById('finalFeedback').innerHTML='<div class="feedback"><strong>'+score+' / 12개 정답</strong><p>'+(score===12?'세 시대의 특징을 모두 연결했어요!':'힌트를 보고 틀리거나 비어 있는 카드를 다시 선택해 보세요.')+'</p></div>';}
function showEnding(){if(!allFinished())return;activity.endingSeen=true;saveActivity();let reviews=[];age.forEach((a,n)=>stages[a.id].forEach((st,j)=>st.investigations.forEach((it,k)=>{let errors=activity.errors[n+'-'+j+'-'+k]||0;if(errors)reviews.push({title:it.title,point:it.point||it.title,age:a.name,stage:j+1,errors});})));reviews.sort((a,b)=>b.errors-a.errors);app.innerHTML='<section class="panel"><span class="eyebrow">탐사 완료 · 9 / 9 스테이지</span><h1>시간탐사대의 기록</h1><p>선사 시대 사람들은 환경 속에서 도구와 생활 방식을 발전시켰습니다.</p><div class="ending-summary"><h2>구석기</h2><p>뗀석기를 사용하고, 사냥과 채집을 하며 이동 생활을 했습니다.</p><h2>신석기</h2><p>간석기와 토기를 사용하고, 농경과 목축을 시작하며 정착 생활을 했습니다.</p><h2>청동기</h2><p>벼농사가 발달하고 계급이 나타났습니다. 청동기와 함께 돌 도구도 사용했습니다.</p></div><h2>나의 다시 볼 개념</h2><p>플레이 중 기록된 행동·근거 선택의 오답 횟수가 많은 조사부터 모았습니다.</p>'+(reviews.length?'<ol>'+reviews.slice(0,3).map(r=>'<li><h3>'+r.title+'</h3><p>'+r.age+' STAGE '+r.stage+' · 오답 '+r.errors+'회</p><p>'+r.point+'</p></li>').join('')+'</ol>':'<p class="notice">기록된 오답이 없습니다. 세 시대의 핵심 개념을 다시 읽어 보세요.</p>')+'<p class="progress">도전 별 ⭐ '+starCount()+'개</p><div class="actions"><button onclick="showFinal()">최종 미션 도전</button><button class="secondary" onclick="home()">홈으로</button></div></section>';window.scrollTo(0,0);}
