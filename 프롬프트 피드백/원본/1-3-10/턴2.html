<head>

<style>
*{box-sizing:border-box} :root{color-scheme:dark;font-family:Arial,'Malgun Gothic',sans-serif}body{margin:0;background:#070f21;color:#f4f7ff;min-height:100vh;background-image:radial-gradient(ellipse at 50% 0,#192c50 0,transparent 65%)}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #344563;background:#17253d;border-radius:12px;padding:13px 20px;font-weight:700;transition:background .15s,transform .15s}button:hover{background:#263b5b}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;padding:28px 4vw;border-bottom:1px solid #27344c}h1{font-size:20px;letter-spacing:3px;margin:0}.tag{font-size:11px;color:#91a5c5;letter-spacing:3px;margin-top:7px}.toolbar{display:flex;gap:10px}.board{max-width:1600px;margin:auto;padding:55px 4vw 35px;display:grid;grid-template-columns:1fr .8fr 1fr;gap:30px;align-items:center}.team{text-align:center;--team:#48b7ff}.team.right{--team:#ff727d}.team-label{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(22px,3vw,42px);font-weight:800;overflow-wrap:anywhere}.dot{width:12px;height:12px;border-radius:50%;background:var(--team);box-shadow:0 0 18px var(--team);flex-shrink:0}.score{display:block;width:100%;border:0;background:transparent!important;padding:10px 0;font-size:clamp(110px,20vw,300px);line-height:1.25;font-weight:800;font-variant-numeric:tabular-nums;color:var(--team);text-shadow:0 0 45px color-mix(in srgb,var(--team) 25%,transparent);letter-spacing:-9px}.score:active{transform:scale(.96)}.hint{color:#8191ac;font-size:12px;margin:0 0 24px}.points{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.points button{min-width:58px;font-size:20px}.points button:last-child{color:#a7b4ca;background:#101b2e}.center{text-align:center}.live{color:#8c9db8;font-size:11px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:8px}.live i{width:7px;height:7px;background:#71829e;border-radius:50%}.running .live i{background:#50e4b1;box-shadow:0 0 12px #50e4b1}.clock{font-size:clamp(42px,6.4vw,100px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:15px 0}.expired .clock{color:#ffbe59}.timer-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.primary{background:#d9f66f;color:#18230d;border-color:#d9f66f}.primary:hover{background:#ecff9c}.small{font-size:12px;color:#93a4bf;background:transparent;border:0;padding:14px}.quarter{border-top:1px solid #2a3851;margin-top:35px;padding-top:28px}.eyebrow{font-size:11px;color:#8c9db8;letter-spacing:3px}.quarter-control{display:flex;align-items:center;justify-content:center;gap:25px;margin-top:12px}.quarter-control strong{font-size:45px;font-variant-numeric:tabular-nums}.quarter-control button{padding:6px 13px;background:transparent;font-size:20px}footer{text-align:center;color:#7385a3;font-size:12px;padding:25px}.status{min-height:20px;text-align:center;color:#bdcae1;font-size:13px}dialog{width:min(480px,calc(100% - 32px));background:#111e34;color:#f4f7ff;border:1px solid #3a4d6d;border-radius:20px;padding:28px;box-shadow:0 25px 100px #0009}dialog::backdrop{background:#020713cc;backdrop-filter:blur(5px)}dialog h2{margin:0 0 25px;font-size:23px}.field{margin:18px 0}.field label{display:block;color:#b8c5da;font-size:13px;margin-bottom:9px}.input-row{display:flex;gap:10px}input[type=text],input[type=number]{width:100%;min-width:0;border:1px solid #3a4d6d;background:#091427;color:#fff;padding:12px;border-radius:8px}input[type=color]{width:52px;height:45px;flex-shrink:0;border:0;background:transparent;padding:0;cursor:pointer}.duration{display:grid;grid-template-columns:1fr 1fr;gap:15px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:27px}.note{color:#8195b3;font-size:12px;line-height:1.6}@media(max-width:750px){header{padding:20px}h1{font-size:16px}.toolbar button{padding:10px;font-size:12px}.board{padding:35px 14px;gap:10px;grid-template-columns:1fr 1fr}.center{grid-column:1/-1;grid-row:2;margin-top:25px;display:flex;flex-direction:column;align-items:center}.score{font-size:clamp(95px,28vw,200px);letter-spacing:-5px}.team-label{font-size:23px}.points{gap:5px}.points button{padding:10px;min-width:36px;font-size:16px}.clock{font-size:75px;margin:10px}.quarter{margin-top:20px;padding-top:15px;width:100%}.quarter-control{margin-top:5px}.tag{letter-spacing:2px}footer{padding:15px}}
[hidden]{display:none!important}.extras{margin-top:22px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.extras button{padding:8px 12px}.badge{color:#d9f66f;font-size:20px}.shot{margin-top:20px;padding:15px;border:1px solid #344563;border-radius:14px}.shot strong{display:block;font-size:45px;color:#ffbe59}.shot button{padding:8px;margin:3px}.sport-grid,.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule-grid .field{margin:5px 0}.announcement{color:#d9f66f;font-size:21px;text-align:center;margin:15px;min-height:28px}.set-history{text-align:center;color:#a0b1cb;font-size:14px;margin:15px;line-height:1.8}dialog{max-height:90vh;overflow:auto}.toolbar{flex-wrap:wrap;justify-content:flex-end}.quarter-control strong{font-size:30px}select{width:100%;background:#091427;color:white;border:1px solid #344563;padding:12px;border-radius:8px}@media(max-width:750px){header{gap:12px}.toolbar{max-width:230px}}
</style>

<body>
<header><div><h1>SPORTS SCOREBOARD</h1><div class="tag">우리들의 경기 · 스포츠 점수판</div></div><div class="toolbar"><button id="sportSelect">🏅 <span id="sportName">종목 선택</span></button><button id="undo" title="마지막 변경 되돌리기">↶ 되돌리기</button><button id="settings">⚙ 설정</button></div></header>
<main class="board">
<section class="team" id="leftTeam" aria-label="왼쪽 팀"><div class="team-label"><span class="dot"></span><span id="leftName"></span></div><button class="score" id="leftScore" aria-label="왼쪽 팀 점수 1점 추가">0</button><p class="hint">점수를 누르면 +1</p><div class="points" data-team="left"><button data-add="1">+1</button><button data-add="2">+2</button><button data-add="3">+3</button><button data-add="-1">−1</button></div></section>
<section class="center" id="timer"><div class="live"><i></i><span id="timerStatus">경기 준비</span></div><div class="clock" id="clock" role="timer">10:00</div><div class="timer-buttons"><button class="primary" id="start">시작</button><button id="stop">정지</button><button id="reset">초기화</button></div><div class="quarter"><div class="eyebrow" id="periodTitle">경기 구간</div><div class="quarter-control"><button id="quarterDown" aria-label="이전 쿼터">−</button><strong id="quarter">1</strong><button id="quarterUp" aria-label="다음 쿼터">+</button></div></div></section>
<section class="team right" id="rightTeam" aria-label="오른쪽 팀"><div class="team-label"><span class="dot"></span><span id="rightName"></span></div><button class="score" id="rightScore" aria-label="오른쪽 팀 점수 1점 추가">0</button><p class="hint">점수를 누르면 +1</p><div class="points" data-team="right"><button data-add="1">+1</button><button data-add="2">+2</button><button data-add="3">+3</button><button data-add="-1">−1</button></div></section>
</main><div class="announcement" id="announcement" role="status" aria-live="polite"></div><div class="set-history" id="setHistory"></div><div class="status" id="message" role="status" aria-live="polite"></div><footer>함께 뛰고, 공정하게 즐기는 우리 반 경기장</footer>
<dialog id="dialog"><form id="settingsForm"><h2>경기 설정</h2><div class="field"><label for="nameLeft">왼쪽 팀</label><div class="input-row"><input id="nameLeft" type="text" maxlength="24" required><input id="colorLeft" type="color" aria-label="왼쪽 팀 색상"></div></div><div class="field"><label for="nameRight">오른쪽 팀</label><div class="input-row"><input id="nameRight" type="text" maxlength="24" required><input id="colorRight" type="color" aria-label="오른쪽 팀 색상"></div></div><div class="duration"><div class="field"><label for="minutes">경기 시간 · 분</label><input id="minutes" type="number" min="0" max="999" required></div><div class="field"><label for="seconds">초</label><input id="seconds" type="number" min="0" max="59" required></div></div><h3>종목별 규칙</h3><div id="rulesFields"></div><p class="note">수업에 맞게 규칙을 바꿀 수 있습니다. 세트 승리는 세트 확정 버튼으로 기록합니다.</p><p class="note">경기 시간을 변경하면 시계가 정지되고 새 시간으로 초기화됩니다.<br>점수와 설정은 이 브라우저에 자동 저장됩니다.</p><div class="dialog-actions"><button type="button" id="cancel">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<dialog id="sportDialog"><h2>종목 선택</h2><p class="note">종목 변경 시 점수와 경기 진행이 초기화됩니다. 팀 이름과 색상은 유지됩니다.</p><div class="sport-grid" id="sportGrid"></div><div class="dialog-actions"><button id="sportCancel">닫기</button></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='school-sports-scoreboard-v1';
const sports={basketball:['농구','time',600,4,'quarter',300,24],volleyball:['배구','set',25,3,15,0],football:['축구','time',2700,2,'half',900,0],futsal:['풋살','time',1200,2,'half',300,0],handball:['핸드볼','time',1800,2,'half',300,0],badminton:['배드민턴','set',21,2,21,30],tabletennis:['탁구','set',11,3,11,0],jokgu:['족구','set',15,2,15,0],free:['자유 경기','time',600,2,'half',300,0]};
function defaults(id){let a=sports[id];return a[1]==='time'?{mode:'time',duration:a[2]*1000,periods:a[3],periodType:a[4],overtime:a[5]*1000,foulLimit:5,resetFouls:true,shot:a[6]>0,shotFull:24,shotShort:14}:{mode:'set',target:a[2],wins:a[3],finalTarget:a[4],cap:a[5],deuce:true}}
let state={sport:'basketball',rules:defaults('basketball'),left:0,right:0,leftName:'팀 BLUE',rightName:'팀 RED',leftColor:'#48b7ff',rightColor:'#ff727d',quarter:1,remaining:600000,end:null,leftFouls:0,rightFouls:0,sets:[],shotRemaining:24000,shotEnd:null},history=[],audio;
try{let old=JSON.parse(localStorage.getItem(key));if(old&&typeof old==='object'){if(!sports[old.sport]){old.sport='basketball';old.rules=defaults('basketball');if(old.duration>0)old.rules.duration=old.duration}state={...state,...old,rules:{...defaults(old.sport),...old.rules}};if(!Array.isArray(state.sets))state.sets=[]}}catch(e){}
function remain(){return state.end===null?state.remaining:Math.max(0,state.end-Date.now())}function shotRemain(){return state.shotEnd===null?state.shotRemaining:Math.max(0,state.shotEnd-Date.now())}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('message').textContent='브라우저 저장 공간을 사용할 수 없습니다.'}}
function snapshot(){history.push(JSON.parse(JSON.stringify({...state,remaining:remain(),end:null,shotRemaining:shotRemain(),shotEnd:null})));if(history.length>100)history.shift()}
function change(fn){snapshot();fn();save();render()}function pause(){state.remaining=remain();state.shotRemaining=shotRemain();state.end=null;state.shotEnd=null}
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function buzz(){initAudio();if(!audio)return;for(let i=0;i<3;i++){let t=audio.currentTime+i*.45,o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.value=180;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.linearRampToValueAtTime(0,t+.35);o.start(t);o.stop(t+.36)}}
document.addEventListener('pointerdown',initAudio,{once:true});document.addEventListener('keydown',initAudio,{once:true});
for(const side of ['left','right']){let d=document.createElement('div');d.className='extras';d.id=side+'Extras';$(side+'Team').append(d)}
let shot=document.createElement('div');shot.className='shot';shot.id='shotPanel';shot.innerHTML='<span class="eyebrow">SHOT CLOCK</span><strong id="shotClock">24</strong><button id="shotFull">24초</button><button id="shotShort">14초</button><button id="shotToggle">시작</button>';$('timer').append(shot);
let next=document.createElement('button');next.id='nextSet';next.textContent='세트 확정';next.className='primary';$('timer').append(next);
function wins(side){return state.sets.filter(s=>s.winner===side).length}function champion(){return ['left','right'].find(s=>wins(s)>=state.rules.wins)}
function target(){return state.sets.length===2*(state.rules.wins-1)?state.rules.finalTarget:state.rules.target}
function winnerAt(l,r){let rule=state.rules,t=target();if(l===r)return null;let lead=l>r?'left':'right',hi=Math.max(l,r),lo=Math.min(l,r);return (rule.cap>0&&hi>=Math.max(t,rule.cap))||(hi>=t&&(!rule.deuce||hi-lo>=2))?lead:null}
function render(){let r=state.rules,isSet=r.mode==='set',sec=Math.ceil(remain()/1000),w=isSet?winnerAt(state.left,state.right):null,champ=isSet?champion():null;
$('sportName').textContent=sports[state.sport][0];for(const side of ['left','right']){$(side+'Score').textContent=state[side];$(side+'Name').textContent=state[side+'Name'];$(side+'Team').style.setProperty('--team',state[side+'Color']);let d=$(side+'Extras');if(isSet){d.replaceChildren();let b=document.createElement('b');b.className='badge';b.textContent='세트 승리 '+wins(side)+' / '+r.wins;d.append(b)}else{if(!d.querySelector('button'))d.innerHTML='<span></span><button data-foul="'+side+'" data-delta="-1" aria-label="팀 파울 감소">−</button><button data-foul="'+side+'" data-delta="1" aria-label="팀 파울 증가">+</button>';d.firstElementChild.textContent='팀 파울 '+state[side+'Fouls']+' / '+r.foulLimit;d.firstElementChild.style.color=state[side+'Fouls']>=r.foulLimit?'#ffbe59':''}}
$('clock').textContent=isSet?target()+'점':String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('timerStatus').textContent=isSet?'목표 점수 · '+(r.deuce?'2점 차 승리':'듀스 없음'):sec===0?'경기 시간 종료':state.end!==null?'경기 진행 중':'경기 준비 / 정지';document.querySelector('.timer-buttons').hidden=isSet;$('timer').classList.toggle('running',state.end!==null);$('timer').classList.toggle('expired',!isSet&&sec===0);
$('periodTitle').textContent=isSet?'SET · 세트':r.periodType==='half'?'전후반 / 연장':'QUARTER / 연장';$('quarter').textContent=isSet?(champ?state.sets.length:state.sets.length+1)+'세트':state.quarter>r.periods?'연장 '+(state.quarter-r.periods):r.periodType==='half'?(state.quarter===1?'전반':'후반'):state.quarter+'쿼터';$('quarterDown').hidden=isSet;$('quarterUp').hidden=isSet;
$('start').disabled=state.end!==null||sec===0;$('stop').disabled=state.end===null;$('undo').disabled=!history.length;$('shotPanel').hidden=isSet||!r.shot;$('shotClock').textContent=Math.ceil(shotRemain()/1000);$('shotFull').textContent=r.shotFull+'초';$('shotShort').textContent=r.shotShort+'초';$('shotToggle').textContent=state.shotEnd===null?'시작':'정지';$('nextSet').hidden=!isSet;$('nextSet').disabled=!w||!!champ;
let notices=[];if(isSet){if(champ)notices.push(state[champ+'Name']+' 매치 승리!');else if(w)notices.push(state[w+'Name']+' 세트 승리 · 세트 확정을 누르세요');else{if(r.deuce&&state.left===state.right&&state.left>=target()-1)notices.push('듀스');for(const side of ['left','right'])if(winnerAt(state.left+(side==='left'?1:0),state.right+(side==='right'?1:0))===side)notices.push(state[side+'Name']+' · '+(wins(side)===r.wins-1?'매치 포인트':'세트 포인트'))}}$('announcement').textContent=notices.join(' / ');$('setHistory').textContent=isSet?state.sets.map((s,i)=>(i+1)+'세트 '+s.left+' : '+s.right+' ('+state[s.winner+'Name']+')').join('　·　'):'';
}
function add(side,n){if(state[side]+n<0)return;if(state.rules.mode==='set'&&(champion()||(n>0&&winnerAt(state.left,state.right))))return;change(()=>state[side]+=n)}
for(const side of ['left','right'])$(side+'Score').onclick=()=>add(side,1);document.querySelectorAll('.points button').forEach(b=>b.onclick=()=>add(b.parentElement.dataset.team,Number(b.dataset.add)));
document.addEventListener('click',e=>{let b=e.target.closest('[data-foul]');if(b)change(()=>state[b.dataset.foul+'Fouls']=Math.max(0,state[b.dataset.foul+'Fouls']+Number(b.dataset.delta)))});
$('start').onclick=()=>{initAudio();if(state.end===null&&remain()>0)change(()=>{state.end=Date.now()+state.remaining;if(state.rules.shot&&state.shotRemaining>0)state.shotEnd=Date.now()+state.shotRemaining})};$('stop').onclick=()=>change(pause);$('reset').onclick=()=>change(()=>{pause();state.remaining=state.quarter>state.rules.periods?state.rules.overtime:state.rules.duration;state.shotRemaining=state.rules.shotFull*1000});
function period(n){if(state.quarter+n<1)return;change(()=>{pause();state.quarter+=n;state.remaining=state.quarter>state.rules.periods?state.rules.overtime:state.rules.duration;state.shotRemaining=state.rules.shotFull*1000;if(state.rules.resetFouls)state.leftFouls=state.rightFouls=0})}$('quarterDown').onclick=()=>period(-1);$('quarterUp').onclick=()=>period(1);
for(const type of ['Full','Short'])$('shot'+type).onclick=()=>change(()=>{state.shotRemaining=state.rules['shot'+type]*1000;state.shotEnd=state.end!==null?Date.now()+state.shotRemaining:null});$('shotToggle').onclick=()=>{initAudio();change(()=>{if(state.shotEnd!==null){state.shotRemaining=shotRemain();state.shotEnd=null}else if(state.shotRemaining>0)state.shotEnd=Date.now()+state.shotRemaining})};
$('nextSet').onclick=()=>{let w=winnerAt(state.left,state.right);if(!w||champion())return;change(()=>{state.sets.push({left:state.left,right:state.right,winner:w});if(!champion())state.left=state.right=0})};$('undo').onclick=()=>{if(history.length){state=history.pop();save();render()}};
for(const [id,a] of Object.entries(sports)){let b=document.createElement('button');b.textContent=a[0];b.onclick=()=>{if(id!==state.sport)change(()=>{pause();state.sport=id;state.rules=defaults(id);state.left=state.right=state.leftFouls=state.rightFouls=0;state.quarter=1;state.sets=[];state.remaining=state.rules.duration||0;state.shotRemaining=(state.rules.shotFull||24)*1000;$('message').textContent=''});$('sportDialog').close()};$('sportGrid').append(b)}$('sportSelect').onclick=()=>$('sportDialog').showModal();$('sportCancel').onclick=()=>$('sportDialog').close();
function num(k,label,min,max){return '<div class="field"><label for="rule_'+k+'">'+label+'</label><input id="rule_'+k+'" type="number" step="1" min="'+min+'" max="'+max+'" value="'+state.rules[k]+'" required></div>'}function check(k,label){return '<div class="field"><label><input id="rule_'+k+'" type="checkbox" '+(state.rules[k]?'checked':'')+'> '+label+'</label></div>'}
$('settings').onclick=()=>{let r=state.rules;for(const side of ['Left','Right']){$('name'+side).value=state[side.toLowerCase()+'Name'];$('color'+side).value=state[side.toLowerCase()+'Color']}$('minutes').value=Math.floor((r.duration||600000)/60000);$('seconds').value=Math.floor((r.duration||600000)/1000)%60;document.querySelector('.duration').hidden=r.mode==='set';
$('rulesFields').innerHTML=r.mode==='time'?'<div class="rule-grid">'+num('periods','정규 구간 수',1,20)+'<div class="field"><label for="rule_periodType">구간 표시</label><select id="rule_periodType"><option value="quarter">쿼터</option><option value="half">전후반 (2구간)</option></select></div><div class="field"><label for="rule_overtime">연장 시간 · 초</label><input id="rule_overtime" type="number" min="1" max="7200" value="'+r.overtime/1000+'" required></div>'+num('foulLimit','팀 파울 알림 기준',1,99)+'</div>'+check('resetFouls','구간 변경 시 팀 파울 초기화')+check('shot','샷클락 사용')+'<div class="rule-grid">'+num('shotFull','샷클락 기본 · 초',1,120)+num('shotShort','샷클락 재설정 · 초',1,120)+'</div>':'<div class="rule-grid">'+num('target','일반 세트 목표 점수',1,999)+num('finalTarget','마지막 세트 목표 점수',1,999)+num('wins','매치 승리에 필요한 세트 수',1,9)+num('cap','점수 상한 (0 = 무제한)',0,999)+'</div>'+check('deuce','듀스 사용 · 2점 차 승리');if(r.mode==='time')$('rule_periodType').value=r.periodType;$('dialog').showModal()};
$('cancel').onclick=()=>$('dialog').close();$('settingsForm').onsubmit=e=>{e.preventDefault();let r={...state.rules};if(r.mode==='time'){let d=(Number($('minutes').value)*60+Number($('seconds').value))*1000;if(d<=0){$('seconds').setCustomValidity('경기 시간을 1초 이상 입력하세요.');$('seconds').reportValidity();return}r.duration=d;r.periodType=$('rule_periodType').value;r.overtime=Number($('rule_overtime').value)*1000;for(const k of ['periods','foulLimit','shotFull','shotShort'])r[k]=Number($('rule_'+k).value);if(r.periodType==='half')r.periods=2;for(const k of ['shot','resetFouls'])r[k]=$('rule_'+k).checked}else{for(const k of ['target','finalTarget','wins','cap'])r[k]=Number($('rule_'+k).value);r.deuce=$('rule_deuce').checked;if(r.cap>0)r.cap=Math.max(r.cap,r.target,r.finalTarget)}change(()=>{for(const side of ['Left','Right']){state[side.toLowerCase()+'Name']=$('name'+side).value.trim()||'팀';state[side.toLowerCase()+'Color']=$('color'+side).value}if(JSON.stringify(r)!==JSON.stringify(state.rules)){pause();if(r.mode==='time'){state.remaining=state.quarter>r.periods?r.overtime:r.duration;state.shotRemaining=r.shotFull*1000}state.rules=r}});$('dialog').close()};for(const id of ['minutes','seconds'])$(id).oninput=()=>$('seconds').setCustomValidity('');
setInterval(()=>{let changed=false;if(state.end!==null&&remain()<=0){pause();state.remaining=0;changed=true;buzz();$('message').textContent='경기 시간이 종료되었습니다.'}if(state.shotEnd!==null&&shotRemain()<=0){pause();state.shotRemaining=0;changed=true;buzz();$('message').textContent='샷클락 종료 · 경기 시계를 정지했습니다.'}if(changed)save();render()},150);render();
})();
</script>
</body>
</html>
