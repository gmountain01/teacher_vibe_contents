<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>온마음 · 학생 건강조사</title><style>
:root{--green:#217266;--ink:#233e3a;--muted:#71817d;--line:#dfe8e4;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;font:15px/1.65 'Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 17px;background:white;color:var(--ink)}button:hover{border-color:var(--green);background:#f0f7f4}button.primary,.active{background:var(--green)!important;color:white!important;border-color:var(--green)}.notice{padding:8px 20px;text-align:center;background:#e7f0eb;color:#376457;font-size:12px}.top{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 28px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand small{font-size:12px;font-weight:400;margin-left:12px;color:var(--muted);letter-spacing:0}.shell{max-width:1184px;margin:16px auto 70px;padding:0 24px}h1{font-size:31px;letter-spacing:-1.3px;margin:8px 0}h2{font-size:21px;margin:0 0 18px}h3{font-size:16px}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:35px;background:#e7efe8;border-radius:22px;padding:48px;margin-top:30px;align-items:center}.hero h1{font-size:38px;line-height:1.45}.hero p{color:#64776c}.illustration{height:220px;display:flex;align-items:center;justify-content:center;position:relative}.paper{background:#fff;border-radius:16px;padding:25px;width:205px;box-shadow:0 15px 45px #274a3320;transform:rotate(7deg)}.paper b{font-size:40px;color:var(--green)}.paper p{height:8px;border-radius:10px;background:#e6eeea}.heart{position:absolute;right:25px;bottom:12px;background:#f0c79e;border:10px solid #e7efe8;border-radius:50%;width:80px;height:80px;display:grid;place-items:center;font-size:35px;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:25px}.card p{color:var(--muted);font-size:13px}.card .icon{font-size:24px;color:var(--green)}.card button{width:100%;margin-top:8px}.footnote{font-size:12px;color:var(--muted);margin-top:22px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.tabs button{border:0;background:transparent}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.metric{background:white;padding:22px;border:1px solid var(--line);border-radius:13px}.metric strong{display:block;font-size:30px;margin-top:10px}.metric span{font-size:12px;color:var(--muted)}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;background:#f6f9f7;color:#6c7e76;font-weight:500}th,td{padding:14px 12px;border-bottom:1px solid var(--line)}td button{padding:5px 10px;font-size:12px}.badge{font-size:11px;padding:4px 9px;border-radius:20px;background:#e9f5ee;color:#337b59}.badge.warn{background:#fff1de;color:#ac772b}.bar{height:9px;border-radius:10px;background:#eaf0ec;overflow:hidden;margin:9px 0 19px}.bar i{display:block;height:100%;background:#6aa28a;border-radius:10px}.form{max-width:760px;margin:24px auto}.form label{display:block;margin:17px 0 6px;font-weight:600;font-size:13px}input,select,textarea{padding:12px;border:1px solid #d3dfd8;border-radius:8px;width:100%;background:#fff;color:var(--ink)}textarea{min-height:95px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.check{font-weight:400!important;display:flex!important;gap:9px;align-items:start}.check input{width:auto;margin-top:6px}.steps{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:22px 0}.steps .current{color:var(--green);font-weight:700}.actions{border-top:1px solid var(--line);padding-top:20px;margin-top:25px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.error{color:#b24836;font-size:13px;white-space:pre-line}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#244b40;color:#fff;padding:12px 24px;border-radius:10px;z-index:10;display:none}.sub{padding:10px 15px;background:#eff5f1;border-radius:9px;font-size:12px}.filter{width:140px;padding:8px}.report td{white-space:normal}.empty{padding:35px;text-align:center;color:var(--muted)}footer{text-align:center;color:#87968d;font-size:11px;padding:25px}dialog{border:1px solid var(--line);border-radius:16px;max-width:680px;width:90%;padding:28px}dialog::backdrop{background:#153c3155}@media(max-width:760px){.top{padding:18px}.brand small{display:none}.shell{padding:0 16px}.hero{grid-template-columns:1fr;padding:28px}.hero h1{font-size:29px}.illustration{display:none}.grid,.twocol{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.steps{font-size:10px}.panel{padding:18px}h1{font-size:26px}}@media print{.notice,.top,.tabs,.no-print,footer,#toast{display:none!important}body{background:white}.shell{max-width:none;margin:0;padding:0}.panel{border:0}button{display:none!important}th,td{padding:8px;white-space:normal}.stats{grid-template-columns:repeat(4,1fr)}@page{size:A4 landscape;margin:12mm}}
</style></head><body><div class="notice">외부 연결 없는 로컬 미리보기 · 모든 정보는 가상 예시이며 새로고침하면 초기화됩니다.</div><header class="top"><div class="brand">✚ 온마음 <small>학생 건강조사</small></div><button id="mode" onclick="toggleMode()">교사 화면으로 전환 ↗</button></header><main id="app" class="shell"></main><footer>온마음 · 학생 건강상태 조사 및 응급처치 동의 | 예시 문항 · 예시 보고서</footer><div id="toast" role="status"></div><dialog id="detail"><div id="detailBody"></div><button onclick="document.getElementById('detail').close()">닫기</button></dialog>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let admin=false,page='dash',filter='전체 학급',step=0,draft={},loginType='임시저장',editId=null;
let students=Array.from({length:24},(_,i)=>({id:i+1,grade:1,cls:i<12?1:2,num:i%12+1,student:['김가온','이하늘','박다온','최서준','정나래','강도윤','윤시온','장예봄','임지우','한유진','오새봄','신여울'][i%12]+(i>=12?'(예시)':'')}));
let responses=students.slice(0,19).map((s,i)=>({...s,id:'R'+i,parent:'가상보호자'+(i+1),phone:'0100000'+String(i+1).padStart(4,'0'),status:i<16?'제출':'임시저장',health:i%4===0?'있음':'없음',allergy:i%5===0?'있음':'없음',medicine:i%7===0?'있음':'없음',note:i%4===0?'체육활동 시 상태를 살펴 주세요.':'',emergency:i%6===0?'미동의':'동의',updated:'2026.11.08 09:30',relation:'부모',privacy:true,sensitive:true,demo:true}));responses.push({ ...responses[0],id:'RX',student:'김가온(오입력)',num:30,parent:'가상보호자20'});
const qnames={health:'건강상태',allergy:'알레르기',medicine:'복용 중인 약'};const steps=['기본 정보','건강상태','학교생활·동의','최종 확인'];const key=s=>[s.grade,s.cls,s.num,s.student].join('|');const filtered=a=>a.filter(s=>filter==='전체 학급'||`${s.grade}학년 ${s.cls}반`===filter);const matched=(r,ss=students)=>ss.some(s=>key(s)===key(r));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">표시할 자료가 없습니다.</td></tr>`}</tbody></table></div>`}function toggleMode(){admin=!admin;$('mode').textContent=admin?'학부모 화면으로 전환 ↗':'교사 화면으로 전환 ↗';admin?renderAdmin():home()}
function home(){$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">2026 STUDENT HEALTH SURVEY</div><h1>아이의 건강한 학교생활,<br>함께 살펴요.</h1><p>학교에서 알아야 할 건강상태를 알려 주세요.<br>선생님이 아이를 더 세심하게 살피는 데 도움이 됩니다.</p><button class="primary" onclick="start()">건강조사 처음 작성하기 →</button><div class="footnote">작성 약 5분 · 작성 중 임시저장 가능 · 모바일 지원</div></div><div class="illustration" aria-hidden="true"><div class="paper"><b>✚</b><h3>우리 아이 건강 기록</h3><p></p><p style="width:75%"></p><p></p><p style="width:60%"></p></div><div class="heart">♥</div></div></section><div class="grid"><article class="card"><div class="icon">◷</div><h3>잠시 멈추셨나요?</h3><p>이 창에서 임시저장한 설문을 이어서 작성해요.</p><button onclick="showLogin('임시저장')">임시저장한 설문 이어쓰기</button></article><article class="card"><div class="icon">▤</div><h3>제출 내용을 확인해요</h3><p>작성한 내용을 확인하고 필요한 정보를 수정해요.</p><button onclick="showLogin('제출')">제출한 설문 확인·수정</button></article><article class="card"><div class="icon">♧</div><h3>작성 전 확인해 주세요</h3><p>문항과 동의문은 예시입니다. 실제 개인정보를 입력하지 마세요. 자료는 현재 창의 메모리에만 보관돼요.</p><span class="badge">외부 전송 없음</span></article></div>`}
function showLogin(type){loginType=type;$('app').innerHTML=`<div class="form panel"><button onclick="home()">← 처음으로</button><h1>${type==='제출'?'제출한 설문 확인':'임시저장 이어쓰기'}</h1><p class="muted">이 창에서 저장할 때 입력한 정보를 사용해 주세요.</p><label>학부모 성함<input id="ln"></label><label>전화번호<input id="lp" type="tel"></label><label>조회용 암호<input id="lw" type="password"></label><p id="err" class="error" role="alert"></p><button class="primary" onclick="lookup()">설문 조회하기</button><div id="found"></div><p class="footnote">미리 입력된 관리자 예시는 조회 대상에서 제외됩니다. 직접 작성·저장한 예시 설문으로 체험하세요.</p></div>`}
function lookup(){let list=responses.filter(r=>r.auth&&r.parent===$('ln').value.trim()&&r.phone.replace(/\D/g,'')===$('lp').value.replace(/\D/g,'')&&r.auth===$('lw').value&&r.status===loginType);$('lw').value='';$('err').textContent=list.length?'':'입력 정보와 저장 상태를 확인해 주세요.';$('found').innerHTML=list.map(r=>`<p>${esc(r.student)} · ${r.status} <button onclick="load('${r.id}')">${r.status==='제출'?'확인·수정':'이어쓰기'}</button></p>`).join('')}
function start(){draft={grade:1,cls:1,num:'',student:'',parent:'',phone:'',relation:'부모'};editId=null;step=0;survey()}function load(id){draft={...responses.find(r=>r.id===id)};editId=id;step=0;survey()}
function field(id,label,type='text'){return `<label>${label}<input id="f_${id}" type="${type}" value="${esc(draft[id]||'')}" ${type==='number'?'min="1" max="99"':''}></label>`}function select(id,label,opts){return `<label>${label}<select id="f_${id}" onchange="capture();${['health','allergy','medicine'].includes(id)?'survey()':''}">${['',...opts].map(v=>`<option value="${v}" ${draft[id]===v?'selected':''}>${v||'선택해 주세요'}</option>`).join('')}</select></label>`}function check(id,label){return `<label class="check"><input type="checkbox" id="f_${id}" ${draft[id]?'checked':''}>${label}</label>`}
function capture(){document.querySelectorAll('[id^="f_"]').forEach(e=>draft[e.id.slice(2)]=e.type==='checkbox'?e.checked:e.value)}
function survey(){let content='';if(step===0)content=`<h2>학생과 보호자 정보를 알려 주세요</h2><div class="fields">${field('grade','학년','number')}${field('cls','반','number')}${field('num','번호','number')}</div>${field('student','학생 이름 · 가명')}${field('parent','학부모 성함 · 가명')}${field('phone','전화번호 · 가상 번호','tel')}${select('relation','학생과의 관계',['부모','조부모','기타 보호자'])}${!editId?`${field('auth','조회용 암호 · 10자 이상','password')}${field('authConfirm','암호 확인','password')}<label class="check"><input type="checkbox" onchange="document.getElementById('f_auth').type=this.checked?'text':'password';document.getElementById('f_authConfirm').type=this.checked?'text':'password'">암호 표시</label>`:''}`;
if(step===1)content=`<h2>학교에서 살펴야 할 건강상태</h2><p class="muted">해당되는 응답을 선택해 주세요. 모든 문항은 예시입니다.</p>${Object.entries(qnames).map(([id,n])=>select(id,n+'에 관해 알릴 사항이 있나요?',['없음','있음','모름','답변하지 않음'])+(draft[id]==='있음'?`<label>관련 내용 · 예시<textarea id="f_${id}Detail">${esc(draft[id+'Detail']||'')}</textarea></label>`:'')).join('')}`;
if(step===2)content=`<h2>학교생활 참고사항과 동의</h2><label>선생님께 알려 주세요<textarea id="f_note" maxlength="2000">${esc(draft.note||'')}</textarea></label><div class="sub">예시 동의 안내: 건강상태 파악과 학교생활 지원을 위한 문항입니다. 실제 운영용 동의문이 아닙니다.</div>${check('privacy','[예시] 기본 개인정보 처리에 동의합니다.')}${check('sensitive','[예시] 건강에 관한 민감정보 처리에 동의합니다.')}${select('emergency','응급처치 동의 · 예시',['동의','미동의'])}<p class="footnote">미동의 응답도 제출할 수 있습니다. 실제 응급 대응 절차와 대체 제출 방법은 학교에 확인해야 합니다.</p>${check('demo','실제 개인정보가 아닌 가상자료만 입력했습니다. (필수)')}`;
if(step===3)content=`<h2>제출 전에 확인해 주세요</h2>${summary(draft)}<p class="sub">제출 후 이 창에서 이름·전화번호·암호로 다시 조회하고 수정할 수 있습니다.</p>`;
$('app').innerHTML=`<div class="form"><div class="row between"><button onclick="home()">← 처음으로</button><span class="muted">${step+1} / 4 단계</span></div><div class="steps">${steps.map((s,i)=>`<span class="${i===step?'current':''}">${i+1}. ${s}</span>`).join('')}</div><div class="bar"><i style="width:${(step+1)*25}%"></i></div><section class="panel">${content}<p id="err" class="error" role="alert"></p><div class="actions"><div>${step?'<button onclick="move(-1)">이전</button>':''}<button onclick="save(false)">임시저장</button></div>${step<3?'<button class="primary" onclick="move(1)">다음 →</button>':'<button class="primary" onclick="save(true)">최종 제출하기</button>'}</div><p class="footnote">임시저장은 이 창의 메모리에만 보관되며 새로고침 시 사라집니다.</p></section></div>`}
function validBase(){return draft.student?.trim()&&draft.parent?.trim()&&/^0\d{8,10}$/.test((draft.phone||'').replace(/\D/g,''))&&['grade','cls','num'].every(k=>Number.isInteger(+draft[k])&&+draft[k]>0&&+draft[k]<=99)&&(editId||(draft.auth?.length>=10&&draft.auth===draft.authConfirm))}function move(n){capture();if(n>0&&step===0&&!validBase()){$('err').textContent='학년·반·번호, 가명, 가상 전화번호와 일치하는 10자 이상 암호를 확인해 주세요.';return}step+=n;survey()}
function save(final){capture();if(!validBase()){$('err').textContent='기본 정보와 암호를 확인한 뒤 저장해 주세요.';return}if(final&&(!draft.demo||!draft.emergency||!['health','allergy','medicine'].every(k=>draft[k]))){$('err').textContent='건강 질문, 응급처치 동의 여부와 가상자료 확인을 완료해 주세요.';return}const old=responses.find(r=>r.id===editId);let rec={...draft,id:editId||'U'+Date.now(),status:final?'제출':'임시저장',updated:new Date().toLocaleString('ko-KR')};delete rec.authConfirm;if(old?.status==='제출'&&!final){old.pending={...rec};toast('수정본을 메모리에 임시저장했습니다. 기존 제출본은 유지됩니다.');return}responses=responses.filter(r=>r.id!==rec.id);responses.push(rec);draft={...rec};editId=rec.id;if(!final){toast('현재 창에 임시저장했습니다.');return}$('app').innerHTML=`<div class="form panel"><div style="font-size:45px;color:var(--green)">✓</div><h1>건강조사를 제출했어요</h1><p class="muted">예시 응답이 현재 창의 메모리에 저장되었습니다.</p><p class="sub">접수번호 ${esc(rec.id)} · ${esc(rec.updated)}</p>${summary(rec)}<div class="row no-print"><button class="primary" onclick="load('${rec.id}')">내용 수정</button><button onclick="window.print()">응답 인쇄·PDF</button><button onclick="home()">처음으로</button></div></div>`}
function summary(r){return table(['항목','응답'],[['학생',esc(`${r.grade}학년 ${r.cls}반 ${r.num}번 ${r.student}`)],['보호자',esc(r.parent)+' · '+esc(r.phone)],...Object.entries(qnames).map(([k,v])=>[v,esc(r[k]||'미응답')+(r[k]==='있음'?' · '+esc(r[k+'Detail']||'상세 내용 없음'):'')]),['학교생활 참고사항',esc(r.note||'없음')],['개인정보 / 민감정보 동의',`${r.privacy?'동의':'미동의'} / ${r.sensitive?'동의':'미동의'}`],['응급처치 동의',esc(r.emergency||'미응답')]])}
function renderAdmin(){const rs=filtered(responses),ss=filtered(students),sub=rs.filter(r=>r.status==='제출'),drafts=rs.filter(r=>r.status==='임시저장'),match=new Set(sub.filter(r=>matched(r,ss)).map(key)),rate=ss.length?Math.round(match.size/ss.length*100):0;let body='';const tabs=[['dash','대시보드'],['raw','설문 원문·통계'],['report','결과 보고서·시각화'],['roster','학생명단 관리']];const metric=(name,value,note)=>`<div class="metric"><span>${name}</span><strong>${value}</strong><span>${note||''}</span></div>`;
if(page==='dash')body=`<div class="stats">${metric('등록 학생',ss.length+'명','조사 대상 명단')}${metric('정상 제출 학생',match.size+'명','명단과 정확히 일치')}${metric('미제출 학생',ss.length?ss.length-match.size+'명':'—','최종 제출 기준')}${metric('명단 기준 제출률',ss.length?rate+'%':'계산 불가','중복 학생 제외')}</div><div class="twocol"><section class="panel"><div class="row between"><h2>학급별 수합 현황</h2><span class="badge">메모리 집계</span></div>${[1,2].filter(c=>filter==='전체 학급'||filter===`1학년 ${c}반`).map(c=>{let s=ss.filter(s=>+s.cls===c),n=new Set(sub.filter(r=>+r.cls===c&&matched(r,s)).map(key)).size;return `<div class="row between"><span>1학년 ${c}반</span><b>${n} / ${s.length}명</b></div><div class="bar"><i style="width:${s.length?n/s.length*100:0}%"></i></div>`}).join('')}<p class="footnote">명단과 일치한 제출 학생 수 ÷ 등록 학생 수</p></section><section class="panel"><h2>확인할 항목</h2>${table(['구분','수량'],[['최종 제출 응답',sub.length+'건'],['제출 보호자 계정',new Set(sub.map(r=>r.parent+'|'+r.phone)).size+'개'],['임시저장 응답',drafts.length+'건'],['명단 불일치',sub.filter(r=>!matched(r,ss)).length+'건'],['중복 제출 의심',sub.length-new Set(sub.map(key)).size+'건'],['임시저장만 있는 학생',ss.filter(s=>!match.has(key(s))&&drafts.some(r=>key(r)===key(s))).length+'명']])}</section></div><section class="panel" style="margin-top:20px"><div class="row between"><h2>최근 응답</h2><button onclick="go('raw')">전체 응답 보기 →</button></div>${responseTable(rs.slice(-5).reverse())}</section>`;
if(page==='raw'||page==='stats')body=`${subnav('raw','설문 응답 원문','stats','설문 항목별 통계')}<section class="panel"><h2>${page==='raw'?'설문 응답 원문':'설문 항목별 통계'}</h2>${page==='raw'?`<input placeholder="학생 가명으로 검색" oninput="searchRows(this.value)" style="max-width:280px;margin-bottom:15px"><div id="responseRows">${responseTable(rs)}</div>`:charts(sub)}</section>`;
if(page==='report'||page==='visual')body=`${subnav('report','학급별 결과 보고서','visual','보고서 기반 시각화')}<section class="panel"><div class="row between"><h2>건강조사 ${page==='report'?'학급별 수합 보고서':'결과 시각화'}</h2><div class="no-print"><button onclick="window.print()">인쇄·PDF 저장</button> <button onclick="exportReport()">보고서 CSV 저장</button></div></div><p class="muted">2026학년도 · ${filter} · 예시 서식</p>${page==='report'?table(['학급','번호','학생 가명','건강상태','알레르기','복용약','응급 동의','참고사항'],sub.slice().sort((a,b)=>a.cls-b.cls||a.num-b.num).map(r=>[`${r.grade}-${r.cls}`,r.num,esc(r.student),esc(r.health),esc(r.allergy),esc(r.medicine),esc(r.emergency),esc(r.note)]))+`<p>합계: 최종 제출 ${sub.length}건 / 명단 일치 학생 ${match.size}명</p><p class="footnote">원본 수합 서식이 제공되지 않아 예시로 구성했습니다. 불일치 응답도 보고서에는 표시되며 정상 제출률에는 포함되지 않습니다.</p>`:charts(sub)}</section>`;
if(page==='roster')body=`<section class="panel"><h2>학생명단 관리</h2><p class="muted">개별 입력은 메모리에 반영됩니다. 파일 업로드는 로컬 내용 미리보기만 제공합니다.</p><input type="hidden" id="sid"><div class="fields">${['학년','반','번호','이름(가명)'].map((n,i)=>`<label>${n}<input id="s${i}" ${i<3?'type="number" min="1" max="99"':'maxlength="30"'}></label>`).join('')}</div><div class="row" style="margin:16px 0"><button class="primary" onclick="saveStudent()">개별 명단 저장</button><button onclick="download('학년,반,번호,이름\r\n1,1,1,가상학생\r\n','학생명단_양식.csv')">CSV 양식 다운로드</button><label>CSV 로컬 미리보기<input type="file" accept=".csv,text/csv" onchange="previewFile(this)" style="max-width:270px"></label></div><div id="csvPreview"></div>${table(['학년','반','번호','가명','작업'],ss.map(s=>[s.grade,s.cls,s.num,esc(s.student),`<button onclick="editStudent(${s.id})">수정</button> <button onclick="removeStudent(${s.id})">삭제</button>`]))}</section>`;
$('app').innerHTML=`<div class="row between"><div><div class="eyebrow">TEACHER WORKSPACE</div><h1>학생 건강조사 관리</h1><p class="muted">아이들의 건강정보와 설문 참여 현황을 한눈에 살펴보세요.</p></div><span class="badge">교사 화면 체험 · 인증 없음</span></div><nav class="tabs">${tabs.map(([p,t])=>`<button class="${p===page||p==='raw'&&page==='stats'||p==='report'&&page==='visual'?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}</nav><div class="row between no-print"><div class="row"><span>조회 학급</span><select class="filter" onchange="filter=this.value;renderAdmin()">${['전체 학급','1학년 1반','1학년 2반'].map(v=>`<option ${v===filter?'selected':''}>${v}</option>`).join('')}</select></div><span class="footnote">집계 기준 ${new Date().toLocaleString('ko-KR')}</span></div>${body}<p class="footnote">모든 표시는 가상자료입니다. 보호자 수는 이름·전화번호 조합 기준이며, 실제 자연인 수와 다를 수 있습니다.</p>`}
function go(p){page=p;renderAdmin()}function subnav(a,at,b,bt){return `<div class="tabs"><button class="${page===a?'active':''}" onclick="go('${a}')">${at}</button><button class="${page===b?'active':''}" onclick="go('${b}')">${bt}</button></div>`}function responseTable(rs){return table(['학생','학급·번호','상태','명단 대조','저장 시각',''],rs.map(r=>[esc(r.student),`${r.grade}-${r.cls} · ${r.num}번`,`<span class="badge ${r.status==='임시저장'?'warn':''}">${r.status}</span>`,matched(r)?'일치':'<span class="badge warn">확인 필요</span>',esc(r.updated),`<button onclick="showDetail('${r.id}')">상세 보기</button>`]))}function searchRows(v){$('responseRows').innerHTML=responseTable(filtered(responses).filter(r=>r.student.includes(v)))}function showDetail(id){let r=responses.find(r=>r.id===id);$('detailBody').innerHTML=`<h2>${esc(r.student)} · 응답 상세</h2><p class="muted">${r.status} · ${esc(r.updated)}</p>${summary(r)}`;$('detail').showModal()}
function charts(rs){let unique=[...new Map(rs.map(r=>[key(r),r])).values()];return `<p class="sub">최종 제출 학생 조합 기준 ${unique.length}명 · 중복 응답은 최신 배열 항목으로 집계 · 보호자 응답 기반 예시 통계</p><div class="grid">${Object.entries({...qnames,emergency:'응급처치 동의'}).map(([k,n])=>`<div><h3>${n}</h3>${(k==='emergency'?['동의','미동의','미응답']:['있음','없음','모름','답변하지 않음','미응답']).map(v=>{let count=unique.filter(r=>(r[k]||'미응답')===v).length,p=unique.length?Math.round(count/unique.length*100):0;return `<div class="row between"><span>${v}</span><b>${count}명 · ${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('')}</div>`).join('')}</div><p class="footnote">각 문항 분모 ${unique.length}명. 미응답·모름·답변하지 않음을 ‘없음’과 구분합니다.</p>`}
function saveStudent(){let s={id:+$('sid').value||Date.now(),grade:+$('s0').value,cls:+$('s1').value,num:+$('s2').value,student:$('s3').value.trim()};if(!s.student||![s.grade,s.cls,s.num].every(n=>Number.isInteger(n)&&n>0&&n<=99)){toast('학년·반·번호와 가명을 확인해 주세요.');return}if(students.some(r=>r.id!==s.id&&r.grade===s.grade&&r.cls===s.cls&&r.num===s.num)){toast('같은 학년·반·번호가 있습니다.');return}students=students.filter(r=>r.id!==s.id);students.push(s);renderAdmin();toast('명단을 메모리에 저장했습니다.')}function editStudent(id){let s=students.find(s=>s.id===id);$('sid').value=s.id;[s.grade,s.cls,s.num,s.student].forEach((v,i)=>$('s'+i).value=v)}function removeStudent(id){students=students.filter(s=>s.id!==id);renderAdmin();toast('명단에서 삭제했습니다. 설문 응답은 유지됩니다.')}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(Boolean))rows.push(row);return rows}
async function previewFile(input){let f=input.files[0];if(!f)return;if(f.size>500000){toast('500KB 이하의 CSV 파일을 선택해 주세요.');return}let rows=parseCSV((await f.text()).replace(/^\uFEFF/,''));let head=rows.shift();if(!head||head.join(',')!=='학년,반,번호,이름'){$('csvPreview').textContent='머리글은 학년,반,번호,이름이어야 합니다.';return}let seen=new Set(students.map(s=>[s.grade,s.cls,s.num].join('|')));$('csvPreview').innerHTML=`<h3>${esc(f.name)} · 로컬 미리보기</h3><p class="sub">파일은 전송되거나 명단에 등록되지 않습니다. 최대 100행을 표시합니다.</p>${table(['행','학년','반','번호','이름','검토'],rows.slice(0,100).map((r,i)=>{let k=r.slice(0,3).join('|'),error=r.length!==4||!r[3]||!r.slice(0,3).every(v=>/^\d+$/.test(v)&&+v>0&&+v<=99)?'형식 확인':seen.has(k)?'번호 중복':'정상';seen.add(k);return [i+2,...r.slice(0,4).map(esc),error]}))}`}
function download(text,name){let url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportReport(){let rows=[['학년','반','번호','학생','건강상태','알레르기','복용약','응급동의','참고사항'],...filtered(responses).filter(r=>r.status==='제출').map(r=>[r.grade,r.cls,r.num,r.student,r.health,r.allergy,r.medicine,r.emergency,r.note])];download(rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[\s]*[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'건강조사_예시보고서.csv');toast('엑셀에서 열 수 있는 CSV를 저장했습니다.')}
home();
</script></body></html>
