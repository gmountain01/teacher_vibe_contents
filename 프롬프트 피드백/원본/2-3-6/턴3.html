<!DOCTYPE html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:15px system-ui;margin:0;background:#f1f5f9;color:#18324b}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;flex-wrap:wrap}button,input,select{font:inherit;padding:10px;border:1px solid #ccd5df;border-radius:7px;margin:4px}button{background:#176b63;color:white;cursor:pointer}.card{display:inline-block;background:white;border-radius:12px;padding:18px;margin:7px;min-width:150px}.card b{display:block;font-size:27px}.panel{background:white;padding:18px;border-radius:14px;margin-top:15px;overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd;white-space:pre-wrap}nav{text-align:right}.hide{display:none}.bar{background:#218d80;height:18px;min-width:0}#msg{color:#ad382a}pre{white-space:pre-wrap}.notice{background:#fff0c6;padding:12px}@media print{header,.notice,#filters,#msg,button,input,select{display:none}.panel{overflow:visible}main{padding:0}table{font-size:11px}thead{display:table-header-group}@page{size:A4 landscape;margin:12mm}
</style></head><body><main><header><h1>건강조사 관리자</h1><nav><button onclick="view('dash')">대시보드</button><button onclick="view('raw')">설문 원문·통계</button><button onclick="view('report')">결과 보고서·시각화</button><button onclick="view('roster')">학생명단 관리</button></nav></header><p class="notice">가상자료 전용입니다. 실제 개인정보를 입력하지 마세요. 보고서와 동의 문항은 예시 양식입니다.</p><p id="msg" role="status"></p><div id="filters"><label>학년 <input id="fg" size="3"></label><label>반 <input id="fc" size="3"></label><button onclick="render()">필터 적용</button><button onclick="refresh()">새로고침</button><button onclick="xlsx()">전체 가상 응답 XLSX</button></div><section id="content" class="panel"></section></main><script>
const $=id=>document.getElementById(id);let data={responses:[],students:[]},page='dash',csv='',preview=[];function el(tag,t){const e=document.createElement(tag);if(t!==undefined)e.textContent=t;return e}function btn(t,f){const b=el('button',t);b.onclick=f;return b}function api(fn,p,ok){$('msg').textContent='처리 중…';google.script.run.withSuccessHandler(r=>{$('msg').textContent='';ok(r)}).withFailureHandler(e=>$('msg').textContent=e.message)[fn](p)}function refresh(){api('getAdminData',null,r=>{data=r;render()})}function view(p){page=p;render()}function filtered(a){return a.filter(r=>(!$('fg').value||String(r.grade)===$('fg').value)&&(!$('fc').value||String(r.classNo)===$('fc').value))}function key(r){return [r.grade,r.classNo,r.number,r.name||r.student].map(String).join('|')}function table(headers,rows){const t=el('table'),h=el('thead'),tr=el('tr');headers.forEach(v=>tr.append(el('th',v)));h.append(tr);t.append(h);const body=el('tbody');rows.forEach(r=>{const row=el('tr');r.forEach(v=>{const c=el('td');if(v instanceof Node)c.append(v);else c.textContent=v===undefined?'':String(v);row.append(c)});body.append(row)});t.append(body);return t}function title(t){$('content').append(el('h2',t))}function card(t,v){const c=el('div');c.className='card';c.append(el('span',t),el('b',v));$('content').append(c)}
function render(){const c=$('content');c.replaceChildren();const rs=filtered(data.responses),ss=filtered(data.students),sub=rs.filter(r=>r.status==='제출'),draft=rs.filter(r=>r.status==='임시저장');
if(page==='dash'){title('수합 현황');card('제출 응답 건수',sub.length);card('제출 보호자 계정 수',new Set(sub.map(r=>r.name+'|'+r.phone)).size);card('임시저장 응답',draft.length);card('임시저장 보호자 계정 수',new Set(draft.map(r=>r.name+'|'+r.phone)).size);const sk=new Set(ss.map(key)),matched=new Set(sub.filter(r=>sk.has(key({...r,name:r.student}))).map(r=>key({...r,name:r.student})));card('등록 학생 수',ss.length);card('정확 일치 제출 학생',matched.size);card('명단 불일치 응답',sub.filter(r=>!sk.has(key({...r,name:r.student}))).length);card('명단 기준 미제출 학생',ss.length?ss.length-matched.size:'명단 등록 후 계산');card('제출률',ss.length?(matched.size/ss.length*100).toFixed(1)+'%':'계산 불가');const groups={};rs.forEach(r=>{const k=r.grade+'학년 '+r.classNo+'반';groups[k]??={제출:0,임시저장:0};groups[k][r.status]++});c.append(table(['학급','제출 응답','임시저장'],Object.entries(groups).map(([k,v])=>[k,v.제출,v.임시저장])));c.append(el('p','집계 기준: '+new Date().toLocaleString()+' · 이름·전화번호 기준 보호자 수는 실제 자연인 수와 다를 수 있습니다.'));}
else if(page==='raw'||page==='stats'){c.append(btn('설문 응답 원문',()=>view('raw')),btn('설문 항목별 통계',()=>view('stats')));if(page==='raw'){title('설문 응답 원문');c.append(table(['학년','반','번호','학생','상태','명단 대조','상세'],rs.map(r=>[r.grade,r.classNo,r.number,r.student,r.status,ss.some(s=>key(s)===key({...r,name:r.student}))?'일치':'확인 필요',btn('상세 보기',()=>detail(r))])))}else stats(sub,false);}
else if(page==='report'||page==='visual'){c.append(btn('결과 보고서',()=>view('report')),btn('보고서 기반 시각화',()=>view('visual')),btn('현재 화면 인쇄·PDF',()=>window.print()));if(page==='report'){title('건강조사 학급별 수합 보고서 · 예시');c.append(el('p','생성 시각: '+new Date().toLocaleString()));c.append(table(['학년','반','번호','이름','건강','알레르기','복용약','참고','응급 동의'],sub.slice().sort((a,b)=>+a.grade-+b.grade||+a.classNo-+b.classNo||+a.number-+b.number).map(r=>[r.grade,r.classNo,r.number,r.student,r.answers.health,r.answers.allergy,r.answers.medicine,r.answers.note,r.answers.emergency])))}else stats(sub,true);}
else roster();}
function detail(r){const c=$('content');c.replaceChildren(btn('목록으로',()=>render()));title(r.student+' · 응답 상세');c.append(table(['항목','내용'],[['보호자',r.name],['전화번호',r.phone],['저장 시각',r.updated],['상태',r.status],...Object.entries(r.answers).map(([k,v])=>[({health:'건강상태',allergy:'알레르기',medicine:'복용약',note:'참고 사항',emergency:'응급 동의'})[k],v])]))}
function stats(rs,visual){title(visual?'보고서 기반 시각화':'설문 항목별 통계');c=$('content');['health','allergy','medicine','emergency'].forEach(k=>{c.append(el('h3',({health:'건강상태',allergy:'알레르기',medicine:'복용약',emergency:'응급 동의'})[k]));const counts={};rs.forEach(r=>{const v=r.answers[k]||'미응답';counts[v]=(counts[v]||0)+1});c.append(table(['응답','인원','비율','그래프'],Object.entries(counts).map(([v,n])=>{const b=el('div');b.className='bar';b.style.width=(rs.length?n/rs.length*100:0)+'%';return [v,n,(rs.length?n/rs.length*100:0).toFixed(1)+'%',b]})));c.append(el('p','분모: 최종 제출 응답 '+rs.length+'건. 중복 학생 응답이 있으면 중복을 포함한 예시 통계입니다.'))})}
function roster(){const c=$('content');title('학생명단 관리');['id','grade','classNo','number','name'].forEach(k=>{const i=el('input');i.id='s_'+k;i.placeholder=({id:'내부 ID(수정 시 자동)',grade:'학년',classNo:'반',number:'번호',name:'이름(가명)'})[k];if(k==='id')i.readOnly=true;c.append(i)});c.append(btn('저장',()=>{const s={};['id','grade','classNo','number','name'].forEach(k=>s[k]=$('s_'+k).value);api('saveStudent',s,refresh)}));c.append(btn('CSV 양식 다운로드',()=>download('\uFEFF학년,반,번호,이름\r\n1,1,1,가상학생\r\n','학생명단_양식.csv','text/csv;charset=utf-8')));const f=el('input');f.type='file';f.accept='.csv';f.onchange=async()=>{csv=await f.files[0].text();api('previewCsv',csv,r=>{preview=r;const box=$('preview');box.replaceChildren(table(['행','학년','반','번호','이름','오류'],r.map(x=>[x.line,x.grade,x.classNo,x.number,x.name,x.error])));box.append(btn('확인 후 등록',()=>{if(!confirm('미리보기 명단을 등록할까요?'))return;api('importCsv',csv,refresh)}))})};c.append(f,el('div'));const box=el('div');box.id='preview';c.append(box);c.append(table(['학년','반','번호','이름','작업'],filtered(data.students).map(s=>{const actions=el('div');actions.append(btn('수정',()=>['id','grade','classNo','number','name'].forEach(k=>$('s_'+k).value=s[k])),btn('삭제',()=>{if(confirm('명단에서 삭제할까요? 설문 응답은 삭제되지 않습니다.'))api('deleteStudent',s.id,refresh)}));return [s.grade,s.classNo,s.number,s.name,actions]})))}
function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type})),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function xlsx(){api('exportXlsx',null,b64=>{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));download(bytes,'건강조사_가상자료.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')})}refresh();
</script></body></html>
