<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회신서 제출현황</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#243347;background:#f3f6fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dbe2eb;background:white;border-radius:8px;padding:9px 13px;color:#33435b}button:hover{background:#edf3fb}button.primary,.tabs button.active{background:#2463d4;color:white;border-color:#2463d4}.danger{color:#bd3741}header{height:86px;background:white;border-bottom:1px solid #e1e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 32px}h1{font-size:22px;margin:0 0 5px}small,.muted{color:#768398}.tabs{display:flex;gap:8px}.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 86px)}aside{background:white;border-right:1px solid #e1e7ef;padding:25px 18px}aside h3{margin-top:0;font-size:15px}.full{width:100%}.sideitem{border:1px solid #e0e7ef;border-radius:10px;padding:14px;margin-top:12px;cursor:pointer}.sideitem.selected{background:#edf4ff;border-color:#80a9f0}.sideitem b{display:block;margin-bottom:8px}.sideitem .actions{display:flex;justify-content:flex-end;gap:5px;margin-top:10px}.actions button{padding:4px 8px;font-size:12px}main{padding:30px;max-width:1400px;width:100%}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h2{margin:0 0 9px;font-size:25px}.card{background:white;border:1px solid #e1e7ef;border-radius:13px;padding:22px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat span{display:block;color:#758196}.stat strong{display:block;font-size:29px;margin-top:12px}.progress{height:7px;border-radius:10px;background:#e9eef6;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:#3676e4}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.toolbar input{margin-left:auto;max-width:230px}.filters button.active{color:#2463d4;background:#edf4ff;border-color:#9cbaed}.group{margin:22px 0}.group h3{font-size:15px;padding-bottom:10px;border-bottom:1px solid #edf0f5}.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.person{padding:13px;border:1px solid #e1e7ef;border-radius:9px;display:flex;gap:8px;align-items:center}.person button{padding:0;border:0;text-align:left;background:transparent;flex:1}.badge{font-size:11px;display:block;color:#9a6b28;margin-top:6px}.submitted{background:#effaf5;border-color:#c2e6d4}.submitted .badge{color:#27805b}.excluded{background:#f5f5f7}.excluded .badge{color:#78808b}.empty{text-align:center;padding:75px 20px;color:#8190a5}dialog{border:0;border-radius:15px;padding:25px;width:min(630px,94vw);max-height:90vh;box-shadow:0 20px 70px #182d4d40}dialog::backdrop{background:#172e4b66}label{display:block;margin:15px 0 7px;font-weight:bold}input,textarea,select{width:100%;border:1px solid #d5deea;border-radius:7px;padding:10px;background:white;color:#243347}input[type=checkbox]{width:auto}textarea{min-height:100px;resize:vertical}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.checklist{max-height:180px;overflow:auto;border:1px solid #e0e7ef;padding:10px;border-radius:8px}.checklist label{font-weight:normal;margin:8px}.note{line-height:1.7;color:#768398;font-size:12px}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e8edf3}th{background:#f5f7fb}td input{padding:6px}.tablewrap{max-height:310px;overflow:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263e60;color:white;padding:13px 22px;border-radius:9px;display:none;z-index:10}@media(max-width:760px){header{padding:18px;height:auto;gap:15px;flex-wrap:wrap}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-wrap:wrap}}
</style></head><body>
<header><div><h1>▤ 회신서 제출현황</h1><small>빠짐없이 확인하고, 간편하게 관리하세요.</small></div><nav class="tabs"><button id="tab-docs" onclick="switchTab('docs')">회신문서</button><button id="tab-lists" onclick="switchTab('lists')">명단관리</button></nav></header><div class="layout"><aside id="sidebar"></aside><main id="main"></main></div>
<dialog id="editor"></dialog><dialog id="personDialog"></dialog><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const KEY='reply-manager-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}data=data||{docs:[],lists:[]};let tab='docs',currentDoc=data.docs[0]?.id,currentList=data.lists[0]?.id,filter='all',search='',selected=new Set(),preview=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('저장 공간이 부족하거나 브라우저 저장이 차단되었습니다.');return false}return true}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}
function switchTab(t){tab=t;selected.clear();render()}function doc(){return data.docs.find(d=>d.id===currentDoc)}function list(){return data.lists.find(l=>l.id===currentList)}function members(d){return data.lists.filter(l=>d.listIds.includes(l.id)).flatMap(l=>l.people.map(p=>({...p,group:l.name+(l.type==='학생'?' · '+l.grade+'학년 '+l.room+'반':''),listId:l.id})))}function status(d,p){return d.status[p.id]?.state||'pending'}
function render(){for(const t of ['docs','lists'])$('#tab-'+t).classList.toggle('active',tab===t);let items=tab==='docs'?data.docs:data.lists;$('#sidebar').innerHTML=`<h3>${tab==='docs'?'회신문서':'명단 목록'} <small>${items.length}</small></h3><button class="primary full" onclick="${tab==='docs'?'editDoc()':'editList()'}">＋ ${tab==='docs'?'회신문서':'명단'} 추가</button>`+items.map(x=>`<div class="sideitem ${x.id===(tab==='docs'?currentDoc:currentList)?'selected':''}" onclick="choose('${x.id}')"><b>${esc(x.name)}</b><small>${tab==='docs'?'마감 '+esc(x.due||'미지정'):esc(x.type)+(x.type==='학생'?' · '+esc(x.grade)+'학년 '+esc(x.room)+'반':'')+' · '+x.people.length+'명'}</small><div class="actions"><button onclick="event.stopPropagation();${tab==='docs'?'editDoc':'editList'}('${x.id}')">수정</button><button class="danger" onclick="event.stopPropagation();removeItem('${x.id}')">삭제</button></div></div>`).join('');tab==='docs'?renderDoc():renderList()}
function choose(id){if(tab==='docs')currentDoc=id;else currentList=id;selected.clear();render()}function removeItem(id){if(!confirm('삭제하시겠습니까?'+(tab==='lists'?' 연결된 문서의 대상에서도 제외됩니다.':'')))return;let key=tab==='docs'?'docs':'lists';data[key]=data[key].filter(x=>x.id!==id);if(tab==='docs')currentDoc=data.docs[0]?.id;else{data.docs.forEach(d=>d.listIds=d.listIds.filter(x=>x!==id));currentList=data.lists[0]?.id}save();render()}
function renderDoc(){let d=doc();if(!d){$('#main').innerHTML='<div class="empty"><h2>첫 회신문서를 등록하세요</h2><p>명단을 먼저 추가하면 문서의 대상으로 연결할 수 있습니다.</p><button class="primary" onclick="editDoc()">＋ 회신문서 추가</button></div>';return}let pp=members(d),submitted=pp.filter(p=>status(d,p)==='submitted').length,excluded=pp.filter(p=>status(d,p)==='excluded').length,pending=pp.length-submitted-excluded,rate=pp.length-excluded?Math.round(submitted/(pp.length-excluded)*100):0;$('#main').innerHTML=`<div class="heading"><div><small>회신문서 / 제출현황</small><h2 style="margin-top:9px">${esc(d.name)}</h2><span class="muted">회신 마감일 ${esc(d.due||'미지정')} · 제외 ${excluded}명</span></div><button onclick="editDoc('${d.id}')">문서 수정</button></div>${d.memo?`<div class="card" style="padding:15px">✎ ${esc(d.memo)}</div>`:''}<div class="stats">${[['대상',pp.length+'명'],['제출',submitted+'명'],['미제출',pending+'명'],['제출률',rate+'%']].map(([a,b])=>`<div class="card stat"><span>${a}</span><strong>${b}</strong>${a==='제출률'?`<div class="progress"><i style="width:${rate}%"></i></div>`:''}</div>`).join('')}</div><div class="card"><div class="toolbar"><button class="primary" onclick="bulk('submitted')">✓ 일괄제출</button><button onclick="bulk('excluded')">제외 처리</button><button onclick="bulk('pending')">미제출로 변경</button><small id="selectionCount">${selected.size}명 선택</small></div><div class="toolbar filters">${[['all','전체',pp.length],['pending','미제출',pending],['submitted','제출',submitted],['excluded','제외',excluded]].map(([a,b,c])=>`<button class="${filter===a?'active':''}" onclick="filter='${a}';selected.clear();renderDoc()">${b} ${c}</button>`).join('')}<input placeholder="이름 검색" aria-label="이름 검색" value="${esc(search)}" oninput="search=this.value;renderPeople()"></div><label style="font-weight:normal"><input type="checkbox" onchange="selectVisible(this.checked)"> 현재 보이는 명단 전체 선택</label><div id="people"></div><p class="note">이름을 누르면 바로 제출하거나 제외 사유를 기록할 수 있습니다. 제출률은 제외 인원을 뺀 대상 기준입니다.</p></div>`;renderPeople()}
function visible(){let d=doc();return members(d).filter(p=>(filter==='all'||status(d,p)===filter)&&p.name.includes(search))}function renderPeople(){let d=doc(),pp=visible(),groups=[...new Set(pp.map(p=>p.group))];$('#people').innerHTML=pp.length?groups.map(g=>`<section class="group"><h3>${esc(g)} <small>${pp.filter(p=>p.group===g).length}명</small></h3><div class="people">${pp.filter(p=>p.group===g).map(p=>`<div class="person ${status(d,p)}"><input type="checkbox" aria-label="${esc(p.name)} 선택" ${selected.has(p.id)?'checked':''} onchange="togglePerson('${p.id}',this.checked)"><button onclick="openPerson('${p.id}')"><b>${p.number?esc(p.number)+'번 ':''}${esc(p.name)}</b><span class="badge">${{pending:'미제출',submitted:'✓ 제출',excluded:'제외'}[status(d,p)]}</span>${d.status[p.id]?.reason?`<small>${esc(d.status[p.id].reason)}</small>`:''}</button></div>`).join('')}</div></section>`).join(''):'<div class="empty">해당하는 명단이 없습니다.</div>'}
function togglePerson(id,on){on?selected.add(id):selected.delete(id);$('#selectionCount').textContent=selected.size+'명 선택'}function selectVisible(on){visible().forEach(p=>on?selected.add(p.id):selected.delete(p.id));renderPeople();$('#selectionCount').textContent=selected.size+'명 선택'}function bulk(state){if(!selected.size)return toast('처리할 사람을 선택하세요.');let reason='';if(state==='excluded'){reason=prompt('제외 사유를 입력하세요.');if(reason===null)return;if(!reason.trim())return toast('제외 사유가 필요합니다.')}selected.forEach(id=>doc().status[id]={state,reason,date:new Date().toISOString()});save();selected.clear();renderDoc()}
function openPerson(id){let p=members(doc()).find(p=>p.id===id);$('#personDialog').innerHTML=`<h2>${esc(p.name)}</h2><p class="muted">${esc(p.group)}</p><label>제외 사유</label><textarea id="reason" placeholder="제외 처리 시 사유를 입력하세요.">${esc(doc().status[id]?.reason||'')}</textarea><div class="footer"><button onclick="$('#personDialog').close()">닫기</button><button onclick="setPerson('${id}','pending')">미제출</button><button onclick="setPerson('${id}','excluded')">제외</button><button class="primary" onclick="setPerson('${id}','submitted')">바로제출</button></div>`;$('#personDialog').showModal()}
function setPerson(id,state){let reason=state==='excluded'?$('#reason').value.trim():'';if(state==='excluded'&&!reason)return toast('제외 사유를 입력하세요.');doc().status[id]={state,reason,date:new Date().toISOString()};save();$('#personDialog').close();renderDoc()}
function editDoc(id){let d=data.docs.find(x=>x.id===id);$('#editor').innerHTML=`<form id="docForm"><h2>회신문서 ${d?'수정':'추가'}</h2><label>문서이름</label><input id="docName" required value="${esc(d?.name||'')}" placeholder="예: 현장체험학습 참가 동의서"><label>대상 명단 (복수 선택)</label><div class="checklist">${data.lists.length?data.lists.map(l=>`<label><input type="checkbox" name="target" value="${l.id}" ${d?.listIds.includes(l.id)?'checked':''}> ${esc(l.name)} · ${esc(l.type)} ${l.type==='학생'?esc(l.grade)+'학년 '+esc(l.room)+'반':''} (${l.people.length}명)</label>`).join(''):'명단관리에서 대상 명단을 먼저 등록하세요.'}</div><label>회신 마감일</label><input id="due" type="date" value="${esc(d?.due||'')}"><label>메모</label><textarea id="memo">${esc(d?.memo||'')}</textarea><div class="footer"><button type="button" onclick="$('#editor').close()">취소</button><button class="primary">등록하기</button></div></form>`;$('#docForm').onsubmit=e=>{e.preventDefault();let ids=[...document.querySelectorAll('[name=target]:checked')].map(x=>x.value);if(!ids.length)return toast('대상 명단을 선택하세요.');let obj={id:d?.id||uid(),name:$('#docName').value.trim(),due:$('#due').value,memo:$('#memo').value,listIds:ids,status:d?.status||{}};if(!obj.name)return;d?Object.assign(d,obj):data.docs.push(obj);currentDoc=obj.id;save();$('#editor').close();render()};$('#editor').showModal()}
function renderList(){let l=list();$('#main').innerHTML=l?`<div class="heading"><div><small>명단관리 / 등록 명단</small><h2 style="margin-top:9px">${esc(l.name)}</h2><span class="muted">${esc(l.type)} ${l.type==='학생'?'· '+esc(l.grade)+'학년 '+esc(l.room)+'반':''} · ${l.people.length}명</span></div><div><button onclick="downloadList()">↓ CSV 다운로드</button> <button class="primary" onclick="editList('${l.id}')">명단 수정·업로드</button></div></div><div class="card"><table><thead><tr><th>번호</th><th>이름</th><th>분류</th><th>학년 / 반</th></tr></thead><tbody>${l.people.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(l.type)}</td><td>${l.type==='학생'?esc(l.grade)+' / '+esc(l.room):'—'}</td></tr>`).join('')}</tbody></table></div><p class="note">명단 변경 내용은 연결된 회신문서에 반영됩니다. 같은 사람의 제출 기록은 이름이 유지되면 보존됩니다.</p>`:'<div class="empty"><h2>관리할 명단을 추가하세요</h2><p>학생과 교직원을 구분하고, 붙여넣기 또는 파일로 등록합니다.</p><button class="primary" onclick="editList()">＋ 명단 추가</button></div>'}
function editList(id){let l=data.lists.find(x=>x.id===id);preview=l?l.people.map(p=>({...p})):[];$('#editor').innerHTML=`<form id="listForm"><h2>명단 ${l?'수정':'추가'}</h2><label>명단 이름</label><input id="listName" required value="${esc(l?.name||'')}" placeholder="예: 1학년 1반"><label>분류</label><select id="listType" onchange="$('#studentFields').hidden=this.value!=='학생'"><option ${l?.type==='교직원'?'':'selected'}>학생</option><option ${l?.type==='교직원'?'selected':''}>교직원</option></select><div id="studentFields" ${l?.type==='교직원'?'hidden':''}><div style="display:flex;gap:15px"><div style="flex:1"><label>학년</label><input id="grade" type="number" min="1" max="12" value="${esc(l?.grade||1)}"></div><div style="flex:1"><label>반</label><input id="room" value="${esc(l?.room||1)}"></div></div></div><label>명단 업로드</label><input type="file" id="upload" accept=".csv,.pdf,.hwpx,.txt" onchange="importFile(this.files[0])"><p class="note">CSV·PDF·HWPX 지원. 텍스트가 있는 PDF를 읽습니다(스캔 이미지는 제외). PDF·HWPX를 읽으려면 인터넷 연결이 필요합니다. 추출 결과에서 제목 등 불필요한 행을 지우고 저장하세요.</p><label>명단 붙여넣기</label><textarea id="paste" placeholder="이름을 한 줄에 한 명씩 입력하거나, 번호·이름 표를 붙여넣으세요." oninput="parsePasted(this.value)"></textarea><div class="toolbar" style="margin-top:12px"><b>저장할 명단 <span id="previewCount"></span></b><button type="button" onclick="preview.push({id:uid(),name:'',grade:#grade.value,room:#room.value,number:String(preview.length+1)});renderPreview()">＋ 행 추가</button></div><div id="previewTable" class="tablewrap"></div><div class="footer"><button type="button" onclick="$('#editor').close()">취소</button><button class="primary">명단 저장</button></div></form>`;renderPreview();$('#listForm').onsubmit=e=>{e.preventDefault();let names=preview.map(p=>({...p,name:p.name.trim()})).filter(p=>p.name);if(!names.length)return toast('한 명 이상 입력하세요.');let type=$('#listType').value;if(type==='학생'&&(!$('#grade').value||!$('#room').value.trim()))return toast('학년과 반을 입력하세요.');let old=l?.people||[],used=new Set();names=names.map(p=>{let match=old.find(o=>o.name===p.name&&!used.has(o.id));if(match){used.add(match.id);return {...p,id:match.id}}return p});let obj={id:l?.id||uid(),name:$('#listName').value.trim(),type,grade:$('#grade').value,room:$('#room').value.trim(),people:names};if(!obj.name)return;l?Object.assign(l,obj):data.lists.push(obj);currentList=obj.id;save();$('#editor').close();render()};$('#editor').showModal()}
function renderPreview(){$('#previewCount').textContent=preview.length+'명';$('#previewTable').innerHTML=`<table><thead><tr><th>번호</th><th>이름 (수정 가능)</th><th></th></tr></thead><tbody>${preview.map((p,i)=>`<tr><td>${i+1}</td><td><input aria-label="${i+1}번 이름" value="${esc(p.name)}" oninput="preview[${i}].name=this.value"></td><td><button type="button" class="danger" onclick="preview.splice(${i},1);renderPreview()">삭제</button></td></tr>`).join('')}</tbody></table>`}
function csvRows(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c==='\t')){row.push(cell);cell=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function parsePasted(text){let rows=csvRows(text.replace(/^\uFEFF/,'')),header=rows[0]?.findIndex(x=>/^(이름|성명|name)$/i.test(x.trim()))??-1;if(header>=0)rows.shift();preview=rows.map(r=>{let value=header>=0?r[header]:r.find(x=>x.trim()&&!/^\d+$/.test(x.trim()));value=(value||'').trim().replace(/^\d+[.)\s]+/,'');return {id:uid(),name:value}}).filter(p=>p.name&&!/^(이름|성명|번호)$/.test(p.name));renderPreview()}
async function importFile(file){if(!file)return;toast('파일을 읽고 있습니다.');try{let ext=file.name.split('.').pop().toLowerCase(),text='';if(ext==='csv'||ext==='txt'){let buf=await file.arrayBuffer();text=new TextDecoder('utf-8').decode(buf);if(text.includes('\uFFFD'))text=new TextDecoder('euc-kr').decode(buf)}else if(ext==='pdf'){if(!window.pdfjsLib)throw Error('PDF 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),content=await page.getTextContent(),lastY;for(let item of content.items){let y=item.transform[5];text+=(lastY!==undefined&&Math.abs(y-lastY)>4?'\n':'\t')+item.str;lastY=y}text+='\n'}}else if(ext==='hwpx'){if(!window.JSZip)throw Error('HWPX 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');let zip=await JSZip.loadAsync(await file.arrayBuffer());let files=Object.keys(zip.files).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!files.length)throw Error('HWPX 본문을 찾을 수 없습니다.');for(let n of files){let xml=new DOMParser().parseFromString(await zip.file(n).async('string'),'application/xml');for(let p of xml.getElementsByTagNameNS('*','p')){if(p.parentElement?.closest&&[...p.getElementsByTagNameNS('*','p')].length)continue;let s=[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('');if(s.trim())text+=s+'\n'}}}else throw Error('CSV, PDF, HWPX, TXT 파일을 선택하세요.');if(!text.trim())throw Error('추출된 텍스트가 없습니다. 스캔 PDF는 문자 인식 후 업로드하세요.');$('#paste').value=text;parsePasted(text);toast('추출된 명단을 확인하고 저장하세요.')}catch(e){alert('파일 읽기 실패: '+e.message)}finally{$('#upload').value=''}}
function downloadList(){let l=list(),rows=[['번호','이름','분류','학년','반'],...l.people.map((p,i)=>[i+1,p.name,l.type,l.type==='학생'?l.grade:'',l.type==='학생'?l.room:''])],csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=l.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

<script>

function sortedPeople(l){return l.people.map((p,i)=>({...p,grade:p.grade||l.grade,room:p.room||l.room,number:p.number||String(i+1)})).sort(l.type==='학생'?((a,b)=>+a.grade- +b.grade||+a.room- +b.room||+a.number- +b.number):((a,b)=>a.name.localeCompare(b.name,'ko')))}

editList=function(id){oldEditList(id);let l=data.lists.find(x=>x.id===id);preview=l?sortedPeople(l):[];$('#listType').onchange=()=>{$('#studentFields').hidden=$('#listType').value!=='학생';renderPreview()};$('#paste').placeholder='학생: 학년,반,번호,이름 (한 줄에 한 명)\n교직원: 이름 (한 줄에 한 명)';renderPreview();$('#listForm').onsubmit=e=>{e.preventDefault();let type=$('#listType').value,people=preview.map(p=>({...p,name:p.name.trim(),grade:String(p.grade||$('#grade').value),room:String(p.room||$('#room').value),number:String(p.number||'')})).filter(p=>p.name);if(!people.length)return toast('명단을 입력하세요.');if(type==='학생'){if(people.some(p=>[p.grade,p.room,p.number].some(v=>!/^\d+$/.test(v)||+v<1)))return toast('학년·반·번호를 양의 정수로 입력하세요.');let keys=people.map(p=>[+p.grade,+p.room,+p.number].join('-'));if(new Set(keys).size!==keys.length)return toast('학년·반·번호가 중복됩니다.')}let used=new Set();people=people.map(p=>{let old=l?.people.find(o=>o.id===p.id&&!used.has(o.id))||l?.people.find((o,i)=>!used.has(o.id)&&o.name===p.name&&(type!=='학생'||String(o.grade||l.grade)===p.grade&&String(o.room||l.room)===p.room&&String(o.number||i+1)===p.number));if(old){used.add(old.id);p.id=old.id}return p});let obj={id:l?.id||uid(),name:$('#listName').value.trim(),type,grade:$('#grade').value,room:$('#room').value,people};if(!obj.name)return;obj.people=sortedPeople(obj);l?Object.assign(l,obj):data.lists.push(obj);currentList=obj.id;save();$('#editor').close();render()}};
renderPreview=function(){let student=$('#listType').value==='학생';$('#previewCount').textContent=preview.length+'명';$('#previewTable').innerHTML=`<table><thead><tr>${student?'<th>학년</th><th>반</th><th>번호</th>':''}<th>이름</th><th></th></tr></thead><tbody>${preview.map((p,i)=>`<tr>${(student?['grade','room','number']:[]).concat('name').map(k=>`<td><input aria-label="${i+1}행 ${k}" ${k==='name'?'':'type="number" min="1"'} value="${esc(p[k]||'')}" oninput="preview[${i}]['${k}']=this.value"></td>`).join('')}<td><button type="button" onclick="preview.splice(${i},1);renderPreview()">삭제</button></td></tr>`).join('')}</tbody></table>`};
parsePasted=function(text){let rows=csvRows(text.replace(/^\uFEFF/,'')),head=rows[0]?.map(x=>x.trim())||[],ni=head.findIndex(x=>/^(이름|성명|name)$/i.test(x));if(ni>=0)rows.shift();preview=rows.map((r,i)=>{if(r.length===1)r=r[0].trim().split(/\s+/);let four=ni<0&&r.length>=4&&r.slice(0,3).every(v=>/^\d+$/.test(v)),get=(key,fallback)=>{let n=ni>=0?head.indexOf(key):-1;return String(n>=0?r[n]||'':fallback||'').trim()};return {id:uid(),name:ni>=0?String(r[ni]||'').trim():String(four?r[3]:r.find(v=>v&&!/^\d+[.)]?$/.test(v))||'').trim(),grade:get('학년',four?r[0]:$('#grade').value),room:get('반',four?r[1]:$('#room').value),number:get('번호',four?r[2]:/^\d+$/.test(r[0])?r[0]:i+1)}}).filter(p=>p.name);renderPreview()};
renderList=function(){let l=list();if(!l){$('#main').innerHTML='<div class="empty"><h2>관리할 명단을 추가하세요</h2><button onclick="editList()">＋ 명단 추가</button></div>';return}let student=l.type==='학생';$('#main').innerHTML=`<div class="heading"><div><h2>${esc(l.name)}</h2><span class="muted">${esc(l.type)} · ${l.people.length}명</span></div><div><button onclick="downloadList()">↓ CSV 다운로드</button> <button class="primary" onclick="editList('${l.id}')">명단 수정·업로드</button></div></div><div class="card"><table><thead><tr>${student?'<th>학년</th><th>반</th><th>번호</th>':'<th>순서</th>'}<th>이름</th></tr></thead><tbody>${sortedPeople(l).map((p,i)=>`<tr>${student?`<td>${esc(p.grade)}</td><td>${esc(p.room)}</td><td>${esc(p.number)}</td>`:`<td>${i+1}</td>`}<td>${esc(p.name)}</td></tr>`).join('')}</tbody></table></div><p class="note">학생은 학년·반·번호순, 교직원은 이름 오름차순으로 표시합니다.</p>`};
downloadList=function(){let l=list(),student=l.type==='학생',rows=[student?['학년','반','번호','이름']:['이름'],...sortedPeople(l).map(p=>student?[p.grade,p.room,p.number,p.name]:[p.name])],csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=l.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

let syncRows=[],syncDocId=null,syncBusy=false;
function openSync(){syncDocId=doc().id;syncRows=[];$('#editor').innerHTML=`<h2>제출현황 파일 연동</h2><p class="note">HWPX · JPG · PNG · CSV · Excel(.xlsx/.xls)을 읽습니다. 이름만 있는 명단은 제출자로 처리합니다. 상태 열이 있으면 제출·미제출·제외를 구분합니다. 동명이인은 학년·반·번호로 구분하며, 불명확한 행은 직접 대상을 선택하세요.</p><input id="syncFile" type="file" accept=".hwpx,.jpg,.jpeg,.png,.csv,.xlsx,.xls" onchange="readSync(this.files[0])"><p class="note">이미지는 한국어 문자 인식 후 연결합니다. 파일은 서버에 저장하지 않으며, 읽기 도구와 인식 언어를 불러오기 위해 인터넷이 필요합니다.</p><div id="syncProgress" role="status"></div><div id="syncPreview" class="tablewrap"></div><div class="footer"><button onclick="$('#editor').close()">닫기</button><button id="syncApply" class="primary" disabled onclick="applySync()">선택 결과 적용</button></div>`;$('#editor').showModal()}
async function hwpxRows(file){if(!window.JSZip)throw Error('HWPX 읽기 도구를 불러오지 못했습니다.');let zip=await JSZip.loadAsync(await file.arrayBuffer()),rows=[];for(let n of Object.keys(zip.files).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))){let xml=new DOMParser().parseFromString(await zip.file(n).async('string'),'application/xml');if(xml.querySelector('parsererror'))throw Error('HWPX 본문 형식이 잘못되었습니다.');let tx=el=>[...el.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join(' ').trim();for(let tr of xml.getElementsByTagNameNS('*','tr')){let cells=[...tr.children].filter(el=>el.localName==='tc');if(cells.length)rows.push(cells.map(tx))}for(let p of xml.getElementsByTagNameNS('*','p')){let inCell=false;for(let a=p.parentElement;a;a=a.parentElement)if(a.localName==='tc')inCell=true;if(!inCell&&![...p.getElementsByTagNameNS('*','p')].length&&tx(p))rows.push([tx(p)])}}return rows}
async function readSync(file){if(!file||syncBusy)return;syncBusy=true;syncRows=[];$('#syncApply').disabled=true;$('#syncFile').disabled=true;$('#syncPreview').innerHTML='';let progress=$('#syncProgress');progress.textContent='파일을 읽고 있습니다…';try{let ext=file.name.split('.').pop().toLowerCase(),rows=[];if(ext==='csv'){let buf=await file.arrayBuffer(),text=new TextDecoder('utf-8').decode(buf);if(text.includes('\uFFFD'))text=new TextDecoder('euc-kr').decode(buf);rows=csvRows(text.replace(/^\uFEFF/,''))}else if(['xlsx','xls'].includes(ext)){if(!window.XLSX)throw Error('Excel 읽기 도구를 불러오지 못했습니다.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=wb.SheetNames.flatMap(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false}))}else if(ext==='hwpx')rows=await hwpxRows(file);else if(['jpg','jpeg','png'].includes(ext)){if(!window.Tesseract)throw Error('이미지 인식 도구를 불러오지 못했습니다.');let worker;try{worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{progress.textContent='이미지 문자 인식 중… '+Math.round((m.progress||0)*100)+'%'}});let result=await worker.recognize(file);rows=result.data.text.split(/\r?\n/).filter(x=>x.trim()).map(x=>[x])}finally{if(worker)await worker.terminate()}}else throw Error('지원하지 않는 파일입니다.');syncRows=matchRows(rows);progress.textContent=syncRows.length?`${syncRows.length}행 추출 · 연결 대상과 상태를 확인하세요. 파일에 없는 대상의 상태는 유지됩니다.`:'이름을 포함한 행을 찾지 못했습니다.';drawSync()}catch(e){progress.textContent='파일 읽기 실패: '+e.message}finally{syncBusy=false;$('#syncFile').disabled=false}}
function matchRows(rows){let d=data.docs.find(d=>d.id===syncDocId),pp=members(d),header=null,out=[];let norm=v=>String(v??'').replace(/\s/g,'').trim();for(let raw of rows){let r=raw.map(v=>String(v??'').trim());if(!r.some(Boolean))continue;let ni=r.findIndex(v=>/^(이름|성명|name)$/i.test(norm(v)));if(ni>=0){header=r.map(norm);continue}let idx=keys=>header?header.findIndex(v=>keys.includes(v)):-1,get=keys=>{let i=idx(keys);return i>=0?norm(r[i]):''},name=get(['이름','성명','name']),line=r.join(' '),grade=get(['학년']),room=get(['반']),number=get(['번호','출석번호']);if(!header||r.length===1){let gm=line.match(/(\d+)\s*학년/),rm=line.match(/(\d+)\s*반/),nm=line.match(/(\d+)\s*번/);grade=gm?.[1]||'';room=rm?.[1]||'';number=nm?.[1]||'';let tokens=line.trim().split(/[\s,\t|]+/);if(tokens.length>=4&&tokens.slice(0,3).every(x=>/^\d+$/.test(x))){[grade,room,number]=tokens;name=tokens[3]}else{name='';let hits=pp.filter(p=>tokens.some(t=>norm(t)===norm(p.name)));if(hits.length)name=hits[0].name;else name=tokens.find(t=>/^[가-힣a-zA-Z]{2,}$/.test(t)&&!['제출','미제출','제외','제출완료','미제출자','제출자'].includes(t))||line}}if(!name)continue;let candidates=pp.filter(p=>norm(p.name)===norm(name)&&(!grade||+p.grade===+grade)&&(!room||+p.room===+room)&&(!number||+p.number===+number));let sv=get(['상태','제출상태','제출여부','제출현황']),si=idx(['상태','제출상태','제출여부','제출현황']),state='submitted',reason=get(['사유','제외사유']),problem='';let source=si>=0?sv:line;if(/미제출|미회신|미완료|^(x|×|n|no|false|0)$/i.test(source))state='pending';else if(/제외|면제/.test(source))state='excluded';else if(si>=0&&!/^(제출|제출완료|완료|회신|회신완료|o|○|✓|y|yes|true|1)$/i.test(source))problem='상태 확인 필요';out.push({label:[grade&&grade+'학년',room&&room+'반',number&&number+'번',name].filter(Boolean).join(' '),target:candidates.length===1?candidates[0].id:'',state,reason,problem:problem||(candidates.length>1?'동명이인 확인':candidates.length?'':'일치 대상 없음'),checked:candidates.length===1&&!problem,source:line})}return out}
function drawSync(){let pp=members(data.docs.find(d=>d.id===syncDocId));$('#syncPreview').innerHTML=`<table><thead><tr><th>적용</th><th>추출 내용</th><th>연결 대상</th><th>상태</th><th>제외 사유</th></tr></thead><tbody>${syncRows.map((r,i)=>`<tr><td><input type="checkbox" ${r.checked?'checked':''} onchange="syncRows[${i}].checked=this.checked"></td><td title="${esc(r.source)}">${esc(r.label)}<small style="display:block">${esc(r.problem)}</small></td><td><select onchange="syncRows[${i}].target=this.value"><option value="">대상 선택</option>${pp.map(p=>`<option value="${p.id}" ${r.target===p.id?'selected':''}>${esc(p.group)} / ${p.number?esc(p.number)+'번 ':''}${esc(p.name)}</option>`).join('')}</select></td><td><select onchange="syncRows[${i}].state=this.value">${[['submitted','제출'],['pending','미제출'],['excluded','제외']].map(([k,v])=>`<option value="${k}" ${r.state===k?'selected':''}>${v}</option>`).join('')}</select></td><td><input value="${esc(r.reason)}" aria-label="제외 사유" oninput="syncRows[${i}].reason=this.value"></td></tr>`).join('')}</tbody></table>`;$('#syncApply').disabled=!syncRows.length}
function applySync(){let rows=syncRows.filter(r=>r.checked),d=data.docs.find(d=>d.id===syncDocId);if(!rows.length)return toast('적용할 행을 선택하세요.');if(rows.some(r=>!r.target))return toast('선택한 행의 연결 대상을 지정하세요.');if(new Set(rows.map(r=>r.target)).size!==rows.length)return toast('같은 대상에 연결된 중복 행을 해제하세요.');if(rows.some(r=>r.state==='excluded'&&!r.reason.trim()))return toast('제외 사유를 입력하세요.');let old=JSON.parse(JSON.stringify(d.status));rows.forEach(r=>d.status[r.target]={state:r.state,reason:r.state==='excluded'?r.reason.trim():'',date:new Date().toISOString(),source:'파일 업로드'});if(!save()){d.status=old;return}$('#editor').close();selected.clear();render();toast(rows.length+'명의 제출현황을 반영했습니다.')}
