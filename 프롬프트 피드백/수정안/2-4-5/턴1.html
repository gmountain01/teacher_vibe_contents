<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>교직원 연수 서명부 · 미리보기</title>
<style>
:root{font-family:"Malgun Gothic",system-ui,sans-serif;color:#203332;background:#f3f6f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:46px auto;padding:0 24px 60px}.eyebrow{font-size:13px;color:#22776c;font-weight:700;letter-spacing:2px}h1{font-size:32px;letter-spacing:-1.5px;margin:10px 0}p{color:#647571;line-height:1.7}.badge{display:inline-block;background:#e3f1eb;color:#216d5f;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.card{background:white;border:1px solid #e0e8e4;border-radius:18px;padding:26px;margin-bottom:22px;box-shadow:0 5px 20px #233c3304}h2{font-size:18px;margin:0 0 21px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.registration{display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:700;color:#4b605a}input,select{font:inherit;width:100%;padding:12px;border:1px solid #d7e1dc;border-radius:9px;background:white;color:#243e35;margin-top:8px;min-height:46px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:12px 18px;min-height:46px;font-weight:700;background:#197568;color:white}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #89cbbb;outline-offset:3px}.secondary{background:#edf2ef;color:#405f53}.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.listhead h2{margin:0}.count{font-size:13px;color:#62776c}.hint{font-size:13px;margin:14px 0 20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:12px;color:#73827c;background:#f7f9f8;padding:13px 14px}td{padding:15px 14px;border-bottom:1px solid #edf1ee;font-size:14px}.name{background:transparent;color:#176d5d;padding:0;min-height:35px;text-decoration:underline;text-underline-offset:4px}.status{font-size:12px;border-radius:20px;padding:5px 10px;background:#f0f3f1;color:#7c8881}.status.done{background:#e1f2e9;color:#227047}.foot{font-size:12px;color:#85918b;text-align:center}dialog{border:0;border-radius:20px;padding:28px;width:min(560px,calc(100% - 28px));box-shadow:0 20px 100px #15382c40}dialog::backdrop{background:#18352e80}dialog h2{margin-bottom:8px}canvas{width:100%;height:230px;border:1px dashed #a9c2b7;border-radius:12px;background:#fafcfb;touch-action:none;display:block}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.actions>div{display:flex;gap:8px}.message{color:#b94c34;font-size:13px;min-height:20px;margin:10px 0 0}.signature-caption{font-size:12px;color:#829189;text-align:center;margin:10px 0} @media(max-width:760px){main{margin:25px auto;padding:0 16px 36px}.top{align-items:flex-start}h1{font-size:26px}.grid,.registration{grid-template-columns:1fr 1fr}.registration button{grid-column:1/-1}.card{padding:20px}.badge{white-space:nowrap}.grid label:first-child{grid-column:1/-1}}@media(max-width:420px){.registration{grid-template-columns:1fr}.top{display:block}.badge{margin-top:10px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header class="top"><div><div class="eyebrow">STAFF TRAINING</div><h1>교직원 연수 서명부</h1><p style="margin:0">참가자 목록에서 이름을 누르고 서명해 주세요.</p></div><span class="badge">가명 예시 · 미리보기</span></header>
<section class="card"><h2>01 &nbsp;연수 정보</h2><div class="grid"><label>연수명<input id="training" placeholder="연수명을 입력해 주세요" value="함께 배우는 디지털 수업 역량 연수"></label><label>연수 날짜<input id="date" type="date" value="2026-11-10"></label></div></section>
<section class="card"><h2>02 &nbsp;참가자 등록</h2><form id="register" class="registration"><label>학교급<select id="level"><option value="초">초등</option><option value="중">중등</option><option value="고">고등</option></select></label><label>직위<select id="role"><option>교장</option><option>교감</option><option>원장</option><option selected>교사</option><option>행정</option><option>영양사</option><option>조리사</option></select></label><label><span id="subjectLabel">학년</span><input id="subject" placeholder="예: 3학년" required maxlength="40"></label><label>이름<input id="personName" placeholder="이름 입력" required maxlength="30"></label><button type="submit">참가자 추가</button></form><p class="hint" style="margin-bottom:0">초등은 학년, 중·고등은 과목을 입력합니다.</p></section>
<section class="card"><div class="listhead"><h2>03 &nbsp;참가자 목록</h2><span id="count" class="count" aria-live="polite"></span></div><p class="hint">이름을 선택하면 서명창이 열립니다. 완료한 서명도 다시 작성할 수 있습니다.</p><div class="tablewrap"><table><thead><tr><th>학교급</th><th>직위</th><th>학년 / 과목</th><th>이름 · 서명하기</th><th>서명 상태</th></tr></thead><tbody id="people"></tbody></table></div></section>
<p class="foot">모든 예시 이름은 가명입니다. 입력·서명은 현재 화면에서만 유지되며 새로고침하면 초기화됩니다.</p>
</main>
<dialog id="signDialog" aria-labelledby="signTitle"><h2 id="signTitle">서명하기</h2><p id="signInfo" style="font-size:14px"></p><canvas id="canvas" aria-label="마우스 또는 손가락으로 서명을 그리는 영역"></canvas><p class="signature-caption">손가락이나 마우스로 위 영역에 서명해 주세요.</p><p id="error" class="message" role="alert"></p><div class="actions"><button id="clear" class="secondary" type="button">지우고 다시 쓰기</button><div><button id="cancel" class="secondary" type="button">닫기</button><button id="save" type="button">서명 완료</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id);
const people=[{level:'초',role:'교사',subject:'3학년',name:'김가온'},{level:'중',role:'교감',subject:'국어',name:'이해솔'},{level:'고',role:'교사',subject:'수학',name:'박나래'},{level:'초',role:'영양사',subject:'전 학년',name:'정다온'}];
function render(){ $('people').replaceChildren();people.forEach((p,i)=>{const tr=document.createElement('tr');[p.level,p.role,p.subject].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.className='name';b.textContent=p.name;b.setAttribute('aria-label',p.name+' 서명하기');b.onclick=()=>openSign(i);td.append(b);tr.append(td);const state=document.createElement('td'),s=document.createElement('span');s.className='status'+(p.signature?' done':'');s.textContent=p.signature?'서명 완료':'서명 대기';state.append(s);tr.append(state);$('people').append(tr)});$('count').textContent=`총 ${people.length}명 · 서명 완료 ${people.filter(p=>p.signature).length}명`;}
$('level').onchange=()=>{const primary=$('level').value==='초';$('subjectLabel').textContent=primary?'학년':'과목';$('subject').placeholder=primary?'예: 3학년':'예: 국어';$('subject').value=''};
$('register').onsubmit=e=>{e.preventDefault();const name=$('personName').value.trim(),subject=$('subject').value.trim();if(!name||!subject)return;people.push({level:$('level').value,role:$('role').value,subject,name});$('personName').value='';$('subject').value='';render()};
let selected=-1,drawing=false,hasInk=false;const canvas=$('canvas'),ctx=canvas.getContext('2d');
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false;$('error').textContent=''}
function openSign(i){selected=i;$('signTitle').textContent=people[i].name+' 님의 서명';$('signInfo').textContent=($('training').value.trim()||'연수명 미입력')+' · '+($('date').value||'날짜 미입력');$('signDialog').showModal();const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#203c34';clearCanvas();if(people[i].signature){const img=new Image();img.onload=()=>{if(selected===i&&$('signDialog').open){ctx.drawImage(img,0,0,r.width,r.height);hasInk=true}};img.src=people[i].signature}}
function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();hasInk=true;$('error').textContent=''};
canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false};
$('clear').onclick=clearCanvas;$('cancel').onclick=()=>$('signDialog').close();$('signDialog').onclose=()=>{drawing=false;selected=-1};$('save').onclick=()=>{if(!hasInk){$('error').textContent='서명을 작성한 후 완료를 눌러 주세요.';return}people[selected].signature=canvas.toDataURL('image/png');render();$('signDialog').close()};render();
</script>
</body></html>
