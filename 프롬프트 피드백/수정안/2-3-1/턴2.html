<!DOCTYPE html>

<head>

<title>가정통신문 | 늘봄초등학교</title>
<style>
:root{--ink:#20362f;--green:#21664e;--muted:#697970;--line:#dfe7e1;--paper:#fff;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;line-height:1.65}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}header{border-bottom:1px solid var(--line);background:#fff}.brand{max-width:960px;margin:auto;padding:23px 28px;display:flex;gap:12px;align-items:center;font-weight:750}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:white}.brand small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}main{max-width:960px;margin:0 auto;padding:56px 28px 70px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.055em;margin:10px 0}p{margin:0 0 20px}.intro{color:var(--muted)}.topline{display:flex;align-items:center;justify-content:space-between;margin:36px 0 12px;font-size:14px}.pill{border-radius:20px;padding:4px 11px;background:#e8efe6;color:#446049;font-size:12px}.board{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.columns{display:grid;grid-template-columns:1fr 150px;gap:20px;padding:14px 25px;background:#edf2ec;color:var(--muted);font-size:12px}.columns span:last-child{text-align:right}.notice{display:grid;grid-template-columns:1fr 150px;gap:20px;width:100%;text-align:left;border:0;background:#fff;padding:26px 25px;cursor:pointer;color:var(--ink);align-items:center}.notice+.notice{border-top:1px solid var(--line)}.notice:hover{background:#f6faf6}.notice:focus-visible,a:focus-visible,.back:focus-visible{outline:3px solid #86b9a0;outline-offset:-4px}.category{display:block;color:var(--green);font-size:12px;margin-bottom:6px}.title{font-size:18px;font-weight:700;letter-spacing:-.025em}.sub{display:block;color:var(--muted);font-size:12px;margin-top:7px}.end{text-align:right;font-size:14px;white-space:nowrap}.arrow{color:var(--green);margin-left:12px}.hint{font-size:13px;color:var(--muted);margin-top:17px}.back{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;cursor:pointer;margin-bottom:25px;color:var(--ink)}.article{background:white;border:1px solid var(--line);border-radius:18px;padding:32px}.article h1{font-size:clamp(25px,4vw,32px);line-height:1.4}.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;color:var(--muted);padding:16px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px}.body{font-size:16px;line-height:1.9;word-break:keep-all}.body ul{padding-left:22px;margin-bottom:24px}.callout{background:#f1f6ee;border-radius:10px;padding:18px 20px;margin:24px 0}.sign{text-align:right;font-weight:650}.attachment{border-top:1px solid var(--line);margin-top:32px;padding-top:25px}.attachment h2{font-size:18px;margin:0 0 15px}.filebar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f5f7f3;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}.filename{font-size:14px;overflow-wrap:anywhere}.filebar a{font-size:13px;color:var(--green);white-space:nowrap}iframe{width:100%;height:620px;border:1px solid var(--line);border-radius:8px;background:#e8ece7}.pdf-help{font-size:12px;color:var(--muted);margin-top:10px}.pdf-help a{color:var(--green)}footer{max-width:904px;border-top:1px solid var(--line);margin:0 auto;padding:22px 0 35px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){.brand{padding:17px 20px}.brand small{font-size:10px}main{padding:32px 18px 44px}.topline{margin-top:26px}.columns{padding:12px 18px;grid-template-columns:1fr 100px}.notice{padding:22px 18px;grid-template-columns:1fr;gap:12px}.title{font-size:17px}.end{text-align:left;font-size:12px;color:var(--muted)}.end:before{content:'게시 종료일  ';margin-right:6px}.arrow{float:right}.columns span:last-child{display:none}.article{padding:23px 19px}.body{font-size:16px}.filebar{align-items:flex-start;flex-direction:column;gap:7px}iframe{height:460px}footer{margin:0 18px}.intro{font-size:14px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">늘</span><span>늘봄초등학교</span><small>학교와 가정을 잇는 소식</small></div></header>
<main>
<section id="listView" aria-labelledby="listTitle"><div class="eyebrow">SCHOOL LETTER</div><h1 id="listTitle" tabindex="-1">가정통신문</h1><p class="intro">아이들의 하루를 함께 살피는, 우리 학교의 소식을 전합니다.</p><div class="topline"><span>전체 <strong>2</strong>건</span><span class="pill">예시 미리보기</span></div><div class="board"><div class="columns"><span>제목</span><span>게시 종료일</span></div><div id="noticeList"></div></div><p class="hint">통신문 제목을 누르면 안내 내용과 첨부 PDF를 확인할 수 있습니다.</p></section>
<section id="detailView" hidden><button class="back" id="backButton">← 목록으로</button><article class="article"><span class="category" id="detailCategory"></span><h1 id="detailTitle" tabindex="-1"></h1><div class="meta" id="detailMeta"></div><div class="body" id="detailBody"></div><section class="attachment" aria-labelledby="attachmentTitle"><h2 id="attachmentTitle">첨부파일</h2><div class="filebar"><span class="filename" id="filename"></span><a id="download" download>PDF 내려받기 ↓</a></div><iframe id="pdfViewer" title="첨부 가정통신문 PDF 미리보기"></iframe><p class="pdf-help">PDF가 보이지 않으면 <a id="openPdf" target="_blank" rel="noopener">새 창에서 열기 ↗</a> 또는 내려받기를 이용해 주세요. 첨부 PDF는 영문으로 구성한 예시 문서입니다.</p></section></article></section>
</main>
<footer>늘봄초등학교 · 웹 가정통신문 미리보기<br>학교명과 모든 안내 내용은 화면 구성을 위한 예시입니다.</footer>
<script>
const notices=[{id:'field-trip',category:'현장체험학습',title:'함께 배우는 가을 현장체험학습 안내',date:'2026.11.10',end:'2026.11.27',file:'가을_현장체험학습_안내.pdf',body:`<p>학부모님, 안녕하십니까?</p><p>교실 밖에서 자연을 관찰하고 친구들과 함께 배우는 가을 현장체험학습을 실시합니다. 아이들이 안전하고 즐겁게 참여할 수 있도록 아래 내용을 확인해 주세요.</p><ul><li><strong>일시:</strong> 2026년 11월 20일(금) 09:00~15:00</li><li><strong>대상:</strong> 3학년 전체 학생</li><li><strong>장소:</strong> 시립 생태공원</li><li><strong>준비물:</strong> 도시락, 물, 모자, 개인 돗자리, 편한 운동화</li></ul><div class="callout"><strong>꼭 확인해 주세요</strong><br>참가 동의서는 11월 16일(월)까지 담임 선생님께 제출해 주세요. 우천 시 일정이 변경될 수 있으며, 변경 사항은 별도로 안내합니다.</div><p>건강 상태와 음식 알레르기 등 사전에 공유할 내용은 담임 선생님께 알려 주세요. 학생들의 안전을 최우선으로 지도하겠습니다.</p><p class="sign">늘봄초등학교장</p>`,pdf:['AUTUMN FIELD TRIP','Neulbom Elementary School','Date: Friday, November 20, 2026 / 09:00 - 15:00','Participants: All Grade 3 students','Place: Municipal Ecology Park','Bring: Lunch, water, a hat, a mat and comfortable shoes.','Please submit the consent form by November 16.','The schedule may change in case of rain.','Please tell your teacher about allergies or health concerns.','SAMPLE DOCUMENT - For preview purposes only.']},{id:'parent-meeting',category:'학교생활',title:'2학기 학부모 상담 주간 안내',date:'2026.11.10',end:'2026.12.04',file:'2학기_학부모_상담_주간.pdf',body:`<p>학부모님, 안녕하십니까?</p><p>학생들의 학교생활과 성장에 대해 함께 이야기하는 학부모 상담 주간을 운영합니다. 가정과 학교가 아이의 마음을 이해하고 성장을 응원하는 시간이 되기를 바랍니다.</p><ul><li><strong>상담 기간:</strong> 2026년 11월 23일(월)~11월 27일(금)</li><li><strong>상담 시간:</strong> 14:00~16:30 중 사전 협의한 시간</li><li><strong>상담 방법:</strong> 학교 방문 또는 전화 상담</li><li><strong>신청 방법:</strong> 담임 선생님께 희망 일시와 상담 방법 전달</li></ul><div class="callout"><strong>신청 기한: 11월 18일(수)</strong><br>한 가정당 약 20분간 진행하며, 최종 상담 일시는 담임 선생님이 개별 안내합니다.</div><p>상담을 통해 나누고 싶은 이야기나 궁금한 점을 미리 전달해 주시면 더 알찬 상담을 준비하는 데 도움이 됩니다.</p><p class="sign">늘봄초등학교장</p>`,pdf:['PARENT CONSULTATION WEEK','Neulbom Elementary School','Period: November 23 - 27, 2026','Time: 14:00 - 16:30 (by appointment)','Format: In-person meeting or telephone consultation','Duration: Approximately 20 minutes per family','Request an appointment from your classroom teacher.','Application deadline: Wednesday, November 18','Your teacher will confirm the final date and time.','SAMPLE DOCUMENT - For preview purposes only.']}];
// Build small, self-contained sample PDFs without any external services.
function makePdf(lines){const esc=s=>s.replace(/[\\()]/g,'\\$&');let stream='BT\n/F1 18 Tf\n50 785 Td\n('+esc(lines[0])+') Tj\n/F1 11 Tf\n';lines.slice(1).forEach(line=>{stream+='0 -35 Td\n('+esc(line)+') Tj\n'});stream+='ET';const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'];let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+obj+'\nendobj\n'});const xref=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n';offsets.slice(1).forEach(n=>pdf+=String(n).padStart(10,'0')+' 00000 n \n');pdf+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';return URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));}
notices.forEach(n=>{n.url=makePdf(n.pdf);const b=document.createElement('button');b.className='notice';b.id='notice-'+n.id;b.innerHTML=`<span><span class="category">${n.category}</span><span class="title">${n.title}</span><span class="sub">등록일 ${n.date} · 첨부 PDF 1개</span></span><span class="end">${n.end}<span class="arrow" aria-hidden="true">↗</span></span>`;b.addEventListener('click',()=>location.hash=n.id);document.getElementById('noticeList').append(b)});
let lastId=null;function render(){const n=notices.find(n=>n.id===location.hash.slice(1));document.getElementById('listView').hidden=!!n;document.getElementById('detailView').hidden=!n;if(n){lastId=n.id;document.getElementById('detailCategory').textContent=n.category;document.getElementById('detailTitle').textContent=n.title;document.getElementById('detailMeta').innerHTML=`<span>등록일 ${n.date}</span><span>게시 종료일 ${n.end}</span>`;document.getElementById('detailBody').innerHTML=n.body;document.getElementById('filename').textContent='PDF · '+n.file;document.getElementById('download').href=n.url;document.getElementById('download').download=n.file;document.getElementById('openPdf').href=n.url;document.getElementById('pdfViewer').src=n.url;document.title=n.title+' | 가정통신문';document.getElementById('detailTitle').focus({preventScroll:true})}else{document.title='가정통신문 | 늘봄초등학교';if(lastId)document.getElementById('notice-'+lastId).focus({preventScroll:true})}window.scrollTo(0,0)}document.getElementById('backButton').addEventListener('click',()=>{location.hash=''});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
