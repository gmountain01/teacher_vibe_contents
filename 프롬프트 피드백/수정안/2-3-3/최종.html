<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src blob:; object-src blob:; form-action 'none'; connect-src 'none'"><title>함께학교 · 학부모 프로그램</title>
<style>
:root{--ink:#24352e;--muted:#77847d;--green:#237453;--line:#e2e9e3;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.5}.banner{background:#243e32;color:#edf5ef;text-align:center;font-size:12px;padding:9px 16px}.header{background:white;border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:23px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:21px}.mark{background:var(--green);color:white;border-radius:12px;width:42px;height:42px;display:grid;place-items:center}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.switch{display:flex;padding:4px;background:#f0f3ef;border-radius:10px}.switch button{padding:9px 17px;border-radius:7px;background:transparent;color:#6f7c74}.switch .active{background:white;color:var(--green);box-shadow:0 2px 6px #243e3210}main{max-width:1200px;margin:38px auto;padding:0 28px}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--green);font-weight:bold}h1{font-size:32px;letter-spacing:-1.4px;margin:8px 0}h2{font-size:25px;letter-spacing:-.8px;line-height:1.45;margin:14px 0}h3{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);margin:0}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.leaf{font-size:48px;background:#e6eee2;width:90px;height:90px;border-radius:50%;text-align:center;line-height:90px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:17px 22px;font-size:13px;color:var(--muted)}.stat strong{color:var(--ink);font-size:25px;margin-right:8px}.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelhead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.small{font-size:12px;color:var(--muted)}.item{display:block;width:100%;padding:23px;text-align:left;background:white;color:var(--ink);border-bottom:1px solid var(--line)}.item:last-child{border:0}.item.selected{background:#eef5ed;box-shadow:inset 4px 0 var(--green)}.item:hover{background:#f3f7f0}.item h3{font-size:16px;margin:10px 0}.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:bold;background:#e6f3e9;color:#27784d}.badge.closed{background:#eef0f1;color:#7b8286}.badge.wait{background:#fff1d5;color:#967028}.count{display:flex;justify-content:space-between;margin-top:17px;font-size:12px;color:var(--muted)}.count b{color:var(--green)}.bar{height:5px;background:#e4eae3;border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#5b9a68}.detail{padding:30px}.description{color:#69796e;white-space:pre-wrap}.info{display:grid;grid-template-columns:110px 1fr;gap:13px;background:#f6f8f4;border-radius:10px;padding:20px;font-size:13px;margin:24px 0}.info dt{color:var(--muted)}.info dd{margin:0;font-weight:600}.primary{background:var(--green);color:white;padding:13px 20px;border-radius:8px;font-weight:bold}.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 16px}.widebtn{width:100%}.notice{padding:13px 15px;background:#f6f8f4;border-radius:8px;color:#71816e;font-size:12px;margin:17px 0}.formpart{border-top:1px solid var(--line);margin-top:25px;padding-top:23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600}input,select,textarea{width:100%;display:block;background:white;border:1px solid #d9e2d9;border-radius:7px;padding:11px;margin-top:6px;color:var(--ink);min-width:0}input:focus,select:focus,textarea:focus{outline:3px solid #dfefdf;border-color:#598c66}textarea{min-height:110px;resize:vertical}.children{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.tabbar{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:-5px 0 24px}.tabbar button{background:none;padding:13px 0;color:var(--muted)}.tabbar button.active{color:var(--green);border-bottom:2px solid var(--green);font-weight:bold}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{background:#f5f7f3;color:#728074}.empty{text-align:center;padding:40px;color:var(--muted)}iframe{width:100%;height:360px;border:1px solid var(--line);border-radius:8px}a{color:var(--green)}.file{padding:10px 12px;background:#f5f7f3;border-radius:7px;margin:8px 0;font-size:13px}.success{max-width:650px;margin:35px auto;padding:45px;text-align:center}.check{margin:auto;background:#e5f3e7;color:var(--green);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px}.success .info{text-align:left}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263e31;color:white;padding:13px 25px;border-radius:10px;box-shadow:0 8px 25px #0002;z-index:20;max-width:90%;font-size:13px}footer{text-align:center;font-size:11px;color:#8c978d;padding:35px} [hidden]{display:none!important}@media(max-width:800px){main{padding:0 16px;margin:25px auto}.nav{padding:16px;flex-wrap:wrap}.layout{grid-template-columns:1fr}.hero .leaf{display:none}h1{font-size:26px}.detail{padding:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.stat{padding:12px}.stat strong{font-size:21px}.info{grid-template-columns:90px 1fr}.success{padding:25px}}@media print{body{background:white}.banner,.header,.hero,.stats,aside,.tabbar,.actions,footer,.toast,#editor{display:none!important}main{margin:0;padding:0;max-width:none}.layout{display:block}.panel{border:0}.detail{padding:0}#roster{display:block!important}th,td{font-size:10px}}
</style></head><body>
<div class="banner">외부 연결 없는 로컬 미리보기 · 실제 접수·계정 인증·배포·이메일 발송 없음 · 새로고침하면 초기화됩니다</div>
<header class="header"><div class="nav"><div class="brand"><span class="mark">✳</span><div>함께학교<small>PARENT LEARNING COMMUNITY</small></div></div><div class="switch"><button id="parentMode" class="active" onclick="setMode(false)">학부모 신청</button><button id="adminMode" onclick="setMode(true)">관리자 화면</button></div></div></header>
<main><div class="hero"><div><div class="eyebrow" id="eyebrow">함께 배우고, 함께 자라는 시간</div><h1 id="heading">학부모 프로그램 참가 신청</h1><p class="sub" id="subtitle">관심 있는 프로그램을 선택해 주세요. 정원이 차면 자동으로 마감됩니다.</p></div><div class="leaf" aria-hidden="true">❧</div></div><div class="stats" id="stats"></div><div class="layout" id="layout"><aside class="panel"><div class="panelhead"><b>프로그램 목록</b><span class="small" id="total"></span></div><div id="list"></div><div id="newWrap" hidden style="padding:18px"><button class="primary widebtn" onclick="newProgram()">＋ 프로그램 등록</button></div></aside><section class="panel detail" id="content"></section></div><section id="complete" class="panel success" hidden></section></main>
<footer>함께학교 · 학부모의 배움이 아이의 성장으로 이어집니다.<br>모든 인물과 프로그램은 예시입니다. 실제 개인정보를 입력하지 마세요.</footer><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=(offset,time='09:00')=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${time}`};
const fmt=v=>v.replace('T',' ').replaceAll('-','. '),range=p=>`${fmt(p.start)} ~ ${fmt(p.end)}`;
let programs=[{id:1,title:'자녀와 소통하는 마음 대화법',category:'학부모 교육',description:'아이의 마음을 이해하는 첫걸음, 공감과 경청에서 시작합니다.\n다양한 일상 속 대화 사례를 통해 자녀와 더 가까워지는 소통 방법을 함께 연습해 보세요.',type:'datetime',start:date(25,'10:00'),end:date(25,'12:00'),rs:date(-3),re:date(18,'18:00'),place:'본교 2층 시청각실',capacity:25,count:18,apps:[],files:[]},{id:2,title:'우리 가족 친환경 공방',category:'가족 체험',description:'자녀와 함께 친환경 생활용품을 만들며 환경을 위한 작은 실천을 배웁니다.\n준비물은 학교에서 제공합니다. 편안한 복장으로 참여해 주세요. 마지막 한 자리 신청과 자동 마감을 체험할 수 있습니다.',type:'datetime',start:date(30,'10:00'),end:date(30,'11:30'),rs:date(-2),re:date(22,'18:00'),place:'본교 1층 미술실',capacity:20,count:19,apps:[],files:[]},{id:3,title:'함께 읽는 시간, 학부모 독서 모임',category:'독서 모임',description:'한 권의 책을 함께 읽고 자녀의 성장과 부모의 일상을 이야기합니다.\n매주 한 번, 서로의 생각을 듣고 나누는 시간입니다.',type:'period',start:date(8).slice(0,10),end:date(29).slice(0,10),rs:date(-15),re:date(-1,'18:00'),place:'본교 도서관',capacity:15,count:15,apps:[],files:[]}];
programs.forEach(p=>{p.apps=Array.from({length:p.count},(_,i)=>({parent:['김하늘','이서연','박지우','최다온'][i%4]+(i>3?' '+(i+1):''),grade:i%6+1,classroom:i%3+1,child:['김새봄','이도윤','박수아','최시온'][i%4],phone:'010-0000-'+String(i+1).padStart(4,'0'),created:fmt(date(-1,'10:'+String(i+10).padStart(2,'0')))}))});
let admin=false,selected=1,tab='roster',busy=false;
const current=()=>programs.find(p=>p.id===selected),status=p=>p.count>=p.capacity||Date.now()>=new Date(p.re).getTime()?'마감':Date.now()<new Date(p.rs).getTime()?'모집 예정':'모집 중';
const badge=p=>`<span class="badge ${status(p)==='마감'?'closed':status(p)==='모집 예정'?'wait':''}">${status(p)}</span>`;
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').hidden=true,4500)}
function setMode(v){admin=v;tab='roster';$('parentMode').classList.toggle('active',!v);$('adminMode').classList.toggle('active',v);$('heading').textContent=v?'프로그램 관리':'학부모 프로그램 참가 신청';$('eyebrow').textContent=v?'ADMINISTRATION · 화면 전환 체험':'함께 배우고, 함께 자라는 시간';$('subtitle').textContent=v?'프로그램을 등록하고 신청 현황을 확인하세요. 인증은 화면 전환으로 대신합니다.':'관심 있는 프로그램을 선택해 주세요. 정원이 차면 자동으로 마감됩니다.';$('newWrap').hidden=!v;home();}
function home(){ $('complete').hidden=true;$('layout').hidden=false;$('stats').hidden=false;render(); }
function select(id){selected=id;tab='roster';render()}
function render(){ $('stats').innerHTML=[['전체 프로그램',programs.length,'개'],['모집 중',programs.filter(p=>status(p)==='모집 중').length,'개'],['전체 신청',programs.reduce((n,p)=>n+p.count,0),'명']].map(([t,n,u])=>`<div class="stat"><div>${t}</div><strong>${n}</strong>${u}</div>`).join('');$('total').textContent=`전체 ${programs.length}개`;$('list').innerHTML=programs.map(p=>`<button class="item ${selected===p.id?'selected':''}" onclick="select(${p.id})">${badge(p)} <span class="small">${esc(p.category||'학부모 프로그램')}</span><h3>${esc(p.title)}</h3><div class="small">${esc(fmt(p.start))} · ${esc(p.place)}</div><div class="count"><span>신청 인원</span><b>${p.count} / ${p.capacity}명</b></div><div class="bar"><i style="width:${Math.min(100,p.count/p.capacity*100)}%"></i></div></button>`).join('');if(admin)adminDetail();else detail();}
function files(p){return `${p.pdf?`<h3>관련 문서</h3><iframe title="선택한 로컬 PDF 미리보기" src="${p.pdf.url}"></iframe><div class="small">${esc(p.pdf.name)} · 로컬 미리보기</div>`:''}${p.files.map((f,i)=>`<div class="file">▤ ${esc(f.name)} <a href="${f.url}" download="${esc(f.name)}">내려받기</a></div>`).join('')}`}
function information(p){return `<dl class="info"><dt>운영 일시·기간</dt><dd>${esc(range(p))}</dd><dt>모집 기간</dt><dd>${esc(fmt(p.rs))} ~ ${esc(fmt(p.re))}</dd><dt>운영 장소</dt><dd>${esc(p.place)}</dd><dt>모집 인원</dt><dd>${p.count} / ${p.capacity}명 · 남은 자리 ${Math.max(0,p.capacity-p.count)}명</dd></dl>`}
function detail(){const p=current();$('content').innerHTML=`${badge(p)} <span class="small">${esc(p.category||'학부모 프로그램')}</span><h2>${esc(p.title)}</h2><p class="description">${esc(p.description)}</p>${files(p)}${information(p)}<div class="notice">ⓘ 선착순으로 접수되며, 정원이 차거나 모집 기간이 지나면 신청이 마감됩니다.</div><button class="primary widebtn" onclick="application()" ${status(p)!=='모집 중'?'disabled':''}>${status(p)==='모집 중'?'참가 신청 →':status(p)}</button><div id="application"></div>`}
function field(label,name,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`}
function application(){if(status(current())!=='모집 중'){render();return} $('application').innerHTML=`<div class="formpart"><h3>참가 신청서</h3><p class="small">모든 항목은 필수입니다. 예시 정보를 입력해 주세요.</p><form id="applyForm"><div class="grid"><div class="full">${field('학부모 이름','parent','text','','maxlength="30" placeholder="예: 김하늘"')}</div><div class="children full">${field('자녀 학년','grade','number','','min="1" max="12"')}${field('자녀 반','classroom','number','','min="1" max="99"')}${field('자녀 이름','child','text','','maxlength="30"')}</div>${field('전화번호','phone','tel','','pattern="01[0-9]-?[0-9]{3,4}-?[0-9]{4}" placeholder="010-0000-0000" title="010-0000-0000 형식"')}${field('신청서 비밀번호','password','password','','minlength="4" maxlength="30" placeholder="4자 이상" autocomplete="new-password"')}</div><div class="notice">입력 내용은 현재 탭의 메모리에만 보관됩니다. 비밀번호는 접수 후 보관하지 않습니다.</div><button class="primary widebtn">신청 완료하기</button></form></div>`;$('applyForm').onsubmit=submitApplication;$('applyForm').elements.parent.focus()}
function submitApplication(e){e.preventDefault();if(busy)return;busy=true;const p=current(),data=Object.fromEntries(new FormData(e.target));if(status(p)!=='모집 중'){busy=false;render();notify('모집 기간이 종료되었거나 정원이 마감되었습니다.');return}delete data.password;data.created=new Date().toLocaleString('ko-KR');p.apps.push(data);p.count++;busy=false;render();$('layout').hidden=true;$('stats').hidden=true;$('complete').hidden=false;$('complete').innerHTML=`<div class="check">✓</div><h2>참가 신청이 완료되었습니다</h2><p class="sub">미리보기 접수가 완료되었습니다. 실제 신청은 아닙니다.</p><dl class="info">${[['프로그램',p.title],['학부모',data.parent],['자녀',`${data.grade}학년 ${data.classroom}반 ${data.child}`],['전화번호',data.phone],['운영 일정',range(p)],['장소',p.place]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="small">${p.count>=p.capacity?'정원이 충족되어 이 프로그램은 자동 마감되었습니다.':'관리자 화면에서 신청 현황을 확인할 수 있습니다.'}</p><button class="primary widebtn" onclick="home()">첫 화면으로</button>`;window.scrollTo(0,0)}
function adminDetail(){const p=current();$('content').innerHTML=`<div class="tabbar"><button class="${tab==='roster'?'active':''}" onclick="tab='roster';adminDetail()">신청자 현황</button><button class="${tab==='edit'?'active':''}" onclick="tab='edit';adminDetail()">프로그램 정보 수정</button></div><div id="adminBody"></div>`;if(tab==='edit'){editor(p);return}$('adminBody').innerHTML=`<section id="roster">${badge(p)}<h2>${esc(p.title)}</h2>${information(p)}<div style="display:flex;justify-content:space-between;align-items:center"><h3>신청자 명단 <span class="small">${p.count}명</span></h3><span class="small">예시 데이터 포함</span></div><div class="tablewrap"><table><thead><tr>${['번호','학부모','학년','반','자녀 이름','전화번호','신청 일시'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${p.apps.map((a,i)=>`<tr>${[i+1,a.parent,a.grade,a.classroom,a.child,a.phone,a.created].map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="7" class="empty">아직 신청자가 없습니다.</td></tr>'}</tbody></table></div><div class="actions"><button class="secondary" onclick="window.print()">명단 인쇄</button><button class="primary" onclick="downloadRoster()">엑셀용 CSV 내려받기</button></div><p class="small">내려받기는 현재 메모리의 명단으로 생성하는 Excel 호환 CSV 파일입니다.</p></section>`}
function newProgram(){tab='edit';$('content').innerHTML='<div id="adminBody"></div>';editor(null)}
function editor(p){$('adminBody').innerHTML=`<form id="editor"><h2>${p?'프로그램 정보 수정':'새 프로그램 등록'}</h2><p class="small">저장한 내용은 학부모 신청 화면에 바로 반영됩니다.</p><div class="grid"><div class="full">${field('프로그램 이름','title','text',p?.title||'','maxlength="120"')}</div><label class="full">프로그램 설명<textarea name="description" required maxlength="5000">${esc(p?.description||'')}</textarea></label><label>운영일 형식<select name="type" onchange="changeType(this.value)"><option value="datetime">날짜와 시간</option><option value="period">기간</option></select></label>${field('모집 인원','capacity','number',p?.capacity||20,`min="${p?.count||1}" max="10000"`)}${field('운영 시작','start','datetime-local',p?.start||date(25,'10:00'))}${field('운영 종료','end','datetime-local',p?.end||date(25,'12:00'))}<div class="full">${field('운영 장소','place','text',p?.place||'','maxlength="200"')}</div>${field('모집 시작','rs','datetime-local',p?.rs||date(-1))}${field('모집 종료','re','datetime-local',p?.re||date(20,'18:00'))}<label class="full">관련 PDF (선택)<input name="pdf" type="file" accept="application/pdf,.pdf"><span class="small">설명 아래 로컬 PDF 미리보기로 표시합니다. 서버 업로드는 하지 않습니다.</span></label><label class="full">추가 파일 (선택)<input name="extras" type="file" multiple accept=".pdf,.doc,.docx,.hwp,.hwpx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.7z,.rar"><span class="small">문서·압축 파일을 로컬에서만 보관하고 내려받기 링크로 표시합니다.</span></label></div><div id="localPreview"></div>${p?files(p):''}<div class="notice">파일당 최대 10MB · 추가 파일 최대 5개 · 합계 20MB. 새 파일을 선택하지 않으면 기존 첨부가 유지됩니다.</div><div class="actions"><button class="primary" type="submit">${p?'변경 사항 저장':'프로그램 등록'}</button><button class="secondary" type="button" onclick="render()">취소</button></div></form>`;const f=$('editor');f.elements.type.value=p?.type||'datetime';changeType(f.elements.type.value,false);f.elements.pdf.onchange=()=>{const file=f.elements.pdf.files[0];$('localPreview').innerHTML=file?`<div class="file">선택한 로컬 파일: ${esc(file.name)}</div>`:''};f.onsubmit=e=>saveProgram(e,p)}
function changeType(type,reset=true){const f=$('editor');for(const n of ['start','end']){const v=f.elements[n].value;f.elements[n].type=type==='period'?'date':'datetime-local';f.elements[n].value=type==='period'?v.slice(0,10):v.length===10?v+'T10:00':v;}}
function saveProgram(e,p){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),pdf=f.elements.pdf.files[0],extra=[...f.elements.extras.files],all=[pdf,...extra].filter(Boolean);if(new Date(d.end)<new Date(d.start)||new Date(d.re)<=new Date(d.rs)){notify('운영·모집 종료일은 시작일 이후로 지정해 주세요.');return}if(Number(d.capacity)<(p?.count||0)){notify('현재 신청 인원보다 정원을 줄일 수 없습니다.');return}if(extra.length>5||all.some(x=>x.size>10485760)||all.reduce((s,x)=>s+x.size,0)>20971520){notify('첨부 파일의 개수와 용량을 확인해 주세요.');return}if(pdf&&!pdf.name.toLowerCase().endsWith('.pdf')){notify('관련 문서는 PDF로 선택해 주세요.');return}const fileObj=f=>({name:f.name,url:URL.createObjectURL(f)});const next={...p,id:p?.id||Date.now(),category:p?.category||'학부모 프로그램',title:d.title.trim(),description:d.description.trim(),type:d.type,start:d.start,end:d.end,rs:d.rs,re:d.re,place:d.place.trim(),capacity:Number(d.capacity),count:p?.count||0,apps:p?.apps||[],pdf:pdf?fileObj(pdf):p?.pdf,files:extra.length?extra.map(fileObj):p?.files||[]};if(!next.title||!next.description||!next.place){notify('이름, 설명, 장소를 입력해 주세요.');return}if(p)programs[programs.indexOf(p)]=next;else programs.push(next);selected=next.id;tab='roster';render();notify('현재 브라우저 메모리에 저장했습니다.');}
function downloadRoster(){const p=current(),rows=[['번호','학부모 이름','자녀 학년','자녀 반','자녀 이름','전화번호','신청 일시'],...p.apps.map((a,i)=>[i+1,a.parent,a.grade,a.classroom,a.child,a.phone,a.created])],safe=v=>{let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'},blob=new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=p.title.replace(/[\\/:*?"<>|]/g,'_')+'_신청자명단.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('예시 명단 CSV를 생성했습니다.');}
render();
</script></body></html>
