<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과제 점검판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}main{max-width:1280px;margin:auto;padding:36px 24px 60px}h1{font-size:32px;margin:0 0 10px}.intro{color:#627089;margin:0 0 28px}.setup{background:white;border:1px solid #dce3ef;border-radius:20px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;box-shadow:0 6px 24px #23395308}label{display:block;font-size:17px;font-weight:700;margin-bottom:10px}input,textarea{width:100%;font:inherit;padding:13px 15px;border:1px solid #b9c5d7;border-radius:10px;color:inherit;background:#fff}textarea{resize:vertical;min-height:138px}input:focus,textarea:focus{outline:3px solid #b7d2ff;border-color:#326bce}.hint{font-size:14px;color:#627089;line-height:1.7;margin:10px 0}.primary{background:#285fbd;color:white;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:750;cursor:pointer}.primary:hover{background:#204f9e}.error{color:#b42318;min-height:22px;margin:12px 0 0}.board{margin-top:32px}.board-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:30px;margin:0;overflow-wrap:anywhere}.count{font-size:26px;font-weight:800;color:#175c43;background:#e0f3eb;border-radius:14px;padding:13px 20px;white-space:nowrap}.progress{height:10px;background:#dfe6f0;border-radius:10px;overflow:hidden;margin-bottom:24px}.progress div{height:100%;background:#26966c;transition:width .2s}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{min-height:156px;padding:24px 14px;border:2px solid #d4ddeb;background:white;border-radius:18px;cursor:pointer;font:inherit;color:#27364e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 4px 10px #23395306;transition:background .15s,border-color .15s}.card:hover{border-color:#7d9ac9}.card:focus-visible{outline:4px solid #91baff;outline-offset:3px}.name{font-size:30px;font-weight:800;overflow-wrap:anywhere;max-width:100%}.status{font-size:18px;font-weight:700;color:#6b7890}.card.done{background:#dcf5e8;border-color:#239363;color:#14553c}.done .status{color:#146341}.empty{text-align:center;padding:55px 20px;background:#fff;border:2px dashed #d4ddeb;border-radius:18px;color:#64728a;line-height:1.8}.guide{color:#627089;font-size:15px;margin:0 0 18px}@media(max-width:640px){main{padding:24px 16px}.setup{grid-template-columns:1fr;padding:20px}h2{font-size:25px}.count{font-size:22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.name{font-size:26px}.card{min-height:140px}}
</style>
</head>
<body>
<main>
<h1>과제 점검판</h1>
<p class="intro">학생 카드를 눌러 제출 여부를 한눈에 확인하세요.</p>
<form class="setup" id="setup">
<div><label for="assignment">과제 이름</label><input id="assignment" placeholder="예: 수학 익힘책 24쪽" maxlength="150"><p class="hint">과제 이름과 명단을 입력한 뒤 점검판을 만들어 주세요.</p><button class="primary" type="submit">점검판 만들기</button><p class="error" id="error" role="alert"></p></div>
<div><label for="students">학생 명단</label><textarea id="students" placeholder="김민준&#10;이서연&#10;박지우"></textarea><p class="hint">한 줄에 한 명씩 입력하세요. 쉼표로 구분해도 됩니다.<br>명단을 새로 적용하면 제출 상태가 초기화됩니다.</p></div>
</form>
<section class="board" aria-label="학생별 과제 제출 현황">
<div class="board-head"><h2 id="boardTitle">과제 제출 현황</h2><div class="count" id="count" aria-live="polite">제출 0/0명</div></div>
<div class="progress" aria-hidden="true"><div id="bar" style="width:0%"></div></div>
<p class="guide" id="guide" hidden>카드를 누르면 제출 처리됩니다. 다시 누르면 취소됩니다.</p>
<div class="cards" id="cards"></div><div class="empty" id="empty">아직 점검판이 없습니다.<br>위에서 과제 이름과 학생 명단을 입력해 주세요.</div>
</section>
</main>
<script>
const form=document.getElementById('setup'),cards=document.getElementById('cards');
let students=[];
function updateCount(){const n=students.filter(s=>s.done).length;document.getElementById('count').textContent=`제출 ${n}/${students.length}명`;document.getElementById('bar').style.width=students.length?`${n/students.length*100}%`:'0%'}
form.addEventListener('submit',event=>{
 event.preventDefault();
 const title=document.getElementById('assignment').value.trim();
 const names=document.getElementById('students').value.split(/[\n,，]+/).map(s=>s.trim()).filter(Boolean);
 const error=document.getElementById('error');
 if(!title||!names.length){error.textContent='과제 이름과 학생 명단을 모두 입력해 주세요.';return}
 error.textContent='';students=names.map(name=>({name,done:false}));
 document.getElementById('boardTitle').textContent=title;
 document.getElementById('empty').hidden=true;document.getElementById('guide').hidden=false;cards.replaceChildren();
 students.forEach(student=>{
  const button=document.createElement('button');button.type='button';button.className='card';button.setAttribute('aria-pressed','false');
  const name=document.createElement('span');name.className='name';name.textContent=student.name;
  const status=document.createElement('span');status.className='status';status.textContent='미제출';
  button.append(name,status);button.setAttribute('aria-label',`${student.name}, 미제출`);
  button.addEventListener('click',()=>{student.done=!student.done;button.classList.toggle('done',student.done);button.setAttribute('aria-pressed',String(student.done));status.textContent=student.done?'✓ 제출':'미제출';button.setAttribute('aria-label',`${student.name}, ${student.done?'제출':'미제출'}`);updateCount()});
  cards.append(button);
 });updateCount();
});
</script>
</body>
</html>
