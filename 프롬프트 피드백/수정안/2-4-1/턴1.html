<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>회신서 제출 현황판</title>
<style>
:root{font-family:'Malgun Gothic',sans-serif;color:#233047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173c59;color:white;padding:30px max(24px,calc((100% - 1120px)/2))}h1{font-size:26px;margin:0 0 8px}header p{color:#c5dbe9;margin:0;font-size:14px}main{max-width:1120px;margin:24px auto;padding:0 20px}nav{display:flex;gap:8px;margin-bottom:24px}button{font:inherit;cursor:pointer;border:1px solid #ccd6e0;border-radius:8px;background:white;padding:9px 16px;color:#293e52}button:hover{filter:brightness(.96)}button.primary,nav button.active{background:#176c82;color:white;border-color:#176c82}button.danger{color:#b03333}button:disabled{opacity:.45;cursor:default}.card{background:white;border:1px solid #dfe6ed;border-radius:14px;padding:24px;margin-bottom:20px}h2{font-size:19px;margin:0 0 20px}h3{font-size:16px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}input,select,textarea{font:inherit;border:1px solid #cbd5df;border-radius:7px;padding:10px;width:100%;background:white;color:inherit}textarea{resize:vertical;min-height:76px}.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}.muted{color:#68788a;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e6ecf1;white-space:nowrap}th{background:#f5f8fb;color:#53677b;font-size:12px}td.memo{white-space:pre-wrap;min-width:130px;max-width:250px}.badge{display:inline-block;background:#e7f3f5;color:#176c82;border-radius:20px;padding:4px 10px;font-size:12px}.empty{text-align:center;padding:32px;color:#7c8998}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs .active{border-color:#176c82;color:#176c82;background:#edf8fa}.notice{background:#edf5fa;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.8;margin-bottom:16px}#status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#173c59;color:white;border-radius:10px;z-index:3}small.error{color:#b03333} [hidden]{display:none!important}@media(max-width:650px){.fields{grid-template-columns:1fr}.card{padding:17px}header{padding:24px}main{padding:0 12px}.row{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>회신서 제출 현황판</h1><p>회신문서와 우리 학교 명단을 한곳에서 관리하세요.</p></header>
<main>
<nav aria-label="주 화면"><button class="active" data-page="documents">회신문서</button><button data-page="roster">명단 관리</button></nav>
<section id="documents">
<div class="card"><h2 id="formTitle">새 회신문서 등록</h2>
<form id="docForm"><div class="fields"><div><label for="docName">문서 이름 *</label><input id="docName" required maxlength="150" placeholder="예: 현장체험학습 참가 회신서"></div><div><label for="docTarget">대상 *</label><select id="docTarget"><option>학생</option><option>교직원</option><option>학생 및 교직원</option></select></div><div><label for="docDate">회신 마감일 *</label><input id="docDate" type="date" required></div><div class="wide"><label for="docMemo">메모</label><textarea id="docMemo" placeholder="안내 사항을 입력하세요."></textarea></div></div><div class="actions"><button class="primary" id="docSubmit">문서 등록</button><button type="button" id="cancelEdit" hidden>수정 취소</button></div></form></div>
<div class="card"><div class="row"><h2>등록된 회신문서</h2><span class="badge" id="docCount"></span></div><div class="scroll"><table><thead><tr><th>문서 이름</th><th>대상</th><th>회신 마감일</th><th>메모</th><th>관리</th></tr></thead><tbody id="docRows"></tbody></table></div></div>
</section>
<section id="roster" hidden>
<div class="tabs" aria-label="명단 구분"><button class="active" data-kind="students">학생 명단</button><button data-kind="staff">교직원 명단</button></div>
<div class="card"><h2 id="rosterTitle">학생 명단 등록</h2><div class="notice" id="pasteHelp"></div>
<label for="pasteArea">엑셀 표 붙여넣기</label><textarea id="pasteArea" rows="6" placeholder="엑셀에서 셀을 복사한 뒤 이곳에 붙여 넣으세요."></textarea><div class="actions"><button id="previewBtn" class="primary">표로 미리보기</button><button id="clearPaste">입력 지우기</button></div>
<div id="preview" hidden><h3>저장 전 확인</h3><p class="muted">오류가 있으면 위의 내용을 고친 후 미리보기를 다시 눌러 주세요. 기존 명단에 추가됩니다.</p><div class="scroll"><table><thead id="previewHead"></thead><tbody id="previewRows"></tbody></table></div><p id="previewSummary" class="muted"></p><button class="primary" id="saveRoster">확인한 명단 저장</button></div></div>
<div class="card"><div class="row"><h2 id="savedTitle">저장된 학생 명단</h2><span class="badge" id="rosterCount"></span></div><p class="muted" id="sortHelp"></p><div class="scroll"><table><thead id="rosterHead"></thead><tbody id="rosterRows"></tbody></table></div></div>
</section>
<p class="muted">자료는 이 브라우저에 저장됩니다. 다른 기기와 공유되지 않으며, 브라우저 저장 데이터를 삭제하면 자료도 지워집니다.</p>
</main><div id="status" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id), KEY='reply-dashboard-v1';
let state={documents:[],students:[],staff:[]},kind='students',editing=null,pending=[],timer;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&['documents','students','staff'].every(k=>Array.isArray(saved[k])))state=saved}catch(e){alert('저장 자료를 읽지 못했습니다. 브라우저 저장 설정을 확인해 주세요.')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('status').textContent=s;$('status').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('status').hidden=true,2800)}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch(e){alert('저장하지 못했습니다. 브라우저 저장 공간과 설정을 확인해 주세요.');return false}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('documents').hidden=b.dataset.page!=='documents';$('roster').hidden=b.dataset.page!=='roster'});
function resetDoc(){editing=null;$('docForm').reset();$('formTitle').textContent='새 회신문서 등록';$('docSubmit').textContent='문서 등록';$('cancelEdit').hidden=true}
$('cancelEdit').onclick=resetDoc;
$('docForm').onsubmit=e=>{e.preventDefault();const name=$('docName').value.trim();if(!name){$('docName').setCustomValidity('문서 이름을 입력해 주세요.');$('docName').reportValidity();return}const doc={id:editing||uid(),name,target:$('docTarget').value,date:$('docDate').value,memo:$('docMemo').value.trim()};const docs=editing?state.documents.map(d=>d.id===editing?doc:d):[...state.documents,doc];if(commit({...state,documents:docs})){resetDoc();renderDocs();notify('회신문서를 저장했습니다.')}};
$('docName').oninput=()=>$('docName').setCustomValidity('');
function renderDocs(){$('docCount').textContent=state.documents.length+'건';$('docRows').innerHTML=state.documents.length?state.documents.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<tr><td>${esc(d.name)}</td><td><span class="badge">${esc(d.target)}</span></td><td>${esc(d.date)}</td><td class="memo">${esc(d.memo)||'—'}</td><td><button data-edit="${esc(d.id)}">수정</button> <button class="danger" data-delete="${esc(d.id)}">삭제</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">등록된 회신문서가 없습니다.</td></tr>'}
$('docRows').onclick=e=>{let id=e.target.dataset.edit;if(id){const d=state.documents.find(d=>d.id===id);editing=id;$('docName').value=d.name;$('docTarget').value=d.target;$('docDate').value=d.date;$('docMemo').value=d.memo;$('formTitle').textContent='회신문서 수정';$('docSubmit').textContent='수정 저장';$('cancelEdit').hidden=false;$('docName').focus();window.scrollTo({top:0,behavior:'smooth'})}id=e.target.dataset.delete;if(id&&confirm('이 회신문서를 삭제할까요?')){if(commit({...state,documents:state.documents.filter(d=>d.id!==id)})){if(editing===id)resetDoc();renderDocs();notify('문서를 삭제했습니다.')}}};
function columns(){return kind==='students'?['학년','반','번호','이름']:['이름']}
function clearPreview() {pending=[];$('preview').hidden=true}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));$('pasteArea').value='';clearPreview();renderRoster()});
$('clearPaste').onclick=()=>{$('pasteArea').value='';clearPreview()};$('pasteArea').oninput=clearPreview;
function key(r){return kind==='students'?[r.grade,r.classroom,r.number].join('|'):r.name}
// Excel TSV: preserve embedded line breaks and tabs in quoted cells.
function parseTSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&(quoted||cell==='')){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c==='\t'&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);rows.push(row);return rows.filter(r=>r.some(c=>c.trim()))}
$('previewBtn').onclick=()=>{clearPreview();let rows=parseTSV($('pasteArea').value);if(!rows.length){notify('붙여 넣을 명단을 입력해 주세요.');return}const cols=columns();if(cols.every((c,i)=>(rows[0][i]||'').trim()===c))rows.shift();if(!rows.length){notify('제목 아래에 명단을 입력해 주세요.');return}const seen=new Set(state[kind].map(key));pending=rows.map((cells,i)=>{cells=cells.map(c=>c.trim());let r=kind==='students'?{grade:cells[0],classroom:cells[1],number:cells[2],name:cells[3]}:{name:cells[0]};let error='';if(cells.length!==cols.length)error=cols.length+'개 열이 필요합니다.';else if(cells.some(c=>!c))error='빈 항목이 있습니다.';else if(kind==='students'&&!cells.slice(0,3).every(c=>/^\d+$/.test(c)&&Number(c)>0&&Number.isSafeInteger(Number(c))))error='학년·반·번호는 양의 정수로 입력하세요.';else if(/[\r\n]/.test(r.name))error='이름의 줄바꿈을 제거하세요.';if(!error&&kind==='students'){r.grade=String(Number(r.grade));r.classroom=String(Number(r.classroom));r.number=String(Number(r.number))}if(!error){if(seen.has(key(r)))error=kind==='students'?'같은 학년·반·번호가 있습니다.':'같은 이름이 있습니다.';else seen.add(key(r))}return{...r,id:uid(),error,line:i+1}});$('previewHead').innerHTML='<tr><th>행</th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>확인</th></tr>';$('previewRows').innerHTML=pending.map(r=>'<tr><td>'+r.line+'</td>'+values(r).map(c=>'<td>'+esc(c)+'</td>').join('')+'<td>'+(r.error?'<small class="error">'+esc(r.error)+'</small>':'저장 가능')+'</td></tr>').join('');let errors=pending.filter(r=>r.error).length;$('previewSummary').textContent=`총 ${pending.length}명 · 오류 ${errors}건`;$('saveRoster').disabled=errors>0;$('preview').hidden=false};
function values(r){return kind==='students'?[r.grade,r.classroom,r.number,r.name]:[r.name]}
$('saveRoster').onclick=()=>{if(!pending.length||pending.some(r=>r.error))return;const entries=pending.map(({error,line,...r})=>r);if(commit({...state,[kind]:[...state[kind],...entries]})){$('pasteArea').value='';clearPreview();renderRoster();notify(entries.length+'명의 명단을 저장했습니다.')}};
function renderRoster(){const student=kind==='students',label=student?'학생':'교직원';$('rosterTitle').textContent=label+' 명단 등록';$('savedTitle').textContent='저장된 '+label+' 명단';$('pasteHelp').textContent=student?'엑셀 열 순서: 학년 → 반 → 번호 → 이름. 첫 줄의 제목(학년, 반, 번호, 이름)은 자동으로 제외합니다. 같은 학년·반·번호는 중복 저장되지 않습니다.':'엑셀에서 이름 한 열을 복사해 붙여 넣으세요. 첫 줄의 제목(이름)은 자동으로 제외합니다. 동일 이름은 중복으로 처리됩니다.';$('sortHelp').textContent=student?'학년 → 반 → 번호 순으로 표시합니다.':'이름 가나다순으로 표시합니다.';$('rosterCount').textContent=state[kind].length+'명';$('rosterHead').innerHTML='<tr>'+columns().map(c=>'<th>'+c+'</th>').join('')+'<th>관리</th></tr>';const sorted=state[kind].slice().sort((a,b)=>student?(Number(a.grade)-Number(b.grade)||Number(a.classroom)-Number(b.classroom)||Number(a.number)-Number(b.number)):a.name.localeCompare(b.name,'ko'));$('rosterRows').innerHTML=sorted.length?sorted.map(r=>'<tr>'+values(r).map(c=>'<td>'+esc(c)+'</td>').join('')+`<td><button class="danger" data-remove="${esc(r.id)}">삭제</button></td></tr>`).join(''):`<tr><td colspan="${columns().length+1}" class="empty">저장된 ${label} 명단이 없습니다.</td></tr>`}
$('rosterRows').onclick=e=>{const id=e.target.dataset.remove;if(id&&confirm('이 명단을 삭제할까요?')&&commit({...state,[kind]:state[kind].filter(r=>r.id!==id)})){clearPreview();renderRoster();notify('명단을 삭제했습니다.')}};
renderDocs();renderRoster();
</script></body></html>
