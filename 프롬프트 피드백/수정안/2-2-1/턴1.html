<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진급 반 인계 카드</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#25352f;background:#f3f6f3;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#214e40;color:white;padding:36px max(24px,calc((100% - 1180px)/2)) 30px}header small{letter-spacing:.16em;color:#c3dacd}h1{font-size:30px;margin:10px 0}header p{margin:0;color:#e0ebe4;line-height:1.7}main{max-width:1228px;margin:auto;padding:24px}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px;background:white;border:1px solid #dce5dc;border-radius:14px;margin-bottom:24px}.toolbar label{font-weight:700}input,textarea,button{font:inherit}input[type=number]{width:90px}input:not([type=checkbox]),textarea{border:1px solid #cbd7cf;border-radius:7px;background:#fff;padding:10px;color:#25352f;max-width:100%}input:focus,textarea:focus{outline:3px solid #d7e9dc;border-color:#478268}button{border:0;border-radius:8px;padding:11px 17px;background:#285b48;color:white;cursor:pointer}button:hover{background:#1b4435}#status{margin-left:auto;color:#587363;font-size:13px}.notice{color:#627267;font-size:13px;line-height:1.7;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #d7e2d9;border-radius:14px;padding:24px;box-shadow:0 3px 12px #193b2510}.card-head{display:flex;gap:16px;align-items:center;border-bottom:1px solid #e4ebe5;padding-bottom:17px;margin-bottom:20px}.number{background:#e8f1e9;color:#285b48;padding:10px 13px;border-radius:9px;font-size:18px;font-weight:800;white-space:nowrap}.name{display:flex;align-items:center;gap:10px;flex:1;font-weight:700}.name input{width:100%;min-width:0}.field{display:block;font-weight:700;margin:17px 0 0}.field span{display:block;margin-bottom:8px}.field textarea{display:block;width:100%;resize:vertical;min-height:78px;font-weight:400;line-height:1.6}.checks{border:0;background:#f5f8f4;border-radius:9px;padding:14px;margin:19px 0}.checks legend{font-size:14px;font-weight:700;padding:0 5px}.check-list{display:flex;flex-wrap:wrap;gap:12px 18px}.check-list label{display:flex;align-items:center;gap:6px;font-size:14px}input[type=checkbox]{width:17px;height:17px;accent-color:#285b48}.events-title{font-weight:700;margin:20px 0 6px}.hint{font-size:12px;color:#728175;margin:0 0 10px}.event{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-top:8px}.event input{width:100%;min-width:0}.empty{padding:65px 20px;text-align:center;border:1px dashed #c6d5c9;border-radius:14px;color:#728175;grid-column:1/-1}@media(max-width:800px){.cards{grid-template-columns:1fr}header{padding:28px 20px}main{padding:16px}.card{padding:18px}#status{margin-left:0;width:100%}.event{grid-template-columns:130px 1fr}}@media print{body{background:white}header{background:white;color:#25352f;padding:0 0 15px}header small,header p,.toolbar,.notice{display:none}main{padding:0}.cards{display:block}.card{break-inside:avoid;box-shadow:none;margin-bottom:20px}textarea{resize:none}.card input,.card textarea{border-color:#ccc}}
</style>
</head>
<body>
<header><small>CLASS HANDOVER</small><h1>진급 반 인계 카드</h1><p>아이를 이해하는 기록, 다음 담임에게 이어 주세요.</p></header>
<main>
<form class="toolbar" id="countForm"><label for="count">학생 수</label><input id="count" type="number" min="0" max="200" step="1" value="0" required aria-label="학생 수"><span>명</span><button type="submit">카드 만들기</button><span id="status" role="status" aria-live="polite">자동 저장 준비</span></form>
<p class="notice">입력 즉시 이 브라우저에 자동 저장됩니다. 같은 기기·브라우저에서 이 파일을 다시 열어 주세요. 브라우저 데이터 삭제 시 기록이 지워질 수 있습니다.<br>학생 개인정보가 담긴 파일과 기기는 안전하게 관리해 주세요. 학생 수를 줄여도 기존 기록은 보관되며, 수를 다시 늘리면 나타납니다.</p>
<section class="cards" id="cards" aria-label="학생별 인계 카드"></section>
</main>
<script>
'use strict';
const KEY='class-handover-cards-v1';
let state={count:0,students:{}};
const status=document.getElementById('status');
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(data&&Number.isInteger(data.count)&&data.count>=0&&data.count<=200&&data.students&&typeof data.students==='object'){state=data;status.textContent='저장된 기록을 불러왔습니다';}}}catch(e){status.textContent='저장소를 사용할 수 없습니다. 브라우저 설정을 확인해 주세요.';}
const fields=[['strength','잘하는 것과 맡았던 역할','강점, 관심 분야, 학급에서 맡았던 역할'],['learning','도움이 필요한 과목과 효과 있던 방법','도움이 필요한 부분과 실제로 효과 있었던 지도 방법'],['guidance','생활지도 방법','잘 통했던 안내, 갈등 조정, 일상생활 지도 방법'],['parents','학부모 소통 유의점','소통할 때 도움이 되는 방식과 유의할 점']];
const checks=[['front','앞자리 필요'],['meal','급식 유의'],['medicine','복약'],['health','보건 연계'],['separate','자리 분리 희망']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));status.textContent='자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){status.textContent='저장 실패 · 브라우저 저장 공간과 설정을 확인해 주세요.';}}
function input(tag,attributes,value){const el=document.createElement(tag);Object.entries(attributes).forEach(([k,v])=>el.setAttribute(k,v));if(el.type==='checkbox')el.checked=!!value;else el.value=value||'';return el;}
function render(){const container=document.getElementById('cards');container.replaceChildren();document.getElementById('count').value=state.count;if(!state.count){const empty=document.createElement('div');empty.className='empty';empty.textContent='학생 수를 입력하고 ‘카드 만들기’를 누르면 번호별 카드가 생깁니다.';container.append(empty);return;}
for(let n=1;n<=state.count;n++){const data=state.students[n]||(state.students[n]={});const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const number=document.createElement('div');number.className='number';number.textContent=n+'번';head.append(number);const name=document.createElement('label');name.className='name';name.append('이름',input('input',{type:'text','data-key':'name',autocomplete:'off','aria-label':n+'번 학생 이름'},data.name));head.append(name);card.append(head);
for(const [key,title,placeholder] of fields){const label=document.createElement('label');label.className='field';const text=document.createElement('span');text.textContent=title;label.append(text,input('textarea',{'data-key':key,rows:'2',placeholder},data[key]));card.append(label);}
const box=document.createElement('fieldset');box.className='checks';const legend=document.createElement('legend');legend.textContent='인계 시 확인할 사항';box.append(legend);const list=document.createElement('div');list.className='check-list';for(const [key,title]of checks){const label=document.createElement('label');label.append(input('input',{type:'checkbox','data-key':key},data[key]),document.createTextNode(title));list.append(label);}box.append(list);card.append(box);
const title=document.createElement('div');title.className='events-title';title.textContent='올해 특이사항';const hint=document.createElement('p');hint.className='hint';hint.textContent='날짜와 관찰한 사실만 3줄로 기록해 주세요.';card.append(title,hint);
for(let i=0;i<3;i++){const row=document.createElement('div');row.className='event';row.append(input('input',{type:'date','data-key':'date'+i,'aria-label':n+'번 특이사항 '+(i+1)+' 날짜'},data['date'+i]),input('input',{type:'text','data-key':'fact'+i,placeholder:'관찰한 사실','aria-label':n+'번 특이사항 '+(i+1)+' 사실'},data['fact'+i]));card.append(row);}
card.addEventListener('input',e=>{const key=e.target.dataset.key;if(!key)return;data[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();});container.append(card);}}
document.getElementById('countForm').addEventListener('submit',e=>{e.preventDefault();const count=Number(document.getElementById('count').value);if(!Number.isInteger(count)||count<0||count>200)return;state.count=count;render();save();});render();
</script>
</body>
</html>
