<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사 물품 수요 조사 집계기</title>
<style>
:root{font-family:Arial,'맑은 고딕',sans-serif;color:#203247;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d5deea;background:white;border-radius:8px;padding:10px 14px;color:#263d56}button:hover{background:#edf3fc}.primary{background:#2864dd;color:white;border-color:#2864dd}.primary:hover{background:#1d50ba}header{background:#fff;border-bottom:1px solid #dee5ee;padding:26px max(24px,calc((100% - 1240px)/2))}h1{font-size:25px;margin:0 0 8px}header p{color:#6b7c90;margin:0;font-size:14px}main{max-width:1288px;padding:28px 24px;margin:auto}.toolbar,.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.navigation{display:flex;align-items:center;gap:10px}.navigation h2{font-size:23px;min-width:155px;text-align:center}.calendar{margin-top:14px;background:#fff;border:1px solid #dce3ed;border-radius:14px;overflow:hidden}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{background:#f8fafc;text-align:center;font-size:13px;font-weight:bold;border-bottom:1px solid #dce3ed}.week div{padding:13px}.day{min-height:125px;padding:9px;border-right:1px solid #e5eaf1;border-bottom:1px solid #e5eaf1}.day:nth-child(7n){border-right:0}.date{font-size:13px;margin-bottom:8px}.outside{background:#fafbfd;color:#a8b3c0}.sun .date,.week div:first-child{color:#d25362}.sat .date,.week div:last-child{color:#3975c9}.today .date{background:#2864dd;color:#fff;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;margin-top:-4px;margin-bottom:4px}.event{display:block;width:100%;text-align:left;padding:6px 7px;margin:4px 0;border:0;border-left:3px solid #4b78dc;border-radius:4px;background:#edf3ff;color:#2856a4;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{font-size:13px;color:#758397;margin-top:14px}dialog{border:0;border-radius:16px;box-shadow:0 20px 80px #14253f33;width:min(620px,94vw);padding:26px;max-height:90vh;overflow:auto}dialog::backdrop{background:#17283c70}h2{margin:0;font-size:21px}.close{border:0;font-size:22px;padding:3px 8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}label{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:bold}.wide{grid-column:1/-1}input,select{padding:10px;border:1px solid #ccd6e2;border-radius:7px;width:100%;background:white;color:#203247}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.info{background:#f5f7fb;padding:16px;border-radius:10px;line-height:1.9;margin:18px 0;white-space:pre-wrap;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{background:#edf3ff;padding:16px;border-radius:10px;font-size:14px}.stat strong{display:block;font-size:24px;margin-top:8px;color:#2864dd}.itemform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;margin:12px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 5px;border-bottom:1px solid #e2e8f0;text-align:left}th{color:#6b7c90}.empty{text-align:center;padding:25px;color:#7b8999;font-size:14px}.danger{color:#b74754}.section-title{font-size:16px;margin:22px 0 8px}.small{font-size:12px;color:#7b8999}.remove{padding:5px 7px;font-size:12px}@media(max-width:650px){main{padding:16px 8px}header{padding:22px 16px}h1{font-size:21px}.day{padding:5px;min-height:100px}.event{font-size:11px;padding:5px 3px}.navigation{gap:4px}.navigation h2{font-size:18px;min-width:120px}button{padding:9px}.toolbar{gap:4px}.itemform{grid-template-columns:1fr 1fr}.fields{gap:12px}.week div{padding:10px}}
#detail{width:min(1100px,96vw)}.table-scroll{overflow-x:auto}#items table{min-width:850px}td{overflow-wrap:anywhere}.row-actions{white-space:nowrap}textarea{font:inherit;padding:10px;border:1px solid #ccd6e2;border-radius:7px;width:100%;resize:vertical}.stat .small{display:block;margin-top:8px}</style>
</head>
<body>
<header><h1>행사 물품 수요 조사 집계기</h1><p>행사 일정을 살펴보고 필요한 물품을 한곳에서 관리하세요.</p></header>
<main><div class="toolbar"><div class="navigation"><button id="prev" aria-label="이전 달">‹</button><h2 id="month"></h2><button id="next" aria-label="다음 달">›</button><button id="today">오늘</button></div><button class="primary" id="add">＋ 행사 추가</button></div><div class="calendar"><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="grid"></div></div><p class="hint">행사를 누르면 상세 내용과 대여·구입 현황을 확인할 수 있습니다. 여러 날의 행사는 해당 기간에 매일 표시됩니다.</p><p class="small" id="saveNote">인터넷 연결 없이 사용할 수 있으며, 데이터는 현재 브라우저에 저장됩니다. 브라우저 데이터를 삭제하면 기록도 삭제됩니다.</p></main>
<dialog id="editor"><form id="eventForm"><div class="heading"><h2 id="editorTitle">행사 추가</h2><button type="button" class="close" data-close="editor" aria-label="닫기">×</button></div><div class="fields"><label class="wide">행사명<input id="name" required maxlength="100" placeholder="예: 가을 체육대회"></label><label>시작일<input id="start" type="date" required></label><label>종료일<input id="end" type="date" required></label><label>장소<input id="place" required maxlength="100" placeholder="예: 운동장"></label><label>담당자<input id="person" required maxlength="60" placeholder="예: 김선생"></label></div><div class="actions"><button type="button" data-close="editor">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<dialog id="detail"><div class="heading"><h2 id="detailTitle"></h2><button class="close" data-close="detail" aria-label="닫기">×</button></div><div class="info" id="info"></div><div class="stats"><div class="stat">대여 수요<strong id="rentCount">0개</strong></div><div class="stat">구입 수요<strong id="buyCount">0개</strong></div></div><div class="heading"><h3 class="section-title">물품 수요 및 진행 현황</h3><button class="primary" id="addItem">＋ 물품 추가</button></div><div id="items"></div><p class="small">금액은 전체 수량에 대한 총액(원)입니다. 진행 상태는 표에서 변경할 수 있습니다.</p><div class="actions"><button id="deleteEvent" class="danger">행사 삭제</button><button id="editEvent">행사 수정</button><button data-close="detail">닫기</button></div></dialog>
<dialog id="itemEditor"><form id="itemForm"><div class="heading"><h2 id="itemEditorTitle">물품 추가</h2><button type="button" class="close" data-close="itemEditor" aria-label="닫기">×</button></div><div class="fields"><label>구분<select id="itemType"><option>대여</option><option>구입</option></select></label><label>물품명<input id="itemName" required maxlength="80"></label><label>수량(개)<input id="itemQty" type="number" min="1" max="999999" value="1" required></label><label>금액(총액·원)<input id="itemAmount" type="number" min="0" max="999999999999" step="1" value="0" required></label><label><span id="sourceLabel">대여처</span><input id="itemSource" maxlength="150"></label><label>신청자<input id="itemApplicant" required maxlength="60"></label><label class="wide">비고<textarea id="itemNote" rows="3" maxlength="1000"></textarea></label></div><div class="actions"><button type="button" data-close="itemEditor">취소</button><button class="primary" type="submit">저장</button></div></form></dialog><script>
'use strict';
const $=id=>document.getElementById(id),key='event-supply-manager-v1';let events=[];try{events=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(events))events=[]}catch(e){$('saveNote').textContent='저장된 데이터를 불러오지 못했습니다. 현재 입력 내용은 브라우저 저장이 가능할 때 저장됩니다.'}
let view=new Date(),selected=null,editing=null,itemEditing=null;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function save(){try{localStorage.setItem(key,JSON.stringify(events))}catch(e){$('saveNote').textContent='브라우저 저장이 차단되었거나 저장 공간이 부족합니다. 현재 내용은 이 창을 닫으면 사라질 수 있습니다.'}render()}
function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=`${y}년 ${m+1}월`;$('grid').replaceChildren();const first=new Date(y,m,1),offset=first.getDay(),count=Math.ceil((offset+new Date(y,m+1,0).getDate())/7)*7;for(let i=0;i<count;i++){const d=new Date(y,m,1-offset+i),s=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' outside':'')+(d.getDay()===0?' sun':d.getDay()===6?' sat':'')+(s===iso(new Date())?' today':'');const n=document.createElement('div');n.className='date';n.textContent=d.getDate();cell.append(n);events.filter(e=>e.start<=s&&e.end>=s).sort((a,b)=>a.start.localeCompare(b.start)).forEach(e=>{const b=document.createElement('button');b.className='event';b.textContent=e.name;b.title=e.name;b.onclick=()=>openDetail(e.id);cell.append(b)});$('grid').append(cell)}}
function openEditor(id=null){editing=id;const e=events.find(e=>e.id===id);$('editorTitle').textContent=e?'행사 수정':'행사 추가';$('name').value=e?.name||'';$('start').value=e?.start||iso(new Date());$('end').value=e?.end||$('start').value;$('place').value=e?.place||'';$('person').value=e?.person||'';$('end').min=$('start').value;$('editor').showModal()}
function openDetail(id){selected=id;const e=events.find(e=>e.id===id);if(!e)return;$('detailTitle').textContent=e.name;$('info').textContent=`기간  ${e.start} ~ ${e.end}\n장소  ${e.place}\n담당자  ${e.person}`;renderItems();if(!$('detail').open)$('detail').showModal()}
function renderItems(){
const e=events.find(e=>e.id===selected),items=e.items||[];
for(const [type,id] of [['대여','rentCount'],['구입','buyCount']]){const group=items.filter(i=>i.type===type);$(id).textContent=group.reduce((sum,i)=>sum+Number(i.qty),0).toLocaleString()+'개';const total=document.createElement('span');total.className='small';total.textContent='총 '+group.reduce((sum,i)=>sum+Number(i.amount||0),0).toLocaleString()+'원';$(id).append(total)}
$('items').replaceChildren();for(const type of ['대여','구입']){const group=items.filter(i=>i.type===type),title=document.createElement('h3');title.className='section-title';title.textContent=type+' 물품 ('+group.length+'건)';$('items').append(title);if(!group.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='등록된 '+type+' 물품이 없습니다.';$('items').append(empty);continue}
const wrap=document.createElement('div');wrap.className='table-scroll';const table=document.createElement('table');table.innerHTML='<thead><tr><th>물품명</th><th>수량</th><th>금액(총액)</th><th>'+(type==='대여'?'대여처':'구입처')+'</th><th>비고</th><th>신청자</th><th>진행 상태</th><th>관리</th></tr></thead>';const body=document.createElement('tbody');group.forEach(i=>{const row=document.createElement('tr');[i.name,Number(i.qty).toLocaleString(),Number(i.amount||0).toLocaleString()+'원',i.source||'—',i.note||'—',i.applicant||'—'].forEach(value=>{const td=document.createElement('td');td.textContent=value;td.style.whiteSpace='pre-wrap';row.append(td)});const td=document.createElement('td'),select=document.createElement('select');select.setAttribute('aria-label',i.name+' 진행 상태');['미진행','진행 중','완료'].forEach(s=>{const option=document.createElement('option');option.textContent=s;select.append(option)});select.value=i.status||'미진행';select.onchange=()=>{i.status=select.value;save()};td.append(select);row.append(td);const action=document.createElement('td');action.className='row-actions';const edit=document.createElement('button');edit.className='remove';edit.textContent='수정';edit.onclick=()=>openItemEditor(i.id);const del=document.createElement('button');del.className='remove danger';del.textContent='삭제';del.onclick=()=>{if(confirm('이 물품을 삭제할까요?')){e.items=e.items.filter(item=>item.id!==i.id);save();renderItems()}};action.append(edit,del);row.append(action);body.append(row)});table.append(body);wrap.append(table);$('items').append(wrap)}}
function openItemEditor(id=null){itemEditing=id;const e=events.find(e=>e.id===selected),i=(e.items||[]).find(i=>i.id===id);$('itemForm').reset();$('itemEditorTitle').textContent=i?'물품 수정':'물품 추가';$('itemType').value=i?.type||'대여';$('itemName').value=i?.name||'';$('itemQty').value=i?.qty||1;$('itemAmount').value=i?.amount||0;$('itemSource').value=i?.source||'';$('itemNote').value=i?.note||'';$('itemApplicant').value=i?.applicant||'';updateSourceLabel();$('itemEditor').showModal()}
function updateSourceLabel(){$('sourceLabel').textContent=$('itemType').value==='대여'?'대여처':'구입처'}
$('itemType').onchange=updateSourceLabel;$('addItem').onclick=()=>openItemEditor();
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('today').onclick=()=>{view=new Date();render()};$('add').onclick=()=>openEditor();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('start').onchange=()=>{$('end').min=$('start').value;if($('end').value<$('start').value)$('end').value=$('start').value};
$('eventForm').onsubmit=ev=>{ev.preventDefault();if($('end').value<$('start').value){alert('종료일은 시작일 이후로 지정해 주세요.');return}const name=$('name').value.trim(),place=$('place').value.trim(),person=$('person').value.trim();if(!name||!place||!person){alert('행사명, 장소, 담당자를 입력해 주세요.');return}const old=events.find(e=>e.id===editing),data={id:old?.id||uid(),name,start:$('start').value,end:$('end').value,place,person,items:old?.items||[]};if(old)events[events.indexOf(old)]=data;else events.push(data);view=new Date(data.start+'T12:00:00');save();$('editor').close();if($('detail').open)openDetail(data.id)};
$('itemForm').onsubmit=ev=>{ev.preventDefault();const name=$('itemName').value.trim(),applicant=$('itemApplicant').value.trim(),qty=Number($('itemQty').value),amount=Number($('itemAmount').value);if(!name||!applicant){alert('물품명과 신청자를 입력해 주세요.');return}if(!Number.isInteger(qty)||qty<1||qty>999999||!Number.isSafeInteger(amount)||amount<0||amount>999999999999)return;const e=events.find(e=>e.id===selected),items=(e.items ||= []),old=items.find(i=>i.id===itemEditing),data={id:old?.id||uid(),name,type:$('itemType').value,qty,amount,source:$('itemSource').value.trim(),note:$('itemNote').value.trim(),applicant,status:old?.status||'미진행'};if(old)items[items.indexOf(old)]=data;else items.push(data);save();renderItems();$('itemEditor').close()};$('editEvent').onclick=()=>openEditor(selected);$('deleteEvent').onclick=()=>{if(confirm('이 행사와 등록된 물품을 모두 삭제할까요?')){events=events.filter(e=>e.id!==selected);save();$('detail').close()}};render();
</script>
</body></html>
