<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>특별실 · 기자재 예약</title>
<style>
:root{--ink:#18352e;--green:#21775c;--line:#e0e8e3;--muted:#74837b}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font:15px '맑은 고딕',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:10px 15px;color:var(--ink)}button:hover{background:#edf5ef}button.primary{background:var(--green);color:white;border-color:var(--green)}header{background:white;border-bottom:1px solid var(--line);padding:24px max(5%,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0 0 7px}p{line-height:1.6}header p{margin:0;color:var(--muted);font-size:13px}.logo{display:flex;gap:14px;align-items:center}.mark{background:#e7f1e9;padding:14px;border-radius:15px;font-size:24px}main{max-width:1200px;margin:28px auto;padding:0 22px}.notice{padding:16px 20px;background:#edf3e8;border:1px solid #dbe7d2;border-radius:12px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.notice p{margin:4px 0;color:#62715c;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:25px}.tabs button{padding:13px 28px;border:0;background:transparent;font-weight:bold;color:var(--muted)}.tabs .active{background:var(--green);color:white}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{font-size:20px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:23px}.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;cursor:pointer}.item.selected{border-color:var(--green);background:#f0f7f1}.item h3{margin:0 0 8px;font-size:16px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{font-size:12px;padding:5px 9px}.pill{background:#e8f3ec;color:#287b5d;border-radius:20px;padding:4px 9px;font-size:11px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 18px}.calendar-head strong{font-size:19px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:12px;color:var(--muted);padding:10px}.day{min-height:95px;border-top:1px solid var(--line);border-right:1px solid #f0f2ef;padding:9px;font-size:13px;cursor:pointer}.day:hover,.day.chosen{background:#eef6ef}.day.off{color:#c4ccc6;cursor:default}.event{font-size:10px;line-height:1.5;background:#e9f3ed;border-radius:5px;padding:5px;margin-top:7px;color:#37735a}.empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:1.8}.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stats{display:flex;justify-content:space-between;background:#f5f7f4;border-radius:10px;padding:16px 8px;margin:20px 0}.stats div{text-align:center;flex:1;font-size:12px;color:var(--muted)}.stats b{display:block;font-size:23px;color:var(--ink);margin-top:7px}.stats div:last-child b{color:var(--green)}dialog{border:0;border-radius:18px;padding:28px;max-width:580px;width:calc(100% - 30px);color:var(--ink);box-shadow:0 25px 90px #16372a33}dialog::backdrop{background:#162f2855}dialog h2{margin-bottom:20px}label{display:block;font-size:13px;margin:15px 0 7px;font-weight:bold}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e1da;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.slot.active{background:var(--green);color:white}.slot:disabled{opacity:.45;cursor:not-allowed}.small{font-size:12px;color:var(--muted)}.reservations{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}@media(max-width:800px){header{padding:20px}.layout{grid-template-columns:1fr}.equip-grid{grid-template-columns:1fr}.notice{align-items:flex-start;flex-direction:column}.day{min-height:78px;padding:5px}.event{font-size:9px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo"><div class="mark">▦</div><div><h1>특별실 · 기자재 예약</h1><p>함께 쓰는 공간과 기기, 한곳에서 간편하게</p></div></div><span class="pill">교내 공유 자원</span></header>
<main><div class="notice"><div><strong id="modeTitle">예시 미리보기</strong><p id="modeText">화면을 살펴보세요. 예시 자원과 예약은 실제 목록에 저장되지 않습니다.</p></div><button id="modeButton" onclick="toggleMode()">실제 신청 화면으로 →</button></div>
<nav class="tabs"><button id="roomTab" class="active" onclick="setTab('room')">특별실 예약</button><button id="equipTab" onclick="setTab('equip')">기자재 대여</button></nav><section id="content"></section></main>
<dialog id="modal"><form id="form"><div id="formContent"></div><div class="footer"><button type="button" onclick="modal.close()">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem('school-resource-board'))}catch{}data=data||{rooms:[],equipment:[],bookings:[],loans:[]};let preview=true,tab='room',selected='r1',month=new Date(),picked='',slot='';month.setDate(1);
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const sample={rooms:[{id:'r1',name:'미래배움실',capacity:24,note:'모둠 활동 · 프로젝트 수업'},{id:'r2',name:'과학실',capacity:30,note:'실험 · 탐구 수업'}],equipment:[{id:'e1',name:'태블릿 PC',total:30,note:'충전기 · 보호 케이스'},{id:'e2',name:'노트북',total:20,note:'전원 어댑터 · 마우스'},{id:'e3',name:'디지털카메라',total:5,note:'배터리 · 메모리카드'}],bookings:[{id:'b1',resource:'r1',date:dateKey(new Date(month.getFullYear(),month.getMonth(),12)),time:'09:00–10:00',name:'김민지',people:20},{id:'b2',resource:'r1',date:dateKey(new Date(month.getFullYear(),month.getMonth(),20)),time:'13:00–14:00',name:'이준호',people:16}],loans:[{resource:'e1',qty:8,start:'2000-01-01',end:'2099-12-31'},{resource:'e2',qty:5,start:'2000-01-01',end:'2099-12-31'}]};
const current=()=>preview?sample:data;function save(){if(!preview)localStorage.setItem('school-resource-board',JSON.stringify(data))}function toggleMode(){preview=!preview;selected=current().rooms[0]?.id;render()}function setTab(t){tab=t;render()}
function render(){$('modeTitle').textContent=preview?'예시 미리보기':'우리 학교 예약 관리';$('modeText').textContent=preview?'화면을 살펴보세요. 예시 자원과 예약은 실제 목록에 저장되지 않습니다.':'자원을 추가하고 예약을 관리하세요. 입력 내용은 이 브라우저에 저장됩니다.';$('modeButton').textContent=preview?'실제 신청 화면으로 →':'예시 미리보기';$('roomTab').classList.toggle('active',tab==='room');$('equipTab').classList.toggle('active',tab==='equip');const d=current();$('content').innerHTML=`<div class="heading"><div><h2>${tab==='room'?'특별실 예약':'기자재 대여'}</h2><span class="sub">${tab==='room'?'공간을 선택하고 원하는 날짜와 시간을 예약하세요.':'필요한 기기의 수량을 확인하고 대여를 신청하세요.'}</span></div><button class="primary" onclick="editResource()">＋ ${tab==='room'?'특별실':'기자재'} 추가</button></div>`;if(tab==='equip'){renderEquipment();return}if(!d.rooms.some(r=>r.id===selected))selected=d.rooms[0]?.id;$('content').innerHTML+=`<div class="layout"><aside class="panel"><strong>특별실 목록 <span class="sub">${d.rooms.length}</span></strong>${d.rooms.length?d.rooms.map(r=>`<div class="item ${selected===r.id?'selected':''}" onclick="selected='${r.id}';render()"><h3>${esc(r.name)}</h3><span class="sub">정원 ${r.capacity}명 · ${esc(r.note)}</span><div class="actions"><button onclick="event.stopPropagation();editResource('${r.id}')">수정</button><button onclick="event.stopPropagation();removeResource('${r.id}')">삭제</button></div></div>`).join(''):'<div class="empty">등록된 특별실이 없습니다.<br>첫 특별실을 추가해 주세요.</div>'}</aside><div class="panel" id="calendar"></div></div>`;renderCalendar()}
function renderCalendar(){const d=current(),r=d.rooms.find(x=>x.id===selected);if(!r){$('calendar').innerHTML='<div class="empty">특별실을 추가하면<br>예약 달력이 여기에 표시됩니다.</div>';return}const y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$('calendar').innerHTML=`<div class="heading"><div><h2>${esc(r.name)}</h2><span class="sub">정원 ${r.capacity}명 · 날짜를 눌러 예약</span></div><span class="pill">예약 가능</span></div><div class="calendar-head"><button onclick="moveMonth(-1)">‹</button><strong>${y}년 ${m+1}월</strong><button onclick="moveMonth(1)">›</button></div><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${Array.from({length:start},()=>'<div class="day off"></div>').join('')}${Array.from({length:last},(_,i)=>{let date=dateKey(new Date(y,m,i+1)),bs=d.bookings.filter(b=>b.resource===r.id&&b.date===date);return `<div class="day" onclick="book('${date}')">${i+1}${bs.map(b=>`<div class="event">${esc(b.name)} · ${b.time}<br>남은 자리 ${r.capacity-b.people}명</div>`).join('')}</div>`}).join('')}</div><p class="small">예약별 남은 자리는 정원에서 해당 예약 인원을 뺀 값입니다. 같은 시간의 중복 예약은 제한됩니다.</p>`}
function moveMonth(n){month.setMonth(month.getMonth()+n);renderCalendar()}
function editResource(id){const key=tab==='room'?'rooms':'equipment',r=current()[key].find(x=>x.id===id);$('formContent').innerHTML=`<h2>${tab==='room'?'특별실':'기자재'} ${r?'수정':'추가'}</h2><label>이름</label><input name="name" required maxlength="50" value="${esc(r?.name||'')}"><label>${tab==='room'?'정원 (명)':'보유 수량'}</label><input name="count" type="number" min="1" required value="${r?(r.capacity||r.total):1}"><label>${tab==='room'?'공간 안내':'기본 구성품 · 안내'} (선택)</label><input name="note" value="${esc(r?.note||'')}">`;$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:r?.id||crypto.randomUUID(),name:f.get('name').trim(),note:f.get('note').trim(),[key==='rooms'?'capacity':'total']:Number(f.get('count'))};if(!v.name)return;const d=current();if(r){const booked=key==='rooms'?Math.max(0,...d.bookings.filter(b=>b.resource===id).map(b=>b.people)):Math.max(0,...d.loans.filter(l=>l.resource===id).map(l=>l.qty));if(Number(f.get('count'))<booked){alert('기존 예약 또는 대여 수량보다 작게 설정할 수 없습니다.');return}Object.assign(r,v)}else d[key].push(v);selected=v.id;save();modal.close();render()};modal.showModal()}
function removeResource(id){if(!confirm('이 자원과 연결된 예약·대여 내역을 삭제할까요?'))return;const d=current(),key=tab==='room'?'rooms':'equipment';d[key]=d[key].filter(x=>x.id!==id);d.bookings=d.bookings.filter(x=>x.resource!==id);d.loans=d.loans.filter(x=>x.resource!==id);save();render()}
const times=['09:00–10:00','10:00–11:00','11:00–12:00','13:00–14:00','14:00–15:00','15:00–16:00'];
function book(date){const d=current(),r=d.rooms.find(x=>x.id===selected);slot='';picked=date;const bs=d.bookings.filter(b=>b.resource===r.id&&b.date===date);$('formContent').innerHTML=`<h2>${esc(r.name)} 예약</h2><p>${date} · 정원 ${r.capacity}명</p><label>시간대 선택</label><div class="slots">${times.map(t=>`<button type="button" class="slot" ${bs.some(b=>b.time===t)?'disabled':''} onclick="slot='${t}';document.querySelectorAll('.slot').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${t}${bs.some(b=>b.time===t)?' · 예약됨':''}</button>`).join('')}</div><label>예약자 이름</label><input name="name" required maxlength="30"><label>이용 인원</label><input name="people" type="number" min="1" max="${r.capacity}" value="1" required>${bs.length?`<div class="reservations"><strong>이날의 예약</strong>${bs.map(b=>`<p class="small">${b.time} · ${esc(b.name)} · ${b.people}명 / 남은 자리 ${r.capacity-b.people}명</p>`).join('')}</div>`:''}`;$('form').onsubmit=e=>{e.preventDefault();if(!slot){alert('시간대를 선택해 주세요.');return}const f=new FormData(e.target);if(!f.get('name').trim())return;d.bookings.push({id:crypto.randomUUID(),resource:r.id,date,time:slot,name:f.get('name').trim(),people:Number(f.get('people'))});save();modal.close();render()};modal.showModal()}
function used(id,start=dateKey(new Date()),end=start){const ls=current().loans.filter(l=>l.resource===id&&l.start<=end&&l.end>=start),points=[start,...ls.map(l=>l.start).filter(x=>x>=start&&x<=end)];return Math.max(0,...points.map(p=>ls.filter(l=>l.start<=p&&l.end>=p).reduce((s,l)=>s+l.qty,0)))}
function renderEquipment(){const d=current();$('content').innerHTML+=d.equipment.length?`<div class="equip-grid">${d.equipment.map(r=>{let n=used(r.id);return `<article class="panel"><span class="pill">공유 기자재</span><h2 style="margin-top:17px">${esc(r.name)}</h2><span class="sub">${esc(r.note||'등록된 안내가 없습니다.')}</span><div class="stats"><div>보유<b>${r.total}</b></div><div>대여 중<b>${n}</b></div><div>남은 수량<b>${r.total-n}</b></div></div><button class="primary" style="width:100%" onclick="loan('${r.id}')">대여 신청</button><div class="actions"><button onclick="editResource('${r.id}')">수정</button><button onclick="removeResource('${r.id}')">삭제</button></div></article>`}).join('')}</div><p class="small">대여 중·남은 수량은 오늘 기준이며, 신청 시 선택한 기간의 가용 수량을 확인합니다.</p>`:'<div class="panel empty">등록된 기자재가 없습니다.<br>기자재를 추가하고 보유 수량을 입력해 주세요.</div>'}
function loan(id){const r=current().equipment.find(x=>x.id===id),today=dateKey(new Date());$('formContent').innerHTML=`<h2>기자재 대여 신청</h2><label>희망 기기 종류</label><select name="resource">${current().equipment.map(x=>`<option value="${x.id}" ${id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="row"><div><label>대여 구분</label><select name="type"><option>수업용</option><option>행사용</option><option>업무용</option><option>기타</option></select></div><div><label>신청 수량</label><input name="qty" type="number" min="1" value="1" required></div></div><div class="row"><div><label>대여 시작일</label><input name="start" type="date" min="${today}" value="${today}" required></div><div><label>반납 예정일</label><input name="end" type="date" min="${today}" value="${today}" required></div></div><label>신청자 이름</label><input name="name" required maxlength="30"><label>대여 목적</label><textarea name="purpose" required placeholder="수업 또는 활동 내용을 적어 주세요."></textarea><label>필요 구성품</label><input name="parts" required placeholder="충전기, 연결 케이블 등 (없으면 ‘없음’)"><label>요청 사항 (선택)</label><textarea name="request" placeholder="추가로 필요한 사항을 적어 주세요."></textarea>`;$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.end<v.start){alert('반납 예정일은 시작일 이후로 선택해 주세요.');return}let resource=current().equipment.find(x=>x.id===v.resource),available=resource.total-used(v.resource,v.start,v.end);if(Number(v.qty)>available){alert(`해당 기간에 대여할 수 있는 수량은 ${available}개입니다.`);return}if(!v.name.trim()||!v.purpose.trim()||!v.parts.trim())return;current().loans.push({...v,qty:Number(v.qty),id:crypto.randomUUID()});save();modal.close();render();alert('예시 미리보기입니다. 실제 신청은 저장되지 않았습니다.')};modal.showModal()}
const modal=$('modal');render();
</script>
<script>
// 실제 신청은 Apps Script 웹 앱에서만 가능합니다.
const baseRender=render,baseBook=book,baseLoan=loan;
let loading=false,sending=false,refreshError='';
function rpc(method,payload){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('배포된 Apps Script 웹 앱 링크로 접속해 주세요.'));return}const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='getBoard')runner.getBoard();else runner.submitRequest(payload);});}
render=function(){baseRender();if(!preview){$('modeTitle').textContent='우리 학교 실시간 신청';$('modeText').textContent=loading?'시트에서 목록을 불러오는 중입니다.':(refreshError||'구글 시트 저장 후 접수 완료를 안내합니다. 접수는 승인 대기 상태이며, 최종 사용은 관리자 승인 후 가능합니다.');document.querySelectorAll('.heading > button.primary,.actions').forEach(x=>x.style.display='none');if(loading||refreshError)$('content').innerHTML='<div class="panel empty">'+esc(loading?'시트에서 불러오는 중…':refreshError)+'</div>';}let old=$('reload');if(!old){let b=document.createElement('button');b.id='reload';b.textContent='새로고침';b.onclick=()=>refreshBoard();$('modeButton').before(b);} $('reload').hidden=preview;$('reload').disabled=loading||sending;$('modeButton').disabled=sending||loading;};
async function refreshBoard(){if(preview||loading)return;loading=true;refreshError='';render();try{data=await rpc('getBoard');}catch(e){refreshError='시트를 불러오지 못했습니다. 새로고침을 눌러 다시 시도하세요. '+e.message;}finally{loading=false;render();}}
toggleMode=async function(){if(sending)return;preview=!preview;selected=preview?sample.rooms[0]?.id:undefined;if(!preview){data={rooms:[],equipment:[],bookings:[],loans:[]};await refreshBoard();}else render();};
function pendingFor(payload){const fingerprint=JSON.stringify(payload),key='school-pending-request';let old;try{old=JSON.parse(sessionStorage.getItem(key));}catch{}if(old?.fingerprint===fingerprint)return {...payload,requestId:old.id};const id=crypto.randomUUID();try{sessionStorage.setItem(key,JSON.stringify({fingerprint,id}));}catch{}return {...payload,requestId:id};}
async function sendApplication(payload){if(sending)return;const request=pendingFor(payload);sending=true;const buttons=[...$('form').querySelectorAll('button')],inputs=[...$('form').querySelectorAll('input,textarea,select')];buttons.forEach(b=>b.disabled=true);inputs.forEach(b=>b.disabled=true);const submit=$('form').querySelector('[type=submit]');submit.textContent='저장 확인 중…';let status=$('submitStatus');if(!status){status=document.createElement('p');status.id='submitStatus';status.setAttribute('role','status');$('formContent').append(status);}status.textContent='접수를 처리하고 있습니다.';try{const result=await rpc('submitRequest',request);if(result?.ok!==true||!result.id)throw new Error('저장 확인 응답이 없습니다.');try{sessionStorage.removeItem('school-pending-request');}catch{}modal.close();alert('접수 완료 · 관리자 승인 대기\n접수 번호: '+result.id);await refreshBoard();}catch(e){status.textContent='접수 완료가 확인되지 않았습니다. '+e.message+' 입력을 그대로 두고 다시 시도하면 같은 요청 번호를 사용합니다.';}finally{sending=false;buttons.forEach(b=>b.disabled=false);inputs.forEach(b=>b.disabled=false);submit.textContent='신청 접수';render();}}
book=function(date){baseBook(date);if(preview)return;const r=current().rooms.find(x=>x.id===selected);$('form').querySelector('[type=submit]').textContent='신청 접수';$('form').onsubmit=e=>{e.preventDefault();if(!slot){alert('시간대를 선택하세요.');return}const f=Object.fromEntries(new FormData(e.target));sendApplication({kind:'room',resource:r.id,date,time:slot,name:f.name,people:Number(f.people)});};};
loan=function(id){baseLoan(id);if(preview)return;const today=data.today;['start','end'].forEach(name=>{const el=$('form').elements[name];el.min=today;el.value=today;});$('form').querySelector('[type=submit]').textContent='신청 접수';$('form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));sendApplication({...f,kind:'equip',qty:Number(f.qty)});};};
modal.addEventListener('cancel',e=>{if(sending)e.preventDefault();});
// 미리보기에는 실제 시트 데이터나 접수 완료 문구를 사용하지 않습니다.
save=function(){};
render();
</script>

<script>
// 본인 신청 조회: 로그인 계정은 서버에서 확인하며 이메일/신청 번호로 임의 조회하지 않습니다.
const mineDialog=document.createElement('dialog');mineDialog.style.maxWidth='850px';mineDialog.innerHTML='<div class="heading"><h2>내 신청 현황</h2><button id="mineClose" type="button">닫기</button></div><p id="mineAccount" class="small"></p><button id="mineRefresh">새로고침</button><p id="mineStatus" role="status"></p><div id="mineList"></div>';document.body.append(mineDialog);
const extensionDialog=document.createElement('dialog');extensionDialog.innerHTML='<form id="extendForm"><h2>대여 기간 연장 신청</h2><p id="extendInfo"></p><label>희망 반납 예정일</label><input id="extendEnd" type="date" required><label>연장 사유</label><textarea id="extendReason" required maxlength="1000"></textarea><p class="small">관리자가 뒤 예약을 확인해 승인한 뒤에만 반납 예정일이 변경됩니다.</p><p id="extendStatus" role="status"></p><div class="footer"><button id="extendClose" type="button">취소</button><button id="extendSubmit" class="primary">연장 신청</button></div></form>';document.body.append(extensionDialog);
let mineData=null,mineBusy=false,extendTarget=null;
function mineRPC(method,payload){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('학교 구글 계정으로 배포된 웹 앱에 접속하세요.'));return}const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='getMyRequests')r.getMyRequests();else r.requestExtension(payload);});}
async function loadMine(){if(mineBusy)return;mineBusy=true;$('mineRefresh').disabled=true;$('mineList').innerHTML='';$('mineStatus').textContent='본인 신청을 확인하는 중…';try{mineData=await mineRPC('getMyRequests');$('mineAccount').textContent='로그인 계정: '+mineData.email;$('mineStatus').textContent=mineData.requests.length+'건';mineData.requests.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).forEach(r=>{const card=document.createElement('article');card.className='item';card.style.cursor='default';let ids='';try{ids=JSON.parse(r.assetIds||'[]').join(', ')}catch{}card.innerHTML=`<h3>${esc(r.resourceName)} <span class="pill">${esc(r.status)}</span></h3><p class="small">접수 번호 ${esc(r.id)}<br>${r.kind==='room'?esc(r.date+' · '+r.time+' · '+r.people+'명'):esc(r.start+' ~ '+r.end+' · '+r.qty+'개')}<br>${ids?'관리번호: '+esc(ids)+'<br>':''}${r.reason?'처리 사유: '+esc(r.reason)+'<br>':''}${r.extensionStatus?'연장 '+esc(r.extensionStatus)+' · 희망 반납일 '+esc(r.extensionEnd)+'<br>':''}${r.extensionDecisionReason?'연장 처리 사유: '+esc(r.extensionDecisionReason):''}</p>`;if(r.kind==='equip'&&r.status==='승인'&&r.start<=mineData.today&&r.end>=mineData.today&&r.extensionStatus!=='대기'){const b=document.createElement('button');b.textContent='연장 신청';b.onclick=()=>openExtend(r);card.append(b)}$('mineList').append(card)});if(!mineData.requests.length)$('mineList').textContent='이 계정으로 접수한 신청이 없습니다.';}catch(e){$('mineAccount').textContent='';$('mineStatus').textContent=e.message;}finally{mineBusy=false;$('mineRefresh').disabled=false;}}
function openExtend(r){extendTarget=r;$('extendInfo').textContent=r.resourceName+' · 현재 반납 예정일 '+r.end;const d=new Date(r.end+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);$('extendEnd').min=d.toISOString().slice(0,10);$('extendEnd').value=$('extendEnd').min;$('extendReason').value='';$('extendStatus').textContent='';extensionDialog.showModal()}
$('extendForm').onsubmit=async e=>{e.preventDefault();if(mineBusy)return;mineBusy=true;const fields=[...$('extendForm').querySelectorAll('button,input,textarea')];fields.forEach(x=>x.disabled=true);$('extendStatus').textContent='시트 저장을 확인하는 중…';try{const res=await mineRPC('requestExtension',{id:extendTarget.id,revision:extendTarget.revision||'0',end:$('extendEnd').value,reason:$('extendReason').value});if(!res?.ok)throw new Error('저장을 확인하지 못했습니다.');extensionDialog.close();mineBusy=false;await loadMine();alert('연장 신청 접수 완료 · 관리자 승인 대기');}catch(e){$('extendStatus').textContent='접수 완료가 확인되지 않았습니다. '+e.message+' 응답이 끊긴 경우 목록을 새로고침해 확인하세요.';}finally{mineBusy=false;fields.forEach(x=>x.disabled=false)}};
$('mineClose').onclick=()=>{if(!mineBusy)mineDialog.close()};$('mineRefresh').onclick=loadMine;$('extendClose').onclick=()=>{if(!mineBusy)extensionDialog.close()};[mineDialog,extensionDialog].forEach(d=>d.addEventListener('cancel',e=>{if(mineBusy)e.preventDefault()}));
const mineButton=document.createElement('button');mineButton.textContent='내 신청 현황';mineButton.onclick=()=>{if(preview){alert('실제 신청 화면으로 전환한 뒤 학교 계정으로 본인 신청을 조회하세요.');return}mineDialog.showModal();loadMine()};document.querySelector('.tabs').append(mineButton);
</script>

</body>
