<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'"><title>모두의 예약실 · 로컬 미리보기</title><style>
:root{--green:#23755d;--ink:#213c34;--muted:#75827c;--line:#e0e8e2}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font:14px '맑은 고딕',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:10px 15px}button:hover{background:#edf5ef}button:disabled{opacity:.4;cursor:default}.primary,.active{background:var(--green)!important;color:white!important;border-color:var(--green)!important}.banner{background:#233e34;color:#fff;text-align:center;padding:10px;font-size:12px}header{background:white;border-bottom:1px solid var(--line);padding:25px max(24px,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:15px;align-items:center}.logo{font-size:30px;background:#e8f1e8;padding:12px;border-radius:15px}h1{font-size:22px;margin:0 0 7px}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.7}.muted,small{color:var(--muted);font-size:12px}main{max-width:1200px;padding:28px 24px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#eaf1e5;border:1px solid #dce6d3;padding:20px 24px;border-radius:12px}.welcome p{margin:5px 0 0}nav{display:flex;gap:6px;margin:24px 0;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}nav button{border:0;background:transparent;padding:12px 22px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 20px}.layout{display:grid;grid-template-columns:260px 1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:23px}.resource{padding:17px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.resource.selected{background:#eff7f0;border-color:var(--green)}.resource>button{border:0;background:none;text-align:left;padding:0;width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:12px;padding:6px 10px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#edf3ed;color:#41715b;font-size:11px}.pending{background:#fff2d9;color:#9a6a1d}.cancel{background:#f8e9e6;color:#a46050}.calhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.week span{padding:10px;text-align:center;font-size:12px;color:var(--muted)}.day{border:0;border-top:1px solid var(--line);border-right:1px solid #f0f3ef;border-radius:0;min-height:106px;padding:9px;text-align:left;vertical-align:top;display:flex;flex-direction:column;gap:6px;font-size:12px}.day.today{background:#f0f6ef}.event{background:#eaf3ed;padding:5px;border-radius:5px;font-size:10px;line-height:1.5;width:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.icon{font-size:28px;background:#f0f5ef;border-radius:12px;padding:15px;display:inline-block;margin-bottom:20px}.stats{display:flex;background:#f5f7f4;padding:16px 0;border-radius:10px;margin:22px 0}.stats div{flex:1;text-align:center;color:var(--muted);font-size:12px}.stats b{display:block;font-size:25px;margin-top:8px;color:var(--ink)}.stats div:last-child b{color:var(--green)}.full{width:100%}.empty{text-align:center;padding:65px 15px;color:var(--muted)}dialog{border:0;border-radius:16px;padding:28px;width:560px;max-width:95vw;max-height:90vh;color:var(--ink);box-shadow:0 20px 90px #152e3340}dialog::backdrop{background:#203a3155}label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}input,select,textarea{width:100%;border:1px solid #d7e1d9;padding:11px;border-radius:8px;background:white}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.error{color:#a43e32;margin-top:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:16px 12px;text-align:left;border-bottom:1px solid var(--line);line-height:1.8}th{background:#f4f7f3;color:var(--muted);white-space:nowrap}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.filters input,.filters select{width:auto}.note{background:#f5f7f3;padding:12px;border-radius:8px;font-size:12px;line-height:1.8}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#213e33;color:white;padding:15px 25px;border-radius:10px;z-index:9}footer{text-align:center;color:var(--muted);font-size:11px;margin:30px}@media(max-width:850px){.layout,.cards{grid-template-columns:1fr}.welcome,header{align-items:flex-start;flex-direction:column}.day{min-height:90px;padding:4px}.event{font-size:9px}.row{grid-template-columns:1fr}main{padding:20px 12px}}@media print{.banner,header,.welcome,nav,.heading button,.filters,.actions,footer,.toast{display:none!important}body,main,.panel{background:white;margin:0;padding:0;border:0}table{font-size:10px}}
</style></head><body><div class="banner">외부 연결 없는 로컬 미리보기 · 실제 접수·인증·배포·발송 없음 · 새로고침하면 변경 내용이 초기화됩니다</div><header><div class="brand"><div class="logo">▦</div><div><h1>모두의 예약실</h1><span class="muted">특별실 · 기자재를 함께, 더 편리하게</span></div></div><div><span id="identity" class="pill"></span> <button onclick="admin=!admin;tab=admin?'admin':'room';render()" id="role"></button></div></header><main><div class="welcome"><div><strong>우리 학교의 공간과 배움을 연결합니다.</strong><p class="muted">예시 신청을 직접 만들고 승인해 보세요. 모든 데이터는 현재 화면 안에서만 처리됩니다.</p></div><button onclick="emptyMode()">빈 목록으로 시작</button></div><nav id="nav"></nav><section id="content"></section></main><footer>모두의 예약실 · 학교 공유 자원 예약 미리보기</footer><dialog id="modal"><form id="form"><div id="fields"></div><p id="error" class="error" role="alert"></p><div class="footer"><button type="button" onclick="modal.close()">닫기</button><button class="primary" id="submit">예시 신청 저장</button></div></form></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today='2026-11-10',times=['09:00–10:00','10:00–11:00','11:00–12:00','13:00–14:00','14:00–15:00','15:00–16:00'];let admin=false,tab='room',selected='r1',month=new Date(2026,10,1),filter='전체',from='',to='',seq=10;
let rooms=[{id:'r1',name:'미래배움실',count:24,note:'모둠 활동 · 프로젝트 수업'},{id:'r2',name:'과학실',count:30,note:'실험 · 탐구 수업'},{id:'r3',name:'미디어실',count:20,note:'영상 제작 · 미디어 교육'}],equipment=[{id:'e1',name:'태블릿 PC',count:30,note:'충전기 · 보호 케이스',prefix:'TAB'},{id:'e2',name:'노트북',count:20,note:'전원 어댑터 · 마우스',prefix:'NB'},{id:'e3',name:'디지털카메라',count:5,note:'배터리 · 메모리카드',prefix:'CAM'}];
let requests=[{id:'REQ-001',kind:'room',resource:'r1',name:'김민지',owner:'me',start:'2026-11-12',end:'2026-11-12',time:times[0],qty:20,status:'승인',purpose:'협력 프로젝트 수업'},{id:'REQ-002',kind:'room',resource:'r1',name:'이준호',owner:'other',start:'2026-11-20',end:'2026-11-20',time:times[3],qty:16,status:'승인',purpose:'창의 체험 활동'},{id:'REQ-003',kind:'equip',resource:'e1',name:'김민지',owner:'me',start:'2026-11-09',end:'2026-11-13',qty:3,status:'승인',purpose:'디지털 협력 수업',parts:'충전기, 케이스',ids:['TAB-001','TAB-002','TAB-003']},{id:'REQ-004',kind:'equip',resource:'e2',name:'박서연',owner:'other',start:'2026-11-11',end:'2026-11-12',qty:2,status:'승인 대기',purpose:'학급 발표 수업',parts:'마우스'},{id:'REQ-005',kind:'equip',resource:'e1',name:'이준호',owner:'other',start:'2026-11-16',end:'2026-11-18',qty:2,status:'승인',purpose:'영상 수업',ids:['TAB-001','TAB-004']}];
const active=r=>['승인','승인 대기'].includes(r.status),over=(a,b,c,d)=>a<=d&&b>=c,res=r=>(r.kind==='room'?rooms:equipment).find(x=>x.id===r.resource),id=()=>`REQ-${String(++seq).padStart(3,'0')}`,key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function used(resource,start,end,omit){const rs=requests.filter(r=>r.id!==omit&&r.resource===resource&&active(r)&&over(start,end,r.start,r.end));return Math.max(0,...[start,...rs.map(r=>r.start).filter(d=>d>=start&&d<=end)].map(d=>rs.filter(r=>r.start<=d&&r.end>=d).reduce((a,r)=>a+r.qty,0)))}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500)}
function show(title,html,fn,button='예시 신청 저장'){$('fields').innerHTML=`<h2>${title}</h2>${html}`;$('error').textContent='';$('submit').textContent=button;$('form').onsubmit=e=>{e.preventDefault();try{fn(Object.fromEntries(new FormData(e.target)));modal.close();render()}catch(err){$('error').textContent=err.message}};modal.showModal()}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`}
function emptyMode(){if(!confirm('현재 예시와 변경 내용을 비우고 시작할까요? 새로고침하면 예시가 다시 표시됩니다.'))return;rooms=[];equipment=[];requests=[];selected='';render();toast('빈 목록입니다. 자원을 추가해 보세요.')}
function render(){$('identity').textContent=admin?'관리자 체험':'김민지 선생님 · 신청자 체험';$('role').textContent=admin?'신청자 화면으로':'관리자 화면으로';const tabs=[['room','특별실 예약'],['equip','기자재 대여'],['mine','내 신청 현황'],...(admin?[['admin','신청 관리'],['ledger','대여 대장']]:[])];$('nav').innerHTML=tabs.map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${n}${t==='admin'?` <small>(${requests.filter(r=>r.status==='승인 대기'||r.ext).length})</small>`:''}</button>`).join('');if(tab==='room')renderRooms();else if(tab==='equip')renderEquipment();else renderList()}
function manageButtons(r,kind){return `<div class="actions"><button onclick="editResource('${kind}','${r.id}')">수정</button><button onclick="removeResource('${kind}','${r.id}')">삭제</button></div>`}
function editResource(kind,rid){let list=kind==='room'?rooms:equipment,r=list.find(x=>x.id===rid);show(`${kind==='room'?'특별실':'기자재'} ${r?'수정':'추가'}`,field('이름','name',r?.name||'')+field(kind==='room'?'정원 (명)':'보유 수량','count',r?.count||1,'number','min="1" max="500" step="1"')+field('안내 / 기본 구성품','note',r?.note||'')+(kind==='equip'?field('관리번호 접두어 (영문·숫자)','prefix',r?.prefix||'DEV','text','pattern="[A-Za-z0-9]+"'):'')+`<p class="muted">기자재 관리번호는 접두어-001 형식으로 자동 구성됩니다.</p>`,v=>{v.name=v.name.trim();v.count=+v.count;if(!v.name)throw Error('이름을 입력하세요.');if(r&&requests.some(x=>x.resource===rid&&active(x))&&(v.count<r.count||v.prefix&&v.prefix!==r.prefix))throw Error('진행 중인 신청이 있어 수량 축소와 관리번호 변경은 제한됩니다.');if(r)Object.assign(r,v);else list.push({...v,id:'res'+(++seq)});toast('자원을 메모리에 저장했습니다.')},'자원 저장')}
function removeResource(kind,rid){if(requests.some(r=>r.resource===rid&&active(r))){toast('진행 중인 신청을 취소한 후 삭제해 주세요.');return}if(confirm('이 자원을 삭제할까요?')){if(kind==='room')rooms=rooms.filter(r=>r.id!==rid);else equipment=equipment.filter(r=>r.id!==rid);render()}}
function renderRooms(){if(!rooms.some(r=>r.id===selected))selected=rooms[0]?.id;const r=rooms.find(r=>r.id===selected);$('content').innerHTML=`<div class="heading"><div><h2>특별실 예약</h2><span class="muted">공간과 날짜를 선택하고 수업을 준비하세요.</span></div><button onclick="editResource('room')">＋ 특별실 추가</button></div><div class="layout"><aside class="panel"><h3>특별실 목록 <small>${rooms.length}</small></h3>${rooms.map(x=>`<div class="resource ${x.id===selected?'selected':''}"><button onclick="selected='${x.id}';render()"><h3>${esc(x.name)}</h3><span class="muted">정원 ${x.count}명<br>${esc(x.note)}</span></button>${manageButtons(x,'room')}</div>`).join('')||'<p class="empty">등록된 특별실이 없습니다.</p>'}</aside><div class="panel">${r?calendar(r):'<p class="empty">특별실을 추가하면 예약 달력이 표시됩니다.</p>'}</div></div>`}
function calendar(r){let y=month.getFullYear(),m=month.getMonth();return `<div class="heading" style="margin-top:0"><div><h2>${esc(r.name)}</h2><span class="muted">정원 ${r.count}명 · 날짜를 눌러 예약</span></div><span class="pill">공유 공간</span></div><div class="calhead"><button aria-label="이전 달" onclick="month.setMonth(month.getMonth()-1);render()">‹</button><h3>${y}년 ${m+1}월</h3><button aria-label="다음 달" onclick="month.setMonth(month.getMonth()+1);render()">›</button></div><div class="week">${['일','월','화','수','목','금','토'].map(t=>`<span>${t}</span>`).join('')}</div><div class="calendar">${'<div></div>'.repeat(new Date(y,m,1).getDay())}${Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>{let d=key(new Date(y,m,i+1));return `<button class="day ${d===today?'today':''}" onclick="book('${d}')"><b>${i+1}</b>${requests.filter(q=>q.resource===r.id&&q.start===d&&active(q)).map(q=>`<span class="event">${esc(q.name)} · ${q.time}<br>남은 자리 ${r.count-q.qty}명 · ${q.status}</span>`).join('')}</button>`}).join('')}</div><p class="muted">남은 자리는 예약 인원을 뺀 참고값입니다. 예약된 시간대는 추가 신청할 수 없습니다.</p>`}
function book(date){let r=rooms.find(x=>x.id===selected),busy=t=>requests.some(q=>q.resource===r.id&&q.start===date&&q.time===t&&active(q));show(`${esc(r.name)} 예약`, `<p>${date} · 정원 ${r.count}명</p><label>시간대<select name="time" required><option value="">시간대를 선택하세요</option>${times.map(t=>`<option ${busy(t)?'disabled':''}>${t}${busy(t)?' (예약됨)':''}</option>`).join('')}</select></label>`+field('이용 인원','qty',1,'number',`min="1" max="${r.count}" step="1"`)+field('수업 · 이용 목적','purpose')+'<p class="note">신청자: 김민지 · 접수 후 관리자 승인이 필요합니다.</p>',v=>{if(busy(v.time))throw Error('이미 예약된 시간입니다.');requests.push({...v,id:id(),kind:'room',resource:r.id,qty:+v.qty,start:date,end:date,name:'김민지',owner:'me',status:'승인 대기'});toast('예시 신청 저장 완료 · 관리자 승인 대기')})}
function renderEquipment(){$('content').innerHTML=`<div class="heading"><div><h2>기자재 대여</h2><span class="muted">수량을 확인하고 필요한 기기를 신청하세요. 기준일 ${today}</span></div><button onclick="editResource('equip')">＋ 기자재 추가</button></div><div class="cards">${equipment.map((r,i)=>{let n=requests.filter(q=>q.resource===r.id&&q.status==='승인'&&q.start<=today&&q.end>=today).reduce((s,q)=>s+q.qty,0);return `<article class="panel"><div class="icon">${['▤','▰','◉'][i%3]}</div><h2>${esc(r.name)}</h2><p class="muted">${esc(r.note)}</p><div class="stats"><div>보유<b>${r.count}</b></div><div>대여 중<b>${n}</b></div><div>남은 수량<b>${r.count-n}</b></div></div><button class="primary full" onclick="loan('${r.id}')">대여 신청 →</button>${manageButtons(r,'equip')}</article>`}).join('')}</div>${equipment.length?'':'<div class="panel empty">등록된 기자재가 없습니다. 기자재를 추가해 주세요.</div>'}<p class="muted">승인 대기 신청도 해당 기간의 수량을 확보합니다. 신청 시 기간 전체의 가용 수량을 다시 확인합니다.</p>`}
function loan(rid){show('기자재 대여 신청',`<label>희망 기기 종류<select name="resource">${equipment.map(r=>`<option value="${r.id}" ${r.id===rid?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><div class="row"><label>대여 구분<select name="type"><option>수업용</option><option>행사용</option><option>업무용</option><option>기타</option></select></label>${field('수량','qty',1,'number','min="1" step="1"')}</div><div class="row">${field('대여 시작일','start',today,'date')}${field('반납 예정일','end',today,'date')}</div>`+field('대여 목적','purpose')+field('필요 구성품 (없으면 없음)','parts')+'<label>요청 사항 (선택)<textarea name="note"></textarea></label><p class="note">신청자: 김민지 · 실제 외부 서비스에 접수되지 않습니다.</p>',v=>{if(v.end<v.start)throw Error('반납일은 시작일 이후여야 합니다.');let r=equipment.find(r=>r.id===v.resource),n=r.count-used(r.id,v.start,v.end);if(+v.qty>n)throw Error(`선택 기간의 대여 가능 수량은 ${n}대입니다.`);requests.push({...v,id:id(),kind:'equip',qty:+v.qty,name:'김민지',owner:'me',status:'승인 대기'});toast('예시 신청 저장 완료 · 관리자 승인 대기')})}
function status(r){return `<span class="pill ${r.status==='승인 대기'?'pending':['반려','취소'].includes(r.status)?'cancel':''}">${r.status}</span>${r.ext?'<br><span class="pill pending">연장 심사 중</span>':''}`}
function listed(){return requests.filter(r=>(tab!=='mine'||r.owner==='me')&&(tab!=='ledger'||r.kind==='equip')&&(filter==='전체'||r.status===filter)&&(!from||r.end>=from)&&(!to||r.start<=to))}
function renderList(){let title=tab==='mine'?'내 신청 현황':tab==='ledger'?'기자재 대여 대장':'신청 관리',rs=listed();$('content').innerHTML=`<div class="heading"><div><h2>${title}</h2><span class="muted">${tab==='mine'?'김민지 선생님의 신청만 표시합니다.':'관리자 체험 화면 · 실제 계정 인증은 사용하지 않습니다.'}</span></div>${tab==='ledger'?'<div class="actions"><button onclick="window.print()">대장 인쇄</button><button onclick="download()">Excel 호환 파일 내려받기</button></div>':''}</div><div class="panel"><div class="filters"><select aria-label="상태 필터" onchange="filter=this.value;render()">${['전체','승인 대기','승인','반려','취소'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select><input aria-label="조회 시작일" type="date" value="${from}" onchange="from=this.value;render()"><span>~</span><input aria-label="조회 종료일" type="date" value="${to}" onchange="to=this.value;render()"><small>총 ${rs.length}건</small></div><div class="tablewrap"><table><thead><tr><th>신청 / 자원</th><th>신청자</th><th>사용 기간 / 시간</th><th>수량 / 인원</th><th>상태</th><th>처리</th></tr></thead><tbody>${rs.map(r=>`<tr><td><small>${r.id}</small><br><b>${esc(res(r)?.name||'삭제된 자원')}</b><br><small>${esc(r.purpose)}${r.ids?.length?'<br>'+esc(r.ids.join(', ')):''}</small></td><td>${esc(r.name)}</td><td>${r.start}<br>${r.kind==='room'?r.time:'~ '+r.end}${r.ext?`<br><small>연장 요청: ${r.ext.end}<br>${esc(r.ext.reason)}</small>`:''}</td><td>${r.qty}${r.kind==='room'?'명':'대'}</td><td>${status(r)}${r.reason?'<br><small>'+esc(r.reason)+'</small>':''}</td><td><div class="actions">${tab==='admin'?`${r.status==='승인 대기'?`<button onclick="approve('${r.id}')">승인</button><button onclick="decision('${r.id}','반려')">반려</button>`:''}${r.ext?`<button onclick="extendApprove('${r.id}')">연장 검토</button>`:''}${active(r)?`<button onclick="decision('${r.id}','취소')">취소</button>`:''}`:tab==='mine'?`${r.kind==='equip'&&r.status==='승인'&&r.start<=today&&r.end>=today&&!r.ext?`<button onclick="extend('${r.id}')">연장 신청</button>`:''}${active(r)?`<button onclick="decision('${r.id}','취소')">신청 취소</button>`:''}`:'—'}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">표시할 신청이 없습니다.</td></tr>'}</tbody></table></div>${tab==='ledger'?'<p class="muted">내려받기는 외부 라이브러리 없이 생성하는 Excel 호환 .xls 표입니다. .xlsx 형식은 아닙니다.</p>':''}</div>`}
function approve(rid){let r=requests.find(r=>r.id===rid);if(r.kind==='room'){r.status='승인';render();toast('특별실 예약을 승인했습니다.');return}let e=res(r),all=Array.from({length:e.count},(_,i)=>`${e.prefix}-${String(i+1).padStart(3,'0')}`);show('기자재 배정 및 승인',`<p>${esc(e.name)} ${r.qty}대 · ${r.start} ~ ${r.end}</p><p class="note">등록 번호: ${all.map(esc).join(', ')}<br>기간이 겹치는 기기는 중복 배정할 수 없습니다.</p>`+field('관리번호 (쉼표로 구분)','ids','') ,v=>{let ids=v.ids.split(',').map(s=>s.trim()).filter(Boolean);if(ids.length!==r.qty||new Set(ids).size!==ids.length)throw Error('신청 수량만큼 서로 다른 관리번호를 입력하세요.');if(ids.some(n=>!all.includes(n)))throw Error('등록된 관리번호만 입력하세요.');if(requests.some(q=>q.id!==rid&&q.status==='승인'&&over(r.start,r.end,q.start,q.end)&&q.ids?.some(n=>ids.includes(n))))throw Error('해당 기간에 이미 배정된 기기가 있습니다.');r.ids=ids;r.status='승인';toast('관리번호를 배정하고 승인했습니다.')},'배정 및 승인')}
function decision(rid,state){let r=requests.find(r=>r.id===rid);show(`신청 ${state}`,`<p>${esc(res(r)?.name)} · ${esc(r.name)}</p>`+field(`${state} 사유`,'reason'),v=>{r.status=state;r.reason=v.reason;delete r.ext;toast(`신청을 ${state}했습니다.`)},`${state} 처리`)}
function extend(rid){let r=requests.find(r=>r.id===rid);show('대여 연장 신청',`<p>현재 반납일 ${r.end}</p>`+field('희망 반납일','end',r.end,'date')+field('연장 사유','reason'),v=>{if(v.end<=r.end)throw Error('현재 반납일보다 늦은 날짜를 선택하세요.');r.ext=v;toast('연장 신청 저장 · 관리자 검토 대기')})}
function extendApprove(rid){let r=requests.find(r=>r.id===rid),e=res(r),later=requests.filter(q=>q.id!==rid&&q.resource===r.resource&&active(q)&&over(r.start,r.ext.end,q.start,q.end)),collision=later.some(q=>q.ids?.some(n=>r.ids?.includes(n))),capacity=used(r.resource,r.start,r.ext.end,r.id)+r.qty>e.count;show('연장 신청 검토',`<p>${esc(r.name)} · ${esc(e.name)}<br>${r.end} → <b>${r.ext.end}</b><br>사유: ${esc(r.ext.reason)}</p><div class="note">기간 내 다른 예약 ${later.length}건${later.map(q=>`<br>${q.start} ~ ${q.end} · ${q.qty}대 · ${esc(q.ids?.join(', ')||'배정 대기')}`).join('')}<br>수량 확인: ${capacity?'초과':'가능'} / 관리번호: ${collision?'충돌':'충돌 없음'}</div><label>처리<select name="action"><option>승인</option><option>반려</option></select></label>`,v=>{if(v.action==='승인'){if(collision||capacity)throw Error('뒤 예약과 충돌하여 연장할 수 없습니다. 반려를 선택하세요.');r.end=r.ext.end;r.reason='연장 승인'}else r.reason='연장 반려 · 기존 반납일 유지';delete r.ext;toast('연장 심사를 처리했습니다.')},'심사 결과 저장')}
function download(){const rows=[['접수번호','신청자','기자재','시작일','반납일','수량','상태','관리번호','목적'],...listed().map(r=>[r.id,r.name,res(r)?.name,r.start,r.end,r.qty,r.status,r.ids?.join(', '),r.purpose])];const html='\ufeff<html><head><meta charset="utf-8"></head><body><table>'+rows.map(row=>'<tr>'+row.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';let url=URL.createObjectURL(new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='기자재_대여대장_미리보기.xls';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('현재 조회 조건의 대장을 내려받았습니다.')}
render();
</script></body></html>
