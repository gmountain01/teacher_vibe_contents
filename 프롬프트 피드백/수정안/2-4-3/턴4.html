<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교무수첩</title>
<style>
:root{--ink:#243b39;--muted:#7a8986;--line:#e4ebe7;--green:#286354;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 15px}button:hover{background:#edf3ee}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#204e43}aside{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--line);padding:36px 22px}.brand{font-size:24px;font-weight:800;margin-bottom:6px}.brand span{color:#7a9a71}aside p{color:var(--muted);font-size:12px}nav{margin-top:42px;display:grid;gap:9px}nav button{text-align:left;border:0;padding:15px;background:transparent}nav button.active{background:#eaf1e8;color:var(--green);font-weight:bold}.aside-bottom{position:absolute;bottom:30px;color:var(--muted);font-size:12px;line-height:1.8}main{margin-left:230px;padding:40px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:28px;margin:5px 0 10px}h2{font-size:18px;margin:0}p{line-height:1.7}.eyebrow{font-size:11px;letter-spacing:2px;color:#80947c;font-weight:bold}.subtitle{color:var(--muted);margin:0}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin-right:auto}.search{min-width:220px}input,select,textarea{padding:11px;border:1px solid #dce4df;border-radius:7px;background:white;color:var(--ink);width:100%}input:focus,textarea:focus,select:focus{outline:2px solid #b4cbb7}input[type=checkbox]{width:auto;accent-color:var(--green)}.filters{display:flex;gap:15px;flex-wrap:wrap;margin:22px 0 0}.filters label{display:flex;align-items:center;gap:5px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:24px}.weekday{text-align:center;padding:13px;background:#f8faf7;color:var(--muted);font-size:12px}.day{min-height:125px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.day.other{background:#fafbf9;color:#b6bfba}.date{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;margin-bottom:7px;cursor:pointer}.date.today{background:var(--green);color:white;border-radius:50%}.sun{color:#bf6d6d}.sat{color:#6486b3}.event{display:block;width:100%;text-align:left;border:0;border-radius:4px;font-size:11px;padding:5px 7px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);border-left:3px solid var(--c)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:32px;margin-top:12px}.row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .body{flex:1}.row small{color:var(--muted);display:block;margin-top:6px}.badge{font-size:11px;border-radius:5px;padding:5px 8px;background:#eef3ed}.empty{text-align:center;padding:40px;color:var(--muted)}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:22px}.week-day{border:1px solid var(--line);border-radius:9px;padding:12px;min-height:260px}.week-day h3{font-size:13px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;margin-bottom:8px;font-size:12px;color:#62776e}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}dialog{border:0;border-radius:16px;padding:28px;width:560px;max-width:94vw;box-shadow:0 20px 90px #15382b33}dialog::backdrop{background:#1a302955}dialog h2{margin-bottom:25px}textarea{resize:vertical;min-height:85px}.danger{color:#ba5656}.hint{color:var(--muted);font-size:12px}.task-done{text-decoration:line-through;color:#9aa69e}.notice{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:13px 22px;border-radius:9px;display:none}@media(max-width:950px){aside{position:static;width:auto;padding:20px}nav{display:flex;flex-wrap:wrap;margin-top:20px;gap:3px}nav button{padding:10px}.aside-bottom{display:none}main{margin:0;padding:20px}.day{min-height:100px;padding:4px}.week-grid{grid-template-columns:1fr}.week-day{min-height:90px}.event{font-size:10px;padding:4px}.cards{gap:8px}.stat{padding:16px}header{gap:10px}.form-grid{grid-template-columns:1fr}.search{min-width:150px}.panel{padding:16px}}
</style>
</head>
<body>
<aside><div class="brand">교무수첩<span> .</span></div><p>선생님의 하루를 가지런하게</p><nav id="nav"></nav><div class="aside-bottom">TEACHER'S PLANNER<br>기록은 가볍게, 하루는 여유롭게.<br><span id="termLabel"></span></div></aside>
<main><header><div><div class="eyebrow">MY SCHOOL NOTE</div><h1 id="pageTitle"></h1><p class="subtitle" id="pageSub"></p></div><button class="primary" onclick="openEvent()">＋ 일정 추가</button></header><div id="content"></div></main>
<dialog id="eventDialog"><form id="eventForm"><h2 id="dialogTitle">새 일정 추가</h2><div class="form-grid"><div class="field full"><label for="eventName">일정 이름 *</label><input id="eventName" required maxlength="100" placeholder="일정 이름을 입력하세요"></div><div class="field"><label for="start">시작일 *</label><input id="start" type="date" required></div><div class="field"><label for="end">종료일 *</label><input id="end" type="date" required></div><div class="field"><label for="dept">부서</label><input id="dept" placeholder="예: 교무부"></div><div class="field"><label for="category">분류</label><select id="category"></select></div><div class="field full"><label for="memo">메모</label><textarea id="memo" placeholder="준비물이나 참고 사항을 적어 보세요"></textarea></div></div><div class="actions"><button type="button" id="deleteEvent" class="danger" onclick="removeEvent()">삭제</button><button type="button" onclick="document.getElementById('eventDialog').close()">취소</button><button class="primary" type="submit">저장하기</button></div></form></dialog><div id="notice" class="notice"></div>
<script>
const $=id=>document.getElementById(id);const cats={'학교 행사':'#45846a','회의':'#6689b8','연수':'#9975b8','시험':'#c3756e','평가':'#c58e45','대회':'#499ca1','제출':'#b79c43','보안':'#797e96','기타':'#8c9890'};const pages=['오늘','월간 계획','주간 계획','업무 할 일','학기 설정'];const key='teacher-notebook-v1';let data={events:[],tasks:[],term:{name:'2026학년도 2학기',start:'2026-08-17',end:'2027-01-08'}};try{const saved=JSON.parse(localStorage.getItem(key));if(saved)data=saved}catch{}let page=1,focus=new Date(),query='',enabled=new Set(Object.keys(cats)),editing=null;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>iso(new Date());const parse=s=>new Date(s+'T12:00:00');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>parse(s).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch{alert('저장 공간을 사용할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.');return false}}function toast(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}function filtered(){return data.events.filter(e=>enabled.has(e.cat)&&[e.name,e.dept,e.memo,e.cat].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.start.localeCompare(b.start))}function onDay(s){return filtered().filter(e=>e.start<=s&&e.end>=s)}function eventHTML(e){return `<button class="event" style="--c:${cats[e.cat]}" onclick="openEvent('${e.id}')" title="${esc(e.name)}">${esc(e.name)}</button>`}function filters(){return `<div class="filters">${Object.entries(cats).map(([c,color])=>`<label><input type="checkbox" ${enabled.has(c)?'checked':''} onchange="toggleCat('${c}',this.checked)"><span class="dot" style="background:${color}"></span>${c}</label>`).join('')}</div>`}function toggleCat(c,on){on?enabled.add(c):enabled.delete(c);render()}function searchInput(){return `<input class="search" style="width:240px" aria-label="일정 검색" placeholder="⌕ 일정·부서·메모 검색" value="${esc(query)}" oninput="setSearch(this)">`}function setSearch(el){let pos=el.selectionStart;query=el.value;render();const next=document.querySelector('.search');next.focus();next.setSelectionRange(pos,pos)}function shift(n){focus.setDate(1);focus.setMonth(focus.getMonth()+n);render()}function jumpToday(){focus=new Date();render()}function setPage(n){page=n;render()}function render(){ $('nav').innerHTML=pages.map((p,i)=>`<button class="${page===i?'active':''}" onclick="setPage(${i})">${['◷','▦','▤','☑','⚙'][i]}　${p}</button>`).join('');$('pageTitle').textContent=pages[page];$('pageSub').textContent=['오늘의 일정을 살펴보고 차분하게 하루를 시작해 보세요.','학교의 한 달을 한눈에, 중요한 일정은 놓치지 않도록.','이번 주의 흐름을 살펴보고 미리 준비하세요.','해야 할 일을 하나씩, 가벼운 마음으로 정리하세요.','우리 학교의 학기 정보를 설정하세요.'][page];$('termLabel').textContent=data.term.name;if(page===1)monthView();if(page===0)todayView();if(page===2)weekView();if(page===3)taskView();if(page===4)settingsView()}
function monthView(){const y=focus.getFullYear(),m=focus.getMonth(),first=new Date(y,m,1),offset=first.getDay(),count=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+count)/7)*7;let html=`<section class="panel"><div class="toolbar"><h2>${y}년 ${m+1}월</h2><button onclick="shift(-1)" aria-label="이전 달">‹</button><button onclick="jumpToday()">오늘</button><button onclick="shift(1)" aria-label="다음 달">›</button>${searchInput()}</div>${filters()}<div class="calendar">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="weekday ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}`;for(let i=0;i<cells;i++){const d=new Date(y,m,i-offset+1),s=iso(d);html+=`<div class="day ${d.getMonth()!==m?'other':''}"><span tabindex="0" role="button" aria-label="${s} 일정 추가" onkeydown="if(event.key==='Enter')openEvent(null,'${s}')" onclick="openEvent(null,'${s}')" class="date ${s===today()?'today':''} ${i%7===0?'sun':i%7===6?'sat':''}">${d.getDate()}</span>${onDay(s).map(eventHTML).join('')}</div>`}html+='</div><p class="hint">날짜를 누르면 일정을 추가하고, 일정을 누르면 수정할 수 있어요. 여러 날 일정은 기간 동안 매일 표시됩니다.</p></section>';$('content').innerHTML=html}
function listEvents(items){return items.length?items.map(e=>`<div class="row"><span class="dot" style="background:${cats[e.cat]}"></span><div class="body"><button style="border:0;padding:0;text-align:left" onclick="openEvent('${e.id}')">${esc(e.name)}</button><small>${fmt(e.start)}${e.end!==e.start?' ~ '+fmt(e.end):''}${e.dept?' · '+esc(e.dept):''}</small>${e.memo?`<small style="white-space:pre-wrap">${esc(e.memo)}</small>`:''}</div><span class="badge" style="color:${cats[e.cat]}">${e.cat}</span></div>`).join(''):'<div class="empty">등록된 일정이 없습니다.</div>'}
function todayView(){const items=onDay(today()),upcoming=filtered().filter(e=>e.start>today()).slice(0,5);$('content').innerHTML=`<div class="cards"><div class="stat"><small>${fmt(today())}</small><strong>${items.length}<small> 개의 일정</small></strong></div><div class="stat"><small>남은 업무</small><strong>${data.tasks.filter(t=>!t.done).length}<small> 개</small></strong></div><div class="stat"><small>학기 종료까지</small><strong>${Math.max(0,Math.ceil((parse(data.term.end)-parse(today()))/86400000))}<small> 일</small></strong></div></div><section class="panel"><div class="toolbar"><h2>오늘의 일정</h2>${searchInput()}</div>${filters()}${listEvents(items)}</section><section class="panel"><h2>다가오는 일정</h2>${listEvents(upcoming)}</section>`}
function weekMove(n){focus.setDate(focus.getDate()+n*7);render()}function weekView(){let start=new Date(focus);start.setDate(start.getDate()-((start.getDay()+6)%7));let end=new Date(start);end.setDate(end.getDate()+6);$('content').innerHTML=`<section class="panel"><div class="toolbar"><h2>${fmt(iso(start))} ~ ${fmt(iso(end))}</h2><button onclick="weekMove(-1)">‹</button><button onclick="jumpToday()">이번 주</button><button onclick="weekMove(1)">›</button>${searchInput()}</div>${filters()}<div class="week-grid">${Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let s=iso(d);return `<div class="week-day"><h3 style="color:${s===today()?'#286354':'inherit'}">${fmt(s)}</h3>${onDay(s).map(eventHTML).join('')}<button style="width:100%;margin-top:10px" onclick="openEvent(null,'${s}')" aria-label="${s} 일정 추가">＋</button></div>`}).join('')}</div></section>`}
function taskView(){$('content').innerHTML=`<section class="panel"><h2>업무 체크리스트</h2><form id="taskForm" class="toolbar" style="margin-top:22px"><input id="taskName" style="flex:1;min-width:180px" placeholder="해야 할 일을 입력하세요" required maxlength="150"><input id="taskDue" type="date" style="width:165px" aria-label="업무 마감일"><button class="primary">추가</button></form>${data.tasks.length?data.tasks.map(t=>`<div class="row"><input aria-label="업무 완료" type="checkbox" ${t.done?'checked':''} onchange="completeTask('${t.id}',this.checked)"><div class="body ${t.done?'task-done':''}">${esc(t.name)}${t.due?`<small>마감 ${fmt(t.due)}</small>`:''}</div><button class="danger" onclick="deleteTask('${t.id}')">삭제</button></div>`).join(''):'<div class="empty">새로운 업무를 추가해 보세요.</div>'}</section>`;$('taskForm').onsubmit=e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name)return;data.tasks.push({id:crypto.randomUUID(),name,due:$('taskDue').value,done:false});save();render()}}
function completeTask(id,done){data.tasks.find(t=>t.id===id).done=done;save();render()}function deleteTask(id){data.tasks=data.tasks.filter(t=>t.id!==id);save();render()}
function settingsView(){$('content').innerHTML=`<section class="panel" style="max-width:720px"><h2>학기 기본 정보</h2><p class="hint">학기 정보는 오늘 화면의 남은 기간 표시에 사용됩니다.</p><form id="termForm"><div class="form-grid"><div class="field full"><label for="termName">학기 이름</label><input id="termName" value="${esc(data.term.name)}" required></div><div class="field"><label for="termStart">학기 시작일</label><input id="termStart" type="date" value="${data.term.start}" required></div><div class="field"><label for="termEnd">학기 종료일</label><input id="termEnd" type="date" value="${data.term.end}" required></div></div><div class="actions"><button class="primary">설정 저장</button></div></form></section><p class="hint">입력한 일정과 업무는 현재 브라우저에 자동 저장됩니다. 다른 기기와 동기화되지 않으며 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p>`;$('termForm').onsubmit=e=>{e.preventDefault();if($('termEnd').value<$('termStart').value){alert('학기 종료일은 시작일 이후로 선택해 주세요.');return}data.term={name:$('termName').value.trim(),start:$('termStart').value,end:$('termEnd').value};if(save()){render();toast('학기 설정을 저장했습니다.')}}}
function openEvent(id=null,date=today()){editing=id;const e=id?data.events.find(e=>e.id===id):{name:'',start:date,end:date,dept:'',cat:'학교 행사',memo:''};$('dialogTitle').textContent=id?'일정 수정':'새 일정 추가';$('eventName').value=e.name;$('start').value=e.start;$('end').value=e.end;$('dept').value=e.dept;$('category').value=e.cat;$('memo').value=e.memo;$('deleteEvent').style.display=id?'block':'none';$('end').min=e.start;$('eventDialog').showModal()}
$('category').innerHTML=Object.keys(cats).map(c=>`<option>${c}</option>`).join('');$('start').onchange=()=>{$('end').min=$('start').value;if($('end').value<$('start').value)$('end').value=$('start').value};$('eventForm').onsubmit=e=>{e.preventDefault();const name=$('eventName').value.trim();if(!name){$('eventName').focus();return}if($('end').value<$('start').value){alert('종료일은 시작일 이후로 선택해 주세요.');return}let item={id:editing||crypto.randomUUID(),name,start:$('start').value,end:$('end').value,dept:$('dept').value.trim(),cat:$('category').value,memo:$('memo').value.trim()};if(editing)data.events[data.events.findIndex(e=>e.id===editing)]=item;else data.events.push(item);if(save()){$('eventDialog').close();render();toast('일정을 저장했습니다.')}};function removeEvent(){if(confirm('이 일정을 삭제할까요?')){data.events=data.events.filter(e=>e.id!==editing);save();$('eventDialog').close();render()}}render();
</script>
<style>.week-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.week-day textarea{min-height:200px;line-height:1.8;margin-top:10px}.week-notes{margin-top:22px}.task-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;margin-top:22px}.task-section{font-size:13px;margin:24px 0 0;padding:10px;background:#f5f7f3;border-radius:6px}.task-tabs{display:flex;gap:8px;margin-top:24px}.task-tabs .active{background:var(--green);color:white}.overdue{color:#ba5656}@media(max-width:1100px){.task-form{grid-template-columns:1fr 1fr}.task-form .field:first-child{grid-column:1/-1}}@media(max-width:950px){.week-grid{grid-template-columns:1fr}}</style>
<script>
data.weeks=data.weeks||{};data.tasks=data.tasks.map(t=>({...t,priority:t.priority||'보통',cat:t.cat||'기타'}));let taskFilter='진행 중';
function weekStart(d=focus){const start=new Date(d);start.setDate(start.getDate()-((start.getDay()+6)%7));return start}
function weekRecord(key){return data.weeks[key]||(data.weeks[key]={days:['','','','',''],goal:'',memo:''})}
function updateWeek(key,field,value,index){const w=weekRecord(key);if(field==='days')w.days[index]=value;else w[field]=value;save()}
function importLastWeek(){const start=weekStart(),key=iso(start);start.setDate(start.getDate()-7);const previous=data.weeks[iso(start)];if(!previous||![...previous.days,previous.goal,previous.memo].some(v=>v.trim())){toast('지난주에 작성한 계획이 없습니다.');return}const current=weekRecord(key);if([...current.days,current.goal,current.memo].some(v=>v.trim())&&!confirm('현재 주에 작성한 내용을 지난주 계획으로 바꿀까요?'))return;data.weeks[key]={days:previous.days.slice(),goal:previous.goal,memo:previous.memo};if(save()){render();toast('지난주 계획을 불러왔습니다.')}}
function weekView(){const start=weekStart(),key=iso(start),w=weekRecord(key),end=new Date(start);end.setDate(end.getDate()+4);$('content').innerHTML=`<section class="panel"><div class="toolbar"><h2>${start.getFullYear()}년 ${fmt(key)} ~ ${fmt(iso(end))}</h2><button onclick="weekMove(-1)">‹ 지난주</button><button onclick="jumpToday()">이번 주</button><button onclick="weekMove(1)">다음 주 ›</button><button onclick="importLastWeek()">지난주 계획 불러오기</button></div><p class="hint">입력 내용은 자동 저장됩니다. 지난주 계획 불러오기는 날짜별 계획·목표·메모를 현재 주로 복사합니다.</p><div class="field week-notes"><label for="weekGoal">이번 주 목표</label><textarea id="weekGoal" placeholder="이번 주 목표를 적어 주세요" oninput="updateWeek('${key}','goal',this.value)">${esc(w.goal)}</textarea></div><div class="week-grid">${Array.from({length:5},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const date=iso(d);return `<div class="week-day"><h3 style="color:${date===today()?'#286354':'inherit'}">${fmt(date)}${date===today()?' · 오늘':''}</h3>${onDay(date).map(eventHTML).join('')}<label class="hint" for="weekDay${i}">날짜별 계획</label><textarea id="weekDay${i}" placeholder="수업 준비, 반복 업무 등을 적어 주세요" oninput="updateWeek('${key}','days',this.value,${i})">${esc(w.days[i])}</textarea><button style="width:100%;margin-top:10px" onclick="openEvent(null,'${date}')">＋ 일정 추가</button></div>`}).join('')}</div><div class="field week-notes"><label for="weekMemo">메모·전달 사항</label><textarea id="weekMemo" placeholder="기억할 내용이나 전달 사항을 적어 주세요" oninput="updateWeek('${key}','memo',this.value)">${esc(w.memo)}</textarea></div></section>`}
const taskCats=['공문','수업','평가','학급 업무','행사','기타'];
function taskGroup(t){if(t.done)return '완료';if(!t.due)return '마감일 없음';if(t.due<today())return '기한 지남';if(t.due===today())return '오늘';const sunday=weekStart(new Date());sunday.setDate(sunday.getDate()+6);if(t.due<=iso(sunday))return '이번 주';return '이후'}
function setTaskFilter(value){taskFilter=value;taskView()}
function taskRow(t){return `<div class="row"><input aria-label="${esc(t.name)} 완료" type="checkbox" ${t.done?'checked':''} onchange="completeTask('${t.id}',this.checked)"><div class="body ${t.done?'task-done':''}">${esc(t.name)}<small style="${!t.done&&t.due&&t.due<today()?'color:#ba5656':''}">${t.due?'마감 '+fmt(t.due):'마감일 없음'} · ${esc(t.cat)} · 중요도 ${esc(t.priority)}</small></div><span class="badge" style="color:${t.priority==='높음'?'#ba5656':'#62776e'}">${esc(t.priority)}</span><button class="danger" onclick="deleteTask('${t.id}')">삭제</button></div>`}
function taskView(){const visible=data.tasks.filter(t=>taskFilter==='전체'||(taskFilter==='완료'?t.done:!t.done));let list='';for(const group of ['기한 지남','오늘','이번 주','이후','마감일 없음','완료']){const items=visible.filter(t=>taskGroup(t)===group).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(['높음','보통','낮음'].indexOf(a.priority)-['높음','보통','낮음'].indexOf(b.priority)));if(items.length)list+=`<h3 class="task-section ${group==='기한 지남'?'overdue':''}">${group} · ${items.length}</h3>${items.map(taskRow).join('')}`}$('content').innerHTML=`<section class="panel"><h2>업무 체크리스트</h2><form id="taskForm" class="task-form"><div class="field"><label for="taskName">내용 *</label><input id="taskName" placeholder="해야 할 일을 입력하세요" required maxlength="150"></div><div class="field"><label for="taskDue">마감일</label><input id="taskDue" type="date"></div><div class="field"><label for="taskPriority">중요도</label><select id="taskPriority"><option>높음</option><option selected>보통</option><option>낮음</option></select></div><div class="field"><label for="taskCategory">분류</label><select id="taskCategory">${taskCats.map(c=>`<option>${c}</option>`).join('')}</select></div><button class="primary">등록</button></form><div class="task-tabs" role="group" aria-label="업무 상태 선택">${['진행 중','완료','전체'].map(f=>`<button class="${taskFilter===f?'active':''}" aria-pressed="${taskFilter===f}" onclick="setTaskFilter('${f}')">${f} ${data.tasks.filter(t=>f==='전체'||(f==='완료'?t.done:!t.done)).length}</button>`).join('')}</div>${list||'<div class="empty">해당하는 업무가 없습니다.</div>'}</section>`;$('taskForm').onsubmit=e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name){$('taskName').focus();return}data.tasks.push({id:crypto.randomUUID(),name,due:$('taskDue').value,priority:$('taskPriority').value,cat:$('taskCategory').value,done:false});if(save()){taskFilter='진행 중';render();toast('업무를 등록했습니다.')}}}
function completeTask(id,done){const task=data.tasks.find(t=>t.id===id);task.done=done;task.completedAt=done?new Date().toISOString():null;save();render();toast(done?'완료로 옮겼습니다.':'진행 중으로 옮겼습니다.')}
render();
</script>
<style>.dday{min-width:72px;text-align:center;background:#eaf1e8;color:var(--green);padding:12px 8px;border-radius:8px;font-weight:bold}.progress-track{height:10px;background:#e7eee7;border-radius:10px;overflow:hidden;margin-top:14px}.progress-fill{height:100%;background:var(--green)}.holiday-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.holiday-row span{flex:1}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.summary-grid .panel{margin:0}.metric-value{font-size:28px;font-weight:bold;margin:10px 0}.settings-layout{max-width:920px}.holiday-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.minor-heading{font-size:14px;margin-top:24px}@media(max-width:700px){.summary-grid,.holiday-form{grid-template-columns:1fr}.dday{min-width:60px}.cards{grid-template-columns:1fr}.row{gap:9px}}</style>
<script>
data.term.holidays=Array.isArray(data.term.holidays)?data.term.holidays:[];data.term.target=Number(data.term.target)>0?Number(data.term.target):190;
function schoolStats(){const term=data.term,holidays=new Set(term.holidays.map(h=>h.date)),now=today();let total=0,elapsed=0;const cursor=parse(term.start),end=parse(term.end);while(cursor<=end){const date=iso(cursor),day=cursor.getDay();if(day!==0&&day!==6&&!holidays.has(date)){total++;if(date<=now)elapsed++}cursor.setDate(cursor.getDate()+1)}return {total,elapsed,remaining:total-elapsed,progress:total?Math.round(elapsed/total*100):0,difference:total-term.target}}
function statsHTML(){const s=schoolStats();return `<div class="cards"><div class="stat"><small>학기 수업일수</small><strong>${s.total}<small> 일</small></strong><p class="hint">${esc(data.term.start)} ~ ${esc(data.term.end)}</p></div><div class="stat"><small>오늘까지 진행 / 남은 수업일</small><strong>${s.elapsed}<small> / ${s.remaining}일</small></strong><div class="progress-track" role="progressbar" aria-label="학기 수업 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.progress}"><div class="progress-fill" style="width:${s.progress}%"></div></div><p class="hint">수업일 기준 진행률 ${s.progress}%</p></div><div class="stat"><small>기준 ${data.term.target}일과 비교</small><strong style="color:${s.difference<0?'#ba5656':'#286354'}">${s.difference>0?'+':''}${s.difference}<small> 일</small></strong><p class="hint">${s.difference<0?Math.abs(s.difference)+'일 부족':s.difference>0?s.difference+'일 초과':'기준과 일치'}</p></div></div>`}
function dayDifference(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(x[0],x[1]-1,x[2])-Date.UTC(y[0],y[1]-1,y[2]))/86400000)}
function todayView(){const date=today(),events=data.events.filter(e=>e.start<=date&&e.end>=date).sort((a,b)=>a.start.localeCompare(b.start)),sunday=weekStart(new Date());sunday.setDate(sunday.getDate()+6);const tasks=data.tasks.filter(t=>!t.done&&t.due&&t.due<=iso(sunday)).sort((a,b)=>a.due.localeCompare(b.due)||(['높음','보통','낮음'].indexOf(a.priority)-['높음','보통','낮음'].indexOf(b.priority)));const major=data.events.filter(e=>e.start<=data.term.end&&e.end>=data.term.start).sort((a,b)=>a.start.localeCompare(b.start));$('content').innerHTML=`${statsHTML()}<div class="summary-grid"><section class="panel"><div class="toolbar"><h2>오늘 일정</h2><span class="hint">${fmt(date)}</span></div>${listEvents(events)}</section><section class="panel"><h2>이번 주까지 할 일</h2><p class="hint">${fmt(iso(sunday))}까지 마감인 진행 중 업무 · 기한 지난 업무 포함</p>${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">이번 주까지 마감인 업무가 없습니다.</div>'}</section></div><section class="panel" style="margin-top:20px"><div class="toolbar"><h2>주요 일정</h2><span class="hint">${esc(data.term.name)}</span></div><p class="hint">학기 기간과 겹치는 모든 일정을 시작일 순으로 표시합니다.</p>${major.length?major.map(e=>{const diff=dayDifference(e.start,date);const label=diff>0?'D-'+diff:diff===0?'D-DAY':e.end>=date?'진행 중':'D+'+Math.abs(diff);return `<div class="row"><span class="dday">${label}</span><div class="body"><button style="border:0;padding:0;text-align:left" onclick="openEvent('${e.id}')">${esc(e.name)}</button><small>${esc(e.start)} ~ ${esc(e.end)}</small></div><span class="badge" style="color:${cats[e.cat]}">${esc(e.cat)}</span></div>`}).join(''):'<div class="empty">이번 학기에 등록된 주요 일정이 없습니다.</div>'}</section>`}
function settingsView(){$('content').innerHTML=`<div class="settings-layout">${statsHTML()}<section class="panel"><h2>학기 기본 정보</h2><p class="hint">월~금 중 등록한 휴업일을 제외해 계산합니다. 공휴일과 방학도 휴업일로 직접 등록해 주세요. 학기 시작일·종료일을 포함하며 진행률에는 오늘을 포함합니다.</p><form id="termForm"><div class="form-grid"><div class="field full"><label for="termName">학기 이름</label><input id="termName" value="${esc(data.term.name)}" required></div><div class="field"><label for="termStart">학기 시작일</label><input id="termStart" type="date" value="${esc(data.term.start)}" required></div><div class="field"><label for="termEnd">학기 종료일</label><input id="termEnd" type="date" value="${esc(data.term.end)}" required></div><div class="field"><label for="termTarget">기준 수업일수</label><input id="termTarget" type="number" min="1" max="366" step="1" value="${data.term.target}" required></div></div><p class="hint">기본 기준은 190일입니다. 설정한 학기 기간의 수업일수와 비교하므로 운영 기준에 맞게 바꿔 주세요.</p><div class="actions"><button class="primary">설정 저장</button></div></form></section><section class="panel"><h2>휴업일 설정</h2><p class="hint">하루 또는 연속 기간으로 등록할 수 있습니다. 중복 날짜와 주말은 수업일수에서 중복 차감하지 않습니다.</p><form id="holidayForm" class="holiday-form"><div class="field"><label for="holidayStart">휴업 시작일 *</label><input id="holidayStart" type="date" required></div><div class="field"><label for="holidayEnd">휴업 종료일 *</label><input id="holidayEnd" type="date" required></div><div class="field"><label for="holidayName">휴업 사유</label><input id="holidayName" placeholder="예: 개교기념일, 방학" maxlength="80"></div><button class="primary">휴업일 등록</button></form><h3 class="minor-heading">등록한 휴업일 · ${data.term.holidays.length}일</h3>${data.term.holidays.length?data.term.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<div class="holiday-row"><span>${esc(h.date)} · ${esc(h.name||'휴업일')}${h.date<data.term.start||h.date>data.term.end?' <small class="hint">(학기 기간 밖 · 계산 제외)</small>':''}</span><button class="danger" onclick="removeHoliday('${h.date}')">삭제</button></div>`).join(''):'<div class="empty">등록된 휴업일이 없습니다.</div>'}</section><p class="hint">입력 내용은 현재 브라우저에 저장됩니다. 수업일수는 등록한 기간과 휴업일에 따른 계산값입니다.</p></div>`;$('termForm').onsubmit=e=>{e.preventDefault();if($('termEnd').value<$('termStart').value){alert('학기 종료일은 시작일 이후로 선택해 주세요.');return}const name=$('termName').value.trim();if(!name){$('termName').focus();return}data.term={...data.term,name,start:$('termStart').value,end:$('termEnd').value,target:Number($('termTarget').value)};if(save()){render();toast('학기 설정을 저장했습니다.')}};$('holidayStart').onchange=()=>{$('holidayEnd').min=$('holidayStart').value;if(!$('holidayEnd').value||$('holidayEnd').value<$('holidayStart').value)$('holidayEnd').value=$('holidayStart').value};$('holidayForm').onsubmit=e=>{e.preventDefault();const start=$('holidayStart').value,end=$('holidayEnd').value;if(end<start){alert('휴업 종료일은 시작일 이후로 선택해 주세요.');return}if(dayDifference(end,start)>366){alert('휴업일은 한 번에 최대 367일 범위로 등록해 주세요.');return}const name=$('holidayName').value.trim(),cursor=parse(start),last=parse(end),holidays=new Map(data.term.holidays.map(h=>[h.date,h]));while(cursor<=last){const date=iso(cursor);holidays.set(date,{date,name});cursor.setDate(cursor.getDate()+1)}data.term.holidays=[...holidays.values()];if(save()){render();toast('휴업일을 등록했습니다.')}}}
function removeHoliday(date){data.term.holidays=data.term.holidays.filter(h=>h.date!==date);if(save()){render();toast('휴업일을 삭제했습니다.')}}
render();
</script>
<style>.owner{display:inline-block;font-size:10px;border-radius:4px;padding:2px 5px;background:#edf1eb;color:#597367;margin-right:5px}.admin-info{padding:14px 18px;background:#f0f4ea;border-radius:8px;line-height:1.8;margin:16px 0}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.event{white-space:normal}.file-input{display:none}@media print{body{background:#fff;color:#000}aside,body>main>header>button,#printButton,#adminButton,dialog,.notice,.actions,.admin-actions,.task-form,.task-tabs,#holidayForm,#termForm button,.search,.filters{display:none!important}main{margin:0;padding:0;max-width:none}header{margin-bottom:15px}.panel,.stat,.week-day{box-shadow:none;break-inside:avoid;border-color:#ccc}.calendar{font-size:10px}.day{min-height:90px}.week-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.week-day textarea{min-height:100px}input,textarea,select{border:0!important;background:transparent!important;resize:none}button{color:inherit;background:transparent;border:0;padding:2px}textarea{overflow:visible}#nav{display:none}.cards{grid-template-columns:repeat(3,1fr)}.summary-grid{grid-template-columns:1fr 1fr}@page{margin:12mm}}</style>
<script>const originalRender=render,originalSettingsView=settingsView,originalOpenEvent=openEvent,originalListEvents=listEvents;</script>
<script>
let isAdmin=false;
const authKey='teacher-notebook-admin-password';
function getPassword(){return localStorage.getItem(authKey)||'admin'}
function ownerLabel(e){return e.author==='school'?'학교':(e.dept||'부서 미지정')}
function adminLogin(){if(isAdmin){isAdmin=false;if(page===4)page=0;render();toast('관리자 모드를 종료했습니다.');return}const password=prompt('관리자 비밀번호를 입력하세요.\n초기 비밀번호: admin\n화면만 나누는 잠금이며 보안 인증 기능이 아닙니다.');if(password===null)return;if(password!==getPassword()){alert('비밀번호가 일치하지 않습니다.');return}isAdmin=true;page=4;render();toast('관리자 모드로 들어왔습니다.')}
function setPage(n){if(n===4&&!isAdmin){adminLogin();return}page=n;render()}
function render(){originalRender();$('nav').innerHTML=pages.map((p,i)=>i===4&&!isAdmin?'':`<button class="${page===i?'active':''}" onclick="setPage(${i})">${['◷','▦','▤','☑','⚙'][i]}　${i===4?'학기 설정 · 백업':p}</button>`).join('');let controls=$('headerControls');if(!controls){controls=document.createElement('div');controls.id='headerControls';controls.className='toolbar';const add=document.querySelector('main>header>button');add.replaceWith(controls);controls.appendChild(add);const print=document.createElement('button');print.id='printButton';print.textContent='인쇄';print.onclick=printCurrent;controls.appendChild(print);const admin=document.createElement('button');admin.id='adminButton';admin.onclick=adminLogin;controls.appendChild(admin)}$('adminButton').textContent=isAdmin?'관리자 모드 종료':'관리자 모드';if(page===4)$('pageTitle').textContent='학기 설정 · 백업·복원';if(page===0){const buttons=$('content').querySelectorAll('.row .body > button');buttons.forEach(b=>{const match=b.getAttribute('onclick')?.match(/openEvent\('([^']+)'\)/);const e=match&&data.events.find(e=>e.id===match[1]);if(e&&!b.querySelector('.owner'))b.insertAdjacentHTML('afterbegin',`<span class="owner">${esc(ownerLabel(e))}</span>`)})}}
function eventHTML(e){return `<button class="event" style="--c:${cats[e.cat]}" onclick="openEvent('${e.id}')" title="${esc(e.name)}"><span class="owner">${esc(ownerLabel(e))}</span>${esc(e.name)}</button>`}
function listEvents(items){const wrapper=document.createElement('div');wrapper.innerHTML=originalListEvents(items);wrapper.querySelectorAll('.row .body > button').forEach((button,i)=>button.insertAdjacentHTML('afterbegin',`<span class="owner">${esc(ownerLabel(items[i]))}</span>`));return wrapper.innerHTML}
function openEvent(id=null,date=today()){if(id){const e=data.events.find(e=>e.id===id);if(e?.author==='school'&&!isAdmin){alert('학교 일정은 관리자 모드에서 수정할 수 있습니다.');return}}originalOpenEvent(id,date);$('dept').required=!isAdmin;$('dept').disabled=isAdmin;$('dept').placeholder=isAdmin?'관리자 등록 일정은 학교로 표시됩니다.':'부서 이름을 입력하세요';if(isAdmin)$('dept').value='학교';let note=$('eventOwnerNote');if(!note){note=document.createElement('p');note.id='eventOwnerNote';note.className='hint';$('eventForm').insertBefore(note,$('eventForm').querySelector('.actions'))}note.textContent=isAdmin?'관리자가 저장한 일정은 ‘학교’로 표시됩니다.':'저장한 일정은 입력한 부서 이름으로 표시됩니다.'}
$('eventForm').onsubmit=e=>{e.preventDefault();const name=$('eventName').value.trim(),dept=isAdmin?'학교':$('dept').value.trim();if(!name||!dept){alert('일정 이름과 부서 이름을 입력해 주세요.');return}if($('end').value<$('start').value){alert('종료일은 시작일 이후로 선택해 주세요.');return}if(editing&&data.events.find(item=>item.id===editing)?.author==='school'&&!isAdmin)return;const item={id:editing||crypto.randomUUID(),name,start:$('start').value,end:$('end').value,dept,cat:$('category').value,memo:$('memo').value.trim(),author:isAdmin?'school':'department'};if(editing)data.events[data.events.findIndex(item=>item.id===editing)]=item;else data.events.push(item);if(save()){$('eventDialog').close();render();toast('일정을 저장했습니다.')}};
function removeEvent(){if(editing&&data.events.find(e=>e.id===editing)?.author==='school'&&!isAdmin){alert('학교 일정은 관리자 모드에서 삭제할 수 있습니다.');return}if(confirm('이 일정을 삭제할까요?')){data.events=data.events.filter(e=>e.id!==editing);if(save()){$('eventDialog').close();render()}}}
function adminRequired(){if(isAdmin)return true;alert('관리자 모드에서 사용할 수 있습니다.');return false}
function settingsView(){if(!isAdmin){$('content').innerHTML='<section class="panel"><h2>관리자 전용</h2><p>학기 설정과 백업·복원은 관리자 모드에서 사용할 수 있습니다.</p><button onclick="adminLogin()">관리자 모드 로그인</button></section>';return}originalSettingsView();$('content').insertAdjacentHTML('afterbegin','<div class="admin-info"><strong>관리자 모드</strong><br>이 비밀번호는 화면만 나누는 잠금입니다. 실제 보안 인증이나 데이터 암호화 기능은 없으며, 브라우저 개발자 도구 등으로 우회할 수 있습니다. 모든 기록과 비밀번호는 현재 브라우저에 저장됩니다.</div>');$('content').insertAdjacentHTML('beforeend',`<section class="panel"><h2>백업·복원</h2><p class="hint">전체 백업은 일정·업무·주간 계획·학기 설정을 JSON 파일로 저장합니다. 복원하면 현재 기록 전체가 교체됩니다. 관리자 비밀번호는 백업에 포함하지 않습니다.</p><div class="admin-actions"><button onclick="exportBackup()">전체 백업 저장</button><button onclick="document.getElementById('backupFile').click()">전체 백업 복원</button></div><input id="backupFile" class="file-input" type="file" accept=".json,application/json" onchange="restoreBackup(this)"><h3 class="minor-heading">일정 CSV</h3><p class="hint">UTF-8 CSV로 모든 일정을 내보내거나 추가로 불러옵니다. 동일한 ID는 건너뜁니다. CSV의 작성주체는 참고용이며, 관리자 모드에서 불러온 일정은 학교 일정으로 등록됩니다.</p><div class="admin-actions"><button onclick="exportCSV()">일정 CSV 내보내기</button><button onclick="document.getElementById('csvFile').click()">일정 CSV 불러오기</button></div><input id="csvFile" class="file-input" type="file" accept=".csv,text/csv" onchange="importCSV(this)"></section><section class="panel"><h2>관리자 비밀번호 변경</h2><form id="passwordForm"><div class="form-grid" style="margin-top:20px"><div class="field"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" required></div></div><div class="actions"><button class="primary">비밀번호 변경</button></div></form></section>`);$('passwordForm').onsubmit=e=>{e.preventDefault();if(!adminRequired())return;const password=$('newPassword').value;if(password!==$('confirmPassword').value){alert('비밀번호 확인이 일치하지 않습니다.');return}try{localStorage.setItem(authKey,password);$('passwordForm').reset();toast('비밀번호를 변경했습니다.')}catch{alert('비밀번호를 저장할 수 없습니다.')}}}
function downloadFile(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){if(!adminRequired())return;downloadFile('교무수첩_백업_'+today()+'.json',JSON.stringify({format:'teacher-notebook',version:1,data},null,2),'application/json;charset=utf-8')}
function validDate(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const date=parse(value);return !isNaN(date)&&iso(date)===value}
function validateEvent(e){return e&&typeof e.id==='string'&&typeof e.name==='string'&&e.name.trim()&&validDate(e.start)&&validDate(e.end)&&e.end>=e.start&&Object.hasOwn(cats,e.cat)&&typeof e.dept==='string'&&typeof e.memo==='string'&&(!e.author||['school','department'].includes(e.author))}
function validBackup(d){return d&&Array.isArray(d.events)&&d.events.every(validateEvent)&&new Set(d.events.map(e=>e.id)).size===d.events.length&&Array.isArray(d.tasks)&&d.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&typeof t.done==='boolean'&&(!t.due||validDate(t.due))&&taskCats.includes(t.cat)&&['높음','보통','낮음'].includes(t.priority))&&d.term&&typeof d.term.name==='string'&&validDate(d.term.start)&&validDate(d.term.end)&&d.term.end>=d.term.start&&Number.isInteger(d.term.target)&&d.term.target>0&&d.term.target<=366&&Array.isArray(d.term.holidays)&&d.term.holidays.every(h=>h&&validDate(h.date)&&typeof h.name==='string')&&d.weeks&&typeof d.weeks==='object'&&!Array.isArray(d.weeks)&&Object.entries(d.weeks).every(([k,w])=>validDate(k)&&w&&Array.isArray(w.days)&&w.days.length===5&&w.days.every(v=>typeof v==='string')&&typeof w.goal==='string'&&typeof w.memo==='string')}
async function restoreBackup(input){if(!adminRequired())return;const file=input.files[0];if(!file)return;try{const backup=JSON.parse(await file.text());if(backup.format!=='teacher-notebook'||backup.version!==1||!validBackup(backup.data))throw Error('올바른 교무수첩 백업 파일이 아닙니다.');if(!confirm('현재 기록 전체를 백업 파일의 내용으로 교체할까요?'))return;const previous=data;data=backup.data;if(!save()){data=previous;return}render();toast('백업을 복원했습니다.')}catch(error){alert('복원 실패: '+error.message)}finally{input.value=''}}
const csvHeaders=['ID','일정 이름','시작일','종료일','부서','분류','메모','작성주체'];
function exportCSV(){if(!adminRequired())return;const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[csvHeaders,...data.events.map(e=>[e.id,e.name,e.start,e.end,e.dept,e.cat,e.memo,e.author==='school'?'학교':'부서'])];downloadFile('교무수첩_일정_'+today()+'.csv','\uFEFF'+rows.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false,closed=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else cell+=c;continue}if(c==='"'){if(cell||closed)throw Error('CSV 따옴표 형식이 올바르지 않습니다.');quoted=true}else if(c===','){row.push(cell);cell='';closed=false}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell='';closed=false}else{if(closed)throw Error('CSV 필드 구분이 올바르지 않습니다.');cell+=c}}if(quoted)throw Error('닫히지 않은 CSV 따옴표가 있습니다.');row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
async function importCSV(input){if(!adminRequired())return;const file=input.files[0];if(!file)return;try{const rows=parseCSV(await file.text());const header=rows.shift();if(!header||csvHeaders.some((v,i)=>header[i]!==v)||header.length!==8)throw Error('이 수첩에서 내보낸 CSV 형식을 사용해 주세요.');const ids=new Set(data.events.map(e=>e.id)),pending=[];let skipped=0;rows.forEach((row,index)=>{if(row.length!==8)throw Error((index+2)+'행의 열 개수가 맞지 않습니다.');const [id,name,start,end,dept,cat,memo]=row;const item={id:id||crypto.randomUUID(),name:name.trim(),start,end,dept:'학교',cat,memo,author:'school'};if(!validateEvent(item))throw Error((index+2)+'행의 이름·날짜·분류를 확인해 주세요.');if(ids.has(item.id)){skipped++;return}ids.add(item.id);pending.push(item)});if(!pending.length){toast('추가할 일정이 없습니다. 중복 '+skipped+'개');return}if(!confirm(pending.length+'개 일정을 학교 일정으로 추가할까요? (중복 '+skipped+'개 제외)'))return;const previous=data.events;data.events=[...data.events,...pending];if(!save()){data.events=previous;return}render();toast(pending.length+'개 일정을 불러왔습니다.')}catch(error){alert('CSV 불러오기 실패: '+error.message)}finally{input.value=''}}
function printCurrent(){const areas=[...document.querySelectorAll('main textarea')];const old=areas.map(el=>el.style.height);areas.forEach(el=>el.style.height=Math.max(el.scrollHeight,80)+'px');window.print();areas.forEach((el,i)=>el.style.height=old[i])}
render();
</script>
</body></html>
