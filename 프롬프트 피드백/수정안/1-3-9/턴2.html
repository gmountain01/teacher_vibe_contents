ce3d8;border-radius:20px;margin-top:20px}.panel h2{margin:12px 0}.muted{color:#69756c;font-size:14px}.investigation{padding:20px 0;border-top:1px solid #e3e8de}.investigation h3{margin:0 0 10px;font-size:19px}.investigation p{margin:0 0 15px}.investigation button{width:100%}.badge{font-size:13px;color:#3c6948;background:#edf4e8;padding:5px 10px;border-radius:20px}.notice{padding:16px;background:#edf5e9;border-radius:12px;margin-top:18px}footer{padding:0 20px 28px;display:flex;gap:15px;align-items:center;justify-content:space-between;font-size:13px;color:#6c756b}footer button{font-size:13px;min-height:46px}dialog{border:0;border-radius:18px;padding:25px;max-width:360px;width:90%;color:#21382f}dialog::backdrop{background:#10251e88}.actions{display:flex;gap:10px}.actions button{flex:1}[hidden]{display:none!important}@media(max-width:700px){header{padding-top:30px}.cards{grid-template-columns:1fr}.card p{min-height:0}.card{padding:22px}.status{align-items:flex-start;flex-direction:column;gap:4px}.panel{padding:20px}.stage{align-items:flex-start;flex-direction:column;gap:4px}footer{align-items:flex-start;flex-direction:column}button{min-height:54px}}

<body>
<header><div><span class="eyebrow">HISTORY EXPLORER · 중학교 역사</span><h1>시간탐사대: 선사시대</h1><p>흔적을 조사하고, 시대의 비밀을 하나씩 발견해 보세요.</p></div></header>
<main>
<div class="status" role="status" aria-live="polite"><strong id="total"></strong><span id="guide" class="muted"></span></div>
<div class="resources" aria-label="탐사대 현황"><div><label for="food">🌾 식량 70 / 100</label><progress id="food" max="100" value="70">70%</progress></div><div><label for="community">🤝 공동체 70 / 100</label><progress id="community" max="100" value="70">70%</progress></div><div role="status" aria-live="polite"><strong>🔎 역사 증거 점수</strong><div id="score">0 / 270</div></div></div><section aria-labelledby="era-heading"><h2 id="era-heading">탐사할 시대를 선택하세요</h2><div id="cards" class="cards"></div></section>
<section id="detail" class="panel" hidden aria-labelledby="detail-heading"></section>
</main>
<footer><span id="save-note">탐사 기록은 이 브라우저에 자동 저장됩니다.</span><button class="secondary" id="reset">탐사 기록 초기화</button></footer>
<dialog id="reset-dialog"><h3>탐사를 처음부터 시작할까요?</h3><p>완료한 모든 조사 기록이 지워집니다.</p><div class="actions"><button class="secondary" id="cancel-reset">취소</button><button id="confirm-reset">초기화</button></div></dialog>
<script>
const KEY='prehistoric-time-explorers-v2';
let done=new Set(), selectedEra=null, selectedStage=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved)){for(let e=0;e<3;e++)for(let s=0;s<3;s++)for(let i=0;i<3;i++){const k=`${e}-${s}-${i}`;if(saved.includes(k))done.add(k);}}}catch{document.getElementById('save-note').textContent='자동 저장을 사용할 수 없어 이번 탐사 동안만 기록됩니다.';}
let phase='action', feedback='';
const stageDone=(e,s)=>ERAS[e].stages[s].investigations.every((_,i)=>done.has(`${e}-${s}-${i}`));
const eraDone=e=>ERAS[e].stages.every((_,s)=>stageDone(e,s));
const eraOpen=e=>e===0||ERAS.slice(0,e).every((_,n)=>eraDone(n));
const stageOpen=(e,s)=>eraOpen(e)&&(s===0||ERAS[e].stages.slice(0,s).every((_,n)=>stageDone(e,n)));
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]));}catch{document.getElementById('save-note').textContent='자동 저장을 사용할 수 없어 이번 탐사 동안만 기록됩니다.';}}
function render(){
 const completed=ERAS.reduce((n,e,ei)=>n+e.stages.filter((_,s)=>stageDone(ei,s)).length,0);
 document.getElementById('score').textContent=`${completed*30} / 270`;
 document.getElementById('total').textContent=`전체 ${completed} / 9 스테이지 완료`;
 document.getElementById('guide').textContent=completed===9?'🎉 모든 시대의 탐사를 마쳤습니다!':'행동 선택 → 근거 선택 → 증거 +30';
 document.getElementById('cards').innerHTML=ERAS.map((e,ei)=>{const open=eraOpen(ei),n=e.stages.filter((_,s)=>stageDone(ei,s)).length;return `<article class="card ${selectedEra===ei?'current':''}"><span class="icon" aria-hidden="true">${e.icon}</span><h3>${e.name}</h3><p>${e.intro}</p><div class="tags">${e.keywords.map(k=>`<span class="tag">${k}</span>`).join('')}</div><span class="count">${n} / 3 스테이지 완료</span><div class="track"><div class="fill" style="width:${n/3*100}%"></div></div><button data-era="${ei}" ${open?'':'disabled'}>${open?(n===3?'✓ 다시 탐사하기':'탐사 시작 →'):`🔒 ${ERAS[ei-1].name} 완료 후 열림`}</button></article>`}).join('');
 renderDetail();
}
function renderDetail(){
 const el=document.getElementById('detail');el.hidden=selectedEra===null;if(selectedEra===null)return;
 const e=ERAS[selectedEra];
 if(selectedStage===null){el.innerHTML=`<span class="badge">${e.name} 탐사 지도</span><h2 id="detail-heading">세 개의 스테이지를 탐사하세요</h2><p class="muted">각 스테이지에서 행동과 근거를 모두 맞혀 보세요. 식량과 공동체는 70에서 시작하며 이 예시에서는 고정됩니다.</p><div class="stage-list">${e.stages.map((s,si)=>`<button class="stage ${stageDone(selectedEra,si)?'secondary':''}" data-stage="${si}" ${stageOpen(selectedEra,si)?'':'disabled'}><span>${si+1}. ${s.title}</span><span>${stageDone(selectedEra,si)?'✓ 완료 · 다시 보기':stageOpen(selectedEra,si)?`${s.investigations.filter((_,i)=>done.has(`${selectedEra}-${si}-${i}`)).length} / 1 조사 완료 →`:'🔒 앞 스테이지 완료 필요'}</span></button>`).join('')}</div>${eraDone(selectedEra)?`<div class="notice">🎉 ${e.name} 탐사 완료! ${selectedEra<2?'다음 시대가 열렸어요.':'모든 시대를 탐사한 시간탐사대원입니다!'}</div>`:''}`;return;}

 const s=e.stages[selectedStage],c=s.investigations[0],complete=stageDone(selectedEra,selectedStage),n=selectedEra*3+selectedStage;
 const evidence=phase==='evidence',items=evidence?c.evidence:c.actions;
 // 행동 A/B/C와 근거 1/2/3에 정답이 각각 세 번씩 배치됩니다.
 const position=evidence?(n*2+1)%3:n%3,order=[1,2];order.splice(position,0,0);
 el.innerHTML=`<button class="secondary" id="back">← 스테이지 목록</button><h2 id="detail-heading">${e.name} · ${selectedStage+1}. ${s.title}</h2><article class="investigation"><p>${c.text}</p>${complete?`<div class="notice" role="status"><strong>✓ 조사 완료 · 증거 +30 획득</strong><p>학습 포인트: ${c.point}</p><small>이미 기록한 조사입니다. 다시 열어도 점수가 추가되지 않습니다.</small></div>`:`<div class="step">${evidence?'2. 행동을 뒷받침하는 근거를 고르세요':'1. 시대에 맞는 행동을 고르세요'}</div>${evidence?`<p class="badge">✓ 선택한 행동: ${c.actions[0]}</p>`:''}<div class="choices">${order.map((original,i)=>`<button data-choice="${original}" ${feedback?'disabled':''}>${evidence?i+1:['A','B','C'][i]}. ${items[original]}</button>`).join('')}</div>${feedback?`<div class="error" role="alert">${feedback}<button id="retry" class="secondary">다시 선택</button></div>`:''}`}</article>${complete?`<button id="next" style="width:100%">${selectedStage<2?'다음 스테이지로 →':selectedEra<2?'다음 시대로 →':'전체 탐사 결과 보기 →'}</button>`:''}`;
}
function resetChoice(){phase='action';feedback='';}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.era!==undefined){const e=Number(b.dataset.era);if(!eraOpen(e))return;selectedEra=e;selectedStage=null;resetChoice();render();showDetail();}
 if(b.dataset.stage!==undefined){const s=Number(b.dataset.stage);if(!stageOpen(selectedEra,s))return;selectedStage=s;resetChoice();renderDetail();showDetail();}
 if(b.dataset.choice!==undefined){
  if(selectedEra===null||selectedStage===null||!stageOpen(selectedEra,selectedStage)||stageDone(selectedEra,selectedStage)||feedback)return;
  const choice=Number(b.dataset.choice);
  if(choice!==0){feedback=phase==='evidence'?'근거가 부족합니다: 행동을 직접 뒷받침하는 유물이나 생활 흔적을 찾아보세요.':choice===1?'시대착오 발견: 선택한 기술이나 생활 방식은 이 시대에 해당하지 않아요.':'근거가 부족합니다: 주어진 흔적만으로 그렇게 단정할 수 없어요.';renderDetail();document.getElementById('retry').focus({preventScroll:true});}
  else if(phase==='action'){phase='evidence';renderDetail();document.querySelector('[data-choice]').focus({preventScroll:true});}
  else{const key=`${selectedEra}-${selectedStage}-0`;if(!done.has(key)){done.add(key);save();}render();document.getElementById('next').focus({preventScroll:true});}
 }
 if(b.id==='retry'){feedback='';renderDetail();document.querySelector('[data-choice]').focus({preventScroll:true});}
 if(b.id==='back'){selectedStage=null;resetChoice();renderDetail();showDetail();}
 if(b.id==='next'){if(selectedStage<2)selectedStage++;else if(selectedEra<2){selectedEra++;selectedStage=null;}else{selectedEra=null;selectedStage=null;}resetChoice();render();if(selectedEra!==null)showDetail();else document.getElementById('era-heading').scrollIntoView({behavior:'smooth'});}
});
function showDetail(){document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});const h=document.getElementById('detail-heading');h.tabIndex=-1;h.focus({preventScroll:true});}
const resetDialog=document.getElementById('reset-dialog');
document.getElementById('reset').onclick=()=>resetDialog.showModal();
document.getElementById('cancel-reset').onclick=()=>resetDialog.close();
document.getElementById('confirm-reset').onclick=()=>{done.clear();selectedEra=null;selectedStage=null;resetChoice();save();render();resetDialog.close();};
render();
</script>
</body>
</html>
