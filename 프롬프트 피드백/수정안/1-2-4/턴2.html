<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두근두근 캡슐 뽑기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff6e8;color:#303448;font-family:'Malgun Gothic',sans-serif;background-image:radial-gradient(#ebddca 1.5px,transparent 1.5px);background-size:24px 24px}main{max-width:760px;margin:auto;padding:48px 22px;text-align:center}.badge{display:inline-block;background:#fff;border:1px solid #e5dccf;border-radius:30px;padding:8px 18px;font-size:13px;color:#85715c}h1{font-size:clamp(28px,5vw,42px);margin:18px 0 10px;letter-spacing:-2px}p{color:#797b87;line-height:1.7}.card{margin:30px auto 0;padding:32px;background:white;border:1px solid #eee5d9;border-radius:26px;box-shadow:0 14px 35px #6d51300c;text-align:left;max-width:550px}.step{color:#dc765a;font-size:12px;font-weight:bold;letter-spacing:2px}h2{font-size:22px;margin:10px 0 24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;font-weight:bold}input,textarea{display:block;width:100%;margin-top:10px;border:2px solid #ece9e4;background:#fffcf7;border-radius:12px;padding:14px;font:inherit;color:#303448;outline:none}input:focus,textarea:focus{border-color:#ed997e;box-shadow:0 0 0 3px #fff0e7}textarea{resize:vertical;min-height:180px;line-height:1.7}.hint{font-size:12px;margin:12px 0;color:#8c8d95}.error{color:#bd3d40;font-size:14px;min-height:22px;line-height:1.5;margin:14px 0}button{border:0;border-radius:12px;padding:15px 22px;background:#e98264;color:white;font:inherit;font-weight:bold;cursor:pointer;transition:transform .15s,background .15s}button:hover{background:#d97053;transform:translateY(-2px)}button:focus-visible{outline:3px solid #485d9b;outline-offset:4px}button:disabled{opacity:.6;cursor:wait;transform:none}.primary{width:100%}.back{background:#f1eee9;color:#72727b;padding:10px 15px;font-size:13px}.back:hover{background:#e6e0d7}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.summary{font-size:13px;color:#85818a}[hidden]{display:none!important}
#stage{margin-top:28px}.ready{display:inline-block;color:#d66e51;font-size:25px;font-weight:900;animation:bounce 1s ease-in-out infinite}.machine{position:relative;width:290px;margin:22px auto 28px;filter:drop-shadow(0 16px 9px #65452920)}.enter{animation:popUp .85s cubic-bezier(.2,.9,.35,1.25) both}.dome{height:220px;border:9px solid #eb987e;border-radius:145px 145px 28px 28px;background:linear-gradient(115deg,#ffffffdc,#dbeef180);position:relative;overflow:hidden;box-shadow:inset 8px 0 0 #fff7}.shine{position:absolute;top:30px;left:28px;width:20px;height:75px;border-radius:50%;background:#fff9;transform:rotate(25deg)}.capsule{position:absolute;width:54px;height:54px;border-radius:50%;background:linear-gradient(to bottom,var(--c) 50%,#fff5e9 50%);border:2px solid #ffffffa0;box-shadow:inset -5px -5px 0 #0000000b,0 3px 4px #0001;transform:rotate(var(--r))}.base{background:#ed987d;border:7px solid #dc8268;border-radius:12px 12px 28px 28px;margin-top:-8px;position:relative;height:170px;padding:20px}.plate{font-size:12px;font-weight:bold;letter-spacing:3px;background:#fff2d9;border-radius:7px;padding:9px;color:#9c644c}.knob{position:absolute;left:34px;top:73px;width:55px;height:55px;background:#fff0d4;border:5px solid #d1785f;border-radius:50%;display:grid;place-items:center}.knob:after{content:'';width:12px;height:36px;border-radius:5px;background:#cf795e;transform:rotate(35deg)}.outlet{position:absolute;right:26px;top:78px;width:95px;height:65px;border:6px solid #ce755e;border-radius:35px 35px 12px 12px;background:#804e48;box-shadow:inset 0 8px 0 #0002}.feet{height:10px;width:240px;margin:auto;border-radius:0 0 12px 12px;background:#b66b55}.shaking{animation:shake .15s infinite}.shaking .capsule{animation:jiggle .3s infinite alternate}.shaking .knob{transform:rotate(160deg);transition:transform .7s}#results{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px 0}.winner{background:white;border:2px solid #e9ab8c;border-radius:18px;padding:16px 23px;animation:popUp .5s both;box-shadow:0 5px 0 #edddcd;font-weight:bold;max-width:100%;overflow-wrap:anywhere}.winner small{display:block;color:#d28a6a;font-size:11px;margin-bottom:7px}#draw{min-width:240px}#restart{display:block;margin:22px auto;background:transparent;color:#89828a;font-size:13px;padding:8px}.status{font-size:14px;color:#8b7e77}@keyframes popUp{0%{opacity:0;transform:translateY(180px) scale(.7)}65%{opacity:1;transform:translateY(-18px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes jiggle{to{translate:0 -12px;rotate:20deg}}@media(max-width:480px){main{padding:28px 16px}.card{padding:24px}.fields{gap:12px}input{padding:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.machine{width:min(100%,640px)}.dome{height:520px;border-radius:50%;overflow:hidden}.base{width:290px;margin:-9px auto 0}.capsule{width:64px;height:64px;left:0;top:0;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:14px;font-weight:900;line-height:1.15;color:#293344;background:radial-gradient(circle at 30% 22%,#fff9,transparent 55%),var(--c);border:2px solid #fff;transform:none;overflow-wrap:anywhere;box-shadow:inset -4px -5px 0 #0001,0 2px 5px #0002;will-change:transform}.shine{z-index:2;pointer-events:none}.shaking{animation:none}.shaking .capsule{animation:none}.sound{display:block;margin:14px auto;background:#fff;color:#786b60;border:1px solid #e3d5c8;padding:10px 18px;font-size:13px}.exit-ball{position:absolute;z-index:5;right:49px;top:83px;width:64px;height:64px;border-radius:50%;background:var(--c);border:3px solid white;display:grid;place-items:center;padding:5px;font-weight:900;font-size:14px;overflow-wrap:anywhere;animation:ballOut .8s ease-out both;box-shadow:0 5px 10px #0002}.winner{border-radius:50%;width:116px;min-height:116px;padding:18px 10px;display:flex;flex-direction:column;justify-content:center;background:var(--c);color:#293344}.winner small{color:#534c45}.winner span{overflow-wrap:anywhere}@keyframes ballOut{0%{opacity:0;transform:translateY(-15px) scale(.4)}30%{opacity:1}70%{transform:translateY(95px) scale(1.2)}100%{transform:translateY(75px) scale(1)}}</style>
</head>
<body>
<main>
<div class="badge">우리 반의 작은 두근거림</div>
<h1>두근두근 캡슐 뽑기</h1>
<p id="intro">오늘의 주인공은 누구일까요?<br>캡슐 속에 우리 반 친구들을 담아 보세요.</p>
<section id="step1" class="card">
<span class="step">STEP 01</span><h2>몇 명을 뽑을까요?</h2>
<form id="countForm" novalidate>
<div class="fields"><label for="total">전체 학생 수<input id="total" type="number" min="1" step="1" placeholder="예: 25" required></label><label for="pick">뽑을 학생 수<input id="pick" type="number" min="1" step="1" placeholder="예: 3" required></label></div>
<div class="error" id="countError" role="alert"></div>
<button class="primary" type="submit">다음 →</button><p class="hint" style="text-align:center;margin-bottom:0">Enter 키를 눌러도 다음으로 넘어가요.</p>
</form></section>
<section id="step2" class="card" hidden>
<div class="row"><span class="step">STEP 02</span><button class="back" id="back" type="button">← 이전</button></div><h2>친구들의 이름을 담아 주세요</h2>
<div class="summary" id="summary"></div><form id="nameForm" novalidate>
<label for="names" style="margin-top:20px">학생 이름<textarea id="names" placeholder="김민준&#10;이서연&#10;박지호"></textarea></label>
<p class="hint">한 줄에 한 명씩, 또는 쉼표(,)로 구분해 주세요.<br>동명이인은 ‘김민준(1번)’처럼 구분하면 좋아요.</p>
<div class="error" id="nameError" role="alert"></div><button type="submit" class="primary">실행 ✨</button></form></section>
<section id="stage" hidden aria-label="캡슐 뽑기 기계">
<div id="ready" class="ready" role="status">준비 완료!</div>
<div id="machine" class="machine"><div class="dome" id="dome"><div class="shine"></div></div><div class="base"><div class="plate">LUCKY CAPSULE</div><div class="knob"></div><div class="outlet"></div></div><div class="feet"></div></div>
<button class="sound" id="sound" type="button" aria-pressed="true">🔊 효과음 켜짐</button><button id="draw" type="button">캡슐 뽑기 🎉</button><div id="results" aria-live="polite"></div><p id="status" class="status" role="status"></p><button id="restart" type="button">처음부터 다시 설정하기</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let total=0,pick=0,students=[],busy=false;
$('countForm').addEventListener('submit',e=>{e.preventDefault();const a=Number($('total').value),b=Number($('pick').value);if(!Number.isSafeInteger(a)||a<1||!Number.isSafeInteger(b)||b<1){$('countError').textContent='전체 학생 수와 뽑을 학생 수를 1 이상의 정수로 적어 주세요.';return}if(b>a){$('countError').textContent='뽑을 학생 수는 전체 학생 수보다 클 수 없어요.';return}total=a;pick=b;$('countError').textContent='';$('step1').hidden=true;$('step2').hidden=false;$('summary').textContent=`전체 ${total}명 중 ${pick}명을 뽑아요.`;$('names').focus()});
$('back').onclick=()=>{$('step2').hidden=true;$('step1').hidden=false;$('total').focus()};
$('nameForm').addEventListener('submit',e=>{e.preventDefault();students=$('names').value.split(/[\n,，]+/).map(n=>n.trim()).filter(Boolean);if(students.length!==total){$('nameError').textContent=`이름이 ${students.length}명 입력되었어요. 전체 학생 수 ${total}명에 맞춰 주세요.`;return}$('nameError').textContent='';$('step2').hidden=true;$('stage').hidden=false;$('machine').classList.add('enter');startMachine();$('draw').focus()});
const colors=['#f5ca78','#f2a7b8','#a4d9c7','#a8cced','#cbb6e8'];
let balls=[],chosen=0,frame=0,lastTime=0,soundOn=true,audioContext=null,audioBus=null,tickTimer=null;
function initAudio(){try{if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();audioBus=audioContext.createGain();audioBus.connect(audioContext.destination)}audioBus.gain.value=soundOn?.17:0;audioContext.resume().catch(()=>{})}catch(e){}}
function tone(freq,duration=.08,delay=0,type='sine'){if(!soundOn||!audioContext)return;const t=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.6,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioBus);o.start(t);o.stop(t+duration+.02)}
$('sound').onclick=()=>{soundOn=!soundOn;initAudio();$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';if(soundOn)tone(660)};
function randomIndex(max){const range=4294967296,limit=range-range%max;let value;do{value=crypto.getRandomValues(new Uint32Array(1))[0]}while(value>=limit);return value%max}
function startMachine(){cancelAnimationFrame(frame);chosen=0;balls=[];$('results').replaceChildren();$('dome').querySelectorAll('.capsule').forEach(e=>e.remove());$('machine').querySelectorAll('.exit-ball').forEach(e=>e.remove());$('draw').disabled=false;$('draw').textContent='캡슐 뽑기 🎉';$('ready').textContent='준비 완료!';$('status').textContent=`한 번에 한 명씩, 총 ${pick}명을 뽑아요.`;const w=$('dome').clientWidth;$('dome').style.height=Math.max(380,Math.ceil(students.length*64*64/(w*.48)))+'px';const h=$('dome').clientHeight;students.forEach((name,i)=>{const el=document.createElement('div');el.className='capsule';el.textContent=name;el.title=name;el.style.setProperty('--c',colors[i%colors.length]);if(name.length>6)el.style.fontSize='11px';$('dome').appendChild(el);const angle=Math.random()*Math.PI*2,dist=Math.sqrt(Math.random())*.85;balls.push({name,el,color:colors[i%colors.length],x:w/2+Math.cos(angle)*(w/2-34)*dist,y:h/2+Math.sin(angle)*(h/2-34)*dist,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150})});initAudio();tone(523,.12);tone(784,.2,.13);lastTime=0;frame=requestAnimationFrame(animate)}
function animate(time){if($('stage').hidden)return;const dt=Math.min((time-lastTime)/1000||.016,.025);lastTime=time;const w=$('dome').clientWidth,h=$('dome').clientHeight,r=32,ax=w/2-r-2,ay=h/2-r-2;
for(let step=0;step<2;step++){const d=dt/2;for(const b of balls){const agitation=busy?160:45;b.vx+=(Math.random()-.5)*agitation*d;b.vy+=(Math.random()-.5)*agitation*d;const speed=Math.hypot(b.vx,b.vy),target=busy?240:95;if(speed>0){const scale=1+(target/speed-1)*d*2;b.vx*=scale;b.vy*=scale}b.x+=b.vx*d;b.y+=b.vy*d;}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);if(dist<64){if(dist<.001){dx=1;dy=0;dist=1}const nx=dx/dist,ny=dy/dist,overlap=(64-dist)/2;a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){a.vx+=relative*nx;a.vy+=relative*ny;b.vx-=relative*nx;b.vy-=relative*ny}}}
for(const b of balls){const dx=b.x-w/2,dy=b.y-h/2,q=Math.hypot(dx/ax,dy/ay);if(q>1){b.x=w/2+dx/q;b.y=h/2+dy/q;let nx=dx/(ax*ax),ny=dy/(ay*ay),n=Math.hypot(nx,ny);nx/=n;ny/=n;const v=b.vx*nx+b.vy*ny;if(v>0){b.vx-=2*v*nx;b.vy-=2*v*ny}}}}
for(const b of balls)b.el.style.transform=`translate(${b.x-r}px,${b.y-r}px)`;frame=requestAnimationFrame(animate)}
$('draw').onclick=()=>{if(busy||chosen>=pick)return;busy=true;initAudio();$('draw').disabled=true;$('restart').disabled=true;$('machine').querySelectorAll('.exit-ball').forEach(e=>e.remove());$('ready').textContent='두근두근…';$('status').textContent='누가 나올까요? 공을 섞고 있어요!';$('machine').classList.remove('enter');$('machine').classList.add('shaking');let ticks=0;tickTimer=setInterval(()=>{tone(160+ticks*22,.065,0,'triangle');ticks++;$('status').textContent=ticks<10?'두근두근… 누가 나올까요?':ticks<20?'조금만 더 기다려 주세요…':'곧 공이 나옵니다!'},100);
setTimeout(()=>{clearInterval(tickTimer);const ball=balls.splice(randomIndex(balls.length),1)[0];ball.el.remove();chosen++;$('machine').classList.remove('shaking');const exit=document.createElement('div');exit.className='exit-ball';exit.textContent=ball.name;exit.style.setProperty('--c',ball.color);$('machine').querySelector('.base').appendChild(exit);tone(523,.18);tone(659,.18,.12);tone(784,.4,.24);$('ready').textContent=ball.name+' 당첨!';const card=document.createElement('div');card.className='winner';card.style.setProperty('--c',ball.color);const tag=document.createElement('small');tag.textContent=`${chosen}번째 주인공`;const name=document.createElement('span');name.textContent=ball.name;card.append(tag,name);$('results').appendChild(card);$('status').textContent=`${pick}명 중 ${chosen}명을 뽑았어요.${chosen===pick?' 모두 축하해요!':''}`;$('draw').textContent=chosen===pick?'뽑기 완료 🎉':'다음 공 뽑기 🎉';$('draw').disabled=chosen===pick;$('restart').disabled=false;busy=false},3000)};
$('restart').onclick=()=>{if(busy)return;cancelAnimationFrame(frame);$('stage').hidden=true;$('step1').hidden=false;$('results').replaceChildren();$('ready').textContent='준비 완료!';$('status').textContent='';$('draw').textContent='캡슐 뽑기 🎉';$('machine').classList.remove('enter');$('total').focus()};
</script>
</body>
</html>
