<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"><title>다온초등학교 · 학교 파일 제출함 미리보기</title><style>
:root{--ink:#253b36;--muted:#788781;--green:#24765c;--line:#e1e8e2;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px '맑은 고딕',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:11px 17px;color:var(--ink);font-weight:600}button:hover{background:#edf4ee}button.primary,.active{background:var(--green)!important;color:white!important;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}.banner{background:#e8efe3;text-align:center;padding:10px;color:#42613c;font-size:12px;line-height:1.7}header{background:white;border-bottom:1px solid var(--line);padding:23px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--green);color:white;border-radius:12px;font-size:26px;padding:7px 13px}.brand strong{font-size:19px}.brand small{display:block;color:var(--muted);margin-top:4px}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}main{max-width:1120px;margin:35px auto;padding:0 24px 60px}.eyebrow{color:var(--green);letter-spacing:2px;font-size:11px;font-weight:bold}h1{font-size:30px;letter-spacing:-1.4px;margin:12px 0}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:24px 0 12px}p{color:var(--muted);line-height:1.8}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.badge{display:inline-block;background:#eaf2ec;color:var(--green);padding:5px 9px;border-radius:6px;font-size:11px}.layout{display:grid;grid-template-columns:1fr 270px;gap:24px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:20px}.side{background:#edf1e8}.side p{font-size:13px}.side .number{font-size:32px;color:var(--green);font-weight:bold}.steps{display:flex;gap:8px;margin-bottom:26px}.steps span{flex:1;border-top:3px solid var(--line);padding-top:12px;color:var(--muted);font-size:12px}.steps span.on{border-color:var(--green);color:var(--green);font-weight:bold}.fields{display:grid;grid-template-columns:1fr 1fr;gap:21px}label{display:block;font-size:13px;font-weight:bold}input,select{width:100%;margin-top:8px;border:1px solid #d8e1da;border-radius:8px;padding:12px;background:white;color:var(--ink)}input:focus,select:focus{outline:2px solid #b8d4bd}input[type=checkbox]{width:auto;margin:0;accent-color:var(--green)}.hint{font-weight:normal;font-size:11px;color:var(--muted);display:block;line-height:1.7;margin-top:7px}.notice{border-radius:9px;background:#f1f5ee;padding:15px;color:#60735b;font-size:12px;line-height:1.8;margin:20px 0}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:26px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{text-align:left;padding:18px;min-height:135px}.box strong{display:block;margin:13px 0 9px}.box small{color:var(--muted);font-weight:normal}.box.selected{outline:2px solid var(--green);background:#f0f7f1}.wide{width:100%;min-height:90px}.drop{border:2px dashed #cbd9cc;border-radius:12px;text-align:center;padding:26px;background:#fafcf9}.files{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.file{border:1px solid var(--line);border-radius:10px;overflow:hidden}.thumb{height:110px;background:#edf2e9;display:flex;align-items:center;justify-content:center;font-size:32px}.thumb img{width:100%;height:100%;object-fit:contain}.file div:last-child{padding:12px;font-size:12px;overflow-wrap:anywhere}.file button{padding:3px 8px;float:right}.tabs{margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:29px;margin-top:13px}.stat{padding:21px;background:white;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.stat strong{color:var(--ink)}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:15px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);background:#f8faf6}td button{font-size:11px;padding:6px 9px;margin:2px}.chart{height:150px;display:flex;align-items:end;gap:7px;margin-top:25px}.bar{background:#83b09a;flex:1;border-radius:4px 4px 0 0}.chartlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}footer{text-align:center;color:#91a093;font-size:11px;margin-top:32px}.empty{text-align:center;padding:35px;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#253b36;color:white;padding:14px 24px;border-radius:10px;z-index:10;max-width:90%;display:none}.check{font-size:46px;color:var(--green)}@media(max-width:800px){header,.intro{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.fields,.cards,.stats{grid-template-columns:1fr 1fr}.layout aside{display:none}.panel{padding:21px}main{padding:0 16px}.files{grid-template-columns:1fr 1fr}h1{font-size:25px}}@media(max-width:450px){.fields,.cards{grid-template-columns:1fr}nav button{padding:9px 12px}}
</style></head><body><div class="banner">외부 연결 없는 로컬 미리보기 · 실제 인증·업로드·배포·이메일 발송 없음 · 예시 데이터는 새로고침하면 초기화됩니다.</div><header><div class="brand"><span class="logo">▤</span><div><strong>학교 파일 제출함</strong><small>다온초등학교 · 함께 배우고, 편리하게 나누는 공간</small></div></div><nav><button id="roleParent" onclick="go('parent')">학부모</button><button id="roleTeacher" onclick="go('teacher')">교사 화면</button><button id="roleAdmin" onclick="go('admin')">관리자 화면</button></nav></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='parent',step=1,tab='dashboard',picked='',attachments=[],info={grade:'3',room:'2',student:'김다온',parent:'김보호',phone:'010-0000-0000',password:'1234'},receipt='',teacherState='before',teacherBox='open',studentEdit=-1;
let boxes=[{id:'open',name:'공개수업 참관 신청서',desc:'11월 20일 · 학부모 공개수업',count:48,active:true},{id:'trip',name:'현장체험학습 신청서',desc:'체험학습 신청 및 결과 보고서',count:32,active:true},{id:'survey',name:'교육활동 동의서',desc:'학교 교육활동 참여 동의',count:24,active:true},{id:'etc',name:'기타 학교 제출 서류',desc:'학교 공통 서류를 제출해 주세요',count:8,active:true},{id:'class',name:'2026학년도 3학년 2반',desc:'우리 반 담임 선생님께 보내는 파일',count:18,active:true,grade:3,room:2}];
let students=[{grade:3,room:2,name:'김다온'},{grade:3,room:2,name:'이서준'},{grade:3,room:2,name:'박하윤'}],teachers=[{name:'이선생',email:'teacher@example.invalid',state:'approved',box:'class',homeroom:true},{name:'정선생',email:'new@example.invalid',state:'pending',box:'open'}],records=[{id:1,box:'open',grade:'3',room:'2',student:'김다온',parent:'김보호',password:'1234',name:'공개수업_참관신청서[26-11-10-09-12-30].pdf',date:'2026-11-10 09:12',blob:new Blob(['공개수업 참관 신청서 예시 파일'],{type:'text/plain'}),size:245760},{id:2,box:'open',grade:'3',room:'2',student:'이서준',parent:'이보호',password:'1234',name:'참관_신청서[26-11-09-14-20-10].txt',date:'2026-11-09 14:20',blob:new Blob(['참관 신청 예시'],{type:'text/plain'}),size:1800}];let nextId=3,noticeTimer;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('toast').style.display='none',4000)}
function go(r){role=r;render()}function title(k,h,p){return `<div class="intro"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div><span class="badge">2026학년도 · 로컬 데모</span></div>`}function boxName(id){return boxes.find(b=>b.id===id)?.name||'삭제된 제출함'}function options(list,val){return list.map(v=>`<option ${String(v)===String(val)?'selected':''}>${esc(v)}</option>`).join('')}function field(label,id,value,type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" required ${extra}></label>`}
function render(){['Parent','Teacher','Admin'].forEach(x=>$('role'+x).classList.toggle('active',role===x.toLowerCase()));$('app').innerHTML=role==='parent'?parentView():role==='teacher'?teacherView():adminView();if(role==='parent'&&step===2)renderFiles()}
function parentView(){return title('PARENT PORTAL','작은 전달도, 빠짐없이.','학교에 필요한 서류와 사진을 간편하게 제출해 주세요.')+`<div class="row tabs"><button class="${step!==4?'active':''}" onclick="step=1;render()">파일 제출</button><button class="${step===4?'active':''}" onclick="step=4;render()">업로드 확인</button></div><div class="layout"><section><div class="steps"><span class="${step===1?'on':''}">01 기본 정보</span><span class="${step===2?'on':''}">02 제출함 · 파일 선택</span><span class="${step===3?'on':''}">03 제출 완료</span></div><div class="panel">${step===1?infoForm():step===2?uploadView():step===3?completeView():checkView()}</div></section><aside><div class="panel side"><span class="badge">이용 안내</span><h2 style="margin-top:18px">처음 이용하시나요?</h2><p>01 학생과 보호자 정보 입력<br>02 제출함 선택 및 파일 첨부<br>03 제출 후 업로드 확인</p><hr style="border:0;border-top:1px solid #d8e1d3;margin:24px 0"><h3>이번 달 공개수업</h3><div class="number">11.20 <small style="font-size:14px">금요일</small></div><p>참관 신청서를 선택하고<br>작성한 파일을 첨부해 주세요.</p></div><div class="notice">예시 조회 정보<br>3학년 2반 · 김다온 · 암호 1234<br>실제 개인정보 대신 예시를 사용하세요.</div></aside></div><footer>다온초등학교 · 학교 파일 제출함 / OFFLINE PREVIEW</footer>`}
function infoForm(){return `<span class="badge">학부모 제출 서비스</span><h2 style="margin-top:17px">안녕하세요, 학부모님</h2><p>제출자 확인을 위해 기본 정보를 입력해 주세요.</p><form onsubmit="nextStep(event)"><div class="fields"><label>학년<select id="grade">${options([1,2,3,4,5,6],info.grade)}</select></label>${field('반','room',info.room,'number','min="1" max="30"')}${field('학생 이름','student',info.student)}${field('학부모 이름','parent',info.parent)}${field('전화번호','phone',info.phone,'tel','pattern="[0-9 -]{9,15}"')}${field('확인용 임시 암호','password',info.password,'password','minlength="4"')} </div><div class="notice">입력 정보와 파일은 이 페이지의 메모리에서만 처리됩니다. 새로고침하면 사라집니다.<br>임시 암호는 제출 내역을 확인할 때 사용합니다.</div><div class="actions"><span class="hint">* 모든 항목을 입력해 주세요.</span><button class="primary">다음 · 제출함 선택 →</button></div></form>`}
function nextStep(e){e.preventDefault();['grade','room','student','parent','phone','password'].forEach(k=>info[k]=$(k).value.trim());const count=students.filter(s=>s.grade==info.grade&&s.room==info.room).length;if((students.length>=70||count>=15)&&!students.some(s=>s.grade==info.grade&&s.room==info.room&&s.name===info.student)){toast('등록된 학생 명단과 일치하지 않습니다. 학년·반·이름을 확인해 주세요.');return}step=2;picked='';render()}
function card(b,tag){return `<button class="box ${picked===b.id?'selected':''}" onclick="picked='${b.id}';render()"><span class="badge">${tag}</span><strong>${esc(b.name)}</strong><small>${esc(b.desc)}</small></button>`}
function uploadView(){let common=boxes.filter(b=>!b.grade&&b.active).sort((a,b)=>b.count-a.count);let cls=boxes.filter(b=>b.grade==info.grade&&b.room==info.room&&b.active);return `<h2>어느 제출함에 보낼까요?</h2><div class="notice">${esc(info.grade)}학년 ${esc(info.room)}반 · ${esc(info.student)} 학생 / ${esc(info.parent)} 학부모 <button style="float:right;padding:3px 8px" onclick="step=1;render()">정보 수정</button></div><h3>최근 한 달 많이 사용한 제출함</h3><div class="cards">${common.slice(0,3).map((b,i)=>card(b,`${i+1}위 · ${b.count}건`)).join('')}</div><h3>학교 공통 제출함</h3><div class="cards">${common.slice(3).map(b=>card(b,'공통')).join('')||'추가 제출함이 없습니다.'}</div><h3>우리 반 제출함</h3><div class="cards">${cls.map(b=>card(b,'우리 반')).join('')||'<p>등록된 우리 반 제출함이 없습니다.</p>'}</div><h3>파일 첨부</h3><div class="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();addFiles(event.dataTransfer.files)"><div style="font-size:29px;color:var(--green)">↥</div><p>파일을 끌어 놓거나 선택해 주세요.<br><small>최대 10개 · 파일당 20MB · 합계 30MB</small></p><button onclick="$('upload').click()">＋ 로컬 파일 선택</button> <button onclick="sampleFiles()">예시 파일 담기</button><input hidden style="display:none" id="upload" type="file" multiple onchange="addFiles(this.files)"></div><div id="fileList" class="files"></div><div class="notice">선택한 제출함: <strong>${picked?esc(boxName(picked)):'아직 선택하지 않았습니다'}</strong><br>파일은 외부에 전송되지 않으며 로컬 미리보기로만 처리됩니다.</div><div class="actions"><button onclick="step=1;render()">← 이전</button><button class="primary" onclick="submitLocal(this)">미리보기 제출</button></div>`}
function sampleFiles(){attachments=[new File(['공개수업 참관 신청서\n학생: '+info.student+'\n참관을 신청합니다.'],'참관신청서.txt',{type:'text/plain'})];renderFiles()}
function addFiles(list){let arr=[...attachments,...list];if(arr.length>10||arr.some(f=>f.size>20*1048576)||arr.reduce((n,f)=>n+f.size,0)>30*1048576)return toast('최대 10개, 파일당 20MB, 합계 30MB까지 선택할 수 있습니다.');attachments=arr;renderFiles()}
let previewURLs=[];function renderFiles(){previewURLs.forEach(URL.revokeObjectURL);previewURLs=[];$('fileList').innerHTML=attachments.length?attachments.map((f,i)=>{let u=f.type.startsWith('image/')?URL.createObjectURL(f):'';if(u)previewURLs.push(u);return `<div class="file"><div class="thumb">${u?`<img src="${u}" alt="${esc(f.name)} 미리보기">`:'▧'}</div><div><button aria-label="파일 제거" onclick="attachments.splice(${i},1);renderFiles()">×</button><strong>${esc(f.name)}</strong><br><small>${Math.max(1,Math.ceil(f.size/1024))} KB · 로컬 파일</small></div></div>`}).join(''):'<p class="hint">선택한 파일이 없습니다. 예시 파일로 흐름을 체험할 수 있습니다.</p>'}
function submitLocal(btn){if(!picked)return toast('제출함을 선택해 주세요.');if(!attachments.length)return toast('파일을 선택하거나 예시 파일을 담아 주세요.');if(!boxes.find(b=>b.id===picked)?.active)return toast('중지된 제출함입니다. 다른 제출함을 선택하세요.');btn.disabled=true;let now=new Date(),stamp=[String(now.getFullYear()).slice(-2),now.getMonth()+1,now.getDate(),now.getHours(),now.getMinutes(),now.getSeconds()].map(v=>String(v).padStart(2,'0')).join('-');attachments.forEach(f=>{let i=f.name.lastIndexOf('.'),stem=i>0?f.name.slice(0,i):f.name,ext=i>0?f.name.slice(i):'';records.push({...info,id:nextId++,box:picked,name:`${stem}[${stamp}]${ext}`,blob:f,size:f.size,date:now.toLocaleString('ko-KR')})});boxes.find(b=>b.id===picked).count++;receipt='LOCAL-'+String(Date.now()).slice(-8);attachments=[];step=3;render()}
function completeView(){return `<div class="empty"><div class="check">✓</div><h2>미리보기 제출이 완료되었습니다</h2><p>접수번호 ${receipt}<br>${esc(boxName(picked))}<br>가상 경로: ${esc(info.grade)}_${esc(info.room)}_${esc(info.student)}</p><div class="notice">실제 Drive 저장은 하지 않았습니다.<br>현재 페이지에서 업로드 확인과 교사 파일 관리가 가능합니다.</div><button class="primary" onclick="step=4;render()">업로드 확인하기</button> <button onclick="step=1;render()">새로 제출하기</button></div>`}
function checkView(){return `<h2>업로드 확인</h2><p>제출 시 입력한 학생 정보와 임시 암호로 조회하세요.</p><form onsubmit="checkRecords(event)"><div class="fields">${field('학년','cg',info.grade,'number','min="1" max="6"')}${field('반','cr',info.room,'number','min="1"')}${field('학생 이름','cs',info.student)}${field('임시 암호','cp',info.password,'password')}</div><div class="actions"><span></span><button class="primary">내 제출 내역 조회</button></div></form><div id="checkResult" aria-live="polite"></div>`}
function checkRecords(e){e.preventDefault();let rows=records.filter(r=>r.grade==$('cg').value&&r.room==$('cr').value&&r.student===$('cs').value.trim()&&r.password===$('cp').value);$('checkResult').innerHTML=rows.length?rows.map(r=>`<div class="notice"><strong>${esc(r.name)}</strong><br>${esc(boxName(r.box))} · ${esc(r.date)}<br><button onclick="downloadOne(${r.id})">로컬 파일 내려받기</button></div>`).join(''):'<p class="empty">일치하는 제출 내역이 없습니다. 입력 정보를 확인하세요.</p>'}
function downloadBlob(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadOne(id){let r=records.find(r=>r.id===id);if(r)downloadBlob(r.blob,r.name)}
function teacherView(){let stateText={before:'구글 계정으로 로그인하세요. 실제 로그인 대신 아래 버튼으로 신청 화면을 체험합니다.',not_applied:'신청 전 · 교사 인증을 신청해 주세요.',pending:'승인 대기 · 관리자가 교사 여부를 확인하고 있습니다.',not_teacher:'교사 아님 · 관리자에게 확인을 요청해 주세요.',approved:'승인 완료 · 권한이 있는 제출함을 관리할 수 있습니다.'};return title('TEACHER WORKSPACE','선생님의 제출함','제출 현황을 살펴보고 필요한 파일을 정리하세요.')+`<div class="panel"><h2>교사 인증 미리보기</h2><div class="row"><select style="width:auto;margin:0" onchange="teacherState=this.value;render()">${[['before','로그인 안내'],['not_applied','신청 전'],['pending','승인 대기'],['not_teacher','교사 아님'],['approved','승인 완료']].map(([v,t])=>`<option value="${v}" ${teacherState===v?'selected':''}>${t}</option>`).join('')}</select><button onclick="teacherState='approved';render()">승인된 교사로 화면 전환</button></div><div class="notice">${stateText[teacherState]}</div>${teacherState==='before'?'<button class="primary" onclick="teacherState=\'not_applied\';render()">예시 교사로 시작</button>':teacherState==='not_applied'?'<button class="primary" onclick="applyTeacher()">교사 인증 신청</button>':''}</div>${teacherState==='approved'?fileWorkspace():''}`}
function applyTeacher(){teacherState='pending';if(!teachers.some(t=>t.email==='demo@example.invalid'))teachers.push({name:'체험교사',email:'demo@example.invalid',state:'pending',box:'open'});render();toast('메모리에 교사 인증 신청을 추가했습니다. 관리자에서 승인할 수 있습니다.')}
function fileWorkspace(){let allowed=boxes.filter(b=>['open','class'].includes(b.id)&&b.active);if(!allowed.some(b=>b.id===teacherBox))teacherBox=allowed[0]?.id||'';let rows=records.filter(r=>r.box===teacherBox);return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>권한 있는 제출함</h2><button class="primary" onclick="downloadSelected()">선택 파일 다운로드 · 여러 개는 ZIP</button></div><select style="max-width:400px" onchange="teacherBox=this.value;render()">${allowed.map(b=>`<option value="${b.id}" ${teacherBox===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><p class="hint">예시 권한: 공개수업 참관 신청서, 3학년 2반 · 이동도 위 제출함 사이에서만 가능합니다.</p><div class="table"><table><thead><tr><th><input type="checkbox" aria-label="전체 선택" onchange="document.querySelectorAll('.pick').forEach(c=>c.checked=this.checked)"></th><th>파일 이름</th><th>학생 / 학부모</th><th>업로드 시각</th><th>관리</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" class="pick" value="${r.id}" aria-label="${esc(r.name)} 선택"></td><td>${esc(r.name)}</td><td>${esc(r.grade)}-${esc(r.room)} ${esc(r.student)}<br>${esc(r.parent)}</td><td>${esc(r.date)}</td><td><button onclick="downloadOne(${r.id})">다운로드</button><button onclick="renameFile(${r.id})">이름 변경</button><button onclick="moveFile(${r.id})">이동</button><button onclick="deleteFile(${r.id})">삭제</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">제출된 파일이 없습니다.</div>'}</div></div>`}
function renameFile(id){let r=records.find(r=>r.id===id),n=prompt('새 파일 이름을 확장자와 함께 입력하세요.',r.name);if(n?.trim()){r.name=n.trim();render();toast('파일 이름을 변경했습니다.')}}function moveFile(id){let target=teacherBox==='open'?'class':'open';if(!boxes.find(b=>b.id===target)?.active)return toast('이동 가능한 다른 제출함이 없습니다.');if(confirm(boxName(target)+' 제출함으로 이동할까요?')){records.find(r=>r.id===id).box=target;render();toast('파일을 이동했습니다.')}}function deleteFile(id){if(confirm('이 파일을 미리보기 메모리에서 삭제할까요?')){records=records.filter(r=>r.id!==id);render();toast('파일을 삭제했습니다.')}}
async function downloadSelected(){let selected=[...document.querySelectorAll('.pick:checked')].map(c=>records.find(r=>r.id==c.value));if(!selected.length)return toast('파일을 선택해 주세요.');if(selected.length===1)return downloadOne(selected[0].id);await zipDownload(selected)}
async function zipDownload(list){const enc=new TextEncoder(),parts=[],central=[];let offset=0;const crc=bytes=>{let c=0xffffffff;for(let b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0};for(const [i,r]of list.entries()){const bytes=new Uint8Array(await r.blob.arrayBuffer()),name=enc.encode((i+1)+'_'+r.name),sum=crc(bytes);let h=new Uint8Array(30),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,sum,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);parts.push(h,name,bytes);let c=new Uint8Array(46),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint32(16,sum,true);w.setUint32(20,bytes.length,true);w.setUint32(24,bytes.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);central.push(c,name);offset+=30+name.length+bytes.length}let size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,list.length,true);v.setUint16(10,list.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);downloadBlob(new Blob([...parts,...central,end],{type:'application/zip'}),'제출파일_미리보기.zip');toast('선택한 로컬 파일을 ZIP으로 묶었습니다.')}
function adminView(){return title('SCHOOL ADMINISTRATION','학교 제출함 관리','학교의 제출 현황과 구성원을 한곳에서 관리하세요.')+`<div class="notice" style="margin-top:0">관리자 인증을 화면 전환으로 대신했습니다. 모든 변경은 현재 브라우저 메모리에만 반영됩니다.</div><div class="row tabs">${[['dashboard','대시보드'],['boxes','제출함 관리'],['students','학생 명단'],['teachers','교사 관리']].map(([v,t])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';render()">${t}</button>`).join('')}</div>${tab==='dashboard'?dashboard():tab==='boxes'?boxAdmin():tab==='students'?studentAdmin():teacherAdmin()}`}
function dashboard(){return `<div class="stats"><div class="stat">최근 한 달 업로드 건수<strong>${112+Math.max(0,records.length-2)}<small style="font-size:13px"> 건</small></strong></div><div class="stat">현재 데모 파일 수<strong>${records.length}</strong></div><div class="stat">사용 중인 제출함<strong>${boxes.filter(b=>b.active).length}</strong></div><div class="stat">승인 대기 교사<strong>${teachers.filter(t=>t.state==='pending').length}</strong></div></div><div class="panel" style="margin-top:22px"><h2>최근 한 달 제출 추이</h2><p class="hint">2026.10.12 ~ 11.10 · 과거 통계는 예시 데이터입니다.</p><div class="chart">${[15,28,20,36,25,8,5,44,52,36,48,68,12,8,43,58,42,75,56,15,10,60,90,72,65,100,38,22,83,68].map((n,i)=>`<div class="bar" style="height:${n}%" title="${i+1}일차 · 예시 ${n}건"></div>`).join('')}</div><div class="chartlabels"><span>10.12</span><span>10.22</span><span>11.01</span><span>11.10</span></div></div><div class="panel"><h2>최근 제출 내역</h2><div class="table"><table><tr><th>파일</th><th>학생</th><th>제출함</th><th>시각</th></tr>${records.slice(-5).reverse().map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.student)}</td><td>${esc(boxName(r.box))}</td><td>${esc(r.date)}</td></tr>`).join('')}</table></div></div>`}
function boxAdmin(){return `<div class="panel"><h2>제출함 관리</h2><button onclick="addBox()">＋ 공통 제출함 추가</button><div class="table"><table><tr><th>제출함 이름</th><th>구분</th><th>상태</th><th>관리</th></tr>${boxes.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.grade?'학급':'학교 공통'}</td><td><span class="badge">${b.active?'사용 중':'중지'}${b.due?' · 삭제 예약 '+b.due:''}</span></td><td><button onclick="editBox('${b.id}')">수정</button><button onclick="toggleBox('${b.id}')">${b.active?'사용 중지':'사용 재개'}</button>${b.due?`<button onclick="cancelDeletion('${b.id}')">삭제 예약 취소</button>`:''}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>학년도별 반 제출함 생성</h2><p>학년도는 3월부터 다음 해 2월까지입니다. 버튼을 눌러 로컬 제출함을 생성합니다.</p><form onsubmit="generateClasses(event)"><label>학년도<input id="year" type="number" value="2026" min="2020" max="2100" required></label><div class="fields" style="margin-top:18px">${[1,2,3,4,5,6].map(g=>field(g+'학년 반 수','count'+g,2,'number','min="0" max="10"')).join('')}</div><div class="actions"><span class="hint">자동 생성 트리거는 실행되지 않습니다.</span><button class="primary">반별 제출함 생성</button></div></form></div>`}
function addBox(){let name=prompt('새 제출함 이름');if(name?.trim()){boxes.push({id:'b'+Date.now(),name:name.trim(),desc:'학교 공통 제출함',count:0,active:true});render()}}function editBox(id){let b=boxes.find(b=>b.id===id),n=prompt('제출함 이름',b.name);if(n?.trim()){b.name=n.trim();render()}}function toggleBox(id){let b=boxes.find(b=>b.id===id);if(b.due)return toast('삭제 예약을 먼저 취소하세요.');b.active=!b.active;render()}
function generateClasses(e){e.preventDefault();let year=+$('year').value,created=0;for(let g=1;g<=6;g++)for(let r=1;r<=+$('count'+g).value;r++){if(boxes.some(b=>b.grade==g&&b.room==r&&b.name.startsWith(year+'학년도')))continue;boxes.push({id:`c${year}-${g}-${r}`,name:`${year}학년도 ${g}학년 ${r}반`,grade:g,room:r,desc:`${year}.03 ~ ${year+1}.02 학급 제출함`,count:0,active:true});created++}render();toast(`${year}학년도 제출함 ${created}개를 생성했습니다. 기존 제출함은 유지합니다.`)}
function studentAdmin(){let s=students[studentEdit]||{grade:3,room:2,name:''};return `<div class="panel"><h2>학생 명단 <span class="badge">${students.length}명 등록</span></h2><div class="notice">전체 70명 이상이면 모든 학생을 명단과 대조합니다. 70명 미만일 때는 15명 이상 등록된 반만 대조합니다.<br>현재는 ${students.length}명인 예시 명단으로, 기준 미달 반은 이름 일치 검사를 생략합니다.</div><form onsubmit="saveStudent(event)"><div class="fields">${field('학년','sg',s.grade,'number','min="1" max="6"')}${field('반','sr',s.room,'number','min="1" max="30"')}${field('학생 이름','sn',s.name)}</div><div class="actions"><button type="button" onclick="studentEdit=-1;render()">입력 초기화</button><button class="primary">${studentEdit<0?'학생 추가':'수정 저장'}</button></div></form><h3>CSV 일괄 등록</h3><div class="row"><button onclick="downloadBlob(new Blob(['\uFEFF학년,반,학생이름\r\n3,2,김다온\r\n'],{type:'text/csv;charset=utf-8'}),'학생명단_양식.csv')">CSV 양식 내려받기</button><input style="width:240px;margin:0" aria-label="학생 명단 CSV 선택" type="file" accept=".csv" onchange="importCSV(this.files[0])"></div><p class="hint">선택한 CSV를 로컬에서 읽어 중복 학생을 제외하고 추가합니다. 헤더: 학년,반,학생이름</p><label>명단 검색<input id="search" placeholder="학생 이름 검색" oninput="filterStudents(this.value)"></label><div class="table"><table><thead><tr><th>학년</th><th>반</th><th>이름</th><th>관리</th></tr></thead><tbody id="studentRows">${studentRows('')}</tbody></table></div></div>`}
function studentRows(q){return students.map((s,i)=>({...s,i})).filter(s=>s.name.includes(q)).map(s=>`<tr><td>${s.grade}</td><td>${s.room}</td><td>${esc(s.name)}</td><td><button onclick="studentEdit=${s.i};render()">수정</button><button onclick="if(confirm('명단에서 삭제할까요?')){students.splice(${s.i},1);studentEdit=-1;render()}">삭제</button></td></tr>`).join('')}function filterStudents(q){$('studentRows').innerHTML=studentRows(q)}
function saveStudent(e){e.preventDefault();let s={grade:+$('sg').value,room:+$('sr').value,name:$('sn').value.trim()};if(!s.name)return;if(students.some((r,i)=>i!==studentEdit&&r.grade===s.grade&&r.room===s.room&&r.name===s.name))return toast('이미 등록된 학생입니다.');if(studentEdit<0)students.push(s);else students[studentEdit]=s;studentEdit=-1;render();toast('학생 명단을 저장했습니다.')}
async function importCSV(file){if(!file)return;if(file.size>1048576)return toast('CSV는 1MB 이하로 선택하세요.');let lines=(await file.text()).replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(lines.shift()?.replace(/"/g,'')!=='학년,반,학생이름')return toast('헤더를 학년,반,학생이름으로 맞춰 주세요.');let added=0,skip=0;for(let l of lines){let [g,r,n]=l.split(',').map(v=>v.trim().replace(/^"|"$/g,''));if(!n||!Number.isInteger(+g)||+g<1||+g>6||!Number.isInteger(+r)||+r<1||+r>30||students.some(s=>s.grade==g&&s.room==r&&s.name===n)){skip++;continue}students.push({grade:+g,room:+r,name:n});added++}render();toast(`${added}명 추가 · 중복 또는 형식 오류 ${skip}행 건너뜀`)}
function teacherAdmin(){return `<div class="panel"><h2>교사 인증 신청 및 권한</h2><p>실제 계정이 아닌 예시 교사입니다. 승인하면 해당 상태가 메모리에 반영됩니다.</p><button onclick="addTeacher()">＋ 예시 교사 등록</button><div class="table"><table><tr><th>교사 / 계정</th><th>인증 상태</th><th>제출함 배정</th><th>관리</th></tr>${teachers.map((t,i)=>`<tr><td>${esc(t.name)}<br><small>${esc(t.email)}</small></td><td><span class="badge">${({approved:'승인 완료',pending:'승인 대기',not_teacher:'교사 아님'})[t.state]}</span></td><td>${esc(boxName(t.box))}${t.homeroom?' · 담임':''}</td><td><button onclick="decideTeacher(${i},'approved')">승인</button><button onclick="decideTeacher(${i},'not_teacher')">교사 아님</button><button onclick="assignTeacher(${i})">권한 배정</button>${t.homeroom?`<button onclick="removeHomeroom(${i})">담임 해제</button>`:''}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>폴더 삭제 예약</h2><p>담임 해제 시 제출함을 중지하고 한 달 뒤 삭제 예정일을 표시합니다. 이 미리보기에서는 자동 삭제를 실행하지 않습니다.</p>${boxes.filter(b=>b.due).map(b=>`<div class="notice">${esc(b.name)} · 삭제 예정 ${b.due} <button onclick="cancelDeletion('${b.id}')">예약 취소</button></div>`).join('')||'<div class="empty">삭제 예약된 제출함이 없습니다.</div>'}</div>`}
function decideTeacher(i,s){teachers[i].state=s;if(teachers[i].email==='demo@example.invalid')teacherState=s;render();toast('교사 인증 상태를 변경했습니다.')}function addTeacher(){let n=prompt('예시 교사 이름');if(n?.trim()){teachers.push({name:n.trim(),email:'sample'+teachers.length+'@example.invalid',state:'pending',box:'open'});render()}}
function assignTeacher(i){if(teachers[i].state!=='approved')return toast('승인된 교사에게만 권한을 배정할 수 있습니다.');let id=prompt('배정할 제출함 번호를 입력하세요.\n'+boxes.filter(b=>b.active).map((b,j)=>`${j+1}. ${b.name}`).join('\n'));if(id===null)return;let b=boxes.filter(b=>b.active)[Number(id)-1];if(!b)return toast('유효한 번호를 입력하세요.');if(teachers[i].homeroom)return toast('기존 담임을 먼저 해제한 뒤 다시 배정해 주세요.');teachers[i].box=b.id;teachers[i].homeroom=!!b.grade&&confirm('이 학급의 담임으로 배정할까요? 취소하면 일반 권한으로 배정합니다.');render();toast('제출함 권한을 배정했습니다.')}
function removeHomeroom(i){let t=teachers[i],b=boxes.find(b=>b.id===t.box);if(!confirm(`${b.name} 담임을 해제하면 제출함이 즉시 중지되며 한 달 뒤 폴더와 모든 파일이 영구 삭제되는 예약 상태가 됩니다. 진행할까요?`))return;let due=new Date();due.setMonth(due.getMonth()+1);b.due=due.toLocaleDateString('ko-KR');b.active=false;t.homeroom=false;t.box='';render();toast('담임을 해제하고 제출함 중지·삭제 예약을 표시했습니다.')}
function cancelDeletion(id){let b=boxes.find(b=>b.id===id);delete b.due;render();toast('삭제 예약을 취소했습니다. 제출함 관리에서 사용을 재개하고 담임을 다시 배정하세요.')}
let page=new URLSearchParams(location.search).get('page');if(page==='admin'||page==='teacher')role=page;render();
</script></body></html>
