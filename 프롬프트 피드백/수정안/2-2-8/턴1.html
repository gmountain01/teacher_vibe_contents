<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 칭찬 포인트 보드</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#24324b;font-family:"Malgun Gothic",sans-serif}main{max-width:1250px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px}.intro{color:#61708a;margin:0;line-height:1.7}.total{background:#344ac1;color:white;border-radius:24px;padding:20px 32px;min-width:210px;text-align:center}.total strong{display:block;font-size:56px;line-height:1.2}.total span{font-size:17px}details{margin:28px 0;background:white;border:1px solid #dce2ef;border-radius:18px;padding:20px}summary{cursor:pointer;font-size:19px;font-weight:bold}label{display:block;margin:18px 0 10px;line-height:1.7}textarea{width:100%;min-height:120px;border:1px solid #bcc7dc;border-radius:12px;padding:14px;font:18px/1.6 inherit;font-family:inherit;font-size:18px;resize:vertical}button{font-family:inherit;cursor:pointer}.save{border:0;background:#344ac1;color:white;padding:13px 23px;border-radius:12px;font-size:18px;font-weight:bold;margin-top:12px}.hint{font-size:14px;color:#65718a;line-height:1.7}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:24px}.card{background:white;border:2px solid #e1e6f3;border-radius:24px;padding:25px 16px;min-height:250px;color:#24324b;box-shadow:0 5px 15px #24324b08;transition:transform .12s,border-color .12s}.card:hover{border-color:#8999e7;transform:translateY(-3px)}.card:active{transform:scale(.97)}button:focus-visible,summary:focus-visible{outline:4px solid #f0b43b;outline-offset:4px}.name{display:block;font-size:30px;font-weight:bold;overflow-wrap:anywhere}.score{display:block;font-size:64px;color:#344ac1;font-weight:bold;margin:10px 0}.score small{font-size:22px;margin-left:6px}.date{display:block;color:#6c7991;font-size:14px}.plus{display:block;color:#344ac1;font-weight:bold;margin-top:16px;font-size:17px}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;border:2px dashed #cbd4e9;border-radius:24px;color:#61708a;font-size:21px;line-height:1.8}#status{min-height:26px;margin-top:20px;color:#344ac1;line-height:1.6}footer{margin-top:28px;font-size:14px;color:#718098;line-height:1.8}@media(max-width:520px){main{padding:24px 16px}.total{width:100%}.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:20px 10px;min-height:220px}.name{font-size:24px}.score{font-size:52px}.date{font-size:12px}}
</style>
</head>
<body>
<main>
<header><div><h1>🌟 우리 반 칭찬 포인트</h1><p class="intro">작은 실천이 모여 큰 칭찬이 돼요.<br>학생 카드를 누르면 칭찬 포인트가 1점 올라갑니다.</p></div><div class="total"><span>우리 반 칭찬 합계</span><strong id="total">0</strong><span>포인트</span></div></header>
<details id="settings"><summary>학생 명단 입력·추가</summary><label for="names">학생 이름을 한 줄에 한 명씩 입력하세요. 쉼표로 구분해도 됩니다.</label><textarea id="names" placeholder="김민준&#10;이서연&#10;박지우"></textarea><button class="save" id="add" type="button">명단 적용하기</button><p class="hint">기존 학생의 점수는 그대로 유지하고 새 이름만 추가합니다. 같은 이름은 한 카드로 표시되므로 동명이인은 ‘김민준 1’, ‘김민준 2’처럼 구분해 주세요.</p></details>
<div id="board" class="board"></div>
<p id="status" role="status" aria-live="polite"></p>
<footer>점수와 칭찬 날짜는 현재 브라우저에 자동 저장됩니다. 같은 컴퓨터의 같은 크롬 프로필에서 이 파일을 다시 열어 주세요.<br>시크릿 모드나 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</footer>
</main>
<script>
'use strict';
const KEY='class-praise-board-v1';
let students=[];
const board=document.getElementById('board');
const status=document.getElementById('status');
const names=document.getElementById('names');
function dateText(iso){return new Date(iso).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));students=next;return true;}catch(e){status.textContent='브라우저에 저장할 수 없습니다. 기록 보호를 위해 변경하지 않았습니다. 크롬의 저장 공간 설정을 확인해 주세요.';return false;}}
function render(){board.replaceChildren();document.getElementById('total').textContent=students.reduce((sum,s)=>sum+s.dates.length,0).toLocaleString('ko-KR');if(!students.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='아직 등록된 학생이 없어요. 위에서 학생 명단을 입력해 주세요.';board.append(empty);return;}students.forEach((student,index)=>{const card=document.createElement('button');card.type='button';card.className='card';card.setAttribute('aria-label',student.name+', '+student.dates.length+'점. 누르면 1점 추가');const name=document.createElement('span');name.className='name';name.textContent=student.name;const score=document.createElement('span');score.className='score';score.textContent=student.dates.length.toLocaleString('ko-KR');const unit=document.createElement('small');unit.textContent='점';score.append(unit);const date=document.createElement('span');date.className='date';date.textContent=student.dates.length?'최근 칭찬 '+dateText(student.dates[student.dates.length-1]):'첫 칭찬을 기다리고 있어요';const plus=document.createElement('span');plus.className='plus';plus.textContent='칭찬 +1';card.append(name,score,date,plus);card.addEventListener('click',()=>{const next=students.map((s,i)=>i===index?{name:s.name,dates:[...s.dates,new Date().toISOString()]}:s);if(save(next)){render();board.children[index].focus({preventScroll:true});status.textContent=student.name+' 학생에게 칭찬 1점! 총 '+next[index].dates.length+'점입니다. 저장되었습니다.';}});board.append(card);});}
document.getElementById('add').addEventListener('click',()=>{const list=[...new Set(names.value.split(/[\n,，]+/).map(s=>s.trim()).filter(Boolean))];if(!list.length){status.textContent='학생 이름을 먼저 입력해 주세요.';names.focus();return;}const known=new Set(students.map(s=>s.name));const added=list.filter(name=>!known.has(name)).map(name=>({name,dates:[]}));if(save([...students,...added])){render();names.value='';document.getElementById('settings').open=false;status.textContent=added.length+'명의 학생을 추가했습니다. 기존 칭찬 기록도 저장되어 있습니다.';}});
try{const raw=localStorage.getItem(KEY);if(raw!==null){const loaded=JSON.parse(raw);if(!Array.isArray(loaded)||!loaded.every(s=>s&&typeof s.name==='string'&&Array.isArray(s.dates)&&s.dates.every(d=>typeof d==='string'&&Number.isFinite(Date.parse(d)))))throw new Error('Invalid data');students=loaded;}}catch(e){status.textContent='저장된 기록을 읽을 수 없습니다. 원래 기록을 보호하기 위해 입력과 점수 추가를 중지했습니다.';document.getElementById('add').disabled=true;}
document.getElementById('settings').open=students.length===0;
render();
</script>
</body>
</html>
