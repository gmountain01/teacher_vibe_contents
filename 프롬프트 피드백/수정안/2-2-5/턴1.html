<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 아침 안내판</title>
<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#183b3a;background:#f4f6ee}*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:40px 5vw}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:3px solid #dce5d8;padding-bottom:24px}.eyebrow{font-weight:700;color:#568078;letter-spacing:.12em;font-size:18px}h1{font-size:clamp(30px,4vw,56px);margin:10px 0 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:#205d53;color:white;font-weight:700}button.secondary{background:#e3ebe2;color:#234f47}.welcome{margin:28px 0 22px;font-size:24px;color:#527068}.schedule{display:grid;gap:12px}.lesson{display:flex;align-items:center;gap:32px;background:white;padding:18px 30px;border-radius:18px;border:1px solid #e2e8dd;box-shadow:0 4px 12px #1d453905}.period{font-size:clamp(22px,2.5vw,34px);color:#638078;min-width:110px}.subject{font-size:clamp(34px,4vw,56px);font-weight:800;overflow-wrap:anywhere}.empty{text-align:center;background:white;border-radius:20px;padding:65px 20px;font-size:28px;line-height:1.7}footer{margin-top:24px;color:#6a7d72;font-size:15px}dialog{border:0;border-radius:22px;padding:28px;width:min(900px,95vw);max-height:90vh;color:#183b3a;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#123b3a77}h2{margin:0 0 10px;font-size:28px}.hint{color:#60766d;line-height:1.6}.table-wrap{overflow:auto;margin:22px 0}table{border-collapse:collapse;width:100%;min-width:610px}th,td{padding:7px;text-align:center}th{color:#426b61}input{width:100%;min-width:80px;font:inherit;padding:12px 8px;border:1px solid #ccd9cf;border-radius:8px;color:#183b3a;background:#fafcf8}input:focus{outline:3px solid #b4d8c8}td:first-child{white-space:nowrap}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.status{color:#a03628;min-height:24px}@media(max-width:600px){main{padding:24px 5vw}header{align-items:flex-start;flex-direction:column}.lesson{padding:18px;gap:14px}.period{min-width:76px}.welcome{font-size:20px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">우리 반 아침 안내판</div><h1 id="date"></h1></div><button id="edit">시간표 설정</button></header>
<p class="welcome">좋은 아침이에요! 오늘의 배움을 함께 준비해요.</p>
<section id="schedule" class="schedule" aria-label="오늘의 시간표"></section>
<footer>시간표는 이 브라우저에 저장됩니다. · 빈 과목은 안내판에 표시되지 않습니다.</footer>
</main>
<dialog id="editor" aria-labelledby="editor-title">
<form id="form">
<h2 id="editor-title">우리 반 주간 시간표</h2>
<p class="hint">월~금 과목을 한 번 입력해 주세요. 매일 오늘 요일의 시간표가 자동으로 표시됩니다.<br>사용하지 않는 교시는 비워 두세요.</p>
<div class="table-wrap"><table><thead><tr><th scope="col">교시</th><th scope="col">월요일</th><th scope="col">화요일</th><th scope="col">수요일</th><th scope="col">목요일</th><th scope="col">금요일</th></tr></thead><tbody id="inputs"></tbody></table></div>
<p id="status" class="status" role="status"></p>
<div class="actions"><button type="button" class="secondary" id="cancel">취소</button><button type="submit">저장하고 안내판 보기</button></div>
</form>
</dialog>
<script>
(()=>{
'use strict';
const KEY='class-morning-timetable-v1';
const days=['일','월','화','수','목','금','토'];
let timetable=Array.from({length:5},()=>Array(8).fill(''));
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.length===5)timetable=timetable.map((day,d)=>day.map((_,p)=>typeof saved[d]?.[p]==='string'?saved[d][p]:''));}catch(e){}
const board=document.getElementById('schedule'),editor=document.getElementById('editor');
let lastDate='';
function render(){
 const now=new Date();lastDate=now.toDateString();
 document.getElementById('date').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
 board.replaceChildren();
 const weekday=now.getDay();
 if(weekday===0||weekday===6){empty('오늘은 주말이에요.','편안하고 즐거운 하루 보내세요!');return;}
 const lessons=timetable[weekday-1];
 lessons.forEach((subject,index)=>{if(!subject.trim())return;const row=document.createElement('div');row.className='lesson';const period=document.createElement('span');period.className='period';period.textContent=`${index+1}교시`;const name=document.createElement('span');name.className='subject';name.textContent=subject;row.append(period,name);board.append(row);});
 if(!board.children.length)empty('오늘 시간표가 아직 없어요.','위의 ‘시간표 설정’에서 과목을 입력해 주세요.');
}
function empty(title,detail){const box=document.createElement('div');box.className='empty';const strong=document.createElement('strong');strong.textContent=title;const sub=document.createElement('div');sub.textContent=detail;box.append(strong,sub);board.append(box);}
const inputs=document.getElementById('inputs');
for(let p=0;p<8;p++){const row=document.createElement('tr');const label=document.createElement('th');label.scope='row';label.textContent=`${p+1}교시`;row.append(label);for(let d=0;d<5;d++){const cell=document.createElement('td');const input=document.createElement('input');input.id=`subject-${d}-${p}`;input.maxLength=40;input.setAttribute('aria-label',`${days[d+1]}요일 ${p+1}교시 과목`);cell.append(input);row.append(cell);}inputs.append(row);}
document.getElementById('edit').onclick=()=>{for(let d=0;d<5;d++)for(let p=0;p<8;p++)document.getElementById(`subject-${d}-${p}`).value=timetable[d][p];document.getElementById('status').textContent='';editor.showModal();};
document.getElementById('cancel').onclick=()=>editor.close();
document.getElementById('form').onsubmit=event=>{event.preventDefault();const next=timetable.map((day,d)=>day.map((_,p)=>document.getElementById(`subject-${d}-${p}`).value.trim()));timetable=next;render();try{localStorage.setItem(KEY,JSON.stringify(next));editor.close();}catch(e){document.getElementById('status').textContent='이 브라우저에서 저장이 제한되어 있습니다. 입력한 시간표는 현재 창에 반영되지만, 창을 닫으면 사라질 수 있습니다.';}};
render();setInterval(()=>{if(new Date().toDateString()!==lastDate)render();},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
})();
</script>
</body>
</html>
