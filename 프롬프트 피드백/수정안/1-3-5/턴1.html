<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠 토의 진행판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#172b49;font-family:system-ui,'맑은 고딕',sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 24px}.topic{display:block;font-size:18px;font-weight:700}.topic input{display:block;width:100%;margin-top:10px;border:2px solid #c6d3e5;border-radius:14px;padding:17px;font:inherit;background:white;color:inherit}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0;padding:0;list-style:none}.steps li{padding:16px 10px;border-radius:14px;background:#dfe7f2;text-align:center;font-weight:700}.steps small{display:block;margin-top:5px;font-weight:400}.steps .active{background:#2657c8;color:white;box-shadow:0 5px 15px #2657c830}.panel{text-align:center;background:white;border-radius:26px;padding:32px 20px;box-shadow:0 12px 40px #1834560d}.eyebrow{font-size:18px;color:#546783}h2{font-size:clamp(38px,7vw,76px);margin:12px 0}.timer{font-size:clamp(90px,18vw,180px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-5px}.ended .timer{color:#be452a}.status{min-height:58px;margin:18px 0;font-size:22px;font-weight:600}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:13px;padding:17px 30px;font:700 21px system-ui;cursor:pointer;background:#e7edf6;color:#172b49}button.primary{background:#2657c8;color:white}button.next{background:#163d38;color:white}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:4px solid #e2ab27;outline-offset:4px}.hint{text-align:center;color:#546783;margin:22px 0;font-size:16px}@media(max-width:600px){main{padding:22px 14px}.steps{gap:6px}.steps li{font-size:14px;padding:12px 4px}.panel{padding:26px 12px}button{padding:15px 20px;font-size:18px}.status{font-size:18px}}
</style>
</head>
<body>
<main>
<h1>모둠 토의 진행판</h1>
<label class="topic" for="topic">오늘의 토의 주제<input id="topic" placeholder="토의할 주제를 적어 주세요" autocomplete="off"></label>
<ol class="steps" aria-label="토의 순서">
<li class="active" aria-current="step">1. 문제 확인<small>3분</small></li>
<li>2. 의견 나누기<small>8분</small></li>
<li>3. 대안 비교<small>5분</small></li>
<li>4. 합의하기<small>4분</small></li>
</ol>
<section class="panel" aria-label="현재 토의 단계">
<div class="eyebrow" id="progress">현재 단계 · 1 / 4</div>
<h2 id="stage">문제 확인</h2>
<div class="timer" id="timer" role="timer" aria-label="남은 시간 3분 0초">03:00</div>
<p class="status" id="status" role="status" aria-live="polite">준비되면 시작 버튼을 눌러 주세요.</p>
<div class="controls">
<button class="primary" id="start">시작</button>
<button id="pause" disabled>멈춤</button>
<button class="next" id="next">다음 단계 →</button>
</div>
</section>
<p class="hint">시간이 끝나면 알려 드립니다. 다음 단계는 버튼을 눌러 진행하세요.</p>
</main>
<script>
const stages=[['문제 확인',180],['의견 나누기',480],['대안 비교',300],['합의하기',240]];
let index=0,remaining=stages[0][1]*1000,running=false,deadline=0,interval=null,audioContext;
const el=id=>document.getElementById(id);
function draw(){
 const seconds=Math.max(0,Math.ceil(remaining/1000));
 el('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 el('timer').setAttribute('aria-label',`남은 시간 ${Math.floor(seconds/60)}분 ${seconds%60}초`);
 el('start').disabled=running||remaining<=0;
 el('pause').disabled=!running;
}
function sound(){
 if(!audioContext)return;
 try{const t=audioContext.currentTime;[0,.35,.7].forEach(delay=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.frequency.value=740;gain.gain.setValueAtTime(.16,t+delay);gain.gain.exponentialRampToValueAtTime(.001,t+delay+.25);osc.start(t+delay);osc.stop(t+delay+.26);});}catch(e){}
}
function tick(){remaining=Math.max(0,deadline-Date.now());if(remaining===0){running=false;clearInterval(interval);document.querySelector('.panel').classList.add('ended');el('status').textContent=index===3?'🔔 토의 시간이 모두 끝났습니다. 합의한 내용을 정리해 주세요.':'🔔 시간이 끝났습니다! 다음 단계 버튼을 눌러 주세요.';sound();}draw();}
el('start').onclick=()=>{
 if(running||remaining<=0)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){audioContext=audioContext||new Audio();audioContext.resume().catch(()=>{});}}catch(e){}
 running=true;deadline=Date.now()+remaining;el('status').textContent='토의 중입니다.';interval=setInterval(tick,200);draw();
};
el('pause').onclick=()=>{if(!running)return;remaining=Math.max(0,deadline-Date.now());running=false;clearInterval(interval);el('status').textContent='잠시 멈췄습니다. 시작을 누르면 이어집니다.';draw();};
el('next').onclick=()=>{
 if(index>=3)return;
 clearInterval(interval);running=false;index++;remaining=stages[index][1]*1000;
 el('stage').textContent=stages[index][0];el('progress').textContent=`현재 단계 · ${index+1} / 4`;
 document.querySelectorAll('.steps li').forEach((item,i)=>{item.classList.toggle('active',i===index);if(i===index)item.setAttribute('aria-current','step');else item.removeAttribute('aria-current');});
 document.querySelector('.panel').classList.remove('ended');el('status').textContent='준비되면 시작 버튼을 눌러 주세요.';el('next').disabled=index===3;draw();
};
draw();
</script>
</body>
</html>
