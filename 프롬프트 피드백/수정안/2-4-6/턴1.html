<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>부서 통합 방문대장</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#21334a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173c60;color:white;padding:26px 32px}h1{margin:0;font-size:26px}header p{margin:8px 0 0;color:#cdddeb;font-size:14px}.layout{max-width:1450px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:260px 1fr;gap:22px}.panel{background:white;border:1px solid #dce4ed;border-radius:14px;padding:22px;margin-bottom:20px}h2{font-size:19px;margin:0 0 18px}button,input,textarea,select{font:inherit}button{border:1px solid #cbd7e4;background:white;color:#29415b;border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{background:#edf3f9}button.primary{background:#2168a5;color:white;border-color:#2168a5}.danger{color:#b73737}input,textarea{width:100%;border:1px solid #cbd7e4;border-radius:7px;padding:10px;background:white}input:focus,textarea:focus{outline:2px solid #a4ceed;outline-offset:1px}label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.wide{grid-column:1/-1}textarea{resize:vertical;min-height:70px}.dept{display:flex;gap:5px;align-items:center;margin-bottom:8px}.dept .choose{flex:1;text-align:left;overflow-wrap:anywhere}.dept.active .choose{background:#e5f0fa;border-color:#5291c5;color:#154d7b;font-weight:700}.mini{padding:7px;font-size:12px}.muted{color:#718196;font-size:13px;line-height:1.6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.signature{border:1px dashed #96acc3;border-radius:8px;background:#fbfcfe;overflow:hidden}canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}.sigtools{border-top:1px solid #e4eaf0;padding:7px 10px;display:flex;align-items:center;justify-content:space-between}.actions{margin-top:20px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:850px}th,td{padding:12px 10px;border-bottom:1px solid #e1e8ef;text-align:left;vertical-align:middle;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#f0f5f9;color:#53677c;font-size:13px}td img{width:110px;height:55px;object-fit:contain}.empty{text-align:center;padding:35px;color:#7b8b9b}.notice{padding:10px 14px;background:#fff5dc;border-radius:8px;font-size:13px;margin-bottom:18px}#status{min-height:22px;color:#246942;font-size:14px;margin-top:10px}.search{max-width:280px}aside .panel{position:sticky;top:20px}.foot{max-width:1450px;margin:0 auto 25px;padding:0 22px}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:0 12px;margin:15px auto}.fields{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:22px}aside .panel{position:static}}@media print{header{background:white;color:black;padding:0 0 18px}header p,aside,#entryPanel,.toolbar,.foot,.recordAction,#status{display:none!important}.layout{display:block;padding:0;margin:0}.panel{border:0;padding:0}table{min-width:0;font-size:11px}th,td{padding:7px}td img{width:85px}body{background:white}tr{break-inside:avoid}}
</style>
</head>
<body>
<header><h1>부서 통합 방문대장</h1><p>부서별 방문 기록을 한곳에서 · 인터넷 연결 없이 사용</p></header>
<div class="layout">
<aside><section class="panel"><h2>부서 관리</h2><form id="deptForm" class="row"><input id="deptName" placeholder="새 부서 이름" maxlength="60" required aria-label="새 부서 이름"><button class="primary" type="submit" style="width:100%">+ 부서 추가</button></form><div id="departments" style="margin-top:18px"></div><p class="muted">부서를 선택하면 해당 부서의 방문 기록이 표시됩니다.</p></section></aside>
<main>
<section class="panel" id="entryPanel"><div class="row between"><h2 id="formTitle">방문 기록 작성</h2><span id="currentDept" class="muted"></span></div><div id="noDept" class="notice">먼저 부서를 추가하고 선택해 주세요.</div>
<form id="visitForm"><fieldset id="entryFields" style="border:0;padding:0;margin:0"><div class="fields">
<div><label for="visitedAt">방문일시 *</label><input type="datetime-local" id="visitedAt" required></div>
<div><label for="organization">기관명 *</label><input id="organization" required maxlength="150" placeholder="방문 기관명"></div>
<div><label for="purpose">업무 *</label><input id="purpose" required maxlength="300" placeholder="방문 목적 및 업무"></div>
<div><label for="visitor">방문자 *</label><input id="visitor" required maxlength="100" placeholder="방문자 성명"></div>
<div class="wide"><label>서명 * <span class="muted">손가락 또는 마우스로 아래에 서명해 주세요.</span></label><div class="signature"><canvas id="signature" aria-label="방문자 서명 영역"></canvas><div class="sigtools"><span class="muted">서명 입력란</span><button type="button" id="clearSig" class="mini">서명 지우기</button></div></div></div>
<div class="wide"><label for="notes">비고</label><textarea id="notes" maxlength="2000" placeholder="추가로 남길 내용"></textarea></div></div><div class="row actions"><button class="primary" type="submit" id="saveVisit">방문 기록 저장</button><button type="button" id="resetForm">입력 초기화</button></div></fieldset></form><div id="status" role="status" aria-live="polite"></div></section>
<section class="panel"><div class="row between"><h2 id="recordsTitle">방문 기록</h2><div class="row toolbar"><input class="search" id="search" placeholder="기관·업무·방문자 검색" aria-label="방문 기록 검색"><button id="print">인쇄</button></div></div><p class="muted" id="recordCount"></p><div class="tablewrap"><table><thead><tr><th>방문일시</th><th>기관명</th><th>업무</th><th>방문자</th><th>서명</th><th>비고</th><th class="recordAction">관리</th></tr></thead><tbody id="records"></tbody></table></div></section>
</main></div>
<footer class="foot"><div class="panel"><div class="row between"><div><strong>내 컴퓨터에 자동 저장</strong><p class="muted" style="margin-bottom:0">기록과 서명은 이 Chrome의 브라우저 저장소에 보관됩니다. 브라우저 데이터 삭제, 파일 경로 변경 또는 다른 PC 사용에 대비해 백업 파일을 보관하세요. 개인정보가 포함된 파일은 안전하게 관리하세요.</p></div><div class="row"><button id="backup">전체 백업 저장</button><button id="restore">백업 불러오기</button><input type="file" id="backupFile" accept="application/json,.json" hidden></div></div></div></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='department-visitor-ledger-v1';
let data={departments:[],visits:[]},selected='',hasSignature=false,drawing=false,editing=null,storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!validData(parsed))throw Error();data=parsed;}}catch(e){storageOK=false;alert('저장된 데이터를 읽을 수 없습니다. 기존 데이터를 덮어쓰지 않도록 저장을 중단했습니다. 백업 파일을 불러오거나 브라우저 저장소 설정을 확인해 주세요.');}
function validData(d){return d&&Array.isArray(d.departments)&&Array.isArray(d.visits)&&d.departments.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')&&new Set(d.departments.map(x=>x.id)).size===d.departments.length&&d.visits.every(x=>x&&typeof x.id==='string'&&d.departments.some(b=>b.id===x.departmentId)&&['visitedAt','organization','purpose','visitor','notes','signature'].every(k=>typeof x[k]==='string')&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(x.signature));}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function persist(next){if(!storageOK){alert('저장소를 사용할 수 없습니다. 백업을 불러오거나 브라우저 설정을 확인해 주세요.');return false;}try{localStorage.setItem(KEY,JSON.stringify(next));data=next;return true;}catch(e){alert('저장 공간이 부족하거나 브라우저 저장소를 사용할 수 없습니다. 현재 기록을 백업한 후 저장 공간을 확인해 주세요.');return false;}}
function now(){const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function button(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function render(){const list=$('departments');list.replaceChildren();for(const d of data.departments){const row=document.createElement('div');row.className='dept'+(d.id===selected?' active':'');row.append(button(d.name,()=>{selected=d.id;reset();render();},'choose'),button('수정',()=>rename(d),'mini'),button('삭제',()=>removeDept(d),'mini danger'));list.append(row);}const dept=data.departments.find(d=>d.id===selected);$('currentDept').textContent=dept?dept.name:'';$('entryFields').disabled=!dept;$('noDept').classList.toggle('hidden',!!dept);$('recordsTitle').textContent=dept?dept.name+' 방문 기록':'방문 기록';renderRecords();}
function rename(d){const name=prompt('변경할 부서 이름',d.name);if(name===null||!name.trim())return;if(data.departments.some(x=>x.id!==d.id&&x.name===name.trim()))return alert('같은 이름의 부서가 있습니다.');if(persist({...data,departments:data.departments.map(x=>x.id===d.id?{...x,name:name.trim()}:x)}))render();}
function removeDept(d){const count=data.visits.filter(v=>v.departmentId===d.id).length;if(!confirm('“'+d.name+'” 부서를 삭제할까요?\n소속 방문 기록 '+count+'건과 서명도 모두 삭제됩니다.'))return;if(persist({departments:data.departments.filter(x=>x.id!==d.id),visits:data.visits.filter(x=>x.departmentId!==d.id)})){if(selected===d.id){selected=data.departments[0]?.id||'';reset();}render();}}
$('deptForm').onsubmit=e=>{e.preventDefault();const name=$('deptName').value.trim();if(!name)return;if(data.departments.some(d=>d.name===name))return alert('같은 이름의 부서가 있습니다.');const d={id:uid(),name};if(persist({...data,departments:[...data.departments,d]})){selected=d.id;$('deptForm').reset();reset();render();}};
const canvas=$('signature'),ctx=canvas.getContext('2d');
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);hasSignature=false;}
function sizeCanvas(){const previous=hasSignature?canvas.toDataURL():null;const ratio=window.devicePixelRatio||1;canvas.width=Math.round(canvas.clientWidth*ratio);canvas.height=Math.round(180*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#172d46';ctx.fillStyle='#172d46';if(previous){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.clientWidth,180);img.src=previous;}}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.onpointerdown=e=>{if($('entryFields').disabled)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.arc(p.x,p.y,1.25,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(p.x,p.y);hasSignature=true;};
canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;};
$('clearSig').onclick=clearSignature;
function reset(){editing=null;$('visitForm').reset();$('visitedAt').value=now();clearSignature();$('saveVisit').textContent='방문 기록 저장';$('formTitle').textContent='방문 기록 작성';$('status').textContent='';}
$('resetForm').onclick=reset;
$('visitForm').onsubmit=e=>{e.preventDefault();if(!selected)return;if(!hasSignature)return alert('방문자 서명을 입력해 주세요.');for(const key of ['organization','purpose','visitor'])if(!$(key).value.trim()){alert('필수 항목을 입력해 주세요.');$(key).focus();return;}const v={id:editing||uid(),departmentId:selected,visitedAt:$('visitedAt').value,organization:$('organization').value.trim(),purpose:$('purpose').value.trim(),visitor:$('visitor').value.trim(),notes:$('notes').value.trim(),signature:canvas.toDataURL('image/png')};if(persist({...data,visits:editing?data.visits.map(x=>x.id===editing?v:x):[...data.visits,v]})){reset();renderRecords();$('status').textContent='방문 기록을 저장했습니다.';}};
function renderRecords(){const query=$('search').value.trim().toLowerCase();const all=data.visits.filter(v=>v.departmentId===selected);const rows=all.filter(v=>[v.organization,v.purpose,v.visitor,v.notes,v.visitedAt].some(s=>s.toLowerCase().includes(query))).sort((a,b)=>b.visitedAt.localeCompare(a.visitedAt));$('recordCount').textContent='전체 '+all.length+'건'+(query?' · 검색 결과 '+rows.length+'건':'');const body=$('records');body.replaceChildren();if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.className='empty';td.textContent=selected?(query?'검색 결과가 없습니다.':'아직 방문 기록이 없습니다.'):'부서를 선택해 주세요.';tr.append(td);body.append(tr);}for(const v of rows){const tr=document.createElement('tr');for(const k of ['visitedAt','organization','purpose','visitor','signature','notes']){const td=document.createElement('td');if(k==='signature'){const img=document.createElement('img');img.src=v.signature;img.alt=v.visitor+' 서명';td.append(img);}else td.textContent=k==='visitedAt'?v[k].replace('T',' '):v[k];tr.append(td);}const actions=document.createElement('td');actions.className='recordAction';actions.append(button('수정',()=>edit(v),'mini'),document.createTextNode(' '),button('삭제',()=>{if(confirm('이 방문 기록과 서명을 삭제할까요?')&&persist({...data,visits:data.visits.filter(x=>x.id!==v.id)})){if(editing===v.id)reset();renderRecords();}},'mini danger'));tr.append(actions);body.append(tr);}}
function edit(v){reset();editing=v.id;for(const k of ['visitedAt','organization','purpose','visitor','notes'])$(k).value=v[k];const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,canvas.clientWidth,180);hasSignature=true;};img.src=v.signature;$('saveVisit').textContent='수정 내용 저장';$('formTitle').textContent='방문 기록 수정';$('entryPanel').scrollIntoView({behavior:'smooth'});}
$('search').oninput=renderRecords;$('print').onclick=()=>window.print();
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='부서통합방문대장_백업_'+now().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('restore').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!validData(imported))throw Error('형식');if(!confirm('백업의 부서 '+imported.departments.length+'개, 방문 기록 '+imported.visits.length+'건으로 현재 데이터를 교체할까요?\n현재 기록이 필요하면 먼저 전체 백업을 저장해 주세요.'))return;const old=storageOK;storageOK=true;if(persist({departments:imported.departments,visits:imported.visits})){selected=data.departments[0]?.id||'';reset();render();$('status').textContent='백업을 불러왔습니다.';}else storageOK=old;}catch(err){alert('올바른 방문대장 백업 파일이 아닙니다.');}finally{e.target.value='';}};
selected=data.departments[0]?.id||'';reset();render();sizeCanvas();window.addEventListener('resize',sizeCanvas);
</script>
</body></html>
