<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 응답 보드</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#202d40;background:#f3f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea,select{font:inherit}button,select{cursor:pointer}button{border:0;border-radius:12px;padding:12px 19px;background:#4858d6;color:white;font-weight:700}button.secondary{background:#e9edf7;color:#34415a}header{background:white;border-bottom:1px solid #e1e6ef;padding:25px max(25px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:27px;letter-spacing:-1px}.subtitle{color:#728096;font-size:14px;margin:8px 0 0}.badge{background:#e8f5ee;color:#26754c;padding:9px 13px;border-radius:30px;font-size:13px;white-space:nowrap}main{max-width:1280px;margin:auto;padding:28px 24px 60px}.input-panel{background:white;border:1px solid #e0e6f0;border-radius:20px;padding:26px}.section-label{font-size:18px;font-weight:700;margin:0 0 10px}.hint{color:#67768c;line-height:1.7;margin:0 0 17px;font-size:14px}textarea{width:100%;height:180px;resize:vertical;border:1px solid #ccd5e4;border-radius:12px;padding:16px;line-height:1.6;background:#fbfcff;color:#25334b}textarea:focus,select:focus,button:focus-visible{outline:3px solid #aeb7ff;outline-offset:3px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.note{font-size:13px;color:#728096;margin-left:auto}#message{color:#a43d27;min-height:20px;margin:12px 0 0;font-size:14px}.board-top{display:flex;align-items:center;justify-content:space-between;margin:30px 0 18px;gap:20px}.board-top h2{font-size:23px;margin:0}.count{font-size:14px;color:#718096;margin:8px 0 0}.empty{text-align:center;padding:65px 20px;color:#7d899c;border:2px dashed #dce2ee;border-radius:20px;margin-top:25px}.empty strong{display:block;color:#4b5970;font-size:21px;margin-bottom:12px}.question{background:white;border:1px solid #e0e6f0;border-radius:20px;padding:28px;margin-bottom:22px;break-inside:avoid}.question-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.question-title{display:flex;gap:13px;align-items:flex-start}.number{background:#edf0ff;color:#4c5bd1;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:bold}h3{font-size:22px;margin:5px 0 8px;line-height:1.45;overflow-wrap:anywhere}.meta{font-size:13px;color:#7c889b}select{border:1px solid #d7deec;border-radius:10px;background:white;padding:10px;color:#39465d;max-width:100%}.bar-row{display:grid;grid-template-columns:minmax(100px,24%) 1fr 100px;gap:16px;align-items:center;margin:18px 0}.bar-label{line-height:1.5;overflow-wrap:anywhere}.track{height:31px;background:#f0f2fa;border-radius:7px;overflow:hidden}.fill{height:100%;background:#6a78e4;border-radius:7px;min-width:2px}.bar-value{font-size:14px;color:#586780;text-align:right}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:#f0f3ff;border:1px solid #e2e7fb;border-radius:14px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:18px}.card:nth-child(4n+2){background:#fff7e7;border-color:#f6ead0}.card:nth-child(4n+3){background:#edf7f2;border-color:#dceee3}.card:nth-child(4n){background:#fff0f1;border-color:#f6dfe3}.card small{display:block;font-size:12px;color:#7d879b;margin-bottom:10px}.no-answer{color:#8290a4;padding:20px 0}.presenting header,.presenting .input-panel,.presenting #editButton{display:none}.presenting main{max-width:1500px}.presenting .card{font-size:23px}.presenting h3{font-size:28px}.presenting .bar-label{font-size:21px}[hidden]{display:none!important}@media(max-width:650px){header{padding:22px;align-items:flex-start}.badge{display:none}main{padding:20px 14px}.input-panel,.question{padding:20px}.question-head{flex-direction:column}.bar-row{grid-template-columns:90px 1fr 75px;gap:9px}.note{margin-left:0}h1{font-size:23px}.cards{grid-template-columns:1fr}}
.view-tabs{display:flex;gap:10px;margin:0 0 20px}.view-tabs button[aria-pressed="true"]{background:#4858d6;color:white}.answer-item+.answer-item{border-top:1px solid #d9dfed;margin-top:16px;padding-top:16px}.answer-label{font-size:14px;font-weight:700;color:#485577;margin-bottom:6px}.missing{color:#8791a3;font-style:italic}.response-help{margin:0 0 20px;color:#68778e;line-height:1.7}</style>
</head>
<body>
<header><div><h1>우리 반 응답 보드</h1><p class="subtitle">생각을 모으고, 함께 살펴보는 시간</p></div><span class="badge">● 인터넷 없이 사용</span></header>
<main>
<section class="input-panel" id="inputPanel"><h2 class="section-label">응답 표 붙여 넣기</h2><p class="hint">구글 폼 응답 스프레드시트에서 개인정보를 제외한 표를 복사해 붙여 넣으세요.<br>첫 줄은 문항으로, 다음 줄부터는 한 사람의 응답으로 읽습니다. 탭으로 구분된 표 또는 CSV를 사용할 수 있어요.</p><textarea id="source" aria-label="문항과 응답 표" placeholder="좋아하는 계절은?&#9;우리 반에 바라는 점은?&#10;봄&#9;함께 책 읽는 시간이 있으면 좋겠어요.&#10;여름&#9;서로의 이야기를 잘 들어 주면 좋겠어요."></textarea><div class="actions"><button id="renderButton">응답 보드 만들기</button><button class="secondary" id="exampleButton">예시 보기</button><span class="note">입력한 내용은 이 화면에서만 처리됩니다.</span></div><p id="message" role="status"></p></section>
<div id="empty" class="empty"><strong>우리 반의 생각을 펼쳐 보세요</strong>표를 붙여 넣으면 문항마다 응답을 모아 보여 드려요.</div>
<section id="boardSection" hidden><div class="board-top"><div><h2>응답 한눈에 보기</h2><p class="count" id="summary"></p></div><div class="actions" style="margin:0"><button class="secondary" id="editButton">입력으로 이동</button><button id="presentButton">발표 모드</button></div></div><div class="view-tabs" role="group" aria-label="보기 방식"><button id="byQuestion" class="secondary" aria-pressed="true">문항별 보기</button><button id="byResponse" class="secondary" aria-pressed="false">응답별 보기</button></div><div id="questions"></div><div id="responses" hidden></div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let questions=[],respondents=0,viewMode='question';
// Quoted cells may contain tabs, commas, newlines, or escaped double quotes.
function parseTable(text,delimiter){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&(quoted||cell==='')){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===delimiter&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw new Error('닫히지 않은 큰따옴표가 있습니다. 복사한 표를 다시 확인해 주세요.');row.push(cell);rows.push(row);return rows;}
function guessType(values){const unique=new Set(values);return unique.size<=12&&values.every(v=>v.length<=45)&& (values.length<4||unique.size<=values.length*.65)?'choice':'text';}
function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function drawResponses(){const host=$('responses');host.replaceChildren();const written=questions.filter(q=>q.type==='text');host.append(element('p','response-help','서술형으로 설정한 문항을 한 사람당 한 카드에 모았습니다. 문항별 보기에서 문항 유형을 바꿀 수 있어요.'));if(!written.length){host.append(element('div','empty','서술형 문항이 없습니다. 문항별 보기에서 원하는 문항을 서술형으로 바꿔 주세요.'));return;}const cards=element('div','cards');for(let i=0;i<respondents;i++){const card=element('article','card');card.append(element('small','',`응답 ${i+1}`));written.forEach(q=>{const item=element('div','answer-item');item.append(element('div','answer-label',q.title),element('div',q.answers[i]?'':'missing',q.answers[i]||'응답 없음'));card.append(item);});cards.append(card);}host.append(cards);}
function setView(mode){viewMode=mode;$('questions').hidden=mode!=='question';$('responses').hidden=mode!=='response';$('byQuestion').setAttribute('aria-pressed',String(mode==='question'));$('byResponse').setAttribute('aria-pressed',String(mode==='response'));if(mode==='response')drawResponses();}
$('byQuestion').addEventListener('click',()=>setView('question'));
$('byResponse').addEventListener('click',()=>setView('response'));
function draw(){const host=$('questions');host.replaceChildren();questions.forEach((q,i)=>{const section=element('article','question');const head=element('div','question-head');const title=element('div','question-title');title.append(element('span','number',String(i+1).padStart(2,'0')));const info=element('div');info.append(element('h3','',q.title),element('div','meta',`응답 ${q.values.length}개 · 미응답 ${respondents-q.values.length}명`));title.append(info);const select=element('select');select.setAttribute('aria-label',`${q.title} 표시 방식`);[['choice','선택형 · 막대그래프'],['text','서술형 · 응답 카드']].forEach(([value,label])=>{const option=element('option','',label);option.value=value;select.append(option);});select.value=q.type;select.addEventListener('change',()=>{q.type=select.value;draw();});head.append(title,select);section.append(head);if(!q.values.length)section.append(element('div','no-answer','아직 응답이 없습니다.'));else if(q.type==='choice'){const counts=new Map();q.values.forEach(v=>counts.set(v,(counts.get(v)||0)+1));[...counts].sort((a,b)=>b[1]-a[1]).forEach(([label,count])=>{const row=element('div','bar-row');const track=element('div','track');const fill=element('div','fill');fill.style.width=(count/q.values.length*100)+'%';track.append(fill);row.append(element('div','bar-label',label),track,element('div','bar-value',`${count}명 · ${Math.round(count/q.values.length*100)}%`));section.append(row);});section.append(element('div','meta','같은 응답을 묶어 집계합니다. 비율은 이 문항에 응답한 사람을 기준으로 합니다.'));}else{const cards=element('div','cards');q.values.forEach((v,j)=>{const card=element('div','card');card.append(element('small','',`응답 ${j+1}`),document.createTextNode(v));cards.append(card);});section.append(cards);}host.append(section);});$('summary').textContent=`총 ${respondents}명의 응답 · ${questions.length}개 문항 · 문항 오른쪽에서 표시 방식을 바꿀 수 있어요`;$('empty').hidden=true;$('boardSection').hidden=false;setView(viewMode);}
function build(){try{const raw=$('source').value.replace(/^\uFEFF/,'');if(!raw.trim())throw new Error('먼저 문항과 응답 표를 붙여 넣어 주세요.');const rows=parseTable(raw,raw.includes('\t')?'\t':',');while(rows.length&&rows[rows.length-1].every(v=>!v.trim()))rows.pop();if(rows.length<2)throw new Error('첫 줄의 문항과 한 줄 이상의 응답이 필요합니다.');const headers=rows.shift();const data=rows.filter(row=>row.some(v=>v.trim()));if(!data.length)throw new Error('응답이 비어 있습니다.');if(data.some(row=>row.length>headers.length))throw new Error('문항 수보다 응답 열이 많습니다. 첫 줄에 모든 문항이 포함되었는지 확인해 주세요.');respondents=data.length;questions=headers.map((title,i)=>{const answers=data.map(row=>(row[i]||'').trim());const values=answers.filter(Boolean);return {title:title.trim()||`문항 ${i+1}`,answers,values,type:guessType(values)};});draw();$('message').textContent='보드를 만들었습니다. 자동으로 분류한 문항 유형은 자유롭게 바꿀 수 있어요.';$('boardSection').scrollIntoView({behavior:'smooth',block:'start'});}catch(error){$('message').textContent=error.message;}}
$('renderButton').addEventListener('click',build);
$('exampleButton').addEventListener('click',()=>{$('source').value='좋아하는 계절은?\t함께 하고 싶은 활동은?\t우리 반에 바라는 점은?\n봄\t체육 활동\t서로의 이야기를 끝까지 들어 주면 좋겠어요.\n여름\t독서 활동\t함께 책 읽는 시간을 만들어요!\n가을\t체육 활동\t실수해도 괜찮다고 말해 주는 반이 되면 좋겠어요.\n봄\t미술 활동\t우리 반만의 작은 전시회를 열고 싶어요.\n겨울\t체육 활동\t매일 웃으며 인사해요.\n봄\t미술 활동\t친구들과 더 많이 협력하고 싶어요.';build();});
$('editButton').addEventListener('click',()=>{$('inputPanel').scrollIntoView({behavior:'smooth'});$('source').focus({preventScroll:true});});
function presentation(on){document.body.classList.toggle('presenting',on);$('presentButton').textContent=on?'발표 모드 종료':'발표 모드';}
$('presentButton').addEventListener('click',()=>presentation(!document.body.classList.contains('presenting')));document.addEventListener('keydown',e=>{if(e.key==='Escape')presentation(false);});
</script>
</body>
</html>
