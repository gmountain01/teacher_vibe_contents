<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 모둠 편성기</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#18243b;font-family:system-ui,-apple-system,'맑은 고딕',sans-serif}main{max-width:1250px;margin:auto;padding:48px 24px}header{margin-bottom:30px}.eyebrow{color:#5264d9;font-weight:800;letter-spacing:.1em;font-size:13px}h1{font-size:clamp(30px,4vw,44px);margin:10px 0}header p{color:#647089;line-height:1.7}.panel{background:white;border:1px solid #e0e6f0;border-radius:22px;padding:26px;box-shadow:0 8px 28px #23355c06}.settings{display:grid;grid-template-columns:1fr 280px;gap:28px}label{display:block;font-weight:750;margin-bottom:10px}textarea,input{font:inherit;width:100%;border:1px solid #cbd3e3;border-radius:12px;padding:14px;color:#18243b;background:#fcfdff}textarea{min-height:200px;resize:vertical;line-height:1.7}input{font-size:22px}textarea:focus,input:focus{outline:3px solid #dce2ff;border-color:#6375e7}.hint{font-size:13px;color:#718099;margin:9px 0 0;line-height:1.6}.actions{display:flex;flex-direction:column;gap:12px;margin-top:22px}button{font:inherit;font-weight:750;border:0;border-radius:12px;padding:15px 20px;cursor:pointer;background:#5264d9;color:white;transition:background .15s}button:hover{background:#4052c6}button.secondary{background:#edf0ff;color:#4052bc}button.secondary:hover{background:#e0e5ff}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #a6b4ff;outline-offset:3px}.results-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:32px 0 18px}h2{font-size:23px;margin:0}.summary{color:#67758c;font-size:15px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.group{background:white;border:1px solid #e0e6f0;border-top:6px solid var(--accent);border-radius:18px;overflow:hidden;box-shadow:0 6px 22px #23355c06}.group-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 16px}.group h3{font-size:25px;margin:0}.badge{background:#f0f3fa;color:#5b6982;border-radius:30px;padding:6px 12px;font-size:14px}.members{list-style:none;margin:0;padding:0 24px 24px;display:flex;flex-wrap:wrap;gap:10px}.members li{font-size:23px;font-weight:650;padding:12px 15px;background:#f5f7fc;border-radius:10px;overflow-wrap:anywhere;max-width:100%}.empty{padding:55px 20px;text-align:center;color:#7b879c;border:2px dashed #d9dfec;border-radius:20px;line-height:1.8}.error{color:#c33943;min-height:22px;font-size:14px;margin:12px 0 0}@media(max-width:650px){main{padding:28px 16px}.settings{grid-template-columns:1fr;gap:22px}.panel{padding:20px}.actions{flex-direction:row}.actions button{flex:1}.results-heading{align-items:flex-start;flex-direction:column}.groups{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header><span class="eyebrow">CLASSROOM TOOLS</span><h1>우리 반 모둠 편성기</h1><p>학생 명단만 넣으면 모둠 편성 끝! 골고루 나누고, 함께 시작해 보세요.</p></header>
  <form id="groupForm" class="panel" novalidate>
    <div class="settings">
      <div><label for="students">학생 명단</label><textarea id="students" placeholder="김민준&#10;이서연&#10;박지우&#10;최도윤"></textarea><p class="hint">한 줄에 한 명씩 입력하세요. 쉼표로 구분해도 됩니다. <span id="count">현재 0명</span></p></div>
      <div><label for="groupCount">모둠 수</label><input id="groupCount" type="number" min="1" step="1" value="4"><p class="hint">모둠별 인원 차이가 최대 1명이 되도록 나눕니다.</p><div class="actions"><button type="submit">모둠 만들기</button><button type="button" id="reshuffle" class="secondary" disabled>다시 섞기</button></div></div>
    </div><p id="error" class="error" role="alert"></p>
  </form>
  <section aria-labelledby="resultTitle"><div class="results-heading"><h2 id="resultTitle">모둠 편성 결과</h2><span id="summary" class="summary" aria-live="polite"></span></div><div id="results"><div class="empty">함께할 학생들의 이름을 입력해 주세요.<br>모둠 카드가 여기에 표시됩니다.</div></div></section>
</main>
<script>
  const studentsInput=document.getElementById('students');
  const groupInput=document.getElementById('groupCount');
  const results=document.getElementById('results');
  const error=document.getElementById('error');
  const reshuffle=document.getElementById('reshuffle');
  const colors=['#6375e7','#31a58b','#e5a345','#c477b1','#529dce','#dc7d70'];
  function names(){return studentsInput.value.split(/[\n,，]+/).map(name=>name.trim()).filter(Boolean)}
  studentsInput.addEventListener('input',()=>{document.getElementById('count').textContent=`현재 ${names().length}명`});
  function randomBelow(max){const values=new Uint32Array(1);const limit=4294967296-4294967296%max;do{crypto.getRandomValues(values)}while(values[0]>=limit);return values[0]%max}
  function arrange(){
    const students=names();const total=Number(groupInput.value);error.textContent='';
    if(!students.length){error.textContent='학생 이름을 한 명 이상 입력해 주세요.';studentsInput.focus();return}
    if(!Number.isInteger(total)||total<1){error.textContent='모둠 수는 1 이상의 정수로 입력해 주세요.';groupInput.focus();return}
    if(total>students.length){error.textContent='모둠 수는 학생 수 이하로 입력해 주세요.';groupInput.focus();return}
    for(let i=students.length-1;i>0;i--){const j=randomBelow(i+1);[students[i],students[j]]=[students[j],students[i]]}
    const groups=Array.from({length:total},()=>[]);students.forEach((student,index)=>groups[index%total].push(student));
    results.replaceChildren();results.className='groups';
    groups.forEach((members,index)=>{
      const card=document.createElement('article');card.className='group';card.style.setProperty('--accent',colors[index%colors.length]);
      const heading=document.createElement('div');heading.className='group-head';
      const title=document.createElement('h3');title.textContent=`${index+1}모둠`;
      const badge=document.createElement('span');badge.className='badge';badge.textContent=`${members.length}명`;
      heading.append(title,badge);const list=document.createElement('ul');list.className='members';
      members.forEach(name=>{const item=document.createElement('li');item.textContent=name;list.append(item)});
      card.append(heading,list);results.append(card);
    });
    const min=Math.floor(students.length/total),max=Math.ceil(students.length/total);
    document.getElementById('summary').textContent=`총 ${students.length}명 · ${total}개 모둠 · 모둠당 ${min===max?min:min+'~'+max}명`;
    reshuffle.disabled=false;
  }
  document.getElementById('groupForm').addEventListener('submit',event=>{event.preventDefault();arrange()});
  reshuffle.addEventListener('click',arrange);
</script>
</body>
</html>
