<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다섯 칸으로 쓰는 시 설계도</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f4ee; color: #293c38; font-family: "Malgun Gothic", sans-serif; line-height: 1.7; }
    main { width: min(960px, 100%); margin: 0 auto; padding: 48px 24px 64px; }
    .eyebrow { margin: 0; color: #537b6c; font-size: 14px; font-weight: bold; letter-spacing: .08em; }
    h1 { margin: 8px 0 12px; font-size: clamp(26px, 5vw, 38px); letter-spacing: -.05em; }
    .intro { margin: 0 0 30px; color: #65736d; }
    .panel { padding: 24px; border: 1px solid #dce3d9; border-radius: 18px; background: #fffefa; }
    label { display: block; margin-bottom: 10px; font-size: 18px; font-weight: bold; }
    input, textarea { display: block; width: 100%; border: 1px solid #ccd6cd; border-radius: 10px; background: white; color: #293c38; padding: 14px; font: inherit; }
    input::placeholder, textarea::placeholder { color: #929b96; opacity: 1; font-size: 14px; }
    input:focus, textarea:focus { outline: 3px solid #c6dfd0; border-color: #547f69; }
    textarea { min-height: 140px; resize: vertical; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 20px 0 32px; }
    .number { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-right: 8px; border-radius: 50%; background: #e9f0e7; color: #50725c; font-size: 14px; vertical-align: 2px; }
    .wide { grid-column: 1 / -1; }
    h2 { margin: 0 0 6px; font-size: 24px; }
    .note { margin: 0 0 18px; color: #718078; font-size: 14px; }
    #poem { min-height: 360px; line-height: 2; }
    .poem-label { font-size: 15px; }
    footer { margin-top: 20px; text-align: center; color: #718078; font-size: 13px; }
    @media (max-width: 600px) { main { padding: 28px 16px; } .grid { grid-template-columns: 1fr; } .panel { padding: 20px; } }
    .print-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    button { padding: 11px 18px; border: 1px solid #547f69; border-radius: 10px; background: #fffefa; color: #365f49; font: inherit; font-weight: bold; cursor: pointer; }
    button:last-child { background: #365f49; color: white; }
    button:focus-visible { outline: 3px solid #a7cbb4; outline-offset: 3px; }
    #print-area { position: absolute; left: -100000px; top: 0; width: 186mm; }
    #print-sheet { width: 186mm; padding: 1mm; transform-origin: top left; color: #222; background: white; font-size: 12px; line-height: 1.5; }
    #print-sheet h1 { margin: 0 0 5mm; font-size: 23px; }
    .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin: 3mm 0; }
    .print-box { border: 1px solid #999; border-radius: 3mm; padding: 3mm; min-width: 0; }
    .print-box h2 { font-size: 14px; margin: 0 0 2mm; }
    .print-content { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 22mm; }
    .print-theme .print-content { min-height: 9mm; }
    .print-poem .print-content { min-height: 80mm; }
    .print-help { color: #888; font-size: 11px; }
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      body { background: white; }
      body > main { display: none; }
      #print-area { position: static; width: 186mm; height: 272mm; overflow: hidden; }
      #print-sheet { transform: scale(var(--print-scale, 1)); }
      button, .print-buttons { display: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">나만의 시 쓰기</p>
      <h1>다섯 칸으로 쓰는 시 설계도</h1>
      <p class="intro">떠오르는 생각을 다섯 칸에 모으고, 나만의 말로 시를 써 보세요.</p>
    </header>
    <div class="print-buttons" aria-label="인쇄">
      <button type="button" onclick="printBlueprint(true)">빈 설계도 인쇄</button>
      <button type="button" onclick="printBlueprint(false)">내 설계도 인쇄</button>
    </div>
    <section class="panel" aria-label="시의 주제">
      <label for="theme">내 시의 주제</label>
      <input id="theme" type="text" placeholder="어떤 마음이나 이야기를 전하고 싶나요?">
    </section>
    <section class="grid" aria-label="시를 설계하는 다섯 칸">
      <div class="panel">
        <label for="subject"><span class="number">1</span>대상</label>
        <textarea id="subject" placeholder="누구 또는 무엇에 대해 쓸까요?"></textarea>
      </div>
      <div class="panel">
        <label for="scene"><span class="number">2</span>장면</label>
        <textarea id="scene" placeholder="언제, 어디에서 어떤 일이 일어나나요?"></textarea>
      </div>
      <div class="panel">
        <label for="sense"><span class="number">3</span>감각</label>
        <textarea id="sense" placeholder="빛깔, 소리, 냄새, 맛, 촉감을 떠올려 보세요."></textarea>
      </div>
      <div class="panel">
        <label for="metaphor"><span class="number">4</span>비유</label>
        <textarea id="metaphor" placeholder="대상을 무엇에 빗대어 표현할 수 있을까요?"></textarea>
      </div>
      <div class="panel wide">
        <label for="rhythm"><span class="number">5</span>운율</label>
        <textarea id="rhythm" placeholder="되풀이할 말이나 소리, 읽는 리듬을 생각해 보세요."></textarea>
      </div>
    </section>
    <section class="panel" aria-labelledby="writing-title">
      <h2 id="writing-title">이제, 나의 시</h2>
      <p class="note">위에서 모은 생각을 골라 나만의 시를 직접 써 보세요. 모든 생각을 다 쓰지 않아도 괜찮아요.</p>
      <label class="poem-label" for="poem">시 쓰는 칸</label>
      <textarea id="poem" placeholder="첫 줄에는 시의 제목을, 그 아래에는 나의 시를 써 보세요."></textarea>
    </section>
    <footer>내가 고른 말과 나의 생각으로 완성하는 시</footer>
  </main>
  <div id="print-area" aria-hidden="true"><article id="print-sheet"></article></div>
  <script>
    let blankPrint = false;
    function preparePrint() {
      const sheet = document.getElementById('print-sheet');
      sheet.replaceChildren();
      const title = document.createElement('h1');
      title.textContent = '다섯 칸으로 쓰는 시 설계도';
      sheet.append(title);
      function box(id, heading, className = '') {
        const field = document.getElementById(id);
        const section = document.createElement('section');
        section.className = 'print-box ' + className;
        const label = document.createElement('h2');
        label.textContent = heading;
        const content = document.createElement('div');
        content.className = 'print-content';
        if (blankPrint) {
          const help = document.createElement('span');
          help.className = 'print-help';
          help.textContent = field.placeholder;
          content.append(help);
        } else {
          content.textContent = field.value;
        }
        section.append(label, content);
        return section;
      }
      sheet.append(box('theme', '내 시의 주제', 'print-theme'));
      const grid = document.createElement('div');
      grid.className = 'print-grid';
      [['subject', '1 대상'], ['scene', '2 장면'], ['sense', '3 감각'], ['metaphor', '4 비유'], ['rhythm', '5 운율']].forEach(([id, heading]) => {
        grid.append(box(id, heading, id === 'rhythm' ? 'wide' : ''));
      });
      sheet.append(grid, box('poem', '나의 시', 'print-poem'));
      // 긴 글도 잘리지 않도록 전체 인쇄 내용을 한 페이지 높이에 맞춥니다.
      const availableHeight = 270 * 96 / 25.4;
      const scale = Math.min(1, availableHeight / sheet.scrollHeight);
      sheet.style.setProperty('--print-scale', scale);
    }
    function printBlueprint(blank) {
      blankPrint = blank;
      preparePrint();
      window.print();
      blankPrint = false;
    }
    window.addEventListener('beforeprint', preparePrint);
    window.addEventListener('afterprint', () => { blankPrint = false; });
  </script>
</body>
</html>
