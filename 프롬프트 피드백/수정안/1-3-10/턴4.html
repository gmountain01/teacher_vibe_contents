<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>체육 경기 점수판</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#0b1220;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif;text-align:center}button,input,select{font:inherit;padding:10px;border:1px solid #526079;border-radius:9px;background:#202e45;color:white}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid gold}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{font-size:24px}.row{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:14px}#clock{font-size:clamp(70px,10vw,130px);font-weight:bold;font-variant-numeric:tabular-nums}#teams{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1400px;margin:auto}.team{border:3px solid var(--c);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 25%,#142034),#142034);border-radius:22px;padding:20px;min-width:0}.name{font-size:clamp(24px,3vw,42px);overflow-wrap:anywhere}.score{font-size:clamp(100px,20vw,260px);border:0;background:transparent;width:100%;padding:0;font-weight:bold;line-height:1.2}.scorebuttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.scorebuttons button{font-size:25px}.team input[type=text]{width:65%}.team input[type=color]{width:48px;height:43px;padding:3px}.badge,#message{color:#fcd34d;font-size:24px;margin:14px;min-height:30px}#shot{font-size:44px}details{max-width:1000px;margin:24px auto;background:#142034;padding:20px;border-radius:15px;text-align:left}summary{cursor:pointer;font-weight:bold}.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin:20px 0}.rules label{display:flex;align-items:center;justify-content:space-between;gap:8px}.rules input{width:85px}.rules input[type=checkbox]{width:22px;height:22px}#status,#saved,#log{color:#b9c5db;margin:15px;line-height:1.8}[hidden]{display:none!important}@media(max-width:600px){body{padding:12px}#teams{gap:8px}.team{padding:10px 6px}.scorebuttons{grid-template-columns:1fr 1fr}.row{gap:6px;margin:10px 0}}</style>
<header><h1>체육 경기 점수판</h1><label>종목 <select id="sport"></select></label><span id="saved"></span></header><div id="message" role="status" aria-live="polite"></div>
<section id="time"><div class="badge" id="period"></div><div id="clock" role="timer"></div><div class="row"><button id="start">▶ 시작</button><button id="pause">Ⅱ 멈춤</button><button id="resetClock">시계 초기화</button><button id="nextPeriod">다음 피리어드</button><button id="extra">연장 시작</button></div><div id="shotPanel" class="row">샷클락 <strong id="shot"></strong><button id="s24">24초</button><button id="s14">14초</button><button id="shotToggle">샷클락 시작/멈춤</button></div></section>
<main id="teams"></main><div class="row" id="setPanel"><button id="nextSet">다음 세트 시작</button></div><div id="log"></div><div class="row"><button id="undo">↶ 되돌리기</button><button id="resetScore">점수·세트 초기화</button></div><div id="status" role="status" aria-live="polite"></div>
<details><summary>⚙ 경기 규칙 설정</summary><p>수업용 기본값입니다. 종목을 바꾸면 새 경기로 시작합니다. 규칙은 수업에 맞게 조절하세요. 테니스는 15·30·40, 듀스와 6:6 타이브레이크를 사용합니다. 피구는 잔여 내야 인원으로 승부를 가립니다. 야구는 첫 번째 팀이 초 공격, 두 번째 팀이 말 공격입니다.</p><div class="rules" id="rules"></div><button id="apply">규칙 적용</button><p>시간 설정 변경 시 시계가 초기화됩니다. 세트 기록이 있으면 점수·세트 초기화 후 규칙을 변경하세요.</p></details>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='pe-scoreboard-v2';
const defaults={players:10,mode:'time',label:'quarter',periods:4,seconds:600,extraSeconds:300,fouls:true,foulLimit:5,foulReset:true,shot:false,target:21,finalTarget:21,wins:2,deuce:true,cap:0};
const sports={basketball:['농구',{shot:true}],volleyball:['배구',{mode:'set',target:25,finalTarget:15,wins:3}],football:['축구',{label:'half',periods:2,seconds:2700,extraSeconds:900,fouls:false}],badminton:['배드민턴',{mode:'set',cap:30}],tabletennis:['탁구',{mode:'set',target:11,finalTarget:11,wins:3}],tennis:['테니스',{mode:'tennis',fouls:false}],handball:['핸드볼',{label:'half',periods:2,seconds:1800}],futsal:['풋살',{label:'half',periods:2,seconds:1200,foulLimit:6}],dodgeball:['피구',{mode:'dodge',seconds:300,extraSeconds:180,fouls:false}],baseball:['야구',{mode:'baseball',periods:9,fouls:false}],free:['자유 경기',{}]};
function fresh(sport='basketball',teams){const r={...defaults,...sports[sport][1]};return {sport,r,teams:teams?teams.map(t=>({...t,score:0,sets:0,fouls:0})):[{name:'우리 팀',color:'#3b82f6',score:0,sets:0,fouls:0},{name:'상대 팀',color:'#f43f5e',score:0,sets:0,fouls:0}],period:1,extra:0,ms:r.seconds*1000,running:false,end:null,shotMs:24000,shotRunning:false,shotEnd:null,results:[],setWinner:null,matchWinner:null};}
let state=fresh(),history=[],ctx;
try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&sports[d.sport]&&d.r&&d.teams?.length===2)state=d;else{let old=JSON.parse(localStorage.getItem('pe-scoreboard-v1'));if(old?.teams?.length===2)state.teams=old.teams.map(t=>({...t,sets:0,fouls:0}));}}catch(e){}
const left=()=>state.running?Math.max(0,state.end-Date.now()):state.ms,shotLeft=()=>state.shotRunning?Math.max(0,state.shotEnd-Date.now()):state.shotMs;
function stop(){state.ms=left();state.shotMs=shotLeft();state.running=false;state.shotRunning=false;state.end=null;state.shotEnd=null;}
function remember(){let s=structuredClone(state);s.ms=left();s.shotMs=shotLeft();s.running=false;s.shotRunning=false;history.push(s);if(history.length>100)history.shift();}
function say(t){$('status').textContent=t;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='자동 저장됨';}catch(e){$('saved').textContent='저장 불가 · 현재 화면에서만 유지';}}
function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});}catch(e){}}
function buzz(){audio();if(!ctx)return;for(let i=0;i<3;i++){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.6;o.type='sawtooth';o.frequency.value=220;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.linearRampToValueAtTime(0,t+.48);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.5);}}
function target(){return state.teams.every(t=>t.sets===state.r.wins-1)?state.r.finalTarget:state.r.target;}
function win(a,b){return a>b&&((state.r.cap>0&&a>=state.r.cap)||(a>=target()&&a-b>=(state.r.deuce?2:1)));}
function commit(){save();render();}
function add(i,n){if(state.setWinner!==null||state.matchWinner!==null)return;const t=state.teams[i],v=Math.max(0,t.score+n);if(v===t.score||!Number.isSafeInteger(v))return;remember();t.score=v;if(state.r.mode==='set'&&win(v,state.teams[1-i].score)){state.setWinner=i;t.sets++;state.results.push(state.teams.map(t=>t.score));if(t.sets>=state.r.wins)state.matchWinner=i;buzz();}commit();say(t.name+' '+v+'점');}
function button(text,fn,parent,disabled=false){const b=document.createElement('button');b.textContent=text;b.onclick=fn;b.disabled=disabled;parent.append(b);return b;}
function render(){const set=state.r.mode==='set';$('sport').value=state.sport;$('time').hidden=set;$('setPanel').hidden=!set;$('nextSet').disabled=state.setWinner===null||state.matchWinner!==null;$('teams').replaceChildren();state.teams.forEach((t,i)=>{const c=document.createElement('section');c.className='team';c.style.setProperty('--c',t.color);const name=document.createElement('div');name.className='name';name.textContent=t.name;c.append(name);if(set){const badge=document.createElement('div');badge.className='badge';badge.textContent='세트 승리 '+t.sets+' / '+state.r.wins;c.append(badge);}let locked=state.setWinner!==null||state.matchWinner!==null;const score=button(t.score,()=>add(i,1),c,locked);score.className='score';score.setAttribute('aria-label',t.name+' '+t.score+'점, 누르면 1점 추가');const hint=document.createElement('div');hint.textContent='큰 점수를 누르면 +1';c.append(hint);const row=document.createElement('div');row.className='scorebuttons';[1,2,3,-1].forEach(n=>button(n>0?'+'+n:'−1',()=>add(i,n),row,locked));c.append(row);if(!set&&state.r.fouls){const f=document.createElement('div');f.className='row';const txt=document.createElement('span');txt.textContent='팀 파울 '+t.fouls+(t.fouls>=state.r.foulLimit?' · 기준 도달':'');f.append(txt);[-1,1].forEach(n=>button(n>0?'파울 +1':'파울 −1',()=>{remember();t.fouls=Math.max(0,t.fouls+n);commit();},f));c.append(f);}const settings=document.createElement('div');settings.className='row';const input=document.createElement('input');input.type='text';input.maxLength=30;input.value=t.name;input.setAttribute('aria-label','팀 '+(i+1)+' 이름');input.onchange=()=>{remember();t.name=input.value.trim()||'팀 '+(i+1);commit();};const color=document.createElement('input');color.type='color';color.value=t.color;color.setAttribute('aria-label','팀 '+(i+1)+' 색');color.onchange=()=>{remember();t.color=color.value;commit();};settings.append(input,color);c.append(settings);$('teams').append(c);});let msg='';if(set){if(state.matchWinner!==null)msg=state.teams[state.matchWinner].name+' 매치 승리!';else if(state.setWinner!==null)msg=state.teams[state.setWinner].name+' 세트 승리!';else{msg=state.teams.map((t,i)=>win(t.score+1,state.teams[1-i].score)?t.name+' '+(t.sets===state.r.wins-1?'매치 포인트':'세트 포인트'):'').filter(Boolean).join(' · ');if(state.r.deuce&&state.teams.every(t=>t.score>=target()-1)&&state.teams[0].score===state.teams[1].score)msg='듀스 · 2점 차 승리'+(state.r.cap?' · 최대 '+state.r.cap+'점':'');}msg||=(state.results.length+1)+'세트 · 목표 '+target()+'점';}$('message').textContent=msg;$('log').textContent=state.results.map((r,i)=>(i+1)+'세트 '+r[0]+' : '+r[1]).join(' / ');$('undo').disabled=!history.length;$('shotPanel').hidden=!state.r.shot;clock();}
function clock(){const t=Math.ceil(left()/1000);$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('clock').style.color=t===0?'#fcd34d':'';$('period').textContent=state.extra?'연장 '+state.extra:state.r.label==='half'?(state.period===1?'전반':state.period===2?'후반':state.period+'피리어드'):state.period+(state.r.label==='quarter'?'쿼터':'피리어드');$('nextPeriod').disabled=state.extra>0||state.period>=state.r.periods;$('start').disabled=state.running||t===0;$('pause').disabled=!state.running&&!state.shotRunning;$('shot').textContent=Math.ceil(shotLeft()/1000);$('shotToggle').textContent=state.shotRunning?'샷클락 멈춤':'샷클락 시작';}
for(const [id,[name]] of Object.entries(sports)){const o=document.createElement('option');o.value=id;o.textContent=name;$('sport').append(o);}
$('sport').onchange=()=>{remember();state=fresh($('sport').value,state.teams);sync();commit();say('새 경기를 시작했습니다. 되돌리기로 이전 경기를 복원할 수 있습니다.');};
$('start').onclick=()=>{audio();if(state.running||left()<=0)return;state.end=Date.now()+state.ms;state.running=true;if(state.r.shot&&shotLeft()>0){state.shotEnd=Date.now()+state.shotMs;state.shotRunning=true;}commit();};$('pause').onclick=()=>{stop();commit();};
$('resetClock').onclick=()=>{remember();stop();state.ms=(state.extra?state.r.extraSeconds:state.r.seconds)*1000;state.shotMs=24000;commit();};
function resetShot(n){remember();state.shotMs=n*1000;state.shotRunning=state.running;state.shotEnd=state.shotRunning?Date.now()+n*1000:null;commit();}
$('s24').onclick=()=>resetShot(24);$('s14').onclick=()=>resetShot(14);$('shotToggle').onclick=()=>{audio();if(state.shotRunning){state.shotMs=shotLeft();state.shotRunning=false;}else if(shotLeft()>0){state.shotEnd=Date.now()+state.shotMs;state.shotRunning=true;}commit();};
function advance(extra){remember();stop();if(extra)state.extra++;else state.period++;state.ms=(extra?state.r.extraSeconds:state.r.seconds)*1000;state.shotMs=24000;if(state.r.foulReset)state.teams.forEach(t=>t.fouls=0);commit();}
$('nextPeriod').onclick=()=>advance(false);$('extra').onclick=()=>advance(true);$('nextSet').onclick=()=>{if(state.setWinner===null||state.matchWinner!==null)return;remember();state.teams.forEach(t=>t.score=0);state.setWinner=null;commit();};
$('resetScore').onclick=()=>{remember();state.teams.forEach(t=>{t.score=0;t.sets=0;});state.results=[];state.setWinner=null;state.matchWinner=null;commit();say('점수와 세트 기록을 초기화했습니다.');};$('undo').onclick=()=>{if(!history.length)return;state=history.pop();sync();commit();say('이전 상태로 되돌렸습니다. 시계는 멈춤 상태입니다.');};
const fields=[['mode','경기 방식',{time:'시간 경기',set:'세트 경기',tennis:'테니스',dodge:'피구',baseball:'야구'}],['label','피리어드 표시',{quarter:'쿼터',half:'전후반',period:'피리어드'}],['periods','정규 피리어드 수 / 야구 이닝',1,20],['seconds','피리어드 시간(초)',1,59999],['extraSeconds','연장 시간(초)',1,59999],['fouls','팀 파울 사용'],['foulLimit','파울 경고 기준',1,99],['foulReset','피리어드마다 파울 초기화'],['shot','샷클락 사용'],['target','세트 목표 점수',1,999],['finalTarget','마지막 세트 목표 점수',1,999],['wins','승리에 필요한 세트 수',1,9],['deuce','듀스(2점 차 승리)'],['cap','최대 점수(0=제한 없음)',0,999],['players','피구 시작 내야 인원',1,99]];
for(const [key,title,options,max] of fields){let label=document.createElement('label');label.textContent=title;let e=document.createElement(typeof options==='object'?'select':'input');e.id='r_'+key;if(typeof options==='object'){for(const [v,t] of Object.entries(options)){let o=document.createElement('option');o.value=v;o.textContent=t;e.append(o);}}else if(typeof options==='number'){e.type='number';e.min=options;e.max=max;e.step=1;}else e.type='checkbox';label.append(e);$('rules').append(label);}
function sync(){for(const [key] of fields){const e=$('r_'+key);if(e.type==='checkbox')e.checked=state.r[key];else e.value=state.r[key];}}
$('apply').onclick=()=>{const r={};for(const [key] of fields){const e=$('r_'+key);if(e.type==='number'){if(!e.value||!e.checkValidity()||!Number.isInteger(Number(e.value))){say('숫자를 허용 범위의 정수로 입력해 주세요.');return;}r[key]=Number(e.value);}else r[key]=e.type==='checkbox'?e.checked:e.value;}if(r.cap&&r.cap<Math.max(r.target,r.finalTarget)){say('최대 점수는 두 목표 점수 이상이어야 합니다.');return;}if(state.results.length||state.setWinner!==null){say('세트 기록이 있습니다. 점수·세트 초기화 후 규칙을 변경해 주세요.');return;}remember();stop();state.r=r;state.period=Math.min(state.period,r.periods);state.ms=r.seconds*1000;state.shotMs=24000;commit();say('경기 규칙을 적용했습니다.');};
if(state.sport==='tennis'&&state.r.mode==='set'){state.r.mode='tennis';state.results=[];state.setWinner=null;state.matchWinner=null;state.teams.forEach(t=>{t.score=0;t.sets=0;});}
// 종목 전용 상태도 동일한 자동 저장 및 되돌리기 기록에 포함합니다.
function special(){
 state.r.players??=10;
 state.tennis??={points:[0,0],games:[0,0],tie:false};
 state.dodge??={players:[state.r.players,state.r.players],draw:false};
 state.baseball??={inning:1,half:0,balls:0,strikes:0,outs:0,bases:[false,false,false],runs:[[],[]],ended:false};
}
const originalFresh=fresh;
fresh=function(...args){const s=originalFresh(...args);s.r.players??=10;return s;};
const originalRender=render,originalClock=clock,originalAdd=add;
const specialBox=document.createElement('section');specialBox.id='special';$('teams').after(specialBox);
const css=document.createElement('style');css.textContent='table{border-collapse:collapse;margin:18px auto;min-width:650px}th,td{border:1px solid #526079;padding:10px;text-align:center}.table-scroll{overflow-x:auto}.base{width:80px;height:64px}.base.on{background:#d6a719;color:#101827}.special-note{color:#b9c5db;margin:12px}.tennis-score{font-size:clamp(70px,12vw,150px)}';document.head.append(css);
function tennisPoint(i){
 const t=state.tennis,j=1-i;t.points[i]++;
 const won=t.tie?t.points[i]>=7&&t.points[i]-t.points[j]>=2:t.points[i]>=4&&t.points[i]-t.points[j]>=2;
 if(won){t.games[i]++;t.points=[0,0];
 if(t.tie||(t.games[i]>=6&&t.games[i]-t.games[j]>=2)){
 state.results.push([...t.games]);state.teams[i].sets++;state.setWinner=i;
 if(state.teams[i].sets>=state.r.wins)state.matchWinner=i;
 buzz();
 }else if(t.games[0]===6&&t.games[1]===6)t.tie=true;
 }
}
function tennisDisplay(i){const t=state.tennis,p=t.points;if(t.tie)return p[i];if(p[0]>=3&&p[1]>=3)return p[i]===p[1-i]?'40':p[i]>p[1-i]?'AD':'40';return [0,15,30,40][Math.min(p[i],3)];}
function finishDodge(){const d=state.dodge;const [a,b]=d.players;
 if(a===b){if(!state.extra){state.extra=1;state.ms=state.r.extraSeconds*1000;state.running=true;state.end=Date.now()+state.ms;say('동점! '+state.r.extraSeconds+'초 연장을 시작합니다.');}else{d.draw=true;say('연장 종료 · 동점입니다. 재연장 또는 다음 세트를 선택하세요.');}}
 else {const i=a>b?0:1;state.results.push([a,b]);state.teams[i].sets++;state.setWinner=i;if(state.teams[i].sets>=state.r.wins)state.matchWinner=i;say(state.teams[i].name+' 세트 승리!');}}
add=function(i,n){special();if(state.r.mode==='tennis'){if(n!==1||state.setWinner!==null||state.matchWinner!==null)return;remember();tennisPoint(i);commit();return;}
 if(state.r.mode==='dodge'){if(state.setWinner!==null||state.matchWinner!==null)return;remember();state.dodge.players[i]=Math.max(0,Math.min(state.r.players,state.dodge.players[i]+n));commit();return;}
 if(state.r.mode==='baseball'){const b=state.baseball;if(b.ended||i!==b.half)return;const old=b.runs[i][b.inning-1]||0,next=Math.max(0,old+n);if(old===next)return;remember();b.runs[i][b.inning-1]=next;updateRuns();checkWalkoff();commit();return;}originalAdd(i,n);};
function updateRuns(){state.teams.forEach((t,i)=>t.score=state.baseball.runs[i].reduce((a,b)=>a+(b||0),0));}
function checkWalkoff(){const b=state.baseball;if(b.inning>=state.r.periods&&b.half===1&&state.teams[1].score>state.teams[0].score){b.ended=true;state.matchWinner=1;buzz();}}
function nextHalf(){const b=state.baseball;if(b.inning>=state.r.periods){if(b.half===0&&state.teams[1].score>state.teams[0].score){b.ended=true;state.matchWinner=1;return;}if(b.half===1&&state.teams[0].score!==state.teams[1].score){b.ended=true;state.matchWinner=state.teams[0].score>state.teams[1].score?0:1;return;}}
 if(b.half===0)b.half=1;else{b.half=0;b.inning++;}b.balls=0;b.strikes=0;b.outs=0;b.bases=[false,false,false];b.runs[b.half][b.inning-1]??=0;}
