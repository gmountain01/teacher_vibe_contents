<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self' about:; img-src data: blob:; connect-src 'none'; font-src 'none'"><title>학생 건강조사 · 로컬 미리보기</title><style>*{box-sizing:border-box}body{margin:0;color:#203c3b;background:#f3f6f2;font:14px/1.6 'Malgun Gothic',sans-serif}.notice{background:#fff0cf;color:#76531b;text-align:center;padding:10px 16px}.bar{display:flex;gap:12px;align-items:center;padding:12px 24px;background:white;border-bottom:1px solid #dce5e0}.bar strong{margin-right:auto}button{font:inherit;border:1px solid #b9d2c5;border-radius:8px;padding:9px 16px;background:#edf6f0;color:#176f62;cursor:pointer}button.active{background:#176f62;color:white}iframe{display:block;width:100%;height:calc(100vh - 137px);border:0}.hint{margin:0;padding:6px 20px;text-align:center;font-size:12px;color:#637672}@media(max-width:600px){.bar{padding:10px;flex-wrap:wrap}.bar strong{width:100%}iframe{height:calc(100vh - 205px)}}@media print{.notice,.bar,.hint{display:none}iframe{height:100vh}}</style></head><body><div class="notice"><strong>외부 연결 없는 로컬 미리보기</strong> · Google 계정·Drive·Sheets·이메일에 연결하거나 발송하지 않습니다.</div><nav class="bar" aria-label="화면 전환"><strong>✚ 우리 아이 건강 살피기</strong><button id="parentBtn" class="active" onclick="showRole(false)">학부모 화면</button><button id="adminBtn" onclick="showRole(true)">관리자 화면 전환</button></nav><p class="hint">가상 예시 데이터 · 현재 탭 메모리에만 저장하며 새로고침 시 초기화 · 실제 인증·암호화 없음 · 업로드는 로컬 파일 미리보기만 제공</p><iframe id="parentFrame" title="학부모 건강조사"></iframe><iframe id="adminFrame" title="관리자 현황 및 보고서" style="display:none"></iframe><script>
const clone=v=>JSON.parse(JSON.stringify(v)), norm=v=>String(v||'').replace(/[\s-]/g,'');
let roster=[{id:'s1',year:'3',classroom:'2',number:'1',student:'김하늘',parent:'김보호',phone:'01012345678'},{id:'s2',year:'3',classroom:'2',number:'2',student:'이봄',parent:'이보호',phone:'01022223333'},{id:'s3',year:'3',classroom:'2',number:'3',student:'박도윤',parent:'박보호',phone:'01033334444'},{id:'s4',year:'3',classroom:'3',number:'1',student:'최서윤',parent:'최보호',phone:'01044445555'}];
let rows=[{id:'r1',status:'SUBMITTED',password:'preview1234',data:{student:'김하늘',grade:'3학년 2반 1번',parent:'김보호',phone:'01012345678',relation:'모',condition:'없음',allergy:'있음',allergyDetail:'땅콩 알레르기 / 급식 확인 요청',medicine:'없음',emergencyConsent:'동의',privacyConsent:'동의',sensitiveConsent:'동의',signature:'김보호',date:'2026-11-10',confirmed:true}},{id:'r2',status:'DRAFT',password:'preview1234',data:{student:'이봄',grade:'3학년 2반 2번',parent:'이보호',phone:'01022223333',condition:'확인 필요',message:'진료 후 추가 작성 예정'}},{id:'r3',status:'SUBMITTED',password:'preview1234',data:{student:'최서윤',grade:'3학년 3반 1번',parent:'최보호',phone:'01044445555',condition:'있음',conditionDetail:'천식 / 격한 운동 시 관찰 필요',allergy:'없음',emergencyConsent:'비동의',privacyConsent:'동의',sensitiveConsent:'동의'}},{id:'r4',status:'SUBMITTED',password:'preview1234',data:{student:'정예준',grade:'3학년 2반 9번',parent:'정보호',phone:'01055556666',condition:'없음',allergy:'확인 필요',emergencyConsent:'동의'}}].map(r=>({...r,version:1,updatedAt:new Date().toISOString()}));
const match=(r,s)=>norm(r.data.grade)===norm(s.year+'학년 '+s.classroom+'반 '+s.number+'번')&&['student','parent','phone'].every(k=>norm(r.data[k])===norm(s[k]));
const getClass=r=>(r.data.grade||'').match(/\d+\s*학년\s*\d+\s*반/)?.[0].replace(/\s+/g,' ')||'학급 확인 필요';
const state=r=>r.status==='DRAFT'?'임시 저장':'최종 제출';
const submitted=s=>rows.some(r=>r.status==='SUBMITTED'&&match(r,s));
function view(r){const v=clone(r);delete v.password;v.retainedStudent=!!v.data.student;v.retainedSignature=!!v.data.signature;['student','parent','phone','signature','backup'].forEach(k=>v.data[k]='');return v}
function authorized(r,a){return a&&norm(r.data.parent)===norm(a.name)&&norm(r.data.phone)===norm(a.phone)&&r.password===a.password}
window.localRPC=async(method,arg)=>{
if(method==='loadResponses'){const found=rows.filter(r=>authorized(r,arg));if(!found.length)throw Error('일치하는 응답이 없습니다. 이름·전화번호·암호를 확인하세요.');return found.map(view)}
if(method==='saveResponse'){const a=arg.auth;if(!a||!a.name.trim()||!/^0\d{8,10}$/.test(norm(a.phone))||a.password.length<10||a.password.length>128)throw Error('보호자 이름·전화번호와 10~128자 암호를 확인하세요.');const old=rows.find(r=>r.id===arg.id);if(arg.id&&(!old||!authorized(old,a)))throw Error('다시 조회하세요.');const d=clone(arg.data);if(old)['student','signature','backup'].forEach(k=>{if(!d[k])d[k]=old.data[k]||''});d.parent=a.name;d.phone=norm(a.phone);if(arg.status==='SUBMITTED'){if(['student','grade','relation','signature','date','condition','allergy','emergencyConsent','privacyConsent','sensitiveConsent'].some(k=>!d[k])||!d.confirmed)throw Error('필수 항목과 보호자 확인을 모두 작성하세요.');}if(!old&&rows.some(r=>authorized(r,a)&&norm(r.data.student)===norm(d.student)&&norm(r.data.grade)===norm(d.grade)))throw Error('이미 저장된 학생입니다. 기존 작성 내용에서 조회하세요.');const r={id:old?old.id:'r'+Date.now(),status:arg.status,password:a.password,data:d,version:old?old.version+1:1,updatedAt:new Date().toISOString()};if(old)rows[rows.indexOf(old)]=r;else rows.push(r);return view(r)}
if(method==='adminSaveStudent'){const d={};['id','year','classroom','number','student','parent','phone'].forEach(k=>d[k]=String(arg[k]||'').trim());d.phone=norm(d.phone);if(['year','classroom','number'].some(k=>!(/^[1-9]\d{0,2}$/).test(d[k]))||!d.student||!d.parent||!/^0\d{8,10}$/.test(d.phone))throw Error('명단 입력 내용을 확인하세요.');if(roster.some(s=>s.id!==d.id&&['year','classroom','number'].every(k=>s[k]===d[k])))throw Error('같은 학년·반·번호가 이미 있습니다.');const i=roster.findIndex(s=>s.id===d.id);if(i<0){d.id='s'+Date.now();roster.push(d)}else roster[i]=d;return {message:'브라우저 메모리에 학생 정보를 저장했습니다.'}}
if(method==='adminDashboard'){const n=roster.filter(submitted).length,classes=[...new Set([...roster.map(s=>s.year+'학년 '+s.classroom+'반'),...rows.map(getClass)])];return {email:'가상 관리자 (인증 없음)',parents:new Set(rows.map(r=>norm(r.data.parent)+'|'+norm(r.data.phone))).size,drafts:rows.filter(r=>r.status==='DRAFT').length,hasRoster:!!roster.length,total:roster.length,submitted:n,unsubmitted:roster.length-n,mismatches:rows.filter(r=>!roster.some(s=>match(r,s))).length,rate:roster.length?Math.round(n/roster.length*1000)/10:null,roster:roster.map(s=>({...s,submission:submitted(s)?'제출':'미제출'})),classes:classes.map(c=>({classroom:c,roster:roster.filter(s=>s.year+'학년 '+s.classroom+'반'===c).length,responded:rows.filter(r=>getClass(r)===c).length,submitted:roster.filter(s=>s.year+'학년 '+s.classroom+'반'===c&&submitted(s)).length,drafts:rows.filter(r=>getClass(r)===c&&r.status==='DRAFT').length})),responses:rows.map(r=>({student:r.data.student,grade:r.data.grade,parent:r.data.parent,status:state(r),match:!roster.length?'명단 없음':roster.some(s=>match(r,s))?'일치':'정보 불일치'}))}}
if(method==='adminReportData'){const entries=rows.map(r=>({id:r.id,classroom:getClass(r),number:(r.data.grade||'').match(/(\d+)\s*번/)?.[1]||'',status:state(r),match:!roster.length?'명단 없음':roster.some(s=>match(r,s))?'일치':'정보 불일치',updatedAt:r.updatedAt,data:clone(r.data)}));roster.filter(s=>!rows.some(r=>match(r,s))).forEach(s=>entries.push({id:s.id,classroom:s.year+'학년 '+s.classroom+'반',number:s.number,status:'미제출',match:'명단 학생 / 응답 없음',updatedAt:'',data:{student:s.student,grade:s.year+'학년 '+s.classroom+'반 '+s.number+'번'}}));entries.sort((a,b)=>a.classroom.localeCompare(b.classroom,'ko',{numeric:true})||Number(a.number)-Number(b.number));return {generatedAt:new Date().toISOString(),hasRoster:!!roster.length,entries}}
throw Error('로컬 미리보기에서 지원하지 않는 기능입니다.');};

const parentHTML="\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>학생 건강조사 · 응급처치 동의\u003c/title>\n\u003cstyle>\n:root{--ink:#203c3b;--green:#176f62;--line:#dce5e0;--muted:#637672}*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.65}header{background:white;border-bottom:1px solid var(--line)}.bar{max-width:1120px;margin:auto;padding:19px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:800}.small{font-size:13px;color:var(--muted)}main{max-width:1120px;margin:38px auto;padding:0 28px 60px}.intro{margin-bottom:26px}.eyebrow{color:var(--green);font-size:13px;font-weight:bold;letter-spacing:1px}h1{font-size:32px;margin:8px 0}p{margin:8px 0}.badge{display:inline-block;background:#fff3d8;color:#805b16;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:bold}.layout{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}aside,.card{background:#fff;border:1px solid var(--line);border-radius:16px}aside{padding:22px;position:sticky;top:20px}aside ol{padding:0;list-style:none;margin:16px 0}aside li{padding:10px 0;font-size:14px}aside a{color:var(--muted);text-decoration:none}aside li:first-child a{color:var(--green);font-weight:bold}.mode{display:flex;gap:8px;margin-bottom:18px}.mode button{flex:1;padding:14px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);font:inherit;cursor:pointer}.mode button.active{border:2px solid var(--green);color:var(--green);background:#edf6f1;font-weight:bold}.card{padding:28px;margin-bottom:18px;scroll-margin-top:20px}h2{font-size:20px;margin:0 0 6px}.number{display:inline-flex;width:28px;height:28px;background:#e9f3ee;color:var(--green);border-radius:8px;align-items:center;justify-content:center;margin-right:9px;font-size:14px}.desc{color:var(--muted);font-size:14px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-top:20px}.grid .field{margin-top:0}label,.question{display:block;font-size:14px;font-weight:600;margin-bottom:8px}.req{color:#b24f3a}input[type=password],input[type=text],input[type=tel],input[type=date],textarea,select{width:100%;border:1px solid #cbd8d1;border-radius:8px;padding:12px;font:inherit;color:var(--ink);background:white}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #9fd1bb;outline-offset:2px}.choices{display:flex;gap:10px;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f7f9f6;border:1px solid var(--line);border-radius:8px;font-weight:normal;margin:0;cursor:pointer}input[type=radio],input[type=checkbox]{accent-color:var(--green);width:17px;height:17px;flex-shrink:0}.note{padding:15px 18px;background:#f0f6f2;border-radius:10px;font-size:14px}.consent{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-weight:normal}.consent input{margin-top:5px}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.primary{background:var(--green);color:white;border:0;padding:15px 28px;border-radius:9px;font:inherit;font-weight:bold;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}#result{padding:18px;background:#e4f2e8;border-radius:10px;margin-top:20px}fieldset{padding:0;margin:20px 0 0;border:0}legend{font-size:14px;font-weight:bold;margin-bottom:8px}dialog{max-width:480px;border:1px solid var(--line);border-radius:16px;padding:28px}dialog::backdrop{background:#15332e66}@media(max-width:760px){.bar{padding:16px 20px}.bar .small{display:none}main{padding:0 16px 35px;margin-top:25px}h1{font-size:26px}.layout{display:block}aside{position:static;padding:14px 18px;margin-bottom:20px}aside ol{display:flex;gap:16px;overflow:auto;margin:0}aside li{white-space:nowrap;font-size:12px}aside strong,aside .small{display:none}.card{padding:22px 18px}.grid{grid-template-columns:1fr;gap:18px}.mode button{font-size:14px}.actions{align-items:stretch;flex-direction:column}.primary{width:100%}}\nbutton:disabled{opacity:.5} .secondary{padding:14px;border:1px solid #176f62;border-radius:9px;background:white;color:#176f62;font:inherit} [hidden]{display:none!important}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"bar\">\u003cdiv class=\"brand\">✚ 우리 아이 건강 살피기\u003c/div>\u003cspan class=\"small\">학부모용 · 학생 건강조사\u003c/span>\u003c/div>\u003c/header>\n\u003cmain>\n\u003cdiv class=\"intro\">\u003cspan class=\"eyebrow\">STUDENT HEALTH CARE\u003c/span>\u003ch1>아이의 건강한 학교생활을 위해\u003c/h1>\u003cp>학생의 건강상태와 응급상황 시 필요한 정보를 알려 주세요.\u003c/p>\u003cp class=\"small\">\u003cspan class=\"badge\">예시 항목\u003c/span> 첨부된 가정통신문이 없어 예시로 구성한 설문입니다.\u003c/p>\u003c/div>\n\u003cdiv class=\"layout\">\u003caside>\u003cstrong>작성 안내\u003c/strong>\u003col>\u003cli>\u003ca href=\"#basic\">01 &nbsp; 학생·보호자 정보\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#health\">02 &nbsp; 건강상태\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#school\">03 &nbsp; 학교생활 시 유의사항\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#agree\">04 &nbsp; 응급처치·정보 동의\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"small\">필수 항목은 \u003cspan class=\"req\">*\u003c/span>로 표시했습니다.\u003cbr>모르는 내용은 ‘확인 필요’로 적어 주세요.\u003c/p>\u003c/aside>\n\u003cdiv>\u003cdiv class=\"mode\" role=\"group\" aria-label=\"작성 방식\">\u003cbutton id=\"newButton\" type=\"button\" class=\"active\" aria-pressed=\"true\">건강조사 처음 작성하기\u003c/button>\u003cbutton type=\"button\" id=\"editInfo\" aria-haspopup=\"dialog\">기존 작성 내용 수정\u003c/button>\u003c/div>\n\u003csection id=\"lookupPanel\" class=\"card\" hidden>\u003ch2>저장한 내용 조회\u003c/h2>\u003cp class=\"note\">예시 조회: 김보호 / 010-1234-5678 / preview1234\u003cbr>임시 저장 예시: 이보호 / 010-2222-3333 / preview1234\u003c/p>\u003cp>보호자 이름·전화번호·조회용 암호를 입력해 주세요.\u003c/p>\u003cform id=\"lookupForm\">\u003clabel for=\"lookupName\">보호자 이름\u003c/label>\u003cinput id=\"lookupName\" type=\"text\" required>\u003clabel for=\"lookupPhone\">전화번호\u003c/label>\u003cinput id=\"lookupPhone\" type=\"tel\" required>\u003clabel for=\"lookupPassword\">조회용 암호\u003c/label>\u003cinput id=\"lookupPassword\" type=\"password\" minlength=\"10\" maxlength=\"128\" required autocomplete=\"current-password\">\u003cbutton class=\"primary\">조회하기\u003c/button>\u003c/form>\u003cdiv id=\"recordPicker\" hidden>\u003clabel for=\"recordSelect\">학생 선택\u003c/label>\u003cselect id=\"recordSelect\">\u003c/select>\u003cbutton id=\"openRecord\" type=\"button\" class=\"secondary\">선택한 응답 열기\u003c/button>\u003c/div>\u003cp id=\"lookupResult\" role=\"status\">\u003c/p>\u003c/section>\u003cp id=\"sessionNote\" class=\"note\">새 건강조사를 작성하고 있습니다.\u003c/p>\u003cform id=\"healthForm\">\n\u003csection class=\"card\" id=\"basic\">\u003ch2>\u003cspan class=\"number\">01\u003c/span>학생·보호자 정보\u003c/h2>\u003cp class=\"desc\">학생 정보와 연락 가능한 보호자 연락처를 적어 주세요. 저장한 이름·전화번호는 재조회 화면에 표시하지 않고 관리자 화면에서만 표시합니다. 지금 직접 입력하는 내용은 화면에 보입니다.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"field\">\u003clabel for=\"student\">학생 이름 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"student\" name=\"student\" autocomplete=\"off\" required placeholder=\"예: 김하늘\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"grade\">학년 / 반 / 번호 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"grade\" name=\"grade\" type=\"text\" required placeholder=\"예: 3학년 2반 15번\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"parent\">보호자 이름 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"parent\" name=\"parent\" type=\"text\" required autocomplete=\"name\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"relation\">학생과의 관계 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"relation\" name=\"relation\" type=\"text\" required placeholder=\"예: 부, 모, 조부모 등\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"phone\">보호자 연락처 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" required placeholder=\"010-0000-0000\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"backup\">비상 연락처 및 관계\u003c/label>\u003cinput id=\"backup\" name=\"backup\" type=\"text\" placeholder=\"예: 010-0000-0000 / 조부\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>조회용 암호 설정\u003c/h2>\u003cp class=\"desc\">10~128자로 정해 주세요. 같은 보호자의 형제자매 응답은 같은 이름·전화번호·암호로 조회 후 선택할 수 있습니다. 암호는 다시 보여 드리지 않으니 기억해 주세요.\u003c/p>\u003clabel for=\"password\">조회용 암호 *\u003c/label>\u003cinput id=\"password\" type=\"password\" required minlength=\"10\" maxlength=\"128\" autocomplete=\"new-password\">\u003clabel for=\"passwordConfirm\">암호 확인 *\u003c/label>\u003cinput id=\"passwordConfirm\" type=\"password\" required minlength=\"10\" maxlength=\"128\" autocomplete=\"new-password\">\u003cp class=\"small\">저장 후에는 이름·전화번호·암호를 이 화면에서 변경할 수 없습니다.\u003c/p>\u003c/section>\u003csection class=\"card\" id=\"health\">\u003ch2>\u003cspan class=\"number\">02\u003c/span>현재 건강상태\u003c/h2>\u003cp class=\"desc\">학교에서 알아두어야 할 내용을 중심으로 작성해 주세요.\u003c/p>\n\u003cfieldset>\u003clegend>진단받았거나 관리 중인 질환이 있나요? \u003cspan class=\"req\">*\u003c/span>\u003c/legend>\u003cdiv class=\"choices\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"condition\" value=\"없음\" required>없음\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"condition\" value=\"있음\">있음\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"condition\" value=\"확인 필요\">확인 필요\u003c/label>\u003c/div>\u003c/fieldset>\u003cdiv class=\"field\">\u003clabel for=\"conditionDetail\">질환명 및 관리 방법\u003c/label>\u003ctextarea id=\"conditionDetail\" name=\"conditionDetail\" placeholder=\"해당하는 경우 질환명, 주의사항 등을 적어 주세요.\">\u003c/textarea>\u003c/div>\n\u003cfieldset>\u003clegend>알레르기가 있나요? \u003cspan class=\"req\">*\u003c/span>\u003c/legend>\u003cdiv class=\"choices\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"allergy\" value=\"없음\" required>없음\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"allergy\" value=\"있음\">있음\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"allergy\" value=\"확인 필요\">확인 필요\u003c/label>\u003c/div>\u003c/fieldset>\u003cdiv class=\"field\">\u003clabel for=\"allergyDetail\">알레르기 원인·증상 및 대처 시 참고사항\u003c/label>\u003ctextarea id=\"allergyDetail\" name=\"allergyDetail\" placeholder=\"예: 음식, 약물, 곤충 등 / 나타나는 증상 / 보호자 전달사항\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"medicine\">현재 복용 중인 약 및 학교에서 참고할 사항\u003c/label>\u003ctextarea id=\"medicine\" name=\"medicine\" placeholder=\"없으면 ‘없음’으로 적어 주세요. 이 설문은 별도의 투약 요청서를 대신하지 않습니다.\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"history\">최근 수술·입원 또는 과거 병력\u003c/label>\u003ctextarea id=\"history\" name=\"history\" placeholder=\"학교생활에 영향을 줄 수 있는 내용이 있다면 적어 주세요.\">\u003c/textarea>\u003c/div>\u003c/section>\n\u003csection class=\"card\" id=\"school\">\u003ch2>\u003cspan class=\"number\">03\u003c/span>학교생활 시 유의사항\u003c/h2>\u003cp class=\"desc\">아이가 안전하게 활동할 수 있도록 필요한 도움을 알려 주세요.\u003c/p>\u003cdiv class=\"field\">\u003clabel for=\"activity\">체육활동·급식·현장체험 등에서 주의할 사항\u003c/label>\u003ctextarea id=\"activity\" name=\"activity\" placeholder=\"예: 운동 제한, 식사 관련 주의사항, 이동 시 지원 등\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"message\">담임교사·보건교사에게 전하고 싶은 내용\u003c/label>\u003ctextarea id=\"message\" name=\"message\" placeholder=\"건강 및 정서적 지원과 관련해 필요한 내용을 적어 주세요.\">\u003c/textarea>\u003c/div>\u003c/section>\n\u003csection class=\"card\" id=\"agree\">\u003ch2>\u003cspan class=\"number\">04\u003c/span>응급처치 및 정보 제공 동의\u003c/h2>\u003cp class=\"desc\">아래 내용은 예시 문구입니다. 실제 사용 전 학교의 안내문과 운영 기준에 맞게 조정해 주세요.\u003c/p>\u003cdiv class=\"note\">응급상황 발생 시 보호자에게 연락하고, 학생의 안전을 위해 필요한 응급처치와 119 신고·이송을 진행할 수 있습니다. 연락이 지연되는 경우에도 학생의 안전을 우선하여 대응합니다.\u003c/div>\u003cfieldset>\u003clegend>위 응급처치 및 응급 이송 안내에 대한 의사 \u003cspan class=\"req\">*\u003c/span>\u003c/legend>\u003cdiv class=\"choices\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"emergencyConsent\" value=\"동의\" required>동의합니다\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"emergencyConsent\" value=\"비동의\">동의하지 않습니다\u003c/label>\u003c/div>\u003c/fieldset>\u003cp class=\"small\">비동의를 선택한 경우 실제 운영 시 학교와 별도 협의가 필요합니다.\u003c/p>\u003cdiv class=\"note\" style=\"margin-top:22px\">\u003cstrong>개인정보·건강정보 수집 및 이용 안내 (예시)\u003c/strong>\u003cbr>목적: 학생 건강관리 및 응급상황 대응\u003cbr>항목: 학생·보호자 정보, 연락처, 질환·알레르기·복용약 등 건강정보\u003cbr>이용 대상: 업무상 필요한 담임교사·보건교사 등 담당자\u003cbr>보유 기간: 학교가 정한 기간으로 실제 배포 전 명시 필요\u003cbr>동의를 거부할 수 있으며, 정보가 제공되지 않으면 개별 건강관리 지원이 제한될 수 있습니다.\u003c/div>\u003cfieldset>\u003clegend>개인정보 수집·이용 동의 \u003cspan class=\"req\">*\u003c/span>\u003c/legend>\u003cdiv class=\"choices\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"privacyConsent\" value=\"동의\" required>동의합니다\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"privacyConsent\" value=\"비동의\">동의하지 않습니다\u003c/label>\u003c/div>\u003c/fieldset>\u003cfieldset>\u003clegend>민감정보(건강정보) 수집·이용 동의 \u003cspan class=\"req\">*\u003c/span>\u003c/legend>\u003cdiv class=\"choices\">\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"sensitiveConsent\" value=\"동의\" required>동의합니다\u003c/label>\u003clabel class=\"choice\">\u003cinput type=\"radio\" name=\"sensitiveConsent\" value=\"비동의\">동의하지 않습니다\u003c/label>\u003c/div>\u003c/fieldset>\u003cdiv class=\"grid\" style=\"margin-top:24px\">\u003cdiv>\u003clabel for=\"signature\">작성 보호자 성명 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"signature\" name=\"signature\" type=\"text\" required placeholder=\"내용을 확인한 보호자 이름\">\u003c/div>\u003cdiv>\u003clabel for=\"date\">작성일 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"date\" name=\"date\" type=\"date\" required>\u003c/div>\u003c/div>\u003clabel class=\"consent\">\u003cinput id=\"confirmed\" name=\"confirmed\" type=\"checkbox\" required>\u003cspan>학생의 보호자로서 위 내용을 확인하고 작성했습니다. \u003cspan class=\"req\">*\u003c/span>\u003c/span>\u003c/label>\u003c/section>\n\u003cdiv class=\"actions\">\u003cspan class=\"small\">임시 저장은 설문 필수 항목을 다 채우지 않아도 됩니다.\u003cbr>제출 후 수정했다면 최종 제출을 다시 눌러 주세요.\u003c/span>\u003cbutton id=\"draftButton\" class=\"secondary\" type=\"button\">임시 저장\u003c/button>\u003cbutton class=\"primary\" type=\"submit\">최종 제출하기 →\u003c/button>\u003c/div>\u003cdiv id=\"result\" role=\"status\" hidden>\u003c/div>\u003c/form>\u003cp class=\"footer\">학생의 건강정보는 꼭 필요한 범위에서 신중하게 작성해 주세요.\u003c/p>\u003c/div>\u003c/div>\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id), form=$('healthForm');\nlet current=null, auth=null, lookupAuth=null, records=[], busy=false,dirty=false;\nconst now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;\nfunction notify(msg){$('result').hidden=false;$('result').textContent=msg;}\nfunction rpc(method,payload){return window.parent.localRPC(method,payload);}\nfunction loading(value){busy=value;document.querySelectorAll('button,input,textarea,select').forEach(e=>e.disabled=value);if(!value&&current)['parent','phone','password','passwordConfirm'].forEach(id=>$(id).readOnly=true);}\nfunction mode(lookup){$('lookupPanel').hidden=!lookup;$('newButton').classList.toggle('active',!lookup);$('editInfo').classList.toggle('active',lookup);$('newButton').setAttribute('aria-pressed',String(!lookup));$('editInfo').setAttribute('aria-pressed',String(lookup));}\n$('editInfo').removeAttribute('aria-haspopup');$('editInfo').onclick=()=>mode(true);\n$('newButton').onclick=()=>{if(dirty&&!confirm('저장하지 않은 내용이 있습니다. 새로 작성할까요?'))return;form.reset();student.required=true;signature.required=true;current=null;auth=null;dirty=false;['parent','phone','password','passwordConfirm'].forEach(id=>$(id).readOnly=false);$('sessionNote').textContent='새 건강조사를 작성하고 있습니다.';$('result').hidden=true;mode(false);};\nasync function save(status){if(busy)return;let credentials=auth;if(!current){if($('password').value!==$('passwordConfirm').value){notify('암호 확인이 일치하지 않습니다.');return;}credentials={name:$('parent').value,phone:$('phone').value,password:$('password').value};}const data=Object.fromEntries(new FormData(form));data.confirmed=$('confirmed').checked;loading(true);notify('저장 중입니다…');try{current=await rpc('saveResponse',{auth:credentials,id:current&&current.id,version:current&&current.version,status,data});auth=credentials;dirty=false;$('sessionNote').textContent=(current.status==='DRAFT'?'임시 저장':'최종 제출')+' · 마지막 저장: '+new Date(current.updatedAt).toLocaleString('ko-KR');notify(current.status==='DRAFT'?'임시 저장했습니다. 같은 이름·전화번호·암호로 조회하여 이어 쓸 수 있습니다.':'최종 제출했습니다. 다시 조회하여 확인·수정할 수 있습니다.');}catch(e){notify(e.message||'저장하지 못했습니다. 다시 시도해 주세요.');}finally{loading(false);}}\nform.onsubmit=e=>{e.preventDefault();save('SUBMITTED');};$('draftButton').onclick=()=>save('DRAFT');\nform.addEventListener('input',()=>{dirty=true;$('result').hidden=true;});\n$('lookupForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const credentials={name:$('lookupName').value,phone:$('lookupPhone').value,password:$('lookupPassword').value};loading(true);$('lookupResult').textContent='조회 중입니다…';$('recordPicker').hidden=true;records=[];try{records=await rpc('loadResponses',credentials);lookupAuth=credentials;$('recordSelect').replaceChildren();records.forEach((r,i)=>{const option=document.createElement('option');option.value=i;option.textContent=('응답 '+(i+1))+' / '+(r.data.grade||'학급 미입력')+' · '+(r.status==='DRAFT'?'임시 저장':'제출 완료');$('recordSelect').append(option);});$('recordPicker').hidden=false;$('lookupResult').textContent=records.length+'개의 응답을 찾았습니다.';}catch(e){$('lookupResult').textContent=e.message||'조회하지 못했습니다.';}finally{loading(false);}};\n$('openRecord').onclick=()=>{if(dirty&&!confirm('저장하지 않은 내용이 있습니다. 조회한 응답을 열까요?'))return;const r=records[Number($('recordSelect').value)];if(!r)return;current=r;auth=lookupAuth;form.reset();Object.entries(r.data).forEach(([key,value])=>{form.querySelectorAll('[name=\"'+key+'\"]').forEach(el=>{if(el.type==='radio')el.checked=el.value===value;else if(el.type==='checkbox')el.checked=value===true;else el.value=value;});});['student','parent','phone','signature'].forEach(id=>$(id).required=false);$('password').value=auth.password;$('passwordConfirm').value=auth.password;['parent','phone','password','passwordConfirm'].forEach(id=>$(id).readOnly=true);$('lookupPassword').value='';dirty=false;$('result').hidden=true;$('sessionNote').textContent=(r.status==='DRAFT'?'임시 저장한 내용을 이어 작성합니다.':'제출한 내용을 확인·수정합니다.')+' 마지막 저장: '+new Date(r.updatedAt).toLocaleString('ko-KR');mode(false);$('sessionNote').scrollIntoView({behavior:'smooth'});};\nwindow.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});\n\u003c/script>\u003c/body>\u003c/html>\r\n\r\n",adminHTML="\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>건강조사 관리자\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:#203c3b;font:15px/1.6 Arial,'Malgun Gothic',sans-serif}main{max-width:1200px;margin:32px auto;padding:0 20px}h1{margin:0;font-size:28px}h2{font-size:20px}.card{padding:24px;background:white;border:1px solid #dce5e0;border-radius:14px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.stat{padding:20px;background:#fff;border:1px solid #dce5e0;border-radius:12px}.stat strong{display:block;font-size:30px;color:#176f62}button{padding:11px 18px;background:#176f62;border:0;border-radius:8px;color:white;font:inherit;cursor:pointer}button.secondary{background:#edf4ef;color:#176f62}button:disabled{opacity:.5;cursor:wait}input,select{padding:11px;border:1px solid #bbcfc4;border-radius:8px;width:100%;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:block;font-size:14px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px;text-align:left;border-bottom:1px solid #e0e8e2}th{background:#f2f7f3}.scroll{overflow:auto}p{color:#62756d}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input{width:auto;max-width:100%}#notice{padding:14px;background:#e5eee7;border-radius:8px}a{color:#176f62}input:focus,button:focus-visible{outline:3px solid #94c8ae;outline-offset:2px}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:18px}main{padding:0 14px}.stats{grid-template-columns:1fr 1fr}}\nnav a{display:inline-block;padding:5px}#reportOutput table{white-space:normal;table-layout:fixed;font-size:12px}#reportOutput th,#reportOutput td{overflow-wrap:anywhere;padding:7px;vertical-align:top}.class-report{margin-top:24px}.student-detail{break-inside:avoid;border:1px solid #dce5e0;padding:12px;margin:12px 0}.student-detail dl{display:grid;grid-template-columns:160px 1fr;margin:0;font-size:12px}.student-detail dt,.student-detail dd{margin:0;padding:5px;border-bottom:1px solid #e3e9e5;white-space:pre-wrap;overflow-wrap:anywhere}.bar-line{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:8px 0}.bar-track{background:#edf1ed;height:18px;border-radius:3px;overflow:hidden}.bar-fill{height:100%;background:#176f62}#graphs h3{margin-top:24px}#reportNotice{white-space:pre-line}@media print{@page{size:A4 portrait;margin:12mm}body{background:white;color:black}main{max-width:none;margin:0;padding:0}main>*{display:none!important}#content{display:block!important}#content>*{display:none!important}#content>#reportSection{display:block!important;border:0;padding:0;margin:0}#reportSection>.no-print{display:none!important}#reportNotice{font-size:10px}.class-report{break-before:page;margin:0}.class-report:first-child{break-before:auto}thead{display:table-header-group}tr{break-inside:avoid}h2,h3{break-after:avoid}.student-detail{break-inside:auto}.student-detail dl{grid-template-columns:130px 1fr}a{color:black}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"toolbar\">\u003ch1>건강조사 관리자\u003c/h1>\u003cbutton id=\"refresh\">새로고침\u003c/button>\u003c/div>\u003cp id=\"account\">계정 확인 중…\u003c/p>\u003cp id=\"notice\" role=\"status\">통계를 불러오는 중입니다.\u003c/p>\u003cdiv id=\"content\" hidden>\u003cnav class=\"card no-print\" aria-label=\"관리자 메뉴\">\u003cdiv class=\"grid\">\u003cdiv>\u003cstrong>응답 보기와 통계\u003c/strong>\u003cp>\u003ca href=\"#stats\">응답 요약\u003c/a> · \u003ca href=\"#classes\">학급별 통계\u003c/a> · \u003ca href=\"#responses\">응답 보기\u003c/a> · \u003ca href=\"#roster\">학생 명단\u003c/a>\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>결과 보고서와 그래프\u003c/strong>\u003cp>\u003ca href=\"#reportSection\">학급별 결과 보고서\u003c/a> · \u003ca href=\"#graphSection\">결과 그래프\u003c/a>\u003c/p>\u003c/div>\u003c/div>\u003c/nav>\u003cdiv id=\"stats\" class=\"stats\">\u003c/div>\u003cp id=\"basis\">\u003c/p>\u003csection class=\"card\">\u003ch2>학급별 현황\u003c/h2>\u003cdiv id=\"classes\" class=\"scroll\">\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>학생 명단 관리\u003c/h2>\u003cp>명단이 없어도 설문은 계속 받습니다. CSV 업로드는 로컬 파일 내용만 미리보기로 표시하며 명단에는 반영하지 않습니다.\u003c/p>\u003cdiv class=\"toolbar\">\u003cbutton id=\"template\" class=\"secondary\">CSV 양식 내려받기\u003c/button>\u003cinput id=\"csv\" type=\"file\" accept=\".csv,text/csv\" aria-label=\"학생 명단 CSV 파일\">\u003cbutton id=\"upload\">로컬 파일 미리보기\u003c/button>\u003cpre id=\"localPreview\" style=\"white-space:pre-wrap;overflow-wrap:anywhere\">\u003c/pre>\u003c/div>\u003cp>UTF-8 CSV · 필수 열: 학년, 반, 번호, 학생이름, 학부모이름, 전화번호\u003c/p>\u003cform id=\"studentForm\">\u003cinput id=\"id\" type=\"hidden\">\u003cdiv class=\"grid\">\u003clabel>학년\u003cinput id=\"year\" type=\"number\" min=\"1\" max=\"999\" required>\u003c/label>\u003clabel>반\u003cinput id=\"classroom\" type=\"number\" min=\"1\" max=\"999\" required>\u003c/label>\u003clabel>번호\u003cinput id=\"number\" type=\"number\" min=\"1\" max=\"999\" required>\u003c/label>\u003clabel>학생 이름\u003cinput id=\"student\" maxlength=\"100\" required>\u003c/label>\u003clabel>학부모 이름\u003cinput id=\"parent\" maxlength=\"100\" required>\u003c/label>\u003clabel>전화번호\u003cinput id=\"phone\" type=\"tel\" required placeholder=\"010-0000-0000\">\u003c/label>\u003c/div>\u003cdiv class=\"toolbar\" style=\"margin-top:18px\">\u003cbutton type=\"submit\">학생 정보 저장\u003c/button>\u003cbutton id=\"clear\" class=\"secondary\" type=\"button\">새 학생 입력\u003c/button>\u003c/div>\u003c/form>\u003cp id=\"editing\">새 학생을 추가합니다.\u003c/p>\u003cdiv id=\"roster\" class=\"scroll\">\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>응답 대조 현황\u003c/h2>\u003cp>정보 불일치는 학생 이름·학년·반·번호·학부모 이름·전화번호 중 명단과 일치하지 않는 응답입니다. 학부모 설문 학급 입력 형식은 ‘3학년 2반 15번’입니다.\u003c/p>\u003cdiv id=\"responses\" class=\"scroll\">\u003c/div>\u003c/section>\u003csection id=\"reportSection\" class=\"card\">\u003cdiv class=\"no-print\">\u003ch2>학급별 결과 보고서 \u003csmall>예시 서식\u003c/small>\u003c/h2>\u003cp>첨부된 학급별 정리 서식이 없어 예시로 구성했습니다. 빈 응답은 ‘미응답’으로 표시하며 ‘없음’, ‘비동의’, ‘확인 필요’를 그대로 구분합니다.\u003c/p>\u003cdiv class=\"toolbar\">\u003clabel>보고서 학급\u003cselect id=\"reportClass\">\u003coption value=\"\">전체 학급\u003c/option>\u003c/select>\u003c/label>\u003clabel>포함할 응답\u003cselect id=\"reportStatus\">\u003coption value=\"\">전체 (임시 저장·미제출 포함)\u003c/option>\u003coption value=\"최종 제출\">최종 제출만\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"loadReport\">보고서 불러오기\u003c/button>\u003cbutton id=\"printReport\" disabled>보고서 인쇄\u003c/button>\u003cbutton id=\"exportReport\" disabled>엑셀(.xlsx) 저장\u003c/button>\u003c/div>\u003c/div>\u003cp id=\"reportNotice\" role=\"status\">보고서를 불러와 주세요.\u003c/p>\u003cdiv id=\"reportOutput\">\u003c/div>\u003c/section>\u003csection id=\"graphSection\" class=\"card\">\u003ch2>결과 그래프\u003c/h2>\u003cp>현재 보고서에 포함된 응답 건수 기준입니다. 명단만 있고 응답이 없는 학생은 ‘미제출’로만 집계하며 설문 문항의 미응답 수에는 포함하지 않습니다.\u003c/p>\u003cdiv id=\"graphs\">\u003c/div>\u003c/section>\u003c/div>\u003c/main>\u003cscript>\nconst $=id=>document.getElementById(id);let dashboard,original='',busy=false;\nconst fields=['id','year','classroom','number','student','parent','phone'];\nfunction message(s){$('notice').textContent=s;}\nfunction loading(v){busy=v;document.querySelectorAll('button,input,select').forEach(e=>e.disabled=v);if(!v && !reportData){printReport.disabled=true;exportReport.disabled=true;}}\nfunction rpc(method,arg){return window.parent.localRPC(method,arg);}\nfunction table(target,headers,rows,edit){const t=document.createElement('table'),thead=t.createTHead(),h=thead.insertRow();headers.forEach(x=>{const th=document.createElement('th');th.textContent=x;h.append(th);});const body=t.createTBody();rows.forEach((row,i)=>{const tr=body.insertRow();row.forEach(value=>{tr.insertCell().textContent=String(value);});if(edit){const b=document.createElement('button');b.textContent='수정';b.className='secondary';b.onclick=()=>edit(i);tr.insertCell().append(b);}});if(!rows.length){const cell=body.insertRow().insertCell();cell.colSpan=headers.length;cell.textContent='등록된 내용이 없습니다.';}$(target).replaceChildren(t);}\nfunction editStudent(i){const r=dashboard.roster[i];const base={};fields.forEach(k=>{base[k]=r[k];$(k).value=r[k];});original=JSON.stringify(base);$('editing').textContent=r.student+' 학생 정보를 수정합니다.';$('studentForm').scrollIntoView({behavior:'smooth'});}\nfunction clearForm(){$('studentForm').reset();$('id').value='';original='';$('editing').textContent='새 학생을 추가합니다.';}\nfunction render(d){invalidateReport();dashboard=d;$('content').hidden=false;$('account').textContent='로그인: '+d.email;const stats=[['응답한 학부모',d.parents+'명'],['임시 저장',d.drafts+'건']];if(d.hasRoster)stats.push(['명단 인원',d.total+'명'],['제출',d.submitted+'명'],['미제출',d.unsubmitted+'명'],['정보 불일치',d.mismatches+'명'],['제출률',d.rate+'%']);$('stats').replaceChildren();stats.forEach(([label,value])=>{const box=document.createElement('div');box.className='stat';box.append(document.createTextNode(label));const strong=document.createElement('strong');strong.textContent=value;box.append(strong);$('stats').append(box);});$('basis').textContent=d.hasRoster?'제출률 = 명단과 정보가 일치하는 최종 제출 학생 ÷ 명단 전체 학생. 임시 저장은 미제출에 포함합니다. 정보 불일치는 명단 밖 응답이므로 제출·미제출과 합산하지 않습니다.':'명단이 없습니다. 설문 접수는 계속되며 제출·미제출·정보 불일치·제출률은 명단 등록 후 표시됩니다.';\ntable('classes',['학급','명단 인원','응답 학생','최종 제출','임시 저장(건)'],d.classes.map(c=>[c.classroom,d.hasRoster?c.roster:'—',c.responded,c.submitted,c.drafts]));table('roster',['학년','반','번호','학생 이름','학부모 이름','전화번호','제출 상태','관리'],d.roster.map(r=>[r.year,r.classroom,r.number,r.student,r.parent,r.phone,r.submission]),editStudent);table('responses',['학생 이름','학급·번호','학부모 이름','저장 상태','명단 대조'],d.responses.map(r=>[r.student,r.grade,r.parent,r.status,r.match]));}\nasync function refresh(){if(busy)return;loading(true);message('통계를 불러오는 중입니다…');try{render(await rpc('adminDashboard'));message('최신 현황을 불러왔습니다.');}catch(e){$('content').hidden=true;message(e.message||'불러오지 못했습니다.');}finally{loading(false);}}\n$('refresh').onclick=refresh;$('clear').onclick=clearForm;\n$('studentForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const input={original};fields.forEach(k=>input[k]=$(k).value);loading(true);let result;try{result=await rpc('adminSaveStudent',input);clearForm();}catch(e){message(e.message);}finally{loading(false);}if(result){await refresh();message(result.message);}};\n$('template').onclick=()=>{const blob=new Blob(['\\uFEFF학년,반,번호,학생이름,학부모이름,전화번호\\r\\n3,2,15,김하늘,김보호,010-1234-5678\\r\\n'],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='학생명단_양식.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};\n$('upload').onclick=async()=>{if(busy)return;const file=$('csv').files[0];if(!file){message('CSV 파일을 선택해 주세요.');return;}if(file.size>1000000){message('CSV는 1MB 이내로 올려 주세요.');return;}loading(true);let result;try{$('localPreview').textContent=file.name+' · 명단에는 반영하지 않는 로컬 미리보기\\n'+await file.text();message('파일 내용을 미리보기로만 표시했습니다.');$('csv').value='';clearForm();}catch(e){message(e.message||'업로드하지 못했습니다.');}finally{loading(false);}if(result){await refresh();message(result.message);}};\nsetTimeout(refresh,0);\n// Runtime-only report generation. Source responses remain unchanged.\nlet reportData=null, visibleReport=[];\nconst reportFields=[['student','학생 이름'],['grade','학급·번호'],['parent','보호자 이름'],['relation','관계'],['phone','연락처'],['backup','비상 연락처'],['condition','관리 중인 질환'],['conditionDetail','질환명·관리 방법'],['allergy','알레르기'],['allergyDetail','알레르기 상세'],['medicine','복용약'],['history','수술·입원·병력'],['activity','학교생활 유의사항'],['message','교사 전달사항'],['emergencyConsent','응급처치·이송 동의'],['privacyConsent','개인정보 동의'],['sensitiveConsent','민감정보 동의'],['signature','작성자 성명'],['date','작성일'],['confirmed','보호자 확인']];\nfunction answer(v){return v===true?'확인':v===false?'미확인':v===null||v===undefined||String(v).trim()===''?'미응답':String(v);}\nfunction invalidateReport(){reportData=null;visibleReport=[];$('reportOutput').replaceChildren();$('graphs').replaceChildren();$('reportNotice').textContent='최신 결과를 보려면 보고서를 불러와 주세요.';$('printReport').disabled=true;$('exportReport').disabled=true;}\nfunction node(tag,text,parent){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(parent)parent.append(el);return el;}\nfunction reportGroups(){const map=new Map();visibleReport.forEach(r=>{if(!map.has(r.classroom))map.set(r.classroom,[]);map.get(r.classroom).push(r);});return map;}\nfunction chartData(){const actual=visibleReport.filter(r=>r.status!=='미제출');return [ ['저장 상태', ['최종 제출','임시 저장','미제출'].map(label=>[label,visibleReport.filter(r=>r.status===label).length])],...['condition','allergy','emergencyConsent','privacyCon });});}\nif(!visibleReport.length)node('p','선택한 조건에 해당하는 내용이 없습니다.',$('reportOutput'));\nchartData().forEach(([title,counts])=>{node('h3',title,$('graphs'));const total=counts.reduce((sum,x)=>sum+x[1],0);node('p','집계 대상 '+total+'건',$('graphs'));counts.forEach(([label,value])=>{const row=node('div',undefined,$('graphs'));row.className='bar-line';node('span',label,row);const track=node('div',undefined,row);track.className='bar-track';const fill=node('div',undefined,track);fill.className='bar-fill';fill.style.width=(total?value/total*100:0)+'%';node('span',value+'건',row);});});$('printReport').disabled=!visibleReport.length;$('exportReport').disabled=!visibleReport.length;}\n$('reportClass').onchange=paintReport;$('reportStatus').onchange=paintReport;\n$('loadReport').onclick=async()=>{if(busy)return;loading(true);invalidateReport();try{reportData=await rpc('adminReportData');$('reportClass').replaceChildren();const all=node('option','전체 학급',$('reportClass'));all.value='';Array.from(new Set(reportData.entries.map(r=>r.classroom))).forEach(c=>{node('option',c,$('reportClass')).value=c;});paintReport();message('보고서를 불러왔습니다.');}catch(e){message(e.message||'보고서를 불러오지 못했습니다.');}finally{loading(false);if(reportData)paintReport();}};\n$('printReport').onclick=()=>{if(reportData&&visibleReport.length)window.print();};\n// Minimal OOXML XLSX writer: ZIP (stored), UTF-8 XML, typed strings (never formulas).\nfunction xml(v){return String(v).replace(/[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\uFFFE\\uFFFF]/g,'').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&apos;');}\nfunction colName(index){let s='';for(let n=index+1;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s;}\nfunction zipFiles(files){const enc=new TextEncoder(),parts=[],directory=[];let offset=0;function header(size){const a=new Uint8Array(size);return [a,new DataView(a.buffer)];}function crc32(bytes){let c=0xffffffff;for(const b of b :(++index)+'_'+cls,header:2,rows:[['학생 건강조사 학급별 정리 (예시 서식)'],[cls,'기준 시각',new Date(reportData.generatedAt).toLocaleString('ko-KR')],['저장 상태','명단 대조','수정 시각',...reportFields.map(f=>f[1])],...entries.map(r=>[r.status,r.match,r.updatedAt,...reportFields.map(([k])=>answer(r.data[k]))])]});}sheets.push({name:'문항별 통계',header:0,rows:[['문항','응답','건수'],...chartData().flatMap(([title,counts])=>counts.map(([label,count])=>[title,label,count]))]});const blob=xlsx(sheets),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='건강조사_학급별결과_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('현재 선택한 보고서를 엑셀 파일로 저장했습니다.');}catch(e){message('엑셀 저장 중 오류: '+e.message);}};\r\n\n\u003c/script>\u003c/body>\u003c/html>\r\n\r\n\r\n\r\n";document.getElementById('parentFrame').srcdoc=parentHTML;document.getElementById('adminFrame').srcdoc=adminHTML;function showRole(admin){document.getElementById('parentFrame').style.display=admin?'none':'block';document.getElementById('adminFrame').style.display=admin?'block':'none';document.getElementById('parentBtn').classList.toggle('active',!admin);document.getElementById('adminBtn').classList.toggle('active',admin);if(admin){const w=document.getElementById('adminFrame').contentWindow;if(w&&w.refresh)w.refresh();}}</script></body></html>
